[project]
name = "cmo-agent"
version = "0.2.0"
description = "AI-powered CMO Agent with n8n workflow automation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "anthropic>=0.39.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "XlsxWriter>=3.2.0",
    "google-analytics-admin>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
scraping = ["playwright>=1.40.0"]

[project.scripts]
cmo = "cmo_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmo_agent"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
