// ─────────────────────────────────────────────────────────────────────
// Filter chip
// ─────────────────────────────────────────────────────────────────────
// How many rows in the tree match each filter option, so the popover
// can show "Virtual card 4" etc. Walks the full tree (not the filtered
// view), so counts are stable regardless of what's currently active.
function useFilterCounts(tree, kind, state) {
  return useMemo(() => {
    const counts = {};
    // NPI tab uses its own list (state.npis), not the tree. Count from
    // there for filter kinds that are NPI-specific (npiTypes) or that
    // also apply to NPIs when the NPI view is active (nets, dists).
    if (state && state.npiView && state.npis) {
      state.npis.forEach(n => {
        if (kind === "npiTypes") {
          counts[n.type] = (counts[n.type] || 0) + 1;
        } else if (kind === "nets") {
          counts[n.net] = (counts[n.net] || 0) + 1;
        } else if (kind === "dists") {
          const isDigital = n.net === "ach" || n.net === "achp" || n.net === "sa";
          const eff = isDigital ? "Digital" : (n.net === "check" ? "Mail" : n.dist);
          if (eff) counts[eff] = (counts[eff] || 0) + 1;
        }
      });
      return counts;
    }
    walk(tree, (n) => {
      if (kind === "nets") {
        counts[n.net] = (counts[n.net] || 0) + 1;
      } else if (kind === "levels") {
        counts[n.level] = (counts[n.level] || 0) + 1;
      } else if (kind === "dists") {
        const isDigital = n.net === "ach" || n.net === "achp" || n.net === "sa";
        const eff = isDigital ? "Digital" : (n.net === "check" ? "Mail" : n.dist);
        if (eff) counts[eff] = (counts[eff] || 0) + 1;
      } else if (kind === "geoStates") {
        if (n.state) counts[n.state] = (counts[n.state] || 0) + 1;
      } else if (kind === "orgs") {
        if (n.org) counts[n.org] = (counts[n.org] || 0) + 1;
      } else if (kind === "entities") {
        if (n.name) counts[n.name] = (counts[n.name] || 0) + 1;
      } else if (kind === "vcConsent") {
        const has = vcConsentFor(n);
        counts[has ? "yes" : "no"] = (counts[has ? "yes" : "no"] || 0) + 1;
      } else if (kind === "achEnrollment") {
        const enr = enrollmentsFor(n);
        if (enr.ach_plus) counts.ach_plus = (counts.ach_plus || 0) + 1;
        if (enr.sa_ach)   counts.sa_ach   = (counts.sa_ach   || 0) + 1;
      } else if (kind === "states") {
        const isEd = state && state.editedIds && state.editedIds.has(n.id);
        const isIn = state && state.inheritedIds && state.inheritedIds.has(n.id);
        const key = isEd ? "edited" : isIn ? "inherited" : "unchanged";
        counts[key] = (counts[key] || 0) + 1;
      }
    });
    return counts;
  }, [tree, kind, state && state.editedIds, state && state.inheritedIds, state && state.npiView, state && state.npis]);
}

// Small filter button anchored inside a table column header.
// Funnel icon when idle; tinted with a count badge when active.
function ColumnFilter({ kind, options, state, dispatch, renderOpt, searchable, placeholder }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [anchorRect, setAnchorRect] = useState(null);
  const ref = useRef(null);
  const btnRef = useRef(null);
  const panelRef = useRef(null);
  useEffect(() => {
    function onDoc(e) {
      // Treat clicks INSIDE the trigger wrapper OR inside the portaled
      // panel as "still open" — otherwise picking an option would close
      // the popover before the click registered.
      if (ref.current && ref.current.contains(e.target)) return;
      if (panelRef.current && panelRef.current.contains(e.target)) return;
      setOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  // Reset the search field when the popover closes so reopening is clean.
  useEffect(() => { if (!open) setQuery(""); }, [open]);
  // Capture the trigger rect when the popover opens so the portaled
  // panel can position itself with `position:fixed` viewport coords.
  // Re-measure on scroll/resize so the panel stays anchored to the
  // trigger while the table is scrolled horizontally.
  useEffect(() => {
    if (!open || !btnRef.current) return;
    const update = () => setAnchorRect(btnRef.current.getBoundingClientRect());
    update();
    window.addEventListener("scroll", update, true);
    window.addEventListener("resize", update);
    return () => {
      window.removeEventListener("scroll", update, true);
      window.removeEventListener("resize", update);
    };
  }, [open]);
  const active = state.filters[kind];
  const count = active.size;
  const optionCounts = useFilterCounts(state.tree, kind, state);
  const q = query.trim().toLowerCase();
  const filteredOptions = !searchable || !q ? options : options.filter(o => (o.label || o.id || "").toString().toLowerCase().includes(q));
  // Panel positioned at viewport coords from the trigger rect. Right-
  // aligned to the trigger by default so the menu opens leftward (column
  // headers tend to live near the right edge of the table); falls back to
  // anchoring to the viewport edge if there isn't enough room.
  const panelStyle = anchorRect ? (() => {
    const minWidth = 240;
    const gap = 6;
    const top = anchorRect.bottom + gap;
    const idealRight = window.innerWidth - anchorRect.right;
    return { position:"fixed", top, right: Math.max(8, idealRight), minWidth };
  })() : { position:"fixed", visibility:"hidden" };
  return (
    <span className="col-filter-wrap" ref={ref}>
      <button
        ref={btnRef}
        className={"col-filter " + (count?"active":"")}
        onClick={(e)=>{ e.preventDefault(); e.stopPropagation(); setOpen(o=>!o); }}
        aria-label={`Filter${count?` (${count} active)`:""}`}
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill={count?"currentColor":"none"} stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
        </svg>
        {count > 0 && <span className="col-filter-count">{count}</span>}
      </button>
      {open && ReactDOM.createPortal(
        <div className="filter-panel col-filter-panel" ref={panelRef} style={panelStyle}>
          {searchable && (
            <div className="filter-search-wrap">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input
                type="text"
                className="filter-search-input"
                placeholder={placeholder || "Search…"}
                value={query}
                onChange={(e)=>setQuery(e.target.value)}
                autoFocus
              />
              {query && (
                <button className="filter-search-clear" onClick={()=>setQuery("")} aria-label="Clear search">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
                </button>
              )}
            </div>
          )}
          <div className="filter-options-scroll">
            {filteredOptions.length === 0 ? (
              <div className="filter-empty">No matches for "{query}"</div>
            ) : filteredOptions.map(o => {
              const n = optionCounts[o.id] || 0;
              return (
                <label key={o.id} className={"opt " + (n===0?"opt-empty":"")}>
                  <input type="checkbox" checked={active.has(o.id)} onChange={()=>dispatch({type:"toggleFilter", kind, val:o.id})}/>
                  <span className="opt-label">{renderOpt ? renderOpt(o) : <span>{o.label}</span>}</span>
                  <span className="opt-count">{n}</span>
                </label>
              );
            })}
          </div>
          {count > 0 && (
            <div className="filter-footer">
              <button className="filter-clear" onClick={()=>dispatch({type:"clearFilterKind", kind})}>Clear all</button>
            </div>
          )}
        </div>,
        document.body
      )}
    </span>
  );
}

// Inline dropdown for editing distribution method directly in a table cell.
// On-brand replacement for native <select>: looks like a quiet text/icon at
// rest, expands a popover menu with Fax / Mail icons + checkmark.
function InlineDistDropdown({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    function onKey(e) { if (e.key === "Escape") setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, []);
  const options = ["Fax", "Mail"];
  return (
    <div className="cell-dropdown" ref={ref}>
      <button type="button"
              className={"cell-dropdown-trigger " + (open ? "is-open" : "")}
              onClick={(e)=>{ e.stopPropagation(); setOpen(o=>!o); }}>
        <DistMethodIcon method={value}/>
        <span>{value}</span>
        <svg className="cell-dropdown-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      {open && (
        <div className="cell-dropdown-menu" onClick={(e)=>e.stopPropagation()}>
          {options.map(opt => (
            <button key={opt} type="button"
                    className={"cell-dropdown-item " + (opt === value ? "is-selected" : "")}
                    onClick={()=>{ onChange(opt); setOpen(false); }}>
              <DistMethodIcon method={opt}/>
              <span className="cell-dropdown-item-label">{opt}</span>
              {opt === value && (
                <svg className="cell-dropdown-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              )}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Bulk distribution breakdown — shows how many of the selected entities
// are on each delivery method (Fax / Mail / Digital). Reads each node's
// effective method (VC honors r.dist; Check→Mail; ACH/ACH+/SA→Digital).
// Each chip mirrors the bulk waterfall styling: solid navy + count + label
// for non-zero, muted ash for zero, with a hoverable entity breakdown.
function BulkDistBreakdown({ bulkNodes }) {
  const methodFor = (n) => {
    if (n.net === "vc") return n.dist || "Fax";
    if (n.net === "check") return "Mail";
    return "Digital";
  };
  const byMethod = {};
  for (const n of bulkNodes) (byMethod[methodFor(n)] = byMethod[methodFor(n)] || []).push(n);
  const methods = ["Fax", "Mail", "Digital"];
  return (
    <div className="bulk-dist-breakdown">
      {methods.map(m => {
        const here = byMethod[m] || [];
        if (here.length === 0) {
          return (
            <span key={m} className="eff-tag eff-tag-bulk-empty bulk-dist-chip">
              <DistMethodIcon method={m}/>
              <span className="bulk-dist-chip-label">{m}</span>
              <span className="bulk-dist-chip-count">0</span>
            </span>
          );
        }
        return (
          <Tooltip key={m}
            wrap align="left" placement="below"
            panelStyle={{ maxWidth: 520, padding: "10px 12px", whiteSpace: "normal" }}
            content={(
              <div className="bulk-tag-tip">
                <div className="bulk-tag-tip-title">
                  <DistMethodIcon method={m}/>
                  {here.length} on <b>{m}</b>
                </div>
                <ul className="bulk-tag-tip-list">
                  {here.map(n => (
                    <li key={n.id}>
                      <span className="bulk-tag-tip-row">
                        <span className={"bulk-tag-tip-lvl bulk-tag-tip-lvl-" + (n.level || "").toLowerCase().replace(/[^a-z]/g,"")}>{n.level === "ZIP" ? "Zip code" : n.level}</span>
                        <span className="bulk-tag-tip-name">{n.name}</span>
                        {n.uniqueId && <span className="bulk-tag-tip-id">{n.uniqueId}</span>}
                      </span>
                    </li>
                  ))}
                </ul>
              </div>
            )}>
            <span className="eff-tag eff-tag-bulk bulk-dist-chip">
              <DistMethodIcon method={m}/>
              <span className="bulk-dist-chip-label">{m}</span>
              <span className="bulk-dist-chip-count">{here.length}</span>
            </span>
          </Tooltip>
        );
      })}
    </div>
  );
}

// Distribution method icon — shared between the table cell and the filter popover.
function DistMethodIcon({ method }) {
  if (method === "Fax") return (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9V2h12v7"/><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M6 14h.01M6 18h.01M10 14h8M10 18h8"/></svg>);
  if (method === "Mail") return (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>);
  if (method === "Digital") return (
    // lucide-smartphone — Digital delivery (ACH / electronic)
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>);

}

function FilterChip({ label, kind, options, state, dispatch, renderOpt }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const active = state.filters[kind];
  const count = active.size;
  const optionCounts = useFilterCounts(state.tree, kind, state);
  return (
    <div className="relative" ref={ref}>
      <button className={"filter-chip " + (count?"active":"")} onClick={()=>setOpen(o=>!o)}>
        {label}
        {count > 0 && <span className="count">{count}</span>}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      {open && (
        <div className="filter-panel">
          {options.map(o => {
            const n = optionCounts[o.id] || 0;
            return (
              <label key={o.id} className={"opt " + (n===0?"opt-empty":"")}>
                <input type="checkbox" checked={active.has(o.id)} onChange={()=>dispatch({type:"toggleFilter", kind, val:o.id})}/>
                <span className="opt-label">{renderOpt ? renderOpt(o) : <span>{o.label}</span>}</span>
                <span className="opt-count">{n}</span>
              </label>

          })}

            <div className="filter-footer">
              <button className="filter-clear" onClick={()=>dispatch({type:"clearFilterKind", kind})}>Clear</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ExclusionRulesSheet({ open, onClose }) {
  const [query, setQuery] = React.useState("");
  const [activeOnly, setActiveOnly] = React.useState(false);
  const [scopeFilter, setScopeFilter] = React.useState("Global");
  const [scopeOpen, setScopeOpen] = React.useState(false);
  const scopeRef = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (scopeRef.current && !scopeRef.current.contains(e.target)) setScopeOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  if (!open) return null;
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
  };
  const q = query.trim().toLowerCase();
  const filtered = EXCLUSION_RULES_MOCK.filter(r => {
    if (activeOnly && r.status !== "Active") return false;
    if (scopeFilter !== "All" && r.scope !== scopeFilter) return false;
    if (!q) return true;
    return r.rule.toLowerCase().includes(q) || (r.scopeRef||"").toLowerCase().includes(q);
  });
  return (
    <Fragment>
      <div className="edit-drawer-backdrop" onClick={onClose}/>
      <div className="edit-pop as-drawer exclusion-sheet" style={{}}>
        <div className="edit-content">
          <div className="flex items-start gap-3">
            <div className="flex-1">
              <h3 className="edit-h1">Exclusion rules</h3>
              <div className="ctx-line mt-2">
                <span className="text-[13px] ink-2">Routing exceptions configured for this provider. Read-only.</span>
              </div>
            </div>
            <button onClick={onClose} className="ink-3 hover:ink">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          {/* In-drawer heads-up — same message as the page-level banner so
              the warning travels with the user when they enter the sheet. */}
          <div className="excl-disclaimer" style={{marginTop:14, marginBottom:0}}>
            <span className="ed-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            </span>
            <span className="ed-text">
              <b>Heads up —</b> any payment that triggers any of these rules may be routed to a different network than the fulfillment network shown in the table.
            </span>
          </div>
          <div className="excl-toolbar">
            <div className="excl-search">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input
                type="text"
                placeholder="Search by rule or applied at…"
                value={query}
                onChange={(e)=>setQuery(e.target.value)}
              />
            </div>
            <div className="excl-scope-filter" ref={scopeRef}>
              <button
                type="button"
                aria-label="Status filter"
                className={"trigger " + (activeOnly ? "is-on" : "")}
                onClick={()=>setScopeOpen(v=>!v)}
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
              </button>
              {scopeOpen && (() => {
                const activeCount = EXCLUSION_RULES_MOCK.filter(r => r.status === "Active").length;
                return (
                  <div className="menu">
                    <div className="menu-section">Status</div>
                    <button
                      type="button"
                      className={activeOnly ? "is-on" : ""}
                      onClick={()=>setActiveOnly(v=>!v)}
                    >
                      <span className="opt-tickbox">
                        {activeOnly && (
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        )}
                      </span>
                      <span className="opt-label">Active only</span>
                      <span className="opt-count">{activeCount}</span>
                    </button>
                  </div>
                );
              })()}
            </div>
          </div>
          {/* Scope tabs — primary filter for the rules list. Counts shown
              per tab make it easy to see which scopes have rules at a glance. */}
          {(() => {
            const scopeCounts = EXCLUSION_RULES_MOCK.reduce((c,r) => ((c[r.scope]=(c[r.scope]||0)+1), c), {});
            const tabs = [
              { id:"Global",           label:"Global",           count: scopeCounts["Global"] || 0,
                icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg> },
              { id:"Sub-payer",        label:"Sub-payer",        count: scopeCounts["Sub-payer"] || 0,
                icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg> },
              { id:"Provider opt-out", label:"Provider opt-out", count: scopeCounts["Provider opt-out"] || 0,
                icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg> },
            ];
            return (
              <div className="excl-tabs">
                {tabs.map(t => (
                  <button
                    key={t.id}
                    type="button"
                    className={"excl-tab " + (scopeFilter === t.id ? "is-on" : "")}
                    onClick={()=>setScopeFilter(t.id)}
                  >
                    {t.icon}
                    {t.label}
                    <span className="tab-count">{t.count}</span>
                  </button>
                ))}
              </div>
            );
          })()}
          {(query.trim() || activeOnly) && (
            <div className="excl-count">
              Showing {filtered.length} of {EXCLUSION_RULES_MOCK.length} {EXCLUSION_RULES_MOCK.length === 1 ? "rule" : "rules"}
            </div>
          )}
          <div className="excl-list">
            {filtered.length === 0 ? (
              <div className="excl-empty">No exclusion rules match your search.</div>
            ) : filtered.map(r => (
              <ExclusionRuleCard key={r.id} r={r} query={query} fmtDate={fmtDate}/>
            ))}
          </div>
        </div>
        <div className="edit-bottom">
          <div className="edit-actions flex items-center justify-end gap-2">
            <button className="btn btn-quiet" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    </Fragment>
  );
}

function LevelTabs({ state, dispatch, highlight, relocated }) {
  // In Unified Routing (Variant C) default the active tab to Sub-account on
  // mount — Eric's feedback: sub-account is the canonical anchor for the
  // routing engine, not the flat "All" view.
  const unified    = useContext(UnifiedContext);
  useEffect(() => {
    if (unified && state.filters.levels.size === 0 && !state.npiView) {
      dispatch({type:"setLevels", val: new Set(["Sub-account"])});
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [unified]);
  const counts = useMemo(() => {
    const c = { all:0, Account:0, "Sub-account":0, ZIP:0 };
    walk(state.tree, (n) => { c.all++; c[n.level] = (c[n.level]||0) + 1; });

  }, [state.tree]);
  const current = state.npiView ? "NPI" :
    (state.filters.levels.size === 1 ? Array.from(state.filters.levels)[0] : "all");

  const tabs = [

  return (
    <div className="table-tabs mb-3">
      {tabs.map(t => (

          {t.label}
          <span className="tab-count">{counts[t.id]}</span>
        </button>
      ))}
      {/* NPI tab — separate concept from the hierarchy. Tooltip explains
          the acronym to non-healthcare CSRs. */}
      <Tooltip wrap content={<span><b>National Provider Identifier</b> — unique 10-digit ID issued by CMS to healthcare providers.</span>} panelStyle={{maxWidth:280}}>
        <button className={"table-tab " + (current === "NPI" ? "active" : "")} onClick={()=>dispatch({type:"setNpiView", val:true})}>
          <span className="lvl-badge" style={{width:16, height:16, borderRadius:6, background:"var(--ash, #F3F3F3)", color:"var(--ink-2)", display:"inline-flex", alignItems:"center", justifyContent:"center"}}>

      <button
        key={relocated ? "reloc" : "rest"}

  const accountById = useMemo(() => Object.fromEntries(state.tree.filter(a => a.level === "Account").map(a => [a.id, a])), [state.tree]);
  const filtersOn = hasActiveFilters(state.filters);
  const rows = useMemo(() => state.npis.filter(n => {
    const f = state.filters;
    if (f.nets.size && !f.nets.has(n.net)) return false;
    if (f.npiTypes.size && !f.npiTypes.has(n.type)) return false;
    if (f.dists.size) {
      const isDigital = n.net === "ach" || n.net === "achp" || n.net === "sa";
      const eff = isDigital ? "Digital" : (n.net === "check" ? "Mail" : n.dist);
      if (!f.dists.has(eff)) return false;

    if (f.search.trim()) {

  }), [state.npis, state.filters]);
  const visibleIds = rows.map(n => n.id);

        <div className="head-strip head-dynamic" style={{gridTemplateColumns: NPI_GRID_COLS}}>
          <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type: e.target.checked ? "selectMany":"clearSelection", ids: visibleIds })}/></div>
          <div></div>
          <div></div>
          <div>NPI #</div>
          <div>
            <span>Type</span>
            <ColumnFilter kind="npiTypes" options={[{id:"Type 1",label:"Type 1 — Individual"},{id:"Type 2",label:"Type 2 — Organization"}]} state={state} dispatch={dispatch}

                : <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V12h6v10M8 6h.01M8 10h.01M16 6h.01M16 10h.01"/></svg>}<span>{o.label}</span></span>}/>
          </div>
          <div>Provider</div>
          <div>Taxonomy</div>
          <div>Linked account</div>
          <div>
            <span>Network</span>
            <ColumnFilter kind="nets" options={NETS.map(n=>({id:n.id,label:n.label}))} state={state} dispatch={dispatch}
              renderOpt={(o)=><span className="net"><span className={"dot "+dotFor(o.id)}/><span>{o.label}</span></span>}/>
          </div>
          <div>
            <span>Distribution</span>
            <ColumnFilter kind="dists" options={[{id:"Fax",label:"Fax"},{id:"Mail",label:"Mail"},{id:"Digital",label:"Digital"}]} state={state} dispatch={dispatch}
              renderOpt={(o)=><span className="flex items-center gap-2"><DistMethodIcon method={o.id}/><span>{o.label}</span></span>}/>
          </div>
          <div style={{justifyContent:"flex-end"}}>Action</div>

          <div className="p-10 text-center ink-2">
            <div className="text-base font-semibold mb-1">No matches</div>
            <div className="text-[13px]">Try a different search or <button className="btn-ghost" onClick={()=>dispatch({type:"clearFilters"})}>clear filters</button>.</div>
          </div>
        ) : rows.map(n => <NpiRow key={n.id} n={n} parentAccount={accountById[n.linkedAccountId]} state={state} dispatch={dispatch}/>)}
      </div>

          <div className="absolute" style={{ position:"fixed", top:0, right:0, zIndex:50 }}>
            <EditPopover node={editingNpi} parents={parents}

    </div>
  );

function QuickFilters({ state, dispatch }) {

function matchesFilters(node, state) {
  const f = state.filters;
  if (f.nets.size && !f.nets.has(node.net)) return false;
  if (f.levels.size && !f.levels.has(node.level)) return false;
  if (f.states.size) {
    const isEd = state.editedIds.has(node.id);
    const isIn = state.inheritedIds.has(node.id);
    let ok = false;
    if (f.states.has("edited") && isEd) ok = true;
    if (f.states.has("inherited") && isIn) ok = true;
    if (f.states.has("unchanged") && !isEd && !isIn) ok = true;
    if (!ok) return false;
  }
  if (f.overrides) {
    const parent = node.parents && node.parents.length ? node.parents[node.parents.length-1] : null;
    if (!parent || parent.net === node.net) return false;
  }
  if (f.dists.size) {
    const isDigital = node.net === "ach" || node.net === "achp" || node.net === "sa";
    const effectiveDist = isDigital ? "Digital" : (node.net === "check" ? "Mail" : node.dist);
    if (!f.dists.has(effectiveDist)) return false;
  }
  if (f.geoStates.size) {
    // Only ZIPs carry a US state. Filtering by state surfaces only locations.
    if (!node.state || !f.geoStates.has(node.state)) return false;
  }
  if (f.orgs && f.orgs.size) {
    if (!node.org || !f.orgs.has(node.org)) return false;
  }
  if (f.entities && f.entities.size) {
    if (!node.name || !f.entities.has(node.name)) return false;
  }
  if (f.vcConsent && f.vcConsent.size) {
    // VC consent lives at the root account level (legal flag per provider).
    // Walk to the root via id prefix and check vcConsentFor — "yes" means
    // consent on file, "no" means missing.
    const has = vcConsentFor(node);
    const want = has ? "yes" : "no";
    if (!f.vcConsent.has(want)) return false;
  }
  if (f.achEnrollment && f.achEnrollment.size) {
    // ACH product enrollments are per-root-account too. Filter passes when
    // ANY selected product is enrolled on the row's root.
    const enr = enrollmentsFor(node);
    const want = [...f.achEnrollment];
    const matchesAny = want.some(k => k === "ach_plus" ? enr.ach_plus : k === "sa_ach" ? enr.sa_ach : false);
    if (!matchesAny) return false;
  }
  if (f.search.trim()) {
    const q = f.search.toLowerCase();
    // Include parent chain so a ZIP row surfaces when the CSR searches by
    // its sub-account / account name (Eric's case: "find me the ZIPs
    // under Neighborhood Health Partnership"). Without this, searching
    // "Neighborhood" inside the Locations / Zips tab returns nothing.
    const parentNames = (node.parents || []).map(p => p.name).filter(Boolean);
    const parentIds   = (node.parents || []).map(p => p.uniqueId).filter(Boolean);
    // Searchable fields cover everything visible in the row + a few
    // useful identifiers from the parent chain. Money values are
    // stringified so "$10,000" / "10000" / "10" all match.
    const maxAsText = node.max ? [String(node.max), "$" + Number(node.max).toLocaleString()].join(" ") : "";
    const hay = [node.name, node.uniqueId, node.payerSso, node.org, node.phone, node.fax, maxAsText, ...parentNames, ...parentIds]
      .filter(Boolean).join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────
// Generic preference row
// ─────────────────────────────────────────────────────────────────────
function PrefRow({ r, state, dispatch, flat, hierarchical, withDist, visibleCols }) {
  const edited     = state.editedIds.has(r.id);
  const inherited  = state.inheritedIds.has(r.id);
  const selected   = state.selected.has(r.id);
  const wasChanged = edited || inherited;
  const original   = state.originalNet[r.id];
  const editing    = state.editingId === r.id;
  // No row-level padding indent in the dynamic grid — it would shift every
  // grid track right and break header/body column alignment. Hierarchy is
  // already signaled by the icon/badge + the row's `child-row` class.
  const indentCls  = (flat || visibleCols) ? "" : (r.depth === 1 ? "indent-1" : r.depth === 2 ? "indent-2" : "");
  const stateCls   = (edited ? "is-edited " : inherited ? "is-inherited " : "") + (selected ? "is-selected" : "");
  const sectionCls = !flat && r.depth === 0 ? "account-row" : !flat && r.depth > 0 ? "child-row" : "";
  // Variant B (Routing-aware) injects extra context inside the cell.
  // Default false → A is unaffected.
  const routingAware = useContext(RoutingAwareContext);
  const unified      = useContext(UnifiedContext);
  const entityRules  = routingAware ? relevantRulesForEntity(r) : [];
  // Variant C — provider opt-outs for this row, fed from the session-level
  // store via OptOutWizardContext. Only filtered/rendered in Unified.
  const wizApi       = useContext(OptOutWizardContext);
  // Opt-outs were originally Unified-only — moved to all variants so
  // the new "Opt-outs" column has data regardless of which proposal the
  // CSR is browsing. The wizard for CREATING opt-outs is still Unified-
  // only; here we only READ the existing list.
  const rowOptOuts   = useMemo(() => {
    if (!wizApi?.optOuts) return [];
    return wizApi.optOuts.filter(o => o.entityName === r.name);
  }, [wizApi?.optOuts, r.name]);
  // Eric's case: same ZIP exists under multiple sub-accounts. When that's
  // true we hand EditPopover the sibling list so the location-scope
  // control becomes a sub-account picker instead of a single checkbox.
  // Each sibling carries enough metadata (sub-account name + payment
  // metrics) to build the dropdown options + per-scope impact preview.
  const dupZipSiblings = useMemo(() => {
    if (r.level !== "ZIP" || !(r._zipDupCount > 1)) return null;
    const out = [];
    function walkSibs(nodes, parents=[]) {
      for (const n of nodes) {
        if (n.level === "ZIP" && n.name === r.name) {
          const sub = parents[parents.length-1];
          out.push({
            id: n.id,
            subAccountId: sub?.id,
            subAccountName: sub?.name || "—",
            net: n.net, dist: n.dist,
            inFlight: n.inFlightPayments || 0,
            volume: n.monthlyVolume || 0,
            lastDays: n.lastPaymentDaysAgo == null ? null : n.lastPaymentDaysAgo,
            isCurrent: n.id === r.id,
          });
        }
        if (n.children) walkSibs(n.children, [...parents, n]);
      }
    }
    walkSibs(state.tree);
    return out;
  }, [r.level, r._zipDupCount, r.name, r.id, state.tree]);
  // Variant C (Unified) — account rows show aggregated metrics instead of
  // a waterfall, because the routing actually lives at sub-account level.
  const isAccountAgg = unified && r.level === "Account";
  const accountAgg   = useMemo(() => {
    if (!isAccountAgg) return null;
    const subs = r.children || [];
    let zips = 0, rules = 0;
    const netCount = { vc:0, achp:0, ach:0, check:0, sa:0 };
    for (const sub of subs) {
      const sZips = sub.children || [];
      zips += sZips.length;
      if (sub.net) netCount[sub.net] = (netCount[sub.net]||0) + 1;
      for (const z of sZips) { if (z.net) netCount[z.net] = (netCount[z.net]||0) + 1; }
      rules += relevantRulesForEntity(sub).length;
      for (const z of sZips) rules += relevantRulesForEntity(z).length;
    }
    const total = Object.values(netCount).reduce((a,b)=>a+b, 0) || 1;
    const distribution = Object.entries(netCount).filter(([,n])=>n>0).map(([id,n]) => ({ id, pct: Math.round((n/total)*100) }));
    return { subCount: subs.length, zipCount: zips, ruleCount: rules, distribution };
  }, [isAccountAgg, r]);
  // Provider opt-out rules tied to this account specifically — surfaced in
  // both A and B as a small chip under the entity meta line.
  const optOutRules  = providerOptOutRulesForEntity(r);
  const editingCls = editing ? "is-editing-row" : "";
  const parents    = r.parents || [];
  const pathLabel  = flat && parents.length ? parents.map(p=>p.name).join(" › ") : null;

  const isVc = r.net === "vc";
  // In drawer mode the whole row is clickable as a shortcut for "Edit".
  // We swallow clicks that originate from interactive children (checkbox,
  // chevron, the inline cell editors, the Edit button itself).
  const editorStyle = useContext(EditorStyleContext);
  const isDrawer = editorStyle === "drawer";
  // When the new dynamic-column system is in play (visibleCols passed
  // from VariantTable's Preferences view) we use an inline grid style;
  // otherwise fall back to the legacy class-based grids so the other
  // call sites (NPI, etc.) keep working unchanged.
  const useDynamicGrid = !!visibleCols;
  // Row-background click only fires in legacy mode. In dynamic-column
  // mode the row is NOT clickable as a whole — only the specific
  // editable cells (Distribution, Phone, Network priority, etc.) open
  // the editor when clicked. Keeps the surface calm + predictable.
  const handleRowClick = (isDrawer || useDynamicGrid) ? (e) => {
    // Inline-edit controls and other interactive bits stop propagation
    // themselves, but match a wide selector here as a safety net so the
    // background-click never hijacks an active control.
    if (e.target.closest("input, select, button, .clickable-cell, .change-trigger, .edit-pop, .cell-input, .cell-select, .cell-dropdown, .cell-dropdown-menu, .tip-panel, a")) return;
    if (state.editingId === r.id) return;

            <span className="cell-contact-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <input
              type="text"
              className={"cell-input cell-input-mono cell-input-active " + (state.filters.search && r.phone && r.phone.toLowerCase().includes(state.filters.search.toLowerCase()) ? "is-search-match" : "")}
              defaultValue={r.phone || ""}
              placeholder="—"
              onClick={(e)=>e.stopPropagation()}
              onKeyDown={(e)=>{
                if (e.key === "Enter") e.currentTarget.blur();
                if (e.key === "Escape") { e.currentTarget.value = r.phone || ""; e.currentTarget.blur(); }
              }}
              onBlur={(e)=>{
                const v = e.target.value.trim();
                if (v !== (r.phone || "")) dispatch({type:"applyEdit", id:r.id, draft:{ phone:v, applyCascade:false }});
              }}
              title="Edit phone"/>
          </span>
        </div>
      )}
      {useDynamicGrid && visibleCols.maxAmount && (
        <div className="cell-text cell-num">
          {r.net === "vc" ? (
            <MaxAmountInput
              value={r.max || 0}
              searchQuery={state.filters.search}
              onChange={(v)=>dispatch({type:"applyEdit", id:r.id, draft:{ max:v, applyCascade:false }})}/>
          ) : <span className="ink-3">—</span>}
        </div>
      )}
      <div className="action">
        {isAccountAgg ? (
          // Account-level aggregated view in Unified — nothing to edit at
          // this level (routing lives at sub-account). Show a hint instead.
          <span className="acct-agg-hint ink-3 text-[11px]">Expand to edit</span>
        ) : (
          <div className="action-cluster">
            {wasChanged && edited && (
              <span className="change-applied undo" onClick={()=>dispatch({type:"undo", id:r.id})}>Undo</span>
            )}
            <button className={"change-trigger " + (editing && state.editingScope === "all" ?"on":"") + (state.selected.size > 0 ? " is-bulk-dim" : "")} onClick={(e)=>{ e.stopPropagation(); dispatch({type:"openEdit", id:r.id, scope:"all"}); }}>
              Edit
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            {/* Row-scoped "Create opt-out" — opens the same wizard the
                Unified page-level CTA opens, but pre-fills the entity
                context (name + level + state/zip) for this row. Available
                across variants now that opt-outs render in every table. */}
            <button
              type="button"
              className={"row-create-opt-btn " + (state.selected.size > 0 ? " is-bulk-dim" : "")}
              onClick={(e)=>{
                e.stopPropagation();
                wizApi.open({
                  entityName: r.name,
                  level: r.level,
                  zip: r.level === "ZIP" ? r.name : undefined,
                  state: r.state,
                  suggestedLevel: r.level === "ZIP" ? "zip" : r.level === "Sub-account" ? "sub-account" : "account",
                });
              }}
              title="Create opt-out for this row"
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Opt-out
            </button>
            {unified && <RowOptOutMenu node={r}/>}
          </div>
        )}
        {editing && state.editingScope === "all" && (
          <EditPopover node={r} parents={parents} scope="all" overridesAtRisk={overridesIn(r)} overrides={overrideListIn(r)}
            dupZipSiblings={dupZipSiblings}
            onCancel={()=>dispatch({type:"closeEdit"})}
            onApply={(draft)=>{ dispatch({type:"applyEdit", id:r.id, draft }); dispatch({type:"showToast", id:Date.now(), msg:"Payment preferences updated"}); }}
            anchorRight/>
        )}
      </div>
    </div>
  );
}

// Inline money input — shows "$10,000" formatted at rest. On focus the
// caret enters the digits; while typing only digits are accepted and the
// display reformats on blur. Pressing Enter commits, Escape reverts.
// Money input for the Effective Waterfall step body. Same UX as the
// table's MaxAmountInput (live $ + thousand separators) but using the
// eff-substep visual treatment (prefix + bordered input) so it slots
// into the existing layout without restyling.
function EffSubstepMoneyInput({ value, onChange }) {
  const fmt = (n) => Number(n || 0).toLocaleString();
  const [text, setText] = useState(fmt(value));
  useEffect(() => { setText(fmt(value)); }, [value]);
  return (
    <>
      <span className="eff-substep-prefix">$</span>
      <input
        className="eff-substep-input"
        type="text"
        inputMode="numeric"
        value={text}
        onFocus={(e)=>e.target.select()}
        onChange={(e)=>{
          const digits = e.target.value.replace(/[^\d]/g, "");
          setText(digits ? Number(digits).toLocaleString() : "");
        }}
        onKeyDown={(e)=>{
          if (e.key === "Enter") e.currentTarget.blur();
          if (e.key === "Escape") { setText(fmt(value)); e.currentTarget.blur(); }
        }}
        onBlur={()=>{
          const digits = text.replace(/[^\d]/g, "");
          const n = digits ? Number(digits) : 0;
          if (n !== value) onChange(n);
          setText(fmt(n));
        }}
      />
    </>
  );
}

function MaxAmountInput({ value, onChange, searchQuery }) {
  // Display the number only inside the editable input — the $ prefix
  // lives outside as a fixed glyph so editing reads as "amount", not
  // "currency string with a $ in front to scroll past".
  const fmt = (n) => Number(n || 0).toLocaleString();
  const [text, setText] = useState(fmt(value));
  const matches = searchQuery && ("$" + text).toLowerCase().includes(searchQuery.toLowerCase());
  // Re-sync displayed text when the upstream value changes (e.g. cascade
  // from a parent edit) — avoids the input staying stale after an undo.
  useEffect(() => { setText(fmt(value)); }, [value]);
  return (
    <span className={"cell-money-wrap " + (matches ? "is-search-match" : "")}>
      <span className="cell-money-prefix">$</span>
      <input
        type="text"
        inputMode="numeric"
        className="cell-input cell-input-active cell-input-money"
        value={text}
        onClick={(e)=>e.stopPropagation()}
        onFocus={(e)=>{ e.target.select(); }}
        onChange={(e)=>{
          // Allow free typing; strip non-digits and reformat with thousand
          // separators so the user sees a clean number while typing.
          const digits = e.target.value.replace(/[^\d]/g, "");
          setText(digits ? Number(digits).toLocaleString() : "");
        }}
        onKeyDown={(e)=>{
          if (e.key === "Enter") e.currentTarget.blur();
          if (e.key === "Escape") { setText(fmt(value)); e.currentTarget.blur(); }
        }}
        onBlur={()=>{
          const digits = text.replace(/[^\d]/g, "");
          const n = digits ? Number(digits) : 0;
          if (n !== value) onChange(n);
          setText(fmt(n));
        }}
        title="Edit max amount"/>
    </span>
  );
}

// ─────────────────────────────────────────────────────────────────────

  const FaxIcon  = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9V2h12v7"/><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M6 14h.01M6 18h.01M10 14h8M10 18h8"/></svg>;
  // Digital delivery — smartphone glyph (replaces previous lightning bolt
  // which read more as "fast" than "digital channel")

        </div>
      )}
      {isVc && r.dist === "Mail" && (
        <span className="dist-line"><MailIcon/>Mail</span>

      {isCheck && (
        <>
          <span className="dist-line"><MailIcon/>Mail</span>
          <Tooltip wrap content={lockedNote}>
            <span className="dist-info-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>
            </span>
          </Tooltip>
        </>
      )}
      {isDigital && (
        <>
          <span className="dist-line"><BoltIcon/>Digital</span>
          <Tooltip wrap content={lockedNote}>
            <span className="dist-info-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>

// ─────────────────────────────────────────────────────────────────────
// DistRow — distribution-focused row (used in split mode)
// ─────────────────────────────────────────────────────────────────────
function DistRow({ r, state, dispatch, flat, hierarchical }) {
  const edited     = state.editedIds.has(r.id);
  const inherited  = state.inheritedIds.has(r.id);
  const selected   = state.selected.has(r.id);
  const indentCls  = flat ? "" : (r.depth === 1 ? "indent-1" : r.depth === 2 ? "indent-2" : "");
  const stateCls   = (edited ? "is-edited " : inherited ? "is-inherited " : "") + (selected ? "is-selected" : "");
  const sectionCls = !flat && r.depth === 0 ? "account-row" : !flat && r.depth > 0 ? "child-row" : "";
  const isVc       = r.net === "vc";
  return (
    <div className={`row ${indentCls} ${stateCls} ${sectionCls}`}>
      <span className="left-edge"></span>
      <div><input type="checkbox" checked={selected} onChange={()=>dispatch({type:"toggleSelect", id:r.id})}/></div>
      <div>
        {hierarchical && r.children && r.children.length > 0 ? (
          <button className={"chev "+(state.expanded[r.id]?"open":"")} onClick={()=>dispatch({type:"toggleExpand", id:r.id})}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        ) : <span/>}
      </div>
      <LevelBadge level={r.level} size={32}/>
      <div>
        <div className="mb-0.5"><LevelLabel level={r.level}/></div>
        <div className="name">{r.name}</div>
        <div className="meta">
          {isVc ? "Delivery for Virtual Card payments" : <span className="ink-3">Doesn't apply to {NET_BY_ID[r.net].label}</span>}
        </div>
      </div>
      <DistContent r={r} state={state} dispatch={dispatch}/>
      <div className="action">
        <button className={"change-trigger" + (state.selected.size > 0 ? " is-bulk-dim" : "")} onClick={()=>dispatch({type:"openEdit", id:r.id})}>Edit</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Variant A — Hierarchy table
// ─────────────────────────────────────────────────────────────────────
function VariantTable({ state, dispatch }) {
  const all = useMemo(() => flatten(state.tree), [state.tree]);
  // Track horizontal scroll so we only show the right-edge shadow on the
  // sticky entity cell when content is actually scrolled — at scrollLeft=0
  // there's nothing beneath to indicate, so the shadow is just noise.
  const [scrolledX, setScrolledX] = useState(false);
  const filtersOn = hasActiveFilters(state.filters);
  // Expose the current opt-out list to the module-level sort accessor
  // — sortRows can't reach React context, so we stash a reference here
  // while the table is rendering. Re-runs whenever the wizardApi store
  // changes, which is exactly when sort order could shift.
  const _wizardApiForSort = useContext(OptOutWizardContext);
  useEffect(() => { window.__sortOptOuts = _wizardApiForSort?.optOuts || []; }, [_wizardApiForSort?.optOuts]);
  // Unique organization names in the current tree — drives the
  // Organization column filter's multiselect option list.
  const orgOptions = useMemo(() => {
    const set = new Set();
    walk(state.tree, (n) => { if (n.org) set.add(n.org); });
    return [...set].sort().map(o => ({ id: o, label: o }));
  }, [state.tree]);
  // Unique entity names — drives the Account name column filter so the
  // CSR can pick one or more entities by name (across account / sub-
  // account / ZIP). Useful when scanning a large provider tree.
  const entityOptions = useMemo(() => {
    const set = new Set();
    walk(state.tree, (n) => { if (n.name) set.add(n.name); });
    return [...set].sort().map(o => ({ id: o, label: o }));
  }, [state.tree]);
  // In Routing-aware (Variant B) the rule context is already surfaced inline
  // in the table (per-cell badges + waterfall peek), so the top-of-page
  // banner is redundant. Only show it for the plain hierarchy view.
  const isRoutingAware = useContext(RoutingAwareContext);
  // Variant C (Unified) has its own dedicated Distribution tab at the page
  // level — so the table here drops the Distribution column to keep the
  // network/routing focus uncluttered. Per-row distribution editing still
  // lives inside the Edit drawer.
  const unifiedTable    = useContext(UnifiedContext);
  // Variant C — built-in dev preview toggle inside the Unified Routing
  // section. Off by default (= full Unified). When ON it enforces the
  // strict interpretation of the Schmid + Eric recap: only the Sub-
  // accounts tab visible (others hidden) and the Edit drawer drops the
  // Network/Distribution sub-tab toggle. State lives locally here and
  // is broadcast downward via SimplifiedContext so LevelTabs / EditPopover
  // / the Exclusion-rules relocator all react in concert.
  const [simplifiedMode, setSimplifiedMode] = useState(false);
  const simplifiedTable = simplifiedMode;
  // Column visibility — initialized from COLUMN_REGISTRY's defaultOn
  // flags. Required columns (entity, action) can't be turned off.
  // CSRs can toggle the rest via the ColumnsPicker in the toolbar.
  // Rollup variant flips netDistribution ON by default so the new column
  // is visible the moment the variant is picked.
  const isRollup = state.variant === "routing-rollup";
  const [visibleCols, setVisibleCols] = useState(() => ({
    ...COLUMN_DEFAULTS,
    netDistribution: isRollup,
  }));
  // If the variant changes after mount, keep the rollup default in sync
  // (turn netDistribution on when entering the variant, off when leaving).
  useEffect(() => {
    setVisibleCols(v => ({ ...v, netDistribution: isRollup }));
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isRollup]);
  // When simplified mode flips on, clear NPI view and lock the level
  // filter to Sub-account. Re-runs only on toggle so the user can still
  // search inside Sub-accounts without being reset every keystroke.
  useEffect(() => {
    if (!simplifiedTable) return;
    if (state.npiView) dispatch({type:"setNpiView", val:false});
    if (!(state.filters.levels.size === 1 && state.filters.levels.has("Sub-account"))) {
      dispatch({type:"setLevels", val: new Set(["Sub-account"])});
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [simplifiedTable]);
  // Disclaimer visibility lives here so the trigger button in LevelTabs can
  // react to it (pulse while open; one-shot flash after dismiss).
  const [disclaimerOpen, setDisclaimerOpen] = useState(!isRoutingAware);
  const [justRelocated, setJustRelocated] = useState(false);
  function dismissDisclaimer() {
    setDisclaimerOpen(false);
    setJustRelocated(true);
    setTimeout(() => setJustRelocated(false), 1200);
  }
  // If the user opens the rules sheet, treat that as acknowledgement —
  // the outer banner can go away silently (no flash, because the warning
  // is now visible inside the drawer instead).
  useEffect(() => {
    if (state.exclusionRulesOpen && disclaimerOpen) setDisclaimerOpen(false);
  }, [state.exclusionRulesOpen]);

  const sortActive = !!(state.sort && state.sort.key);
  const rows = useMemo(() => {
    let out;
    // When sort is active, flatten the entire tree so the sort spans
    // every entity (not just expanded ones). Without this, sorting in
    // hierarchical mode would only reorder the few visible parents and
    // leave the rest of the tree hidden behind their unexpanded roots.
    if (filtersOn || sortActive) out = all.filter(r => filtersOn ? matchesFilters(r, state) : true);
    else {
      out = [];
      function go(n, depth=0, parents=[]) { out.push({ ...n, depth, parents }); if (n.children && state.expanded[n.id]) for (const c of n.children) go(c, depth+1, [...parents, n]); }
      for (const n of state.tree) go(n);
    }
    // Eric's feedback: same ZIP can be paid by multiple sub-accounts, and
    // it was hard to know which row to click. For each ZIP we collect the
    // distinct account + sub-account names where it appears, so the row
    // can render a compact "in N accounts · N sub-accounts" hint with the
    // actual names surfacing on hover. Counts span the full tree (not
    // just visible rows) so the hint is truthful regardless of filters.
    const zipPlaces = {};
    for (const r of all) {
      if (r.level !== "ZIP") continue;
      const sub = r.parents && r.parents[r.parents.length-1];
      const acct = r.parents && r.parents[r.parents.length-2];
      const slot = zipPlaces[r.name] = zipPlaces[r.name] || { count:0, accounts:new Map(), subs:new Map() };
      slot.count++;
      if (acct) slot.accounts.set(acct.id, acct.name);
      if (sub)  slot.subs.set(sub.id, sub.name);
    }
    out = out.map(r => {
      if (r.level !== "ZIP") return r;
      const slot = zipPlaces[r.name];
      if (!slot || slot.count <= 1) return r;
      return {
        ...r,
        _zipDupCount: slot.count,
        _zipAccountNames: Array.from(slot.accounts.values()),
        _zipSubAccountNames: Array.from(slot.subs.values()),
      };
    });
    // When the ZIP tab is the only active filter, group same-ZIP rows
    // adjacent so the duplicates read as a cluster instead of being
    // scattered through the list. Sort by ZIP first, then sub-account.
    const onlyZipFilter = state.filters.levels.size === 1 && state.filters.levels.has("ZIP")
      && !state.filters.search.trim() && !state.filters.nets.size && !state.filters.states.size
      && !state.filters.dists.size && !state.filters.geoStates.size && !state.filters.overrides;
    if (onlyZipFilter) {
      out = [...out].sort((a, b) => {
        if (a.name !== b.name) return a.name.localeCompare(b.name);
        const ap = (a.parents && a.parents[a.parents.length-1]?.name) || "";
        const bp = (b.parents && b.parents[b.parents.length-1]?.name) || "";
        return ap.localeCompare(bp);
      });
    }
    // User-driven column sort. Applied AFTER the default ZIP grouping so
    // the explicit sort always wins. Hierarchical view (no filters / no
    // sort) keeps tree order; once the CSR picks a sort, the rows
    // collapse to a flat sorted list.
    if (state.sort && state.sort.key) {
      out = sortRows(out, state.sort);
    }
    return out;
  }, [state, all, filtersOn]);
  const visibleIds = rows.map(r => r.id);
  const anyExpanded = Object.values(state.expanded).some(Boolean);

  return (
    <SimplifiedContext.Provider value={simplifiedTable}>
    <div>
      {/* Built-in dev preview chip — only in Unified. Lets the CSR / reviewer
          flip between the full Unified table and the strict Simplified
          interpretation without leaving the page. Discreet, bottom-left. */}
      {unifiedTable && (
        <UnifiedDevPreview value={simplifiedMode} onChange={setSimplifiedMode}/>
      )}
      {/* Simplified mode hides the level tabs entirely — Sub-account is
          force-set as the filter inside LevelTabs' effect, and the other
          tabs (All / Accounts / Locations / NPI) would only add noise to
          the strict interpretation of Schmid's recap. */}
      {!simplifiedTable && (
        <LevelTabs state={state} dispatch={dispatch} highlight={disclaimerOpen} relocated={justRelocated}/>
      )}
      <ExclusionRulesSheet open={state.exclusionRulesOpen} onClose={()=>dispatch({type:"closeExclusionRules"})}/>
      {disclaimerOpen && <ExclusionDisclaimer dispatch={dispatch} onDismiss={dismissDisclaimer}/>}
      {state.npiView ? <NPISection state={state} dispatch={dispatch}/> : (<>
      <div className="flex items-center gap-2 mb-3">
        <div className="flex-1 min-w-0">
          <Toolbar state={state} dispatch={dispatch} total={all.length} shown={rows.length} visibleIds={visibleIds} hideLevelFilter/>
        </div>
        {/* Quick filters live next to the search — only render when relevant
            (e.g., "Has edits" appears once the CSR has made changes). */}
        <QuickFilters state={state} dispatch={dispatch}/>
        {/* Simplified — Exclusion rules button is relocated next to Create
            opt-out (the tab strip that normally hosts it is hidden). Sits
            to the LEFT so the primary CTA stays right-aligned. */}
        {simplifiedTable && (
          <button type="button" className="exclusion-trigger" onClick={()=>dispatch({type:"openExclusionRules"})}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/></svg>
            Exclusion rules
            <span className="exclusion-count">{EXCLUSION_RULES_MOCK.length}</span>
          </button>
        )}
        {/* Variant C (Unified Routing) — page-level "Create opt-out" CTA.
            Eric's feedback: must support proactive opt-outs without coming
            from a specific payment. Wizard opens with no entity context. */}
        <UnifiedCreateOptOutCta/>
        {/* Columns picker — discreet "Columns" button + popover with a
            checklist of every available column. Lets the CSR add or
            remove columns to fit their workflow. Sits to the LEFT of
            Expand all so it groups with the toolbar's view controls. */}
        <ColumnsPicker visible={visibleCols} onChange={setVisibleCols}/>
        {/* Expand-all sits next to the search bar — quiet text+icon button
            so the affordance reads clearly. Only shown in All view. */}
        {!filtersOn && state.filters.levels.size === 0 && (
          <button className="btn-icon-quiet" onClick={()=>dispatch({type: anyExpanded ? "collapseAll" : "expandAll"})}>
            {anyExpanded ? (
              <>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
                Collapse all
              </>
            ) : (
              <>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                Expand all
              </>
            )}
          </button>
        )}
      </div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        {state.selected.size > 0 && (

            <div className="surface overflow-visible">
              <div className="head-strip">
                <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type: e.target.checked ? "selectMany":"clearSelection", ids: visibleIds })}/></div>
                <div></div><div></div>
                <div>
                  <span>Entity</span>
                  <ColumnFilter kind="geoStates" options={US_STATES_IN_DATA} state={state} dispatch={dispatch}
                    renderOpt={(o)=><span className="flex items-center gap-2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>{o.label}</span></span>}/>
                </div>
                <div>
                  <span>Fulfillment network</span>
                  <ColumnFilter kind="nets" options={NETS.map(n=>({id:n.id,label:n.label}))} state={state} dispatch={dispatch}
                    renderOpt={(o)=><span className="net"><span className={"dot "+dotFor(o.id)}/><span>{o.label}</span></span>}/>
                </div>
                <div style={{justifyContent:"flex-end"}}>Action</div>
              </div>
              {rows.length === 0 ? (
                <div className="p-10 text-center ink-2"><div className="text-base font-semibold mb-1">No matches</div><div className="text-[13px]">Try a different search or <button className="btn-ghost" onClick={()=>dispatch({type:"clearFilters"})}>clear filters</button>.</div></div>
              ) : rows.map(r => <PrefRow key={r.id} r={r} state={state} dispatch={dispatch} flat={filtersOn} hierarchical={!filtersOn}/>)}
            </div>
          ) : (
            <div className="surface overflow-visible">
              <div className="head-strip">
                <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type: e.target.checked ? "selectMany":"clearSelection", ids: visibleIds })}/></div>
                <div></div><div></div>
                <div>
                  <span>Entity</span>
                  <ColumnFilter kind="geoStates" options={US_STATES_IN_DATA} state={state} dispatch={dispatch}
                    renderOpt={(o)=><span className="flex items-center gap-2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>{o.label}</span></span>}/>
                </div>
                <div>
                  <span>Method &amp; fax</span>
                  <ColumnFilter kind="dists" options={[{id:"Fax",label:"Fax"},{id:"Mail",label:"Mail"},{id:"Digital",label:"Digital"}]} state={state} dispatch={dispatch}
                    renderOpt={(o)=><span className="flex items-center gap-2"><DistMethodIcon method={o.id}/><span>{o.label}</span></span>}/>
                </div>
                <div style={{justifyContent:"flex-end"}}>Action</div>
              </div>
              {rows.length === 0 ? (
                <div className="p-10 text-center ink-2 text-[13px]">No rows to show.</div>
              ) : rows.map(r => <DistRow key={"d-"+r.id} r={r} state={state} dispatch={dispatch} flat={filtersOn} hierarchical={!filtersOn}/>)}
            </div>
          )}
        </>
      ) : (
        <div className={"surface surface-scroll-x " + (scrolledX ? "is-scrolled-x" : "")}
             onScroll={(e)=>{ const sl = e.currentTarget.scrollLeft > 0; if (sl !== scrolledX) setScrolledX(sl); }}>
          <div className="head-strip head-dynamic" style={{gridTemplateColumns: buildGridCols(visibleCols)}}>
            <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type: e.target.checked ? "selectMany":"clearSelection", ids: visibleIds })}/></div>
            <div></div><div></div>
            <div className="cell-entity">
              <SortableHeader label="Account name" sortKey="entity" state={state} dispatch={dispatch}/>
              <ColumnFilter kind="entities" searchable placeholder="Search account names…" options={entityOptions} state={state} dispatch={dispatch}/>

            {visibleCols.org          && (
              <div>
                <SortableHeader label="Organization" sortKey="org" state={state} dispatch={dispatch}/>

            )}
            {visibleCols.uniqueId     && <div><SortableHeader label="Account ID" sortKey="uniqueId" state={state} dispatch={dispatch}/></div>}
            {visibleCols.payerSso     && <div><SortableHeader label="835 ID" sortKey="payerSso" state={state} dispatch={dispatch}/></div>}
            {visibleCols.netPriority  && <div>Network priority</div>}
            {visibleCols.network && (
              <div>
                <SortableHeader label="Current network" sortKey="network" state={state} dispatch={dispatch}/>
                <ColumnFilter kind="nets" options={NETS.map(n=>({id:n.id,label:n.label}))} state={state} dispatch={dispatch}
                  renderOpt={(o)=><span className="net"><span className={"dot "+dotFor(o.id)}/><span>{o.label}</span></span>}/>
              </div>
            )}
            {visibleCols.netDistribution && <div>Network distribution</div>}
            {visibleCols.rulesActive  && <div><SortableHeader label="Rules active" sortKey="rulesActive" state={state} dispatch={dispatch}/></div>}
            {visibleCols.optOuts      && <div><SortableHeader label="Opt-outs" sortKey="optOuts" state={state} dispatch={dispatch}/></div>}
            {visibleCols.achEnrolled  && (
              <div>
                <span>ACH enrollment</span>
                <ColumnFilter kind="achEnrollment" options={[{id:"ach_plus",label:"NPx ACH+"},{id:"sa_ach",label:"Settlement Advocate ACH+"}]} state={state} dispatch={dispatch}/>
              </div>
            )}
            {visibleCols.achProducts  && <div>ACH products</div>}
            {visibleCols.vcConsent    && (
              <div>
                <SortableHeader label="VC consent" sortKey="vcConsent" state={state} dispatch={dispatch}/>
                <ColumnFilter kind="vcConsent" options={[{id:"yes",label:"Provided"},{id:"no",label:"Missing"}]} state={state} dispatch={dispatch}
                  renderOpt={(o)=>(
                    <span className={"cell-pill " + (o.id === "yes" ? "is-ok" : "is-off")}>
                      {o.id === "yes" ? (
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      ) : (
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                      )}
                      {o.label}
                    </span>
                  )}/>
              </div>
            )}
            {visibleCols.distOrder    && <div>Dist. order</div>}
            {visibleCols.distribution && (
              <div>
                <span>Distribution</span>
                <ColumnFilter kind="dists" options={[{id:"Fax",label:"Fax"},{id:"Mail",label:"Mail"},{id:"Digital",label:"Digital"}]} state={state} dispatch={dispatch}
                  renderOpt={(o)=><span className="flex items-center gap-2"><DistMethodIcon method={o.id}/><span>{o.label}</span></span>}/>
              </div>
            )}
            {visibleCols.faxNumber    && (
              <div>
                <span>Fax number</span>
                <Tooltip wrap content="Used only when the distribution method for that row is Fax. Ignored for Mail or Digital deliveries.">
                  <span className="head-info-icon" aria-label="Fax number info">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>
                  </span>
                </Tooltip>
              </div>
            )}
            {visibleCols.fax          && (
              <div>
                <span>Phone</span>
                <Tooltip wrap content="Business contact phone on file. Not used for payment delivery — kept for outreach if a follow-up is needed.">
                  <span className="head-info-icon" aria-label="Phone info">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>
                  </span>
                </Tooltip>
              </div>
            )}
            {visibleCols.maxAmount    && <div><SortableHeader label="Max amount" sortKey="maxAmount" state={state} dispatch={dispatch}/></div>}
            <div style={{justifyContent:"flex-end"}}>Action</div>
          </div>
          {rows.length === 0 ? (
            <div className="p-10 text-center ink-2">
              <div className="text-base font-semibold mb-1">No matches</div>
              <div className="text-[13px]">Try a different search or <button className="btn-ghost" onClick={()=>dispatch({type:"clearFilters"})}>clear filters</button>.</div>
            </div>
          ) : rows.map(r => <PrefRow key={r.id} r={r} state={state} dispatch={dispatch} flat={filtersOn || sortActive} hierarchical={!filtersOn && !sortActive} withDist={visibleCols.distribution} visibleCols={visibleCols}/>)}
        </div>
      )}
      </>)}
    </div>
    </SimplifiedContext.Provider>
  );
}

// Built-in dev preview for the Unified Routing section — discreet bottom-
// left chip (matches the wizard's DEV PREVIEW pattern) that toggles a
// strict simplified mode (only Sub-accounts tab visible, no Edit drawer
// sub-tab toggle). Off by default so the regular Unified Routing
// experience is the landing surface.
// Columns picker — discreet toolbar button that opens a popover listing
// every available column with a checkbox. Required columns (Entity /
// Network / Action) render as locked. Placeholder columns are surfaced
// disabled until they're wired in. Closes on outside click + Escape.
// Column registry — drives both the toolbar picker popover AND the
// table's dynamic grid. Order = display order. defaultOn flags the
// columns shown out of the box; the rest are off by default but the
// CSR can opt in via the picker. required = locked, always visible.
const COLUMN_REGISTRY = [
  // Identity
  { id:"entity",       label:"Account name",              group:"Identity",     required:true,  defaultOn:true  },
  { id:"org",          label:"Associated organization",   group:"Identity",     defaultOn:true  },
  { id:"uniqueId",     label:"Unique account ID",         group:"Identity",     defaultOn:true  },
  { id:"payerSso",     label:"Payer 835 ID",              group:"Identity",     defaultOn:true  },
  // Network
  { id:"netPriority",  label:"Network priority (waterfall)", group:"Network",   defaultOn:true  },
  { id:"network",      label:"Current network only",      group:"Network",      defaultOn:true  },
  // Rollup variant only — stacked bar of descendants' current networks at
  // the Account row. Off by default; the experimental "routing-rollup"
  // variant flips it on (and hides priority/network at the Account row).
  { id:"netDistribution", label:"Network distribution (rollup)", group:"Network", defaultOn:false },
  { id:"rulesActive",  label:"Rules active",              group:"Network",      defaultOn:true  },
  { id:"optOuts",      label:"Provider opt-outs",         group:"Network",      defaultOn:true  },
  { id:"achEnrolled",  label:"ACH enrollment",            group:"Network",      defaultOn:false },
  { id:"achProducts",  label:"ACH products",              group:"Network",      defaultOn:false },
  { id:"vcConsent",    label:"VC consent",                group:"Network",      defaultOn:false },
  // Distribution
  { id:"distOrder",    label:"Distribution order",        group:"Distribution", defaultOn:true  },
  { id:"distribution", label:"Distribution (Fax / Mail / STP)", group:"Distribution", defaultOn:true  },
  { id:"faxNumber",    label:"Fax number",                group:"Distribution", defaultOn:true  },
  { id:"fax",          label:"Phone",                     group:"Distribution", defaultOn:true  },
  // System — Max amount sits just before Action (the row-level Edit cell
  // pinned to the rightmost slot so the entire row reads "data first,
  // affordance last").
  { id:"maxAmount",    label:"Max amount",                group:"System",       defaultOn:true  },
  { id:"action",       label:"Action",                    group:"System",       required:true,  defaultOn:true  },
];
const COLUMN_DEFAULTS = Object.fromEntries(COLUMN_REGISTRY.map(c => [c.id, !!c.defaultOn || !!c.required]));
// Per-column display widths used to compute the dynamic grid-template-
// columns inline on both head-strip and rows. The 3 leading utility cells
// (checkbox, chevron, level badge) are constant. Entity is fluid (1fr).
// Each toggleable cell is fixed-width. Action sits at the end.
const COL_WIDTHS = {
  __utility: "22px 16px 32px",
  // Fixed widths sized generously so cell content never needs truncation.
  // When total exceeds viewport, the surface scrolls horizontally and the
  // entity (Account name) column stays sticky on the left edge.
  entity:       "300px",
  org:          "260px",
  uniqueId:     "180px",
  payerSso:     "140px",
  netPriority:  "280px",
  maxAmount:    "120px",
  network:      "180px",
  netDistribution: "260px",
  rulesActive:  "120px",
  optOuts:      "130px",
  achEnrolled:  "140px",
  achProducts:  "180px",
  vcConsent:    "130px",
  distribution: "150px",
  fax:          "140px",
  faxNumber:    "140px",
  distOrder:    "220px",
  action:       "220px",
};
// Returns a single grid-template-columns string given the current
// visibility map. Order matches COLUMN_REGISTRY's display order.
function buildGridCols(v) {
  const parts = [COL_WIDTHS.__utility];
  for (const col of COLUMN_REGISTRY) {
    if (!v[col.id]) continue;
    if (COL_WIDTHS[col.id]) parts.push(COL_WIDTHS[col.id]);
  }
  return parts.join(" ");
}
function ColumnsPicker({ visible, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    function onKey(e) { if (e.key === "Escape") setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, []);
  const visibleCount = COLUMN_REGISTRY.filter(c => visible[c.id]).length;
  const groups = ["Identity", "Network", "Distribution", "System"];
  return (
    <div className="cols-picker-wrap" ref={ref}>
      <button type="button" className={"btn-icon-quiet cols-picker-btn " + (open ? "is-open" : "")} onClick={()=>setOpen(o=>!o)}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Columns
        <span className="cols-picker-count">{visibleCount}</span>
      </button>
      {open && (
        <div className="cols-picker-panel">
          <div className="cols-picker-head">
            <span>Show columns</span>
            <span className="cols-picker-head-meta">{visibleCount} of {COLUMN_REGISTRY.length}</span>
          </div>
          <div className="cols-picker-groups">
            {groups.map(g => {
              const cols = COLUMN_REGISTRY.filter(c => c.group === g);
              if (!cols.length) return null;
              return (
                <div key={g} className="cols-picker-group">
                  <div className="cols-picker-group-label">{g}</div>
                  {cols.map(c => {
                    const isOn = visible[c.id];
                    const isLocked = c.required;
                    return (
                      <label key={c.id} className={"cols-picker-item " + (isLocked ? "is-locked" : "")}>
                        <input
                          type="checkbox"
                          checked={isOn}
                          disabled={isLocked}
                          onChange={(e)=>onChange(v => ({ ...v, [c.id]: e.target.checked }))}
                        />
                        <span className="cols-picker-item-label">{c.label}</span>
                      </label>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function UnifiedDevPreview({ value, onChange }) {
  return (
    <div className="unified-devprev-floating" onClick={(e)=>e.stopPropagation()}>
      <div className="unified-devprev-label">
