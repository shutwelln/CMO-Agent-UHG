  .opt-wiz-amount-value{ flex:0 0 220px; display:flex; }
  .opt-wiz-amount-value .opt-wiz-input-wrap{ flex:1; }
  .opt-wiz-amount-row .text-input,
  .opt-wiz-location-row .text-input{ flex:1; }
  .opt-wiz-foot{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-top:1px solid var(--line); background:var(--paper);
  }
  .opt-wiz-foot-right{ display:flex; gap:8px; }
  /* Icon column inside each radio option — small framed icon to give
     each option a recognizable visual anchor. */
  .opt-wiz-radio-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:8px;
    background:var(--ash); color:var(--ink-2); flex-shrink:0;
  }
  .opt-wiz-radio.is-on .opt-wiz-radio-icon{ background:var(--navy-soft); color:var(--navy); }
  /* Brand-colored icons per level (Step 2). Matches the LevelBadge palette
     so the wizard reads as part of the same visual system. */
  .icon-color-zip{        background:var(--lvl-zip-bg);        color:var(--lvl-zip-fg); }
  .icon-color-subaccount{ background:var(--lvl-subaccount-bg); color:var(--lvl-subaccount-fg); }
  .icon-color-account{    background:var(--lvl-account-bg);    color:var(--lvl-account-fg); }
  .icon-color-org{        background:#E8EEFF;                  color:#1B3A8A; }
  .icon-color-all{        background:#E0F3DF;                  color:#066605; }
  .opt-wiz-radio.is-on .icon-color-zip,
  .opt-wiz-radio.is-on .icon-color-subaccount,
  .opt-wiz-radio.is-on .icon-color-account,
  .opt-wiz-radio.is-on .icon-color-org,
  .opt-wiz-radio.is-on .icon-color-all{ /* keep original brand color when selected */ }
  /* Vertically-centered variant for radios where label/icon/arrow line up. */

  /* FancyDropdown — branded select replacement. */

  /* Sub-tabs sit flush under the entity context line and act as the

  .opt-wiz-confirm-muted{ color:var(--ink-3); font-style:italic; font-weight:400; }

  .btn-confirm{

  /* Toast — top-right transient notification on opt-out submit. */

<script type="text/babel" data-presets="react">
const { useState, useMemo, useReducer, useRef, useEffect, useContext, createContext, Fragment } = React;
// Context for the editor display style (popover anchored to row vs.
// drawer slide-in from the right). Read inside EditPopover so we don't

const EditorStyleContext = createContext("popover");
// Variant B (Routing-aware) wraps the existing VariantTable in this Provider
// set to true. PrefRow checks the context — when true, it renders the
// waterfall-peek chevron and rule-impact badge inside the Fulfillment cell.
// Default false so A and the rest of the app are completely unaffected.
const RoutingAwareContext = createContext(false);

// account-aggregated view (no waterfall), Distribution tab, opt-out wizard
// drawer, ⋯ menu in rows, inline validators + match confidence.
const UnifiedContext = createContext(false);
// Variant D (Simplified Unified Routing) — strict interpretation of the
// Schmid + Eric recap: only the Sub-accounts table tab is shown (All /
// Accounts / Locations / NPI hidden) and the Edit drawer drops the
// Network/Distribution sub-tab toggle (forces stacked layout). Built on
// top of UnifiedContext (everything Unified does still applies); this
// flag only adds the simplifying constraints.
const SimplifiedContext = createContext(false);
// Global handler to open the opt-out wizard from anywhere (table row ⋯
// menu, Edit drawer footer link). Passes through a context so deeply
// nested components don't need prop drilling.
const OptOutWizardContext = createContext({ open: () => {} });
// Variant C (Opt-in/out) — when true, EditPopover injects the VC preference
// toggle and Product enrollments sections; the Payment program / Distribution
// sub-block becomes informational (visually disabled) when opted out.
const OptInOutContext = createContext(false);
// Overview › Disbursements layout — Comparison is the canonical view per
// Eric's feedback; Tabbed / Dense are experimental and only reachable via
// the top DEV PREVIEW panel. Context lets the DevPanel set the layout
// while ProviderDisbursements reads it without prop-drilling.
const DisbLayoutContext = createContext({ value: "comparison", setValue: () => {} });

// ─────────────────────────────────────────────────────────────────────
// Data
// ─────────────────────────────────────────────────────────────────────
const NETS = [
  { id:"vc",    label:"Virtual card", short:"VC",    sub:"Fee · Fax or Mail" },
  { id:"check", label:"Check",        short:"Check", sub:"Free · Mail" },
  { id:"ach",   label:"ACH",          short:"ACH",   sub:"Free · Digital" },
  { id:"achp",  label:"ACH+",         short:"ACH+",  sub:"Small fee · Digital" },
  { id:"sa",    label:"SA",           short:"SA",    sub:"Special arrangement" },
];
const NET_BY_ID = Object.fromEntries(NETS.map(n => [n.id, n]));
const dotFor = (id) => id === "achp" ? "achp" : id;
// Rollup helper for the experimental routing-rollup variant. Walks every
// descendant of an account node and counts how many of them currently
// route to each network (VC, ACH+, ACH, Check, SA). Used to render the
// stacked Network distribution bar at the Account row. For a flat
// account (no children) we count the account itself so the bar reads as
// a single full-width segment of its own network instead of empty.
function rollupNetDistribution(node) {
  const count = { vc:0, achp:0, ach:0, check:0, sa:0 };
  let total = 0;
  function walk(n) {
    if (n.children && n.children.length) {
      for (const c of n.children) walk(c);
    } else if (n.net && count[n.net] !== undefined) {
      count[n.net] += 1;
      total += 1;
    }
  }
  if (node.children && node.children.length) walk(node);
  else if (node.net && count[node.net] !== undefined) { count[node.net] = 1; total = 1; }
  if (!total) return { total: 0, segments: [] };
  // Stable display order, biggest-on-top semantically but we keep the
  // canonical network order so the bar reads left-to-right the same way
  // every time (matches the Overview KPI bar).
  const ORDER = ["vc","achp","ach","check","sa"];
  const segments = ORDER
    .filter(id => count[id] > 0)
    .map(id => ({ id, count: count[id], pct: (count[id] / total) * 100 }));
  return { total, segments };
}
const LEVELS = ["Account","Sub-account","ZIP"];
const STATES = [{id:"unchanged",label:"Unchanged"},{id:"edited",label:"Edited"},{id:"inherited",label:"Inherits from parent"}];
// US states represented in the seed data — used to populate the geographic
// state filter on the Entity column. Add new entries here when new ZIPs land
// in additional states.
const US_STATES_IN_DATA = [
  { id:"FL", label:"Florida" },
  { id:"CA", label:"California" },
];
const DISTS  = ["Fax","Mail"];

// Full payer waterfall — the order the payer wants their networks tried.
// First item is the primary (active) network.
const DEFAULT_PRIORITY = ["vc", "achp", "ach", "check", "sa"];

// NPIs (mock) — National Provider Identifier registry tied to this provider.
// Type 1 = individual practitioner; Type 2 = organizational entity.
// Refine with real fields once we have the integration.
// Exclusion rules (mock) — payment-routing exceptions configured at the
// provider level. Read-only for now; future iteration will let the CSR
// edit them inline.
// Three exclusion rule types (per Eric's Mar 26 email):
//   "Global"        — payer-level global rule, applies to every payment
//   "Sub-payer"     — applies only to payments routed under a sub-payer
//                     program (e.g. Medicare, Medicaid)
//   "Provider opt-out" — applies only to a specific provider/account
// Each rule carries a natural-language `rule` string (used by search +
// fallbacks) PLUS structured fields { when, action, network, preferOver }
// so the UI can render the rule decomposed (per Eric's mental model: each
// rule is a [condition] → [action] [network] triple).
const EXCLUSION_RULES_MOCK = [

function MethodReorderList({ items, current, onReorder, onSelect, renderItem, noDrag, primaryLabel = "primary", itemMeta }) {
  const [draggedIdx, setDraggedIdx] = useState(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  function handleDrop(targetIdx) {
    if (draggedIdx === null || draggedIdx === targetIdx) { setDraggedIdx(null); setHoverIdx(null); return; }
    const newItems = [...items];
    const [moved] = newItems.splice(draggedIdx, 1);
    newItems.splice(targetIdx, 0, moved);
    onReorder(newItems);
    setDraggedIdx(null); setHoverIdx(null);
  }
  return (
    <div className={"method-list " + (noDrag ? "no-drag" : "")}>
      {items.map((item, i) => {
        const isHover = !noDrag && hoverIdx === i && draggedIdx !== null && draggedIdx !== i;
        const dropAbove = isHover && draggedIdx > i;
        const dropBelow = isHover && draggedIdx < i;
        const isPrimary = item === current;
        const meta = itemMeta ? (itemMeta(item) || {}) : {};
        const isDisabled = !!meta.disabled;
        const badge = (isDisabled && meta.badge) ? meta.badge : (isPrimary ? primaryLabel : null);
        const dragProps = (noDrag || isDisabled) ? {} : {
          draggable: true,
          onDragStart: ()=>setDraggedIdx(i),
          onDragEnd: ()=>{ setDraggedIdx(null); setHoverIdx(null); },
          onDragOver: (e)=>{ e.preventDefault(); setHoverIdx(i); },
          onDrop: ()=>handleDrop(i),
        };
        return (
          <div key={item}
            {...dragProps}
            onClick={()=>{ if (isDisabled) return; if (noDrag || draggedIdx === null) onSelect(item); }}
            className={"method-item " + (isPrimary?"primary ":"") + (draggedIdx===i?"dragging ":"") + (dropAbove?"drop-above ":"") + (dropBelow?"drop-below ":"") + (isDisabled?"is-disabled ":"")}>
            {!noDrag && (
              <span className="drag-handle" aria-label="Drag to reorder" onMouseDown={(e)=>e.stopPropagation()}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg>
              </span>
            )}
            <span className="method-radio" aria-hidden="true">
              {isPrimary
                ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
                : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/></svg>}
            </span>
            <span className="method-label">{renderItem ? renderItem(item) : item}</span>
            {badge && <span className={"method-badge " + (isDisabled ? "is-muted" : "")}>{badge}</span>}
          </div>
        );
      })}
    </div>
  );
}

function Tooltip({ children, content, wrap, align="center", placement="above", panelStyle, wrapClass }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  // Trigger rect, captured at open time. Used to position the portaled
  // panel relative to the viewport (the panel mounts on <body> so it
  // can't rely on CSS `top:100%`/`bottom:100%` anymore). Re-measure on
  // window resize so the panel stays glued to the trigger when the
  // layout reflows.
  const [rect, setRect] = useState(null);
  useEffect(() => {
    if (!open || !wrapRef.current) return;
    const update = () => setRect(wrapRef.current.getBoundingClientRect());
    update();
    window.addEventListener("scroll", update, true);
    window.addEventListener("resize", update);
    return () => {
      window.removeEventListener("scroll", update, true);
      window.removeEventListener("resize", update);
    };
  }, [open]);
  const baseStyle = wrap ? { whiteSpace:"normal", width:"max-content", minWidth:240, maxWidth:360, lineHeight:1.45 } : {};
  // Compute viewport coords from the trigger rect. `placement` is
  // "above"/"below" relative to the trigger; `align` is start/center/end
  // along the trigger's horizontal edge.
  const positionStyle = rect ? (() => {
    const gap = 8;
    const top = placement === "below" ? rect.bottom + gap : undefined;
    const bottom = placement === "above" ? (window.innerHeight - rect.top + gap) : undefined;
    // Always set BOTH left and right (one to "auto") and the transform —
    // the base .tip-panel CSS rule has `left:50%; transform:translateX(-50%)`
    // for the legacy centered popover, and without an explicit override it
    // would leak into the right/left-aligned variants and yank the panel
    // off to the viewport centre.
    let left, right, transform;
    if (align === "right") {
      left = "auto";
      right = window.innerWidth - rect.right;
      transform = "none";
    } else if (align === "left") {
      left = rect.left;
      right = "auto";
      transform = "none";
    } else {
      left = rect.left + rect.width / 2;
      right = "auto";
      transform = "translateX(-50%)";
    }
    return { position:"fixed", top, bottom, left, right, transform };
  })() : { position:"fixed", visibility:"hidden" };
  const finalStyle = { ...baseStyle, ...positionStyle, ...(panelStyle||{}) };
  // Panel portals to <body> so an ancestor with overflow:auto (the
  // scrollable table surface) or transform/contain can't clip it. The
  // tip-wrap span stays where it was so hover handlers still fire on
  // the original anchor.
  return (
    <span ref={wrapRef} className={"tip-wrap " + (wrapClass || "")} onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)}>
      {children}
      {open && ReactDOM.createPortal(
        <span className={`tip-panel tip-align-${align} tip-place-${placement}`} style={finalStyle}>
          {content}
        </span>,
        document.body
      )}
    </span>
  );
}

// Returns ONLY Provider opt-out rules tied to a specific entity by name.
// Used in both A and B to surface account-scoped rules inside the row that
// owns them — no need to open the rules sheet.
function providerOptOutRulesForEntity(entity) {
  if (!entity || !entity.name) return [];
  const matches = [];
  const name = entity.name.toLowerCase();
  const stem = name.split(/[ ,]+/).slice(0, 2).join(" ");
  for (const r of EXCLUSION_RULES_MOCK) {
    if (r.status !== "Active") continue;
    if (r.scope !== "Provider opt-out") continue;
    const ref = (r.scopeRef || "").toLowerCase();
    if (stem && ref.includes(stem)) matches.push(r);
  }

// Returns a map { netId → rule } of networks excluded by an active rule
// for this entity. Heuristic text-match against the rule definition.
function networkExclusionsForEntity(entity) {
  const map = {};
  for (const r of activeRulesForEntity(entity)) {
    const t = (r.rule || "").toLowerCase();
    if (!t.includes("not process")) continue; // skip "prefer X over Y" style rules
    if (t.includes("virtual card")) map["vc"] = r;
    else if (/using ach\b/.test(t))  map["ach"] = r;
    else if (t.includes("optumpay")) map["achp"] = r;
    else if (t.includes("check"))    map["check"] = r;
  }
  return map;
}

// Variant B helper — finds the active exclusion rules that potentially
// affect a given entity. Heuristic match for the prototype:
//   - Provider opt-out rules: match when scopeRef includes the entity name
//   - Global / Sub-payer rules: match when rule text targets the entity's
//     current fulfillment network
function relevantRulesForEntity(entity) {
  if (!entity) return [];
  const matches = [];
  const cur = entity.net;
  const name = (entity.name || "").toLowerCase();
  for (const r of EXCLUSION_RULES_MOCK) {
    if (r.status !== "Active") continue;
    if (r.scope === "Provider opt-out") {
      const ref = (r.scopeRef || "").toLowerCase();
      const stem = name.split(/[ ,]+/).slice(0, 2).join(" ");
      if (stem && ref.includes(stem)) matches.push(r);
      continue;
    }
    const t = (r.rule || "").toLowerCase();
    if (cur === "vc"   && t.includes("virtual card")) matches.push(r);
    else if (cur === "ach"  && /using ach\b/.test(t))     matches.push(r);
    else if (cur === "achp" && t.includes("optumpay"))    matches.push(r);
    else if (cur === "check"&& t.includes("check"))       matches.push(r);

// Wraps occurrences of `query` inside `text` with a subtle highlight mark.
// Case-insensitive, safe with non-string values (e.g., numeric IDs).
function Highlight({ text, query }) {
  if (text === null || text === undefined || text === "") return null;
  const s = String(text);
  const q = (query || "").trim();
  if (!q) return <>{s}</>;
  const lower = s.toLowerCase();
  const ql = q.toLowerCase();
  const parts = [];
  let i = 0, k = 0;
  while (i <= lower.length) {
    const idx = lower.indexOf(ql, i);
    if (idx === -1) { parts.push(s.slice(i)); break; }
    if (idx > i) parts.push(s.slice(i, idx));
    parts.push(<mark key={k++} className="hl">{s.slice(idx, idx + ql.length)}</mark>);
    i = idx + ql.length;
    if (ql.length === 0) break;
  }
  return <>{parts}</>;
}

  payerSso:   (r) => (r.payerSso || "").toLowerCase(),
  maxAmount:  (r) => (r.net === "vc" ? (r.max || 0) : -1),
  network:    (r) => (r.net || ""),
  distribution:(r)=> (r.dist || ""),
  faxNumber:  (r) => (r.fax || ""),
  fax:        (r) => (r.phone || ""),
  // Numeric counts — provided by the App via window-level shared
  // helpers. We can't import the row's rule list directly inside this
  // pure comparator, so we re-evaluate from the entity using the same
  // helpers PrefRow uses (relevantRulesForEntity / opt-outs filter).
  rulesActive:(r) => (typeof relevantRulesForEntity === "function" ? relevantRulesForEntity(r).length : 0),
  optOuts:    (r) => ((window.__sortOptOuts || []).filter(o => o.entityName === r.name).length),
  vcConsent:  (r) => (vcConsentFor(r) ? 1 : 0),
};
function sortRows(rows, sort) {
  if (!sort || !sort.key || !SORT_ACCESSORS[sort.key]) return rows;
  const get = SORT_ACCESSORS[sort.key];
  const dir = sort.dir === "desc" ? -1 : 1;
  return [...rows].sort((a, b) => {
    const av = get(a), bv = get(b);
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
    return String(av).localeCompare(String(bv)) * dir;
  });
}

// ─────────────────────────────────────────────────────────────────────
// Edit popover — used for single-row AND bulk
// ─────────────────────────────────────────────────────────────────────
// Variant B (Routing-aware) — collapsible section shell with chevron, count
// badge and an icon. Open by default; user can collapse if desired.
function CollapsibleSection({ title, count, countLabel, countTooltip, countSlot, icon, defaultOpen = true, noToggle = false, children }) {
  const [open, setOpen] = useState(defaultOpen);
  const isOpen = noToggle ? true : open;
  const HeadTag = noToggle ? "div" : "button";
  const headProps = noToggle
    ? { className: "collap-head no-toggle" }
    : { type: "button", className: "collap-head " + (open ? "" : "is-closed"), onClick: () => setOpen(o => !o) };
  const countNode = count != null && (
    countLabel
      ? <span className="collap-count-text">{count} {countLabel}</span>
      : <span className="collap-count">{count}</span>
  );
  return (
    <div className="collap-section">
      <HeadTag {...headProps}>
        {icon && <span className="collap-icon">{icon}</span>}
        <span className="collap-title">{title}</span>
        {countSlot ? countSlot : countNode && (countTooltip
          ? <Tooltip wrap align="right" placement="below" content={countTooltip} panelStyle={{ maxWidth: 460, minWidth: 280, padding:"12px 14px" }}>
              <span className="collap-count-link">{countNode}</span>
            </Tooltip>
          : countNode)}
        {!noToggle && (
          <svg className="collap-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        )}
      </HeadTag>
      {isOpen && <div className="collap-body">{children}</div>}
    </div>
  );
}

// Variant B — Effective waterfall view inside Edit modal. Shows the
// payer's network cascade with status chips per step (CURRENT, NEXT ON
// REISSUE, excluded). Click to select (no drag).
// Translates raw operator + value into a natural-language phrase with the
// value(s) preserved as chips for scannability. "equals" → "is", and a
// multi-value string ("Medicaid · Medicare") splits into individual chips
// joined with "or" so the sentence reads as English.
function humanOp(op) {
  switch (op) {
    case "equals": return "is";
    case "in":     return "is one of";
    case "gte":    return "is at least";
    case "lte":    return "is at most";
    default:       return op;
  }
}
function valueChips(value) {
  const parts = String(value).split(/\s+·\s+/);
  return parts.map((p, i) => (
    <React.Fragment key={i}>
      {i > 0 && <span className="rule-anno-or"> or </span>}
      <strong className="rule-anno-val">{p}</strong>
    </React.Fragment>
  ));
}

// Rule annotation rendered INSIDE a waterfall step. Reads as a sentence —
// "Don't process when State is TX" — so the verb is explicit, not just
// inferred from icon + position.
function RuleAnnotation({ rule, stepId }) {
  const isBlock = rule.action === "block";
  const isCap   = rule.action === "cap";
  const scopeChipCls = rule.scope === "Global" ? "global"
                      : rule.scope === "Sub-payer" ? "subpayer"
                      : "provider";
  const scopeLabel = rule.scope === "Provider opt-out" ? "Provider" : rule.scope;
  return (
    <div className={"rule-anno " + (isBlock ? "is-block" : isCap ? "is-cap" : "is-prefer")}>
      <span className="rule-anno-mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </span>
      <span className="rule-anno-sentence">
        {isBlock ? (
          <>Don't process when {rule.when.field} {humanOp(rule.when.op)} {valueChips(rule.when.value)}</>
        ) : isCap ? (
          <>Limit to <strong className="rule-anno-val">${Number(rule.capAmount).toLocaleString()}</strong> per payment</>
        ) : (
          <>Use instead of <strong className="rule-anno-val">{NET_BY_ID[rule.preferOver].label}</strong> when {rule.when.field} {humanOp(rule.when.op)} {valueChips(rule.when.value)}</>
        )}
      </span>
      <span className={"rule-anno-scope " + scopeChipCls}>{scopeLabel}</span>
    </div>
  );
}

// Variant B — Enrollment status footer below the Effective waterfall.
// Surfaces whether this provider is enrolled in any ACH product, since
// some routing options (ACH+, SA) only make sense if they are. Uses the
// same warning-mark visual language as rule annotations to feel like a
// peer signal ("here's something else worth knowing").
function EnrollmentStatus({ entity }) {
  const enr = enrollmentsFor(entity);
  const products = [];
  if (enr.ach_plus) products.push({ id:"achp",   label:"NPx ACH+",            family:"ACH+" });
  if (enr.sa_ach)   products.push({ id:"sa_ach", label:"Settlement Advocate", family:"ACH+" });
  const isEnrolled = products.length > 0;
  // When the provider is enrolled in ≤2 products, list them inline by
  // name (e.g. "Enrolled · NPx ACH+, Settlement Advocate") so the CSR
  // never has to hover to know what's set up. Above that, fall back to
  // the count + tooltip pattern so the line doesn't get unwieldy.
  const INLINE_LIMIT = 2;
  const inlineList = products.length > 0 && products.length <= INLINE_LIMIT
    ? products.map(p => p.label).join(", ")
    : null;
  const counter = (
    <span className="enr-status-count">
      {products.length} {products.length === 1 ? "product" : "products"}
    </span>
  );
  return (
    <div className={"enr-status " + (isEnrolled ? "is-enrolled" : "is-not")}>
      <span className="enr-status-icon" aria-hidden="true">
        {isEnrolled ? (
          /* party-popper — celebratory mark for "this provider is set up" */
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="M22 2 11 13"/><path d="m22 13-3-3"/><path d="m13 22-3-3"/></svg>
        ) : (
          /* face-frown — clear "not enrolled" signal without alarming red */
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        )}
      </span>
      <span className="enr-status-text">
        {isEnrolled ? "Enrolled" : "Not enrolled in any ACH product"}
      </span>
      {isEnrolled && (
        inlineList ? (
          <span className="enr-status-products">{inlineList}</span>
        ) : (
          <Tooltip
            wrap
            align="right"
            placement="below"
            panelStyle={{ maxWidth: 260, minWidth: 180, padding:"10px 12px" }}
            content={
              <div>
                <div className="rules-tip-title" style={{marginBottom:8}}>Enrolled products</div>
                <div style={{display:"flex", flexDirection:"column", gap:6}}>
                  {products.map(p => (
                    <div key={p.id} style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5, color:"rgba(255,255,255,.85)"}}>
                      <span style={{width:6, height:6, borderRadius:999, background:"#9DBAF1"}}/>
                      <b style={{color:"#fff", fontWeight:600}}>{p.label}</b>
                      {p.family && (
                        <span style={{fontSize:9.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".07em", padding:"2px 6px", borderRadius:4, background:"rgba(255,255,255,.10)", color:"rgba(255,255,255,.65)"}}>{p.family}</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            }
          >
            {counter}
          </Tooltip>
        )
      )}
    </div>
  );
}

// VC consent annotation rendered INSIDE the Virtual card step body. Some
// Lockbox fee annotation rendered INSIDE the Check step body. Surfaces
// the fact that the provider pays their bank 7-10% of deposit value to
// receive checks — key retention talking point per Eric's PRD note

function LockboxFeeInStep() {
  return (
    <div className="rule-anno is-lockbox">
      <span className="rule-anno-mark" aria-hidden="true">
        {/* lucide-zap — lightning bolt = "heads up, retention angle here" */}
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>

// states legally require the provider to supply explicit consent before VC
// payments can be processed — surfaced here so the CSR sees the legal
// state without leaving the editor.
function VcConsentInStep({ entity }) {
  const hasConsent = vcConsentFor(entity);
  return (
    <div className={"rule-anno is-consent " + (hasConsent ? "is-yes" : "is-no")}>
      <span className="rule-anno-mark" aria-hidden="true">
        {hasConsent ? (
          /* check */
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        ) : (
          /* x */
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        )}
      </span>
      <Tooltip
        wrap
        placement="below"
        align="left"
        panelStyle={{ maxWidth: 240, padding:"8px 10px" }}
        content={hasConsent
          ? <span>Provider has signed VC consent on file. Required in some states for virtual card processing.</span>
          : <span>Missing VC consent. Required in some states before virtual card payments can be processed.</span>
        }
