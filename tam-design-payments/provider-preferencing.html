        <span className="rule-anno-sentence" style={{cursor:"help", textDecoration:"underline", textDecorationStyle:"dotted", textDecorationColor:"var(--ink-4)", textUnderlineOffset:3}}>
          {hasConsent ? "Consent provided" : "No consent on file"}
        </span>
      </Tooltip>
    </div>
  );
}

// Which ACH+ network a payer belongs to. Mocked per-account-root since
// real-world payers each subscribe to one (or none) of the ACH+ rails
// — NPx, Settlement Advocate, or PES. Used to name the network in the
// retention talk track ("If you enroll in NPx ACH+, you'll receive
// ACH for this payer plus the others in the NPx network"). Maps each
// of our seed accounts to a concrete network for the demo.
const PAYER_ACH_NETWORK = {
  p1: "NPx",                  // UnitedHealthcare IC
  p2: "Settlement Advocate",  // Medica
  p3: "PES",                  // Harvard Pilgrim
  p4: "NPx",                  // UnitedHealthcare West
  p5: "Settlement Advocate",  // Oxford
};
function payerAchNetworkFor(entity) {
  if (!entity || !entity.id) return null;
  const root = String(entity.id).split("-")[0];
  return PAYER_ACH_NETWORK[root] || null;
}

// Retention talk-track rendered inside the ACH+ step body when the step
// is "Next on reissue" — names the specific ACH+ network this payer is
// in and frames the enroll-then-ACH upside the way Eric's PRD requires
// ("If you enroll in NPx, you'll receive ACH payments for this payer
// along with the other payers in the NPx network"). Stays out of the
// way when the step is already current.
function RetentionTalkTrack({ entity, isCurrent }) {
  if (!entity || isCurrent) return null;
  const network = payerAchNetworkFor(entity);
  if (!network) return null;
  const enr = enrollmentsFor(entity);
  const isEnrolled = network === "NPx" ? enr.ach_plus : (network === "Settlement Advocate" ? enr.sa_ach : false);
  if (isEnrolled) return null;
  return (
    <div className="rule-anno is-talktrack">
      <span className="rule-anno-mark" aria-hidden="true">
        {/* lucide-megaphone — "say this to the provider" */}
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
      </span>
      <span className="rule-anno-sentence">
        This payer is in our <strong className="rule-anno-val">{network}</strong> network. If you enroll in <strong className="rule-anno-val">{network} ACH+</strong>, you'll receive ACH payments for this payer along with the other payers in the {network} network.
      </span>
      <span className="rule-anno-scope retention">Retention</span>
    </div>
  );
}

// Enrollment delay notice rendered inside the ACH+ (or SA) step body
// when the provider isn't enrolled in the relevant network yet. Per
// PRD #7: "The system must accommodate ACH enrollment delays, during
// which current payments continue using the previous method." Surfaces
// the ~5–7 day wait BEFORE the CSR commits to switching, so they can
// set the provider's expectations in the same call.
function EnrollmentDelayInStep({ entity, networkId, currentNetId }) {
  if (!entity) return null;
  const enr = enrollmentsFor(entity);
  // ACH+ requires either NPx or Settlement Advocate enrollment. If the
  // provider already has either, no delay applies.
  const isAchPlus = networkId === "achp";
  const isSa = networkId === "sa";
  if (!isAchPlus && !isSa) return null;
  const isEnrolled = isAchPlus ? (enr.ach_plus || enr.sa_ach) : enr.sa_ach;
  if (isEnrolled) return null;
  const currentLabel = NET_BY_ID[currentNetId]?.label || "the previous method";
  return (
    <div className="rule-anno is-delay">
      <span className="rule-anno-mark" aria-hidden="true">
        {/* lucide-clock — heads-up: this takes a few days */}
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 7 12 12 15 14"/></svg>
      </span>
      <span className="rule-anno-sentence">
        Enrollment takes <strong className="rule-anno-val">5–7 business days</strong>. Until then, in-flight payments will continue using <strong className="rule-anno-val">{currentLabel}</strong>.
      </span>
      <span className="rule-anno-scope delay">Heads up</span>
    </div>
  );
}

// Enrollment status annotation rendered INSIDE the ACH+ step body. Reuses
// the rule-anno visual rhythm. Icon is a smiley (enrolled) or frown (not),
// and the product count sits inline right after "Enrolled" — separated by
// a dot — so the whole line reads naturally instead of split into columns.
function EnrollmentInStep({ entity, currentNetId, isCurrent }) {
  const enr = entity ? enrollmentsFor(entity) : { ach_plus:false, sa_ach:false };
  const products = [];
  if (enr.ach_plus) products.push({ id:"achp",   label:"NPx ACH+",            family:"ACH+" });
  if (enr.sa_ach)   products.push({ id:"sa_ach", label:"Settlement Advocate", family:"ACH+" });
  const isEnrolled = products.length > 0;
  // When the provider isn't enrolled AND this step isn't the current one,
  // the line doubles as a heads-up: enrollment takes 5-7 days and meanwhile
  // payments keep using the current method. Reads as one continuous sentence.
  const showDelayTail = !isEnrolled && !isCurrent;
  const currentLabel = currentNetId ? (NET_BY_ID[currentNetId]?.label || "the previous method") : null;
  return (
    <div className={"rule-anno is-enrollment " + (isEnrolled ? "is-enrolled" : "is-not") + (showDelayTail ? " has-delay-tail" : "")}>
      <span className="rule-anno-mark" aria-hidden="true">
        {isEnrolled ? (
          /* smiley */
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        ) : (
          /* face-frown */
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        )}
      </span>
      <span className="rule-anno-sentence">
        {isEnrolled ? (
          <>
            <Tooltip
              wrap
              align="left"
              placement="below"
              panelStyle={{ maxWidth: 240, padding:"8px 10px" }}
              content={<span>Provider is enrolled in one or more ACH+ products. Required to route via ACH+/SA networks.</span>}
            >
              <span style={{cursor:"help", textDecoration:"underline", textDecorationStyle:"dotted", textDecorationColor:"var(--ink-4)", textUnderlineOffset:3}}>Enrolled</span>
            </Tooltip>
            <span className="enr-sep">·</span>{" "}
            {products.length <= 2 ? (
              // Few enough products that listing them inline is friendlier
              // than a counter-with-tooltip. Above 2, fall back to the
              // counter so the line doesn't sprawl.
              <span className="enr-anno-products">{products.map(p => p.label).join(", ")}</span>
            ) : (
              <Tooltip
                wrap
                align="left"
                placement="below"
                panelStyle={{ maxWidth: 260, minWidth: 180, padding:"10px 12px" }}
                content={
                  <div>
                    <div className="rules-tip-title" style={{marginBottom:8}}>Enrolled products</div>
                    <div style={{display:"flex", flexDirection:"column", gap:6}}>
                      {products.map(p => (
                        <div key={p.id} style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5, color:"rgba(255,255,255,.85)"}}>
                          <span style={{width:6, height:6, borderRadius:999, background:"#9DBAF1"}}/>
                          <b style={{color:"#fff", fontWeight:600}}>{p.label}</b>
                          {p.family && (
                            <span style={{color:"rgba(255,255,255,.55)", fontSize:12.5}}>{p.family}</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                }
              >
                <span className="enr-anno-count">{products.length} products</span>
              </Tooltip>
            )}
          </>
        ) : (
          <>
            <Tooltip
              wrap
              align="left"
              placement="below"
              panelStyle={{ maxWidth: 240, padding:"8px 10px" }}
              content={<span>Provider has no ACH+ enrollments. Required to route via ACH+/SA networks.</span>}
            >
              <strong style={{fontWeight:600, cursor:"help", textDecoration:"underline", textDecorationStyle:"dotted", textDecorationColor:"var(--ink-4)", textUnderlineOffset:3}}>Not enrolled in any ACH product</strong>
            </Tooltip>
            {showDelayTail && (
              <>
                {" — enrollment takes "}
                <strong className="rule-anno-val">5–7 business days</strong>
                {". Until then, in-flight payments will continue using "}
                <strong className="rule-anno-val">{currentLabel}</strong>
                {"."}
              </>
            )}
          </>
        )}
      </span>
      {showDelayTail && <span className="rule-anno-scope delay">Heads up</span>}
    </div>
  );
}

// Variant C (Unified) — provider-initiated opt-out, rendered as an
// annotation under the network it affects. No leading icon (the orange
// scope chip + edit/delete actions make it visually distinct from rules).
// Both edit and delete reopen the wizard flow — edit pre-fills, delete
// removes after confirm. Subtle green highlight flashes for 1.5s after
// creation so the CSR can spot the new entry against existing items.
function OptOutAnnotation({ optOut, onRemove, onEdit }) {
  // Only highlight items that were JUST created (createdAt within last 2s).
  // Pre-seeded items mount fresh too, but their createdAt is in the past
  // so they don't flash green every time the drawer opens.
  const isFresh = optOut.createdAt && (Date.now() - optOut.createdAt < 2000);
  const [justAdded, setJustAdded] = useState(isFresh);
  useEffect(() => {
    if (!isFresh) return;
    const t = setTimeout(() => setJustAdded(false), 1600);
    return () => clearTimeout(t);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const sentence = (() => {
    const parts = [];
    if (optOut.amountOp && optOut.amountOp !== "any" && optOut.amount) {
      parts.push(<>amount {optOut.amountOp === "gte" ? "≥" : "≤"} <b>${Number(optOut.amount).toLocaleString()}</b></>);
    }
    if (optOut.zipValue)   parts.push(<>ZIP <b>{optOut.zipValue}</b></>);
    if (optOut.stateValue) parts.push(<>State <b>{optOut.stateValue}</b></>);
    if (parts.length === 0) return "Provider opt-out";
    return <>Provider opt-out when {parts.reduce((acc, p, i) => i === 0 ? [p] : [...acc, " · ", p], [])}</>;
  })();
  return (
    <div className={"rule-anno is-optout " + (justAdded ? "is-just-added" : "")}>
      <span className="rule-anno-mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </span>
      <span className="rule-anno-sentence">{sentence}</span>
      <span className="rule-anno-scope is-optout-scope">{optOut.levelLabel}</span>
      <span className="rule-anno-actions">
        <button type="button" className="rule-anno-act" onClick={onEdit} aria-label="Edit opt-out" title="Edit">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" className="rule-anno-act" onClick={onRemove} aria-label="Remove opt-out" title="Remove">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </span>
    </div>
  );
}

// One row inside a step body — handles the expand/collapse for steps with
// many items (>5 totals → collapse after 5 with a "Show N more" link).
// Always shows the most recently-added items so a fresh opt-out doesn't
// hide behind the truncation.
function EffStepBody({ children, totalItems }) {
  const [expanded, setExpanded] = useState(false);
  const visibleChildren = React.Children.toArray(children).filter(Boolean);
  const needsCollapse = visibleChildren.length > 5;
  // Auto-expand if any child is freshly added (is-just-added class) so
  // newly-created opt-outs are always visible.
  const hasFresh = visibleChildren.some(c => {
    const cls = c?.props?.optOut ? "" : "";
    // We detect freshness via the OptOutAnnotation component's internal
    // state, but easier: any optOut whose createdAt is within last 2s.
    if (c?.props?.optOut?.createdAt && Date.now() - c.props.optOut.createdAt < 2000) return true;
    return false;
  });
  const showAll = !needsCollapse || expanded || hasFresh;
  const visible = showAll ? visibleChildren : visibleChildren.slice(0, 5);
  return (
    <div className={"eff-step-body " + (needsCollapse && !showAll ? "is-truncated" : "")} onClick={e=>e.stopPropagation()}>
      {visible}
      {needsCollapse && (
        <button type="button" className="eff-step-expand" onClick={()=>setExpanded(v=>!v)}>
          {(expanded || hasFresh) ? "Show less" : `Show ${visibleChildren.length - 5} more`}
        </button>
      )}
    </div>
  );
}

function EffectiveWaterfall({ items, current, excludedMap, onSelect, vcMax, onVcMaxChange, rulesByNetwork = {}, entity, optOutsByNetwork = {}, onRemoveOptOut, onEditOptOut, bulkNodes = null, bulkSelected = null }) {
  // Identify "next on reissue" — first non-excluded item AFTER current
  // that survives the rules.
  const curIdx = items.indexOf(current);
  let nextIdx = -1;
  for (let i = curIdx + 1; i < items.length; i++) {
    if (!excludedMap[items[i]]) { nextIdx = i; break; }
  }
  // Bulk mode: compute, for each network in the cascade, how many of the
  // selected entities currently have that as their network. Used to render
  // count chips in the eff-tag slot instead of the single-entity Current /
  // Next on reissue labels.
  const isBulk = Array.isArray(bulkNodes) && bulkNodes.length > 0;
  const bulkByNet = {};
  if (isBulk) {
    for (const n of bulkNodes) {
      const key = n.net;
      (bulkByNet[key] = bulkByNet[key] || []).push(n);
    }
  }
  // Bulk mode has no single `entity`, but the informational warnings
  // (retention talk-track, enrollment heads-up, VC consent) still apply
  // to whichever provider(s) the bulk selection touches. If every selected
  // node maps to the same provider root, surface the warnings for that
  // provider so the CSR sees the same risk callouts they'd see in single
  // edit. Mixed-provider selections skip the warnings (we can't show one
  // status that's true for everyone).
  const bulkRoot = isBulk
    ? bulkNodes.reduce((acc, n) => {
        if (acc === undefined) return String(n.id || "").split("-")[0];
        if (acc === null) return null;
        return acc === String(n.id || "").split("-")[0] ? acc : null;
      }, undefined)
    : null;
  const effectiveEntity = entity || (bulkRoot ? bulkNodes[0] : null);
  return (
    <div className="eff-list">
      {items.map((id, i) => {
        const excluded = !!excludedMap[id];
        const isCur = id === current;
        const isNext = i === nextIdx;
        const isVcStep = id === "vc";
        const stepRules = rulesByNetwork[id] || [];
        const showMax = isVcStep && typeof vcMax === "number";
        // ACH+ is the canonical enrollment-gated step (NPx ACH+ product).
        // Surface enrollment status inside its body so the CSR sees at a
        // glance whether ACH+ is actually usable for this provider.
        const showEnrollment = id === "achp" && !!effectiveEntity;
        // Retention talk-track only shows up on ACH+ for non-current step
        // — i.e. when the CSR could pitch enrollment. The component
        // itself filters further (returns null if already enrolled or
        // already current).
        const showTalkTrack = id === "achp" && !!effectiveEntity && !isCur;
        // Enrollment-delay heads-up only fires on the enrollment-gated
        // steps (ACH+ / SA) for non-current steps where the provider
        // isn't enrolled yet. Component filters further (returns null
        // if enrolled). Sits inside the step body alongside the rules.
        const showDelay = (id === "achp" || id === "sa") && !!effectiveEntity && !isCur;
        // VC requires explicit consent in some jurisdictions — surface the
        // consent state inside the VC step body for legal visibility.
        const showConsent = isVcStep && !!effectiveEntity;
        // Check step body always carries the lockbox fee notice — the
        // provider pays their bank 7-10% of deposit value to receive
        // checks, which is a retention talking point ("ACH/VC would save
        // you that fee"). Per PRD highlighted note in Workflow #2.
        const showLockboxFee = id === "check";
        const stepOptOuts = optOutsByNetwork[id] || [];
        const hasBody = stepRules.length > 0 || showMax || showEnrollment || showConsent || showLockboxFee || showTalkTrack || showDelay || stepOptOuts.length > 0;
        // Current always wins visually — even if rules also block this network,
        // the user's chosen step reads as active. The body's rule annotations
        // already tell the "but it's blocked by X" story without us needing
        // to dim the head with the excluded treatment.
        // In bulk mode there isn't a single "current" — counts per step
        // carry the story. Drop the is-current / is-next highlights so
        // the rows read as a flat list with the count chip as the only
        // visual signal.
        const isBulkSelected = isBulk && bulkSelected === id;
        const cls = "eff-step "
          + (!isBulk && isCur ? "is-current " : "")
          + (!isBulk && isNext ? "is-next " : "")
          + (isBulkSelected ? "is-bulk-selected " : "")
          + (excluded && !isCur ? "is-excluded " : "")
          + (hasBody ? "has-body " : "");
        return (
          <div key={id} className={cls}>
            <div
              className="eff-step-head"
              onClick={()=>{ if (!excluded && !(isCur && !isBulk)) onSelect(id); }}
            >
              <span className="eff-num">{i + 1}</span>
              <span className="eff-name">
                <span className={"dot " + dotFor(id)}/>
                {NET_BY_ID[id].label}
              </span>
              {/* Right-hand badges live in a single flex group so the count
                  chip and the "Selected" bulk cue sit side by side inside
                  the head's grid auto-column instead of stacking. */}
              <span className="eff-step-tags">
                {isBulk ? (
                  (() => {
                    const here = bulkByNet[id] || [];
                    if (here.length === 0) {
                      return <span className="eff-tag eff-tag-bulk-empty">0</span>;
                    }
                    return (
                      <Tooltip
                        wrap
                        align="right"
                        placement="below"
                        panelStyle={{ maxWidth: 520, padding: "10px 12px", whiteSpace: "normal" }}
                        content={(
                          <div className="bulk-tag-tip">
                            <div className="bulk-tag-tip-title">
                              <span className={"dot " + dotFor(id)}/>
                              {here.length} on <b>{NET_BY_ID[id].label}</b>
                            </div>
                            <ul className="bulk-tag-tip-list">
                              {here.map(n => (
                                <li key={n.id}>
                                  <span className="bulk-tag-tip-row">
                                    <span className={"bulk-tag-tip-lvl bulk-tag-tip-lvl-" + (n.level || "").toLowerCase().replace(/[^a-z]/g,"")}>{n.level === "ZIP" ? "Zip code" : n.level}</span>
                                    <span className="bulk-tag-tip-name">{n.name}</span>
                                    {n.uniqueId && <span className="bulk-tag-tip-id">{n.uniqueId}</span>}
                                  </span>
                                  <span className="bulk-tag-tip-wf">
                                    {(n.priority || DEFAULT_PRIORITY).map((p, idx) => (
                                      <Fragment key={p}>
                                        {idx > 0 && <span className="bulk-tag-tip-wf-arrow">›</span>}
                                        <span className={"bulk-tag-tip-wf-step " + (p === n.net ? "is-current" : "")}>
                                          <span className={"dot " + dotFor(p)}/>
                                          {NET_BY_ID[p]?.short || p}
                                        </span>
                                      </Fragment>
                                    ))}
                                  </span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}>
                        <span className="eff-tag eff-tag-bulk">
                          <span className="eff-tag-bulk-count">{here.length}</span>
                          <span className="eff-tag-bulk-label">on this</span>
                        </span>
                      </Tooltip>
                    );
                  })()
                ) : (
                  <span className="eff-tag">
                    {isCur     ? "Current"
                    : isNext   ? "Next on reissue"
                    : excluded ? "blocked"
                    : ""}
                  </span>
                )}
                {/* Bulk selection cue — sits next to the count chip whenever
                    the CSR has clicked this step as the target network for
                    the bulk apply. Keeps the count visible ("X on this")
                    while adding an explicit "Selected" badge so the choice
                    is unmistakable. */}
                {isBulkSelected && (
                  <span className="eff-tag eff-tag-bulk-selected">Selected</span>
                )}
              </span>
            </div>
            {hasBody && (
              <EffStepBody totalItems={(showMax?1:0) + stepRules.length + stepOptOuts.length + (showEnrollment?1:0) + (showConsent?1:0) + (showLockboxFee?1:0) + (showTalkTrack?1:0) + (showDelay?1:0)}>
                {showMax && (
                  <div className="eff-substep" key="max">
                    <span className="eff-substep-label">Max amount</span>
                    <span className="eff-substep-control">
                      <EffSubstepMoneyInput value={vcMax} onChange={onVcMaxChange}/>
                    </span>
                    <span className="eff-substep-hint">per payment cap</span>
                  </div>
                )}
                {stepRules.map(r => (
                  <RuleAnnotation key={r.id} rule={r} stepId={id}/>
                ))}
                {stepOptOuts.map(o => (
                  <OptOutAnnotation
                    key={o.id}
                    optOut={o}
                    onRemove={()=>onRemoveOptOut && onRemoveOptOut(o.id)}
                    onEdit={()=>onEditOptOut && onEditOptOut(o)}
                  />
                ))}
                {showEnrollment && <EnrollmentInStep key="enr" entity={effectiveEntity} currentNetId={current} isCurrent={isCur}/>}
                {showTalkTrack && <RetentionTalkTrack key="ttk" entity={effectiveEntity} isCurrent={isCur}/>}
                {showDelay && !showEnrollment && <EnrollmentDelayInStep key="dly" entity={effectiveEntity} networkId={id} currentNetId={current}/>}
                {showConsent && <VcConsentInStep key="con" entity={effectiveEntity}/>}
                {showLockboxFee && <LockboxFeeInStep key="lbx"/>}
              </EffStepBody>
            )}
          </div>
        );
      })}
    </div>
  );
}

// Variant B — Active rules list, read-only. Each row shows a scope chip,
// the rule text, and a sub-line indicating where the rule lives.
// Renders an exclusion rule decomposed into WHEN / ACTION / NETWORK rows,
// so the CSR doesn't have to parse a long natural-language sentence.
// Falls back to the raw `rule` string when the rule lacks structured fields.
function StructuredRule({ r }) {
  if (!r) return null;
  const target = r.network ? NET_BY_ID[r.network].label : "";
  const over   = r.preferOver ? NET_BY_ID[r.preferOver].label : "";
  if (r.action === "cap") {
    return (
      <div className="sr-sentence">
        Limit <strong className="rule-anno-val">{target}</strong> to <strong className="rule-anno-val">${Number(r.capAmount).toLocaleString()}</strong> per payment
      </div>
    );
  }
  if (!r.when) return <span>{r.rule}</span>;
  return (
    <div className="sr-sentence">
      {r.action === "block" ? (
        <>Don't process via <strong className="rule-anno-val">{target}</strong> when {r.when.field} {humanOp(r.when.op)} {valueChips(r.when.value)}</>
      ) : (
        <>Use <strong className="rule-anno-val">{target}</strong> instead of <strong className="rule-anno-val">{over}</strong> when {r.when.field} {humanOp(r.when.op)} {valueChips(r.when.value)}</>
      )}
    </div>
  );
}

function ActiveRulesList({ rules }) {
  if (!rules || rules.length === 0) {
    return <div className="ar-empty">No active rules apply at this level.</div>;
  }
  const chipClass = (scope) => scope === "Global" ? "global"
                              : scope === "Sub-payer" ? "subpayer"
                              : "provider";
  return (
    <div className="ar-list">
      {rules.map(r => (
        <div key={r.id} className="ar-row">
          <span className={"ar-chip " + chipClass(r.scope)}>
            {r.scope === "Provider opt-out" ? "Provider" : r.scope}
          </span>
          <span className="ar-rule"><StructuredRule r={r}/></span>
        </div>
      ))}
    </div>
  );
}

function EditPopover({ node, parents, bulkCount, bulkDescendants = 0, bulkNodes = [], overridesAtRisk = 0, overrides = [], scope = "all", onApply, onCancel, anchorRight, dupZipSiblings = null }) {
  // Variant C — dev preview toggle for the Edit drawer layout. "stacked"
  // = current behaviour (Network + Distribution one after the other in a
  // long scroll). "tabbed" = split into sub-tabs so the CSR sees only one
  // section at a time. Toggle lives as a floating chip on the left.
  const [editLayoutMode, setEditLayoutMode] = useState("tabbed");
  const [editSubTab, setEditSubTab]         = useState("network");
  // initial draft pulled from node, or sensible defaults for bulk
  const defaultDistOrder = (d) => [d, ...DISTS.filter(x => x !== d)];
  // Build initial netOrder: prefer node.priority (the payer waterfall), put
  // the active net first so primary lines up with node.net.
  const buildNetOrder = (n) => {
    const base = (n && n.priority && n.priority.length) ? [...n.priority] : [...DEFAULT_PRIORITY];
    if (n && n.net) {
      const idx = base.indexOf(n.net);
      if (idx > 0) { base.splice(idx, 1); base.unshift(n.net); }
      else if (idx === -1) base.unshift(n.net);
    }
    return base;
  };
  // Variant C — pull initial VC preference + product enrollments. These
  // fields ride alongside the regular draft. Default false context means
  // the new sections never render in A/B.
  const isOptInOut = useContext(OptInOutContext);
  const initVcPref = node ? vcPreferenceFor(node) : "out";
  const initEnr    = node ? enrollmentsFor(node) : { ach_plus:false, sa_ach:false };
  const init = node
    ? { net: node.net, netOrder: buildNetOrder(node), dist: node.dist || "Fax", max: node.max || 10000, fax: node.fax || "", phone: node.phone || "", distOrder: node.distOrder || defaultDistOrder(node.dist || "Fax"),
        vcPref: initVcPref, enrAchPlus: initEnr.ach_plus, enrSaAch: initEnr.sa_ach }
    : { net: "check", netOrder: ["check","ach","achp","vc","sa"], dist: "Mail", max: 10000, fax: "", phone: "", distOrder: ["Mail","Fax"],
        vcPref: "out", enrAchPlus: false, enrSaAch: false };
  const [draft, setDraft] = useState(init);
  const [applyCascade, setApplyCascade] = useState(false);
  // forms.md: don't disable the submit. Instead, validate on click and
  // surface a field/alert error if a required field is missing. triedSave
  // flips true on the first blocked save attempt so the error shows.
  const [triedSave, setTriedSave] = useState(false);
  // Expanded inline view of the children list. Separate from the
  // checkbox state — clicking the chip body opens this panel, clicking
  // the checkbox just toggles cascade. Lets the CSR review the affected
  // entities without committing the change.
  const [cascadeExpanded, setCascadeExpanded] = useState(false);
  // Fax-number expander — when Fax isn't the primary method (so the field
  // isn't required) we collapse the input behind a discrete toggle so the
  // editor doesn't show an empty placeholder by default.
  // Fax accordion stays collapsed by default. When Fax is the PRIMARY
  // method (VC + Fax dist), the field force-expands via faxRequired, so
  // this only governs the "optional" cases (non-VC entities, or VC with
  // a different primary). Previously we auto-opened whenever node.fax
  // existed, but that caused the field to "burst open" when switching
  // away from VC — unwanted.
  const [showFaxField, setShowFaxField] = useState(false);
  const [showPhoneField, setShowPhoneField] = useState(false);
  // Bulk mode: track whether the user has explicitly picked a target
  // network in the Effective waterfall. Until they do, the Distribution
  // editor stays locked (read-only breakdown only) — since distribution
  // semantics depend on which network is chosen (VC=Fax/Mail user-pick,
  // Check=Mail fixed, ACH/SA=Digital fixed).
  const [bulkNetChosen, setBulkNetChosen] = useState(false);
  // Editing a ZIP (location) is implicitly comprehensive — the change should
  // flow to every record tied to that location. The toggle is shown for
  // reassurance + visibility into the count, and defaults ON.
  const isZipScope = node ? node.level === "ZIP" : (bulkNodes.length > 0 && bulkNodes.every(n => n.level === "ZIP"));
  const [applyToLocation, setApplyToLocation] = useState(true);
  // When the ZIP being edited appears under more than one sub-account
  // (Eric's case), the simple "items under location X" checkbox isn't
  // enough — the CSR needs to pick which sub-account's row gets touched.
  // "all" applies to every sub-account that shares this ZIP; otherwise
  // it's a single sub-account id. Default = "all" (preserves the prior
  // behaviour for the common single-instance case).
  const hasZipDuplicates = isZipScope && dupZipSiblings && dupZipSiblings.length > 1;
  const [locationScope, setLocationScope] = useState("all");
  // Location-impact summary — focused on the CSR's real question before
  // saving: "what payments will this affect, how much money flows here,
  // is the location still active?". We drop generic counts (providers /
  // contracts) since they aren't impacted by a ZIP-level edit.
  const locImpact = isZipScope
    ? (node
        ? { inFlight: node.inFlightPayments || 0, volume: node.monthlyVolume || 0, lastDays: node.lastPaymentDaysAgo == null ? null : node.lastPaymentDaysAgo, count: 1 }
        : bulkNodes.reduce((acc, n) => ({
            inFlight: acc.inFlight + (n.inFlightPayments || 0),
            volume: acc.volume + (n.monthlyVolume || 0),
            lastDays: acc.lastDays === null ? (n.lastPaymentDaysAgo ?? null) : Math.min(acc.lastDays, n.lastPaymentDaysAgo ?? acc.lastDays),
            count: acc.count + 1,
          }), { inFlight:0, volume:0, lastDays:null, count:0 }))
    : { inFlight:0, volume:0, lastDays:null, count:0 };
  const locationItemsCount = locImpact.inFlight; // headline number = in-flight payments
  const formatRelDays = (d) => d == null ? "—" : d === 0 ? "today" : d === 1 ? "1 day ago" : d < 30 ? `${d} days ago` : d < 60 ? "1 month ago" : `${Math.round(d/30)} months ago`;
  const formatMoney = (n) => "$" + n.toLocaleString();
  const editorStyle = useContext(EditorStyleContext);
  const isDrawer = editorStyle === "drawer";
  // Variant B (Routing-aware) — when true, the modal swaps the legacy
  // "Payment program" radio list for the Effective waterfall + Active
  // rules sections, plus a dedicated Max amount section.
  const isRoutingAware = useContext(RoutingAwareContext);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) {
      if (!ref.current || ref.current.contains(e.target)) return;
      // Don't close the Edit drawer when the click lands on the opt-out
      // wizard (which renders at App level, not inside the EditPopover).
      if (e.target.closest && (e.target.closest(".opt-wiz-drawer") || e.target.closest(".modal-backdrop") || e.target.closest(".toast") || e.target.closest(".edit-devprev-floating") || e.target.closest(".unified-devprev-floating"))) return;
      onCancel();
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [onCancel]);

  const isVc = draft.net === "vc";
  // Routing-aware: derive excluded networks + active rules for this entity.
  const excludedMap = useMemo(() => isRoutingAware && node ? networkExclusionsForEntity(node) : {}, [isRoutingAware, node]);
  const activeRules = useMemo(() => isRoutingAware && node ? activeRulesForEntity(node) : [], [isRoutingAware, node]);
  // Variant C (Unified) — session-created opt-outs for this entity. Stored
  // in App state via the OptOutWizardContext. Filtered by entityName so
  // each row only sees its own opt-outs.
  const wizardApi  = useContext(OptOutWizardContext);
  const unifiedCtx = useContext(UnifiedContext);
  const entityOptOuts = useMemo(() => {
    if (!node) return [];
    return (wizardApi.optOuts || []).filter(o => o.entityName === node.name);
  }, [node, wizardApi.optOuts]);
  // V3 only — when both Network + Distribution sections render in the same
  // drawer, the dev preview chip can swap the long scroll for sub-tabs so
  // the CSR sees one section at a time. Default behaviour ("stacked")
  // matches what A/B do; gating on (unifiedCtx && isDrawer) keeps the
  // other variants untouched.
  // Variant D (Simplified) — the dev preview chip is hidden and the
  // layout is force-stacked, so the drawer renders Network + Distribution
  // one after the other with no sub-tab toggle.
  const simplifiedCtx = useContext(SimplifiedContext);
  const showAsTabbed = unifiedCtx && !simplifiedCtx && isDrawer && editLayoutMode === "tabbed";
  const showNetworkSection      = !showAsTabbed || editSubTab === "network";
  const showDistributionSection = !showAsTabbed || editSubTab === "distribution";
  // Group rules by the network they're anchored to inside the waterfall.
  // Block rules anchor at r.network (the blocked one). Prefer rules anchor
  // at r.network (the promoted one) — the demoted one's annotation lives
  // implicitly via the "over X" suffix.
  const rulesByNetwork = useMemo(() => {
    const map = {};
    for (const r of activeRules) {
      const key = r.network;
      if (!key) continue;
      (map[key] = map[key] || []).push(r);
    }
    return map;
  }, [activeRules]);
  // Bulk mode — union of rules across every selected node, deduplicated by
  // rule id. Lets the CSR see, for each step in the cascade, the full set
  // of rules that touch ANY of the selected entities (global rules plus
  // sub-payer / opt-out rules from individual rows).
  const bulkRulesByNetwork = useMemo(() => {
    if (!isRoutingAware || node || !bulkNodes || bulkNodes.length === 0) return null;
    const map = {};
    const seen = new Set();
    for (const n of bulkNodes) {
      for (const r of activeRulesForEntity(n)) {
        const dedupeKey = r.id + ":" + (r.network || "");
        if (seen.has(dedupeKey)) continue;
        seen.add(dedupeKey);
        const key = r.network;
        if (!key) continue;
        (map[key] = map[key] || []).push(r);
      }
    }
    return map;
  }, [isRoutingAware, node, bulkNodes]);
  const cascadeCount = node ? countDescendants(node) : bulkDescendants;
  // Override detection — node has a preference manually set that doesn't
  // follow its parent. Surface this in the editor so the CSR knows the
  // current state before they save (and that any change overwrites the
  // manual setting against the parent's cascade).
  const directParent = (parents && parents.length) ? parents[parents.length-1] : null;
  const isOverridingParent = !!(node && directParent && directParent.net !== node.net);
  // If we opened the popover scoped to "distribution" but the network doesn't
  // use one, there's literally nothing to cascade — hide the toggle.
  const canCascade = !(scope === "distribution" && !isVc);
  const changedNet = node && node.net !== draft.net;
  const distAllowed = isVc; // distribution + fax + max apply for VC only
  const hasChanges = node
    ? (draft.net !== node.net || draft.dist !== node.dist || draft.max !== node.max || draft.fax !== node.fax || (draft.phone || "") !== (node.phone || "") ||
       (draft.distOrder && JSON.stringify(draft.distOrder) !== JSON.stringify(node.distOrder || defaultDistOrder(node.dist))) ||
       (draft.netOrder && JSON.stringify(draft.netOrder) !== JSON.stringify(node.priority || DEFAULT_PRIORITY)))
    : true;  // bulk mode: always allow (per-row no-op happens in reducer)
  // Save is blocked when a required field is missing — currently the fax
  // number when Fax is the primary distribution method on a VC network.
  const faxIsRequired = isVc && draft.dist === "Fax";
  const isInvalid = faxIsRequired && !(draft.fax || "").trim();
  const canSave = hasChanges && !isInvalid;

  // Drawer must mount at <body> level — when rendered as a descendant of
  // the table row (its natural anchor), any ancestor with a CSS feature
  // that creates a containing block (transform, filter, contain, etc.)
  // would re-root `position:fixed` to that ancestor instead of the
  // viewport, which is what made the drawer collapse to the table's
  // right edge instead of the screen's. Portal sidesteps the whole
  // class of issue, regardless of which ancestor changes in the future.
  const content = (
    <Fragment>
    {isDrawer && <div className="edit-drawer-backdrop" onClick={onCancel}/>}
    {unifiedCtx && !simplifiedCtx && isDrawer && (
      <div className="edit-devprev-floating" onClick={(e)=>e.stopPropagation()}>
        <div className="edit-devprev-label">
          <span className="edit-devprev-dot"/>DEV PREVIEW · Edit layout
        </div>
        <div className="edit-devprev-segs">
          <button type="button"
            className={"edit-devprev-seg " + (editLayoutMode === "stacked" ? "is-on" : "")}
            onClick={()=>setEditLayoutMode("stacked")}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/></svg>
            Stacked
          </button>
          <button type="button"
            className={"edit-devprev-seg " + (editLayoutMode === "tabbed" ? "is-on" : "")}
            onClick={()=>setEditLayoutMode("tabbed")}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9h6V3"/><rect x="3" y="9" width="18" height="12" rx="1"/></svg>
            Tabbed
          </button>
        </div>
        <div className="edit-devprev-hint">Stacks Network + Distribution, or splits them into sub-tabs.</div>
      </div>
    )}
    <div className={"edit-pop " + (isDrawer ? "as-drawer" : "")} ref={ref} style={isDrawer ? {} : (anchorRight ? { right:0 } : { left:0 })}>
      <div className="edit-content">
      <div className="flex items-start gap-3 mb-3">
        <div className="flex-1">
          <h3 className="edit-h1">{bulkCount ? `Edit ${bulkCount} selected row${bulkCount>1?"s":""}` : `Edit preferences`}</h3>
          <div className="ctx-line mt-2">
            {node && (
              <>
                {node.npi ? (
                  // NPI entity — use the same registry icon as the tab/row
                  <span className="lvl-badge npi-level-badge" style={{width:18, height:18, borderRadius:6}}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
                  </span>
                ) : (
                  <LevelBadge level={node.level} size={18}/>
                )}
                <Tooltip wrap content={node.name}>
                  <span className="ec-name">{node.name}</span>
                </Tooltip>
                {node.npi && node.status === "Inactive" && (
                  <span className="status-chip status-inactive">
                    <span className="npi-status-dot npi-status-inactive"/>Inactive
                  </span>
                )}
                {node.npi && node.status === "Active" && (
                  <span className="status-chip status-active">
                    <span className="npi-status-dot npi-status-active"/>Active
                  </span>
                )}
              </>
            )}
            {!node && <span className="text-[12px] ink-2">Changes apply to all selected rows.</span>}
            {node && cascadeCount > 0 && (()=>{ const cb = cascadeBreakdown(node); const levels = ["Account","Sub-account","ZIP"].filter(l => cb[l] > 0);
              return (
                <>
                  <span className="cc-arrow">→</span>
                  {levels.map((l, i) => (
                    <Fragment key={l}>
                      {i > 0 && <span className="cc-sep">·</span>}
                      <span className="cc-item">
                        <LevelBadge level={l} size={14}/>
                        <b>{cb[l]}</b> {l.toLowerCase()}{cb[l] > 1 ? "s" : ""}
                      </span>
                    </Fragment>
                  ))}
                </>
              );
            })()}
          </div>
        </div>
        <button onClick={onCancel} className="ink-3 hover:ink">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      {/* V3 sub-tabs — only rendered when the dev preview chip flips the
          layout to "tabbed". Sits directly under the entity context line so
          it reads as a control over the body below it. */}
      {showAsTabbed && (
        <div className="edit-subtabs">
          <button type="button"
            className={"edit-subtab " + (editSubTab === "network" ? "is-on" : "")}
            onClick={()=>setEditSubTab("network")}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/><path d="M2 12c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/><path d="M2 18c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/></svg>
            Network
          </button>
          <button type="button"
            className={"edit-subtab " + (editSubTab === "distribution" ? "is-on" : "")}
            onClick={()=>setEditSubTab("distribution")}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Distribution
          </button>
        </div>
      )}

      {/* Override notice — surfaces the "doesn't follow parent" state from the
          table inside the editor so the CSR knows the current preference is
          a manual override (and any change overwrites that intent). */}
      {isOverridingParent && (
        <div className="override-notice">
          <span className="ov-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 0 1 4 4v6"/></svg>
          </span>
          <div className="ov-body">
            <div className="ov-title">Currently overriding parent</div>
            <div className="ov-detail">
              Set to <b>{NET_BY_ID[node.net].label}</b> manually instead of inheriting <b>{NET_BY_ID[directParent.net].label}</b> from <b>{directParent.name}</b>.
            </div>
          </div>
        </div>
      )}

      {/* Variant C — Virtual card preference toggle. Sits above Payment
          program and dictates whether the program section is editable
          (Opted in) or informational (Opted out, visually disabled). */}
      {isOptInOut && (
        <div className="mb-4">
          <div className="field-label primary">Virtual card preference</div>
          <div className="method-hint">Is this provider accepting virtual card payments?</div>
          <div className="vc-toggle">
            <button type="button"
              className={"in " + (draft.vcPref === "in" ? "is-on" : "")}
              onClick={()=>setDraft(d=>({...d, vcPref:"in"}))}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Opted in
            </button>
            <button type="button"
              className={"out " + (draft.vcPref === "out" ? "is-on" : "")}
              onClick={()=>setDraft(d=>{
                // Opting out — if VC was the current Payment program, fall
                // back to the next non-VC item in the cascade so the section
                // doesn't end up with a disabled selection.
                if (d.net !== "vc") return { ...d, vcPref:"out" };
                const fallback = d.netOrder.find(id => id !== "vc") || d.net;
                const order = [fallback, ...d.netOrder.filter(x => x !== fallback)];
                return { ...d, vcPref:"out", net:fallback, netOrder:order };
              })}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Opted out
            </button>
          </div>
        </div>
      )}

      {/* NETWORK section — payer's waterfall, editable.
          Primary (top) is the active network. Drag to reorder.
          In Variant C this becomes informational (disabled) when opted out.
          In Variant B (Routing-aware) it's REPLACED by the Effective
          waterfall + Active rules collapsible sections below — but only
          for SINGLE-row edits. Bulk mode in routing-aware falls back to
          this simple radio list (the waterfall needs a specific entity
          to compute against), so the drawer doesn't go empty. */}
      {(!isRoutingAware || (!node && bulkNodes.length === 0)) && (scope === "all" || scope === "network" || isDrawer) && (
        <div className={"mb-4 " + (isDrawer && scope === "network" ? "section-flash" : "")}>
          <div className="field-label primary">Payment program</div>
          <div className="method-hint">
            {isOptInOut && draft.vcPref === "out"
              ? "Virtual card is unavailable for this provider. Other programs remain selectable."
              : "Select the fulfillment payment program"}
          </div>
          <MethodReorderList
            items={draft.netOrder}
            current={draft.net}
            noDrag
            primaryLabel="Fulfillment"
            onSelect={(id)=>setDraft(d=>({ ...d, net:id }))}
            onReorder={(newOrder)=>setDraft(d=>({...d, netOrder:newOrder, net:newOrder[0]}))}
            renderItem={(id)=>{
              const n = NET_BY_ID[id];
              // VC item in OptInOut variant carries an inline consent badge
              // right after the network name — green check / gray X — so the
              // legal state is visible without opening the modal further.
              const showVcConsent = isOptInOut && id === "vc" && !!node;
              const hasConsent = showVcConsent && vcConsentFor(node);
              return (
                <span className="flex items-center gap-2">
                  <span className={"dot " + dotFor(id)}/>
                  <span>{n.label}</span>
                  {showVcConsent && (
                    <Tooltip
                      wrap
                      placement="below"
                      align="center"
                      panelStyle={{ maxWidth: 240, padding:"8px 10px" }}
                      content={hasConsent
                        ? <span>Provider has signed VC consent on file. Required in some states for virtual card processing.</span>
                        : <span>Missing VC consent. Required in some states before virtual card payments can be processed.</span>
                      }
                    >
                      <span className={"vc-consent-inline " + (hasConsent ? "is-yes" : "is-no")}>
                        {hasConsent ? (
                          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        ) : (
                          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        )}
                        {hasConsent ? "Consent" : "No consent"}
                      </span>
                    </Tooltip>
                  )}
                </span>
              );
            }}
            itemMeta={(id) => (isOptInOut && draft.vcPref === "out" && id === "vc") ? { disabled: true, badge: "Opted out" } : null}
          />
          {isVc && !isOptInOut && (
            <div className="mt-3">
              <div className="field-label sub">Max amount (USD)</div>
              <input className="text-input sm" type="number" value={draft.max} onChange={e=>setDraft(d=>({...d, max:Number(e.target.value)||0}))}/>
            </div>
          )}
        </div>
      )}

      {/* Variant B — Effective waterfall + Active rules + Max amount.
          Collapsible sections, both open by default.
          V3 only — hidden when the dev-preview chip swaps to the "tabbed"
          layout and the Distribution sub-tab is active. */}
      {isRoutingAware && (node || bulkNodes.length > 0) && showNetworkSection && (
        <>
          <CollapsibleSection
            title="Effective waterfall"
            noToggle
            countSlot={
              <span className="wf-meta">
                <Tooltip wrap align="right" placement="below" content={(
                  <div className="rules-tip">
                    <div className="rules-tip-title">Active rules</div>
                    <ol className="rules-tip-list">
                      {activeRules.map(r => (
                        <li key={r.id}>
                          <span className={"rules-tip-scope " + (r.scope === "Global" ? "global" : r.scope === "Sub-payer" ? "subpayer" : "provider")}>
                            {r.scope === "Provider opt-out" ? "Provider" : r.scope}
                          </span>
                          <span className="rules-tip-text">
                            {r.action === "block"
                              ? <>Don't process via <b>{NET_BY_ID[r.network].label}</b> when <b>{r.when.field}</b> {humanOp(r.when.op)} <b>{r.when.value}</b></>
                              : r.action === "cap"
                              ? <>Limit <b>{NET_BY_ID[r.network].label}</b> to <b>${Number(r.capAmount).toLocaleString()}</b> per payment</>
                              : <>Use <b>{NET_BY_ID[r.network].label}</b> instead of <b>{NET_BY_ID[r.preferOver].label}</b> when <b>{r.when.field}</b> {humanOp(r.when.op)} <b>{r.when.value}</b></>}
                          </span>
                        </li>
                      ))}
                    </ol>
                  </div>
                )} panelStyle={{ maxWidth:460, minWidth:280, padding:"12px 14px" }}>
                  <span className="collap-count-link"><span className="collap-count-text">{activeRules.length} {activeRules.length===1?"rule":"rules"}</span></span>
                </Tooltip>
                {unifiedCtx && (
                  <button type="button" className="wf-create-opt-btn" onClick={()=>wizardApi.open({
                    entityName: node.name,
                    level: node.level,
                    zip: node.level === "ZIP" ? node.name : undefined,
                    state: node.state,
                    suggestedLevel: node.level === "ZIP" ? "zip" : node.level === "Sub-account" ? "sub-account" : "account",
                  })}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Create opt-out
                    {entityOptOuts.length > 0 && (
                      <span className="wf-create-opt-btn-count">{entityOptOuts.length}</span>
                    )}
                  </button>
                )}
              </span>
            }
            icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/><path d="M2 12c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/><path d="M2 18c2 0 4 2 6 2s4-2 6-2 4 2 6 2"/></svg>}
          >
            <EffectiveWaterfall
              items={draft.netOrder}
              current={draft.net}
              excludedMap={excludedMap}
              onSelect={(id)=>{ setDraft(d=>({ ...d, net:id })); if (!node) setBulkNetChosen(true); }}
              vcMax={draft.netOrder.includes("vc") ? draft.max : undefined}
              onVcMaxChange={(v)=>setDraft(d=>({...d, max:v}))}
              rulesByNetwork={node ? rulesByNetwork : (bulkRulesByNetwork || {})}
              entity={node}
              bulkNodes={!node ? bulkNodes : null}
              bulkSelected={!node && bulkNetChosen ? draft.net : null}
              optOutsByNetwork={entityOptOuts.reduce((acc, o) => { const k = o.network || "vc"; (acc[k]=acc[k]||[]).push(o); return acc; }, {})}
              onRemoveOptOut={wizardApi.removeOptOut}
              onEditOptOut={(o) => {
                wizardApi.removeOptOut(o.id);
                wizardApi.open({
                  entityName: node.name,
                  level: node.level,
                  zip: node.level === "ZIP" ? node.name : undefined,
                  state: node.state,
                  suggestedLevel: node.level === "ZIP" ? "zip" : node.level === "Sub-account" ? "sub-account" : "account",
                  prefill: o,
                });
              }}
            />
          </CollapsibleSection>
        </>
      )}

      {/* DISTRIBUTION section — same H2 weight as Network for visual parity.
          In Variant C this section is renamed "Virtual card preferences"
          and always rendered (independent of isVc), with Max amount moved
          inside it. Disabled visually when opted out.
          V3 only — hidden when the dev-preview chip swaps to the "tabbed"
          layout and the Network sub-tab is active. */}
      {(scope === "all" || scope === "distribution" || isDrawer) && showDistributionSection && (
        <div className={
          (isDrawer && scope === "distribution" ? "section-flash" : "") +
          (isOptInOut && draft.vcPref === "out" ? " opt-disabled mb-4" : (isOptInOut ? " mb-4" : ""))
        }>
          {isOptInOut && (
            <>
              <div className="field-label primary">Virtual card preferences</div>
              <div className="method-hint">
                {draft.vcPref === "out"
                  ? "Saved settings — applied if this provider opts back in to virtual card."
                  : "Configure how virtual card payments are delivered."}
              </div>
              <div className="mt-3">
                <div className="field-label sub">Max amount (USD)</div>
                <input className="text-input sm" type="number" value={draft.max} onChange={e=>setDraft(d=>({...d, max:Number(e.target.value)||0}))}/>
              </div>
              <div className="mt-3">
                <div className="field-label sub">Distribution method</div>
                <MethodReorderList
                  items={draft.distOrder}
                  current={draft.dist}
                  onSelect={(d)=>setDraft(s=>({ ...s, dist:d }))}
                  onReorder={(newOrder)=>setDraft(s=>({ ...s, distOrder:newOrder }))}
                />
              </div>
              {draft.distOrder && draft.distOrder.includes("Fax") && (
                <div className="mt-3">
                  <div className="field-label sub">
                    Fax number
                    {draft.dist === "Fax" && <span className="req-tag">Required</span>}
                  </div>
                  <input
                    className="text-input sm"
                    value={draft.fax || ""}
                    onChange={e=>setDraft(d=>({...d, fax:e.target.value}))}
                    placeholder="Enter fax number"
                  />
                </div>
              )}
            </>
          )}
          {!isOptInOut && isVc && (
            <>
              <div className="field-label primary">Distribution</div>
              {!node && bulkNodes.length > 0 && (
                <>
                  <div className="method-hint">Current distribution across the {bulkNodes.length} selected rows.</div>
                  <BulkDistBreakdown bulkNodes={bulkNodes}/>
                  {!bulkNetChosen && (
                    <div className="readonly-note-inline mt-3">
                      Pick <b>Virtual card</b> as the target in the waterfall above to change the distribution preferences below.
                    </div>
                  )}
                </>
              )}
              {(node || bulkNetChosen) && (
                <div className="method-hint">Select the preferred method · drag to reorder fallbacks</div>
              )}
              {(node || bulkNetChosen) && (
              <MethodReorderList
                items={draft.distOrder}
                current={draft.dist}
                onSelect={(d)=>setDraft(s=>({ ...s, dist:d }))}
                onReorder={(newOrder)=>setDraft(s=>({ ...s, distOrder:newOrder }))}
              />
              )}
              {(node || bulkNetChosen) && draft.distOrder && draft.distOrder.includes("Fax") && (() => {
                // Fax number is required only when Fax is the primary method.
                // When it's just a fallback (and there's no value yet), keep
                // the input collapsed behind a discrete "Add fax number" toggle.
                const faxRequired = draft.dist === "Fax";
                const faxMissing = faxRequired && !(draft.fax || "").trim();
                const expanded = faxRequired || showFaxField;
                if (!expanded) {
                  return (
                    <button type="button" className="fax-expand mb-3" onClick={()=>setShowFaxField(true)}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Fax number
                      <span className="fax-expand-sub">optional · used if Fax becomes primary</span>
                    </button>
                  );
                }
                return (
                  <>
                    <div className="field-label sub">
                      Fax number
                      {faxRequired && <span className="req-tag">Required</span>}
                    </div>
                    <input
                      className={"text-input sm " + (faxMissing ? "is-invalid " : "") + "mb-1"}
                      value={draft.fax || ""}
                      onChange={e=>setDraft(d=>({...d, fax:e.target.value}))}
                      placeholder={faxRequired ? "Enter fax number…" : "Optional fax number…"}
                      aria-invalid={faxMissing}
                    />
                    {faxMissing && (
                      <div className="field-error mb-3">A fax number is required when Fax is the primary delivery method.</div>
                    )}
                    {!faxMissing && <div className="mb-3"/>}
                  </>
                );
              })()}
              {/* Phone — general business contact, separate from the Fax line. */}
              <div className="fax-accordion-quiet">
                <button type="button" className="fax-accordion-trigger" aria-expanded={showPhoneField} onClick={()=>setShowPhoneField(s=>!s)}>
                  <svg className={"chev " + (showPhoneField ? "open" : "")} width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                  <span className="fax-acc-label">Phone</span>
                  <span className="fax-acc-val">{draft.phone || "—"}</span>
                </button>
                {showPhoneField && (
                  <div className="fax-accordion-body">
                    <input
                      className="text-input sm"
                      value={draft.phone || ""}
                      onChange={e=>setDraft(d=>({...d, phone:e.target.value}))}
                      placeholder="Enter phone number…"
                      autoFocus
                    />
                    <div className="fax-acc-note">General contact number for this payer / provider.</div>
                  </div>
                )}
              </div>
            </>
          )}
          {/* Network doesn't use distribution — show what's currently on file as read-only context,
              plus a note explaining why nothing here is editable. */}
          {!isVc && node && (() => {
            const effectiveMethod = node.net === "check" ? "Mail" : "Digital";
            return (
              <>
                <div className="field-label primary">Distribution</div>
                <div className="readonly-method">
                  <DistMethodIcon method={effectiveMethod}/>
                  <span className="readonly-method-name">{effectiveMethod}</span>
                </div>
                <div className="readonly-note-inline">
                  Distribution method, max amount and fax don't apply when the payment program is <b>{NET_BY_ID[draft.net].label}</b>.
                </div>
                {/* Contact accordions — Phone and Fax kept on file. Phone is
                    the general business contact; Fax is used when the payment
                    method requires faxed remittance. Both render as quiet
                    secondary controls so they don't compete with the primary
                    distribution selector above. */}
                <div className="fax-accordion-quiet">
                  <button type="button" className="fax-accordion-trigger" aria-expanded={showPhoneField} onClick={()=>setShowPhoneField(s=>!s)}>
                    <svg className={"chev " + (showPhoneField ? "open" : "")} width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    <span className="fax-acc-label">Phone</span>
                    <span className="fax-acc-val">{draft.phone || "—"}</span>
                  </button>
                  {showPhoneField && (
                    <div className="fax-accordion-body">
                      <input
                        className="text-input sm"
                        value={draft.phone || ""}
                        onChange={e=>setDraft(d=>({...d, phone:e.target.value}))}
                        placeholder="Enter phone number…"
                        autoFocus
                      />
                      <div className="fax-acc-note">General contact number for this payer / provider.</div>
                    </div>
                  )}
                </div>
                <div className="fax-accordion-quiet">
                  <button type="button" className="fax-accordion-trigger" aria-expanded={showFaxField} onClick={()=>setShowFaxField(s=>!s)}>
                    <svg className={"chev " + (showFaxField ? "open" : "")} width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    <span className="fax-acc-label">Fax number</span>
                    <span className="fax-acc-val">{draft.fax || "—"}</span>
                  </button>
                  {showFaxField && (
                    <div className="fax-accordion-body">
                      <input
                        className="text-input sm"
                        value={draft.fax || ""}
                        onChange={e=>setDraft(d=>({...d, fax:e.target.value}))}
                        placeholder="Enter fax number…"
                        autoFocus
                      />

      {overridesAtRisk > 0 && applyCascade && (
        <div className="warn-banner mb-3">

                  </span>
                </Tooltip>
              </>
            )}
          </div>
        </div>
      )}
      {/* forms.md: error alert in the drawer, shown only after a blocked
          save attempt — named field + how to fix, role="alert". */}
      {triedSave && isInvalid && (
        <div className="edit-error-alert" role="alert">
          <span className="ea-icon" aria-hidden="true">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 7v6M12 17h.01"/></svg>
          </span>

      <div className="edit-actions flex items-center justify-end gap-2 border-t line pt-3 mt-1">
        <button className="btn btn-quiet" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" onClick={()=>{
          if (isInvalid) { setTriedSave(true); return; }

          onApply({ ...draft, applyCascade });

      </div>

    </div>
    </Fragment>
  );
  return isDrawer ? ReactDOM.createPortal(content, document.body) : content;
