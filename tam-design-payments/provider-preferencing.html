// ─────────────────────────────────────────────────────────────────────
// Floating Variant Switcher
// ─────────────────────────────────────────────────────────────────────
// Three variants of the edit phase, ordered by recommended adoption:
//   B (default) — Routing-aware: surfaces the routing engine context
//      (waterfall + rule badges) on top of the canonical hierarchy.
//   C — Opt-in/out: focuses the table on Virtual card preference and
//      Product enrollments instead of the routing waterfall.
//   A — Hierarchy table: the original power-user table, unchanged.
const VARIANTS = [
  { id:"routing-aware", letter:"A", title:"Routing-aware",       desc:"Hierarchy table plus a waterfall peek per Fulfillment cell and rule-impact badges. Surfaces the routing engine without changing the layout." },
  { id:"opt-in",        letter:"B", title:"Opt-in / Opt-out",    desc:"Reframes the table around Virtual card preference (opted in/out) and ACH product enrollments. For the “does this provider accept VC?” mental model." },
  { id:"unified",       letter:"C", title:"Unified Routing",     desc:"Sub-account-anchored waterfall + aggregated account view, Distribution tab, wizard-based opt-outs with inline validators. Built from Eric's PPTX + meeting feedback. Includes a built-in DEV PREVIEW chip to toggle a strict Simplified mode (sub-account-only, no Edit sub-tabs)." },
];
// Discarded variants — kept so they can still be inspected but visually
// demoted in the DevPanel.
const VARIANTS_EXPERIMENTAL = [
  // Routing-aware (A) with an account-level rollup column: account rows
  // hide priority + current network and surface a stacked Network
  // distribution bar aggregating every descendant (sub-accounts, locations,
  // ZIPs, NPIs). Sub-accounts and below keep priority + current, so the
  // level distinction reads at a glance — accounts summarise, leaves rule.
  { id:"routing-rollup", letter:"H", title:"Routing-aware · account rollup", desc:"Same as A, but Account rows drop Network priority + Current network and instead show a stacked Network distribution bar built from every descendant. Sub-accounts and ZIPs keep priority + current." },
  { id:"table",   letter:"D", title:"Hierarchy table",   desc:"Original entity-first dense table. Filter, search and act on many rows — power-user friendly. Superseded by Unified Routing." },
  { id:"persona", letter:"E", title:"Persona-driven",    desc:"Adds a provider KPI strip + routing calculator above the table. Folded into the shared Overview tab." },
  { id:"routing", letter:"F", title:"Routing flat-list", desc:"Each account flat with the waterfall as inline chips. Replaces the table — too radical." },
  { id:"trace",   letter:"G", title:"Payment-trace",     desc:"Two-pane payment-first layout. Inverts the entry point — useful but disconnected from the editor." },
];
// Disbursements layout switcher — lives inside the top DEV PREVIEW panel.
// Comparison is the canonical view; Tabbed and Dense are kept available
// for inspection but tucked behind this dev affordance so they don't
// distract from the default CSR experience. Reads / writes the active
// layout through DisbLayoutContext.
function DevPanelDisbLayout() {
  const { value, setValue } = useContext(DisbLayoutContext);
  const OPTIONS = [
    { id:"comparison", label:"Comparison" },
    { id:"tabbed",     label:"Tabbed"     },
    { id:"dense",      label:"Dense"      },
  ];
  return (
    <div className="devp-section">
      <div className="devp-section-label">Overview · Disbursements layout</div>
      <div className="devp-seg cols-3">
        {OPTIONS.map(o => (
          <button key={o.id} className={value === o.id ? "on" : ""} onClick={()=>setValue(o.id)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

// Unified DEV panel — collapses the old top dev bar + the floating layout
// switcher into a single dropdown. Prioritizes the current state in the
// summary chip; full controls live inside the popover.
function DevPanel({ state, dispatch }) {
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) dispatch({type:"closeSwitch"}); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const current = VARIANTS.find(v => v.id === state.variant);
  // Experimental variants live behind a quiet expander so the panel
  // reads as 3 active options by default. Auto-open if the currently
  // selected variant is an experimental one (so the user can see what
  // they have active).
  const isExperimentalSelected = VARIANTS_EXPERIMENTAL.some(v => v.id === state.variant);
  const [expOpen, setExpOpen] = useState(isExperimentalSelected);
  const PHASES = [
    {id:"edit",l:"1 Edit"},{id:"review",l:"2 Review"},
    {id:"impacted",l:"3 Impacted"},{id:"done",l:"4 Done"}
  ];

// Variant C (Unified) — branded dropdown (replaces native <select>).
// Renders a styled trigger button + a popover with the options. Compact
// mode shrinks the trigger width for tight rows (e.g. state codes).
function FancyDropdown({ value, options, onChange, placeholder, compact, dropUp }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const current = options.find(o => o.id === value);
  const labelText = current ? current.label : (placeholder || "Select…");
  return (
    <div className={"fancy-dd " + (compact?"is-compact":"") + (dropUp?" is-dropup":"") + (open?" is-open":"")} ref={ref}>
      <button type="button" className="fancy-dd-trigger" onClick={()=>setOpen(o=>!o)}>
        {current?.icon && <span className="fancy-dd-icon">{current.icon}</span>}
        <span className="fancy-dd-value">{labelText}</span>
        <svg className="fancy-dd-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      {open && (
        <div className="fancy-dd-menu">
          {options.map(o => (
            <button
              key={o.id}
              type="button"
              className={"fancy-dd-item " + (o.id === value ? "is-on" : "")}
              onClick={()=>{ onChange(o.id); setOpen(false); }}
            >
              {o.icon && <span className="fancy-dd-icon">{o.icon}</span>}
              <span>{o.label}</span>
              {o.id === value && (
                <svg className="fancy-dd-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              )}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Toast helper — appends a transient notification node to a fixed container
// in the top-right. Auto-dismisses after 4s; the user can also click ✕.
// Supports three kinds: "created" (default), "updated", "removed".
function showOptOutToast({ scopeKindLabel, levelLabel, entityName, kind = "created" }) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    container.className = "toast-container";
    document.body.appendChild(container);
  }
  const titles = {
    created: "Opt-out created",
    updated: "Opt-out updated",
    removed: "Opt-out removed",
  };
  const iconColors = {
    created: { bg:"#E0F3DF", fg:"#066605" },
    updated: { bg:"#E6F0FF", fg:"#002677" },
    removed: { bg:"#FCEAEA", fg:"#D71515" },
  };
  const icons = {
    created: '<polyline points="20 6 9 17 4 12"></polyline>',
    updated: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline>',
    removed: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',
  };
  const c = iconColors[kind];
  const el = document.createElement("div");
  el.className = "toast toast-" + kind;
  el.innerHTML = `
    <span class="toast-icon" style="background:${c.bg};color:${c.fg}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${icons[kind]}</svg></span>
    <span class="toast-body">
      <span class="toast-title">${titles[kind]}</span>
      <span class="toast-detail">${scopeKindLabel || ""}${scopeKindLabel && levelLabel ? " · " : ""}${levelLabel || ""}${entityName ? " · " + entityName : ""}</span>
    </span>
    <button class="toast-undo">Undo</button>
    <button class="toast-close" aria-label="Dismiss">×</button>
  `;
  container.appendChild(el);
  const remove = () => { el.classList.add("is-out"); setTimeout(()=>el.remove(), 200); };
  el.querySelector(".toast-close").addEventListener("click", remove);
  el.querySelector(".toast-undo").addEventListener("click", remove);
  setTimeout(remove, 4000);
}

// Variant C (Unified) — Opt-out wizard drawer. Eric's PPTX flow:
//   Step 1 — What's being opted out: Network / Distribution / Both
//   Step 2 — At what level: Zip / Sub-account / Account / All payers
//   Step 3 — Restrictions: amount + location (with inline validators
//            and match confidence — added in a later step)
// `context` carries pre-fill info when launched from a specific entity
// (paymentId / sub-account / zip) so the CSR doesn't start from blank.
function OptOutWizard({ context, onClose }) {
  const wizardApi = useContext(OptOutWizardContext);
  const pre = context?.prefill;
  const [step, setStep] = useState(1);
  // Step 1 — scope of the opt-out
  const [scopeKind, setScopeKind] = useState(pre?.scopeKind || "network"); // network · distribution · both
  // Step 2 — level
  const [level, setLevel] = useState(pre?.level || context?.suggestedLevel || "zip");
  // Step 3 — restrictions
  const [amountOp, setAmountOp] = useState(pre?.amountOp || "any"); // any · gte · lte
  const [amount, setAmount] = useState(pre?.amount || "");
  const [zipValue, setZipValue] = useState(pre?.zipValue || context?.zip || "");
  const [stateValue, setStateValue] = useState(pre?.stateValue || context?.state || "");
  // Mock list of ZIPs known to the system for match confidence checks.
  const KNOWN_ZIPS = { "33012":12, "33013":8, "33014":5, "33015":3 };
  // Compute ZIP validation + match confidence
  const zipValidation = useMemo(() => {
    if (!zipValue) return { status:"empty" };
    if (!/^\d+$/.test(zipValue)) return { status:"error", message:"Only numbers allowed" };
    if (zipValue.length !== 5) return { status:"error", message:"Must be 5 digits" };
    const matches = KNOWN_ZIPS[zipValue];
    if (matches) return { status:"match", message:`100% match — appears in ${matches} payments for this provider` };
    return { status:"nomatch", message:"No payments seen with this ZIP — verify spelling" };
  }, [zipValue]);
  // Dev preview state — lets the designer cycle through validator states.
  // Defaults to "empty" so the wizard opens with a clean placeholder. The
  // dev preview chip lives outside the drawer (floating top-left) so it
  // doesn't take up wizard real estate.
  const [zipDevState, setZipDevState] = useState("empty");
  const zipDisplay = zipDevState === "empty" ? { status:"empty" }
    : zipDevState === "match" ? { status:"match", message:"100% match — appears in 12 payments for this provider" }
    : zipDevState === "error" ? { status:"error", message:"Must be 5 digits" }
    : { status:"nomatch", message:"No payments seen with this ZIP — verify spelling" };
  const zipDevValue = zipDevState === "empty" ? ""
    : zipDevState === "match" ? "33012"
    : zipDevState === "error" ? "3301"
    : "99999";
  // Mock impact estimates per level. Real impl would query the platform.
  const impact = {
    zip:          "~5 payments/mo",
    "sub-account":"~30 payments/mo",
    account:      "~150 payments/mo",
    org:          "~600 payments/mo",
    "all-payers": "everything (cross-payer)"
  };
  // US states for the dropdown
  const US_STATES = [
    ["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],
    ["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["FL","Florida"],["GA","Georgia"],
    ["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],
    ["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],
    ["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],
    ["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],
    ["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],
    ["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],
    ["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],
    ["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]
  ];
  // Amount restriction reads in plain CSR language instead of math
  // operators. Icons are directional arrows that match the label's
  // intent (where the opt-out APPLIES relative to the threshold), not
  // the math operator — the previous "≥" / "≤" glyphs read as the
  // opposite of "Max" / "Min" semantically and tripped users up.
  //   Max amount = anything ABOVE this threshold is opted out (↑).
  //   Min amount = anything BELOW this threshold is opted out (↓).
  const amountOpOptions = [
    { id:"any", label:"Any amount",  icon:"∞" },
    { id:"gte", label:"Max amount",  icon:"↑" },
    { id:"lte", label:"Min amount",  icon:"↓" },
  ];
  // When the wizard is launched from a specific entity row (context has
  // entityName), the level is already determined — skip step 2 entirely.
  // From the general "+ Create opt-out" CTA the wizard starts blank, so
  // the level step is needed.
  const hasEntityContext = !!context?.entityName;
  const wizardSteps = hasEntityContext ? [1, 3, 4] : [1, 2, 3, 4];
  const stepIdx = Math.max(0, wizardSteps.indexOf(step));
  const totalSteps = wizardSteps.length;
  const goNext = () => setStep(wizardSteps[stepIdx + 1]);
  const goBack = () => setStep(wizardSteps[stepIdx - 1]);
  // Step 3 — block "Next" when ZIP is in error state (typos / wrong length).
  const canNext = step === 1 ? !!scopeKind
                : step === 2 ? !!level
                : step === 3 ? zipDisplay.status !== "error"
                : true;
  const scopeKindLabel = scopeKind === "network" ? "Network" : scopeKind === "distribution" ? "Distribution" : "Network and Distribution";
  const levelLabel = level === "zip" ? "ZIP" : level === "sub-account" ? "Sub-account" : level === "account" ? "Account" : level === "org" ? "Organization" : "All payers";
  return (
    <>
      <div className="modal-backdrop" onClick={onClose}/>
      {step === 3 && (
        <div className="opt-wiz-devprev-floating">
          <div className="opt-wiz-devprev-label">🧪 DEV PREVIEW · ZIP states</div>
          <div className="opt-wiz-devprev-segs">
            {[
              { id:"empty",   label:"Empty" },
              { id:"match",   label:"✓ Match" },
              { id:"error",   label:"⚠ Error" },
              { id:"nomatch", label:"⚠ No match" },
            ].map(s => (
              <button key={s.id} type="button" className={"opt-wiz-devprev-btn " + (zipDevState===s.id?"is-on":"")} onClick={()=>setZipDevState(s.id)}>{s.label}</button>
            ))}
          </div>
        </div>
      )}
      <div className="opt-wiz-drawer">
        <div className="opt-wiz-head">
          <div className="opt-wiz-head-text">
            <div className="opt-wiz-eyebrow">{pre ? "Edit opt-out" : "Create opt-out"} · Step {stepIdx + 1} of {totalSteps}</div>
            <h1 className="opt-wiz-title">
              {step === 1 ? "What's being opted out?"
              : step === 2 ? "At what level?"
              : step === 3 ? "Restrictions"
              : "Review and confirm"}
            </h1>
            <div className="opt-wiz-desc">
              {step === 1 ? "Choose whether you want to block a payment network, a delivery method, or both."
              : step === 2 ? "Move down for broader coverage. Pick the smallest level that solves the call."
              : step === 3 ? "Add optional amount and location filters. The opt-out only triggers when these match the payment."
              : "Review the opt-out below before creating it. Use Back if you need to change something."}
            </div>
            {context?.entityName && (
              <div className="opt-wiz-context">
                <span className="opt-wiz-context-prefix">Starting from</span>
                {context?.level && <LevelBadge level={context.level} size={16}/>}
                <b>{context.entityName}</b>
                {context?.zip && context.level !== "ZIP" && <> · ZIP <b>{context.zip}</b></>}
              </div>
            )}
          </div>
          <button className="opt-wiz-close" onClick={onClose} aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div className="opt-wiz-steps">
          {wizardSteps.map((n, i) => (
            <span key={n} className={"opt-wiz-step " + (step===n?"is-current":i<stepIdx?"is-done":"")}>
              <span className="opt-wiz-step-num">{i + 1}</span>
            </span>
          ))}
        </div>
        <div className="opt-wiz-body">
          {step === 1 && (

                  </span>
                  <span className="opt-wiz-radio-label"><b>Network</b><br/><span className="opt-wiz-radio-sub">Block one or more payment networks (VC, ACH, Check…)</span></span>
                </label>

                <div className="opt-wiz-confirm-row">
                  <span className="opt-wiz-confirm-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
                  </span>
                  <span className="opt-wiz-confirm-label">Level</span>
                  <span className="opt-wiz-confirm-val">{levelLabel} <span className="opt-wiz-confirm-sub">· {impact[level]}</span></span>
                </div>
                <div className="opt-wiz-confirm-row">
                  <span className="opt-wiz-confirm-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                  </span>
                  <span className="opt-wiz-confirm-label">Amount</span>
                  <span className="opt-wiz-confirm-val">
                    {amountOp === "any" ? <span className="opt-wiz-confirm-muted">Any amount</span>
                      : amount ? <>{amountOp === "gte" ? "≥" : "≤"} ${Number(amount).toLocaleString()}</>
                      : <span className="opt-wiz-confirm-muted">Not set</span>}
                  </span>
                </div>
                <div className="opt-wiz-confirm-row">
                  <span className="opt-wiz-confirm-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  </span>
                  <span className="opt-wiz-confirm-label">Location</span>
                  <span className="opt-wiz-confirm-val">
                    {zipValue || stateValue
                      ? <>{zipValue && <>ZIP {zipValue}</>}{zipValue && stateValue ? " · " : ""}{stateValue && <>State {stateValue}</>}</>
                      : <span className="opt-wiz-confirm-muted">No location restriction</span>}
                  </span>
                </div>
                <div className="opt-wiz-confirm-row">
                  <span className="opt-wiz-confirm-icon" aria-hidden="true">
                    {context?.level
                      ? <LevelBadge level={context.level} size={14}/>
                      : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>}
                  </span>
                  <span className="opt-wiz-confirm-label">Applies to</span>
                  <span className="opt-wiz-confirm-val">{context?.entityName || <span className="opt-wiz-confirm-muted">Whole provider</span>}</span>
                </div>
              </div>
            </div>
          )}
        </div>
        <div className="opt-wiz-foot">
          <button className="btn btn-quiet" onClick={onClose}>Cancel</button>
          <div className="opt-wiz-foot-right">
            {stepIdx > 0 && <button className="btn btn-quiet" onClick={goBack}>Back</button>}
            {stepIdx < totalSteps - 1 ? (
              <button className="btn btn-primary" disabled={!canNext} onClick={goNext}>Next</button>
            ) : (
              <button className="btn btn-confirm" onClick={()=>{
                wizardApi.addOptOut({
                  scopeKind, level,
                  scopeKindLabel, levelLabel,
                  amountOp, amount,
                  zipValue, stateValue,
                  entityName: context?.entityName,
                  entityLevel: context?.level,
                  network: "vc",
                });
                showOptOutToast({
                  scopeKindLabel, levelLabel,
                  entityName: context?.entityName,
                  kind: pre ? "updated" : "created",
                });
                onClose();
              }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                {pre ? "Confirm · Save changes" : "Confirm · Create opt-out"}
              </button>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

// Overview tab content — shared across ALL variants. Provider KPI strip
// at the top, then a Routing calculator CTA. In the future this is where
// richer provider insights (call history, recent payments, etc.) will go.
// Disbursements lifecycle — Eric's "Overview · Disbursements to Date" table
// re-imagined as 3 visual lifecycle cards (one per network). Keeps every
// data point from the original (Issued, Cleared, Cancelled, In Flight,
// Credit, Reissued, Aged, Aged-Reissued + avg days) but groups them by
// CSR intent: top barometer (issued + visual lifecycle bar), then a 2x3
// metric grid (success / pending / issues / recovery / aging). Color
// language matches the existing KPI strip so the page reads as one unit.
const DISBURSEMENT_DATA = [
  { id:"ach",   label:"ACH",          color:"#1E82CB",
    issued:{ c:245,   v:45890.25 }, cleared:{ c:198,   v:37245.80,  d:3.2 },
    inFlight:{ c:35,  v:6487.70,  d:1.8 }, cancelled:{ c:12, v:2156.75 },
    credit:{ c:8,     v:1234.50 }, reissued:{ c:15,    v:2890.45 },
    aged:{ c:23,      v:4125.30 }, agedReissued:{ c:4, v:750.25 } },
  { id:"vdc",   label:"Virtual card", color:"#FF612B",
    issued:{ c:1892,  v:234567.89 }, cleared:{ c:1534, v:189234.15, d:2.7 },
    inFlight:{ c:269, v:33766.29, d:2.1 }, cancelled:{ c:89, v:11567.45 },
    credit:{ c:45,    v:5678.90 }, reissued:{ c:127,   v:15890.75 },
    aged:{ c:156,     v:19234.60 }, agedReissued:{ c:32, v:3890.25 } },
  { id:"check", label:"Check",        color:"#15A796",
    issued:{ c:567,   v:89876.45 }, cleared:{ c:445,   v:69876.45,  d:4.1 },
    inFlight:{ c:88,  v:14123.33, d:3.5 }, cancelled:{ c:34, v:5234.78 },
    credit:{ c:19,    v:2890.15 }, reissued:{ c:52,    v:7456.90 },
    aged:{ c:67,      v:9652.95 }, agedReissued:{ c:12, v:1789.50 } },
];
function fmtMoney(n) {
  if (n >= 1_000_000) return "$" + (n/1_000_000).toFixed(1) + "M";
  if (n >= 1000)      return "$" + (n/1000).toFixed(1) + "k";
  return "$" + n.toFixed(0);
}
function fmtCount(n) { return n.toLocaleString(); }
function ProviderDisbursements() {
  // 3 layout previews. "comparison" is the canonical view (Eric's
  // feedback — the only one CSRs should see by default). "tabbed" /
  // "dense" are experimental and reachable through the DEV PREVIEW
  // panel at the top of the page via DisbLayoutContext.
  const { value: disbLayout } = useContext(DisbLayoutContext);
  const [disbTab, setDisbTab] = useState("all");
  const totalCount = DISBURSEMENT_DATA.reduce((s,n)=>s + n.issued.c, 0);
  const totalValue = DISBURSEMENT_DATA.reduce((s,n)=>s + n.issued.v, 0);
  return (
    <section className="prov-disb">
      <header className="prov-disb-head">
        <div>
          <h3 className="prov-disb-title">Disbursements to date</h3>
          <div className="prov-disb-sub">Lifecycle across enrolled networks</div>
        </div>
        <div className="prov-disb-total">
          <span className="prov-disb-total-val">{fmtMoney(totalValue)}</span>
          <span className="prov-disb-total-cnt">{fmtCount(totalCount)} disbursements</span>
        </div>
      </header>
      {disbLayout === "tabbed" && (
        <DisbTabbed activeTab={disbTab} setActiveTab={setDisbTab}/>
      )}
      {disbLayout === "dense" && (
        <DisbDense/>
      )}
      {disbLayout === "comparison" && (
      /* Comparison table — networks as rows, lifecycle stages as columns
          so the CSR can scan vertically ("which network has most aged?")
          AND horizontally ("how is ACH doing across the board?"). Each
          cell stacks count on top, $ value below. Aged column includes
          the reissued count inline (consolidates the original table's
          two aging columns without losing the number). */
      <div className="disb-table">
        <div className="disb-table-head">
          <div className="disb-th disb-th-net">Network</div>
          <div className="disb-th">
            <span className="disb-th-name">Issued</span>
            <span className="disb-th-hint">Total sent</span>
          </div>
          <div className="disb-th is-success">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Cleared
            </span>
            <span className="disb-th-hint">Completed payments</span>
          </div>
          <div className="disb-th is-pending">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              In flight
            </span>
            <span className="disb-th-hint">Sent, not yet cleared</span>
          </div>
          <div className="disb-th is-issue">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Cancelled
            </span>
            <span className="disb-th-hint">Voided before clearing</span>
          </div>
          <div className="disb-th is-recovery">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
              Reissued
            </span>
            <span className="disb-th-hint">Resent after failure</span>
          </div>
          <div className="disb-th is-recovery">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              Credit
            </span>
            <span className="disb-th-hint">Refunds + reversals</span>
          </div>
          <div className="disb-th is-aging">
            <span className="disb-th-name">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

        {DISBURSEMENT_DATA.map(n => {
          const clearedPct = Math.round((n.cleared.c / (n.issued.c || 1)) * 100);
          return (
            <div className="disb-tr" key={n.id}>
              <div className="disb-td disb-td-net">

              <div className="disb-td is-success">
                <div className="disb-num">{fmtCount(n.cleared.c)} <span className="disb-pct">{clearedPct}%</span></div>

// Aggregated top-level summary across all networks. Surfaces the
// rollup numbers (total issued / cleared / in flight / problems) as
// big KPI tiles plus a per-network ranking on the right.
function DisbAllSummary() {
  const agg = DISBURSEMENT_DATA.reduce((a, n) => ({
    issued:    { c:a.issued.c    + n.issued.c,    v:a.issued.v    + n.issued.v },
    cleared:   { c:a.cleared.c   + n.cleared.c,   v:a.cleared.v   + n.cleared.v },
    inFlight:  { c:a.inFlight.c  + n.inFlight.c,  v:a.inFlight.v  + n.inFlight.v },
    cancelled: { c:a.cancelled.c + n.cancelled.c, v:a.cancelled.v + n.cancelled.v },
    aged:      { c:a.aged.c      + n.aged.c,      v:a.aged.v      + n.aged.v },
    reissued:  { c:a.reissued.c  + n.reissued.c,  v:a.reissued.v  + n.reissued.v },
    credit:    { c:a.credit.c    + n.credit.c,    v:a.credit.v    + n.credit.v },
  }), { issued:{c:0,v:0}, cleared:{c:0,v:0}, inFlight:{c:0,v:0}, cancelled:{c:0,v:0}, aged:{c:0,v:0}, reissued:{c:0,v:0}, credit:{c:0,v:0} });
  const clearedPct = Math.round((agg.cleared.c / (agg.issued.c || 1)) * 100);
  return (
    <div className="disb-all">
      <div className="disb-all-tiles">
        <div className="disb-tile">
          <div className="disb-tile-label">Total issued</div>
          <div className="disb-tile-val">{fmtCount(agg.issued.c)}</div>
          <div className="disb-tile-sub">{fmtMoney(agg.issued.v)}</div>
        </div>
        <div className="disb-tile is-success">
          <div className="disb-tile-label">Cleared</div>
          <div className="disb-tile-val">{fmtCount(agg.cleared.c)} <span className="disb-tile-pct">{clearedPct}%</span></div>
          <div className="disb-tile-sub">{fmtMoney(agg.cleared.v)}</div>
        </div>
        <div className="disb-tile is-pending">
          <div className="disb-tile-label">In flight</div>
          <div className="disb-tile-val">{fmtCount(agg.inFlight.c)}</div>
          <div className="disb-tile-sub">{fmtMoney(agg.inFlight.v)}</div>
        </div>
        <div className="disb-tile is-issue">
          <div className="disb-tile-label">Cancelled</div>
          <div className="disb-tile-val">{fmtCount(agg.cancelled.c)}</div>
          <div className="disb-tile-sub">{fmtMoney(agg.cancelled.v)}</div>
        </div>
        <div className="disb-tile is-aging">
          <div className="disb-tile-label">Aged</div>
          <div className="disb-tile-val">{fmtCount(agg.aged.c)}</div>
          <div className="disb-tile-sub">{fmtMoney(agg.aged.v)}</div>
        </div>
        <div className="disb-tile">
          <div className="disb-tile-label">Reissued + Credit</div>
          <div className="disb-tile-val">{fmtCount(agg.reissued.c + agg.credit.c)}</div>
          <div className="disb-tile-sub">{fmtMoney(agg.reissued.v + agg.credit.v)}</div>
        </div>
      </div>
      <div className="disb-all-ranking">
        <div className="disb-rank-title">By network</div>
        {DISBURSEMENT_DATA.map(n => {
          const pct = Math.round((n.issued.c / agg.issued.c) * 100);
          return (
            <div className="disb-rank-row" key={n.id}>
              <span className="disb-rank-name">
                <span className="disb-net-dot" style={{background:n.color}}/>
                {n.label}

                <div className="disb-rank-bar-fill" style={{width: pct + "%", background:n.color}}/>

              <span className="disb-rank-pct">{pct}%</span>

  );
}

// Per-network deep-dive — every lifecycle metric exposed in a clean
// 2-column key/value grid grouped by intent (volume, performance,
// problems, recovery, aging). No data hidden, no cell ambiguous.
function DisbNetworkDetail({ net }) {
  if (!net) return null;
  const total = net.issued.c || 1;
  const pct = (c) => Math.round((c / total) * 100);
  const groups = [
    { title:"Volume", tone:"neutral", rows:[
      { label:"Issued",          count:net.issued.c,    value:net.issued.v,    extra:null },
    ]},
    { title:"Performance", tone:"success", rows:[
      { label:"Cleared",         count:net.cleared.c,   value:net.cleared.v,   extra:`${pct(net.cleared.c)}% · ${net.cleared.d}d avg to clear` },
      { label:"In flight",       count:net.inFlight.c,  value:net.inFlight.v,  extra:`${pct(net.inFlight.c)}% · ${net.inFlight.d}d avg in flight` },
    ]},
    { title:"Problems", tone:"issue", rows:[
      { label:"Cancelled",       count:net.cancelled.c, value:net.cancelled.v, extra:`${pct(net.cancelled.c)}% of issued` },
      { label:"Aged",            count:net.aged.c,      value:net.aged.v,      extra:`${net.agedReissued.c} reissued from aged set` },
    ]},
    { title:"Recovery", tone:"recovery", rows:[
      { label:"Reissued",        count:net.reissued.c,  value:net.reissued.v,  extra:null },
      { label:"Credit",          count:net.credit.c,    value:net.credit.v,    extra:null },
    ]},
  ];
  return (
    <div className="disb-detail">
      <div className="disb-detail-head">
        <div className="disb-detail-net">
          <span className="disb-net-dot" style={{background:net.color}}/>
          <span>{net.label}</span>
        </div>
        <div className="disb-detail-headline">
          <span className="disb-detail-count">{fmtCount(net.issued.c)}</span>
          <span className="disb-detail-val">{fmtMoney(net.issued.v)} issued total</span>
        </div>
      </div>
      <div className="disb-detail-groups">
        {groups.map(g => (
          <div className={"disb-detail-group is-" + g.tone} key={g.title}>
            <div className="disb-detail-group-title">{g.title}</div>
            {g.rows.map(r => (
              <div className="disb-detail-row" key={r.label}>
                <div className="disb-detail-label">{r.label}</div>
                <div className="disb-detail-vals">
                  <div className="disb-detail-num">{fmtCount(r.count)}</div>
                  <div className="disb-detail-sub">{fmtMoney(r.value)}{r.extra ? <> · {r.extra}</> : null}</div>
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// Variant D — Routing calculator modal. Lets the CSR run a "what would
// happen if we tried to send this payment" scenario (state, sub-payer,
// amount) and see which network would handle it. Built for the Liz
// persona: "are you SURE I won't be getting any more virtual cards?".
// Custom select for the Routing calculator form. Native <select> opens an
// OS-styled menu (Chrome's chrome on macOS, Safari's, Windows' …) which
// reads as broken in an otherwise on-brand form. This component renders
// an input-like trigger and a popover menu styled to match the rest of
// the design system, with check + hover states per option, keyboard
// close on Escape, and outside-click dismiss.
function CalcSelect({ value, options, onChange, ariaLabel }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);
  return (
    <div className="calc-select" ref={ref}>
      <button
        type="button"
        className={"calc-select-trigger " + (open ? "is-open" : "")}
        aria-label={ariaLabel}
        aria-expanded={open}
        onClick={()=>setOpen(o=>!o)}
      >
        <span className="calc-select-value">{value}</span>
        <svg className="calc-select-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      {open && (
        <div className="calc-select-menu" role="listbox">
          {options.map(opt => (
            <button
              key={opt}
              type="button"
              role="option"
              aria-selected={opt === value}
              className={"calc-select-item " + (opt === value ? "is-selected" : "")}
              onClick={()=>{ onChange(opt); setOpen(false); }}
            >
              <span className="calc-select-item-label">{opt}</span>
              {opt === value && (
                <svg className="calc-select-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              )}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function RoutingCalculatorModal({ onClose }) {
  const [state, setState] = useState("CA");
  const [subPayer, setSubPayer] = useState("UHC Commercial");
  const [amount, setAmount] = useState(2500);
  // Additional Preferencing inputs per Eric's feedback ("This Routing
  // calculator needs to be more robust and take into account all of our
  // Preferencing inputs"). Light pass — wires NPI, ZIP and Sub-account
  // into the form. Trace logic still mocked; will be tuned with Eric.
  const [subAccount, setSubAccount] = useState("Neighborhood Health Partnership Inc.");
  const [npi, setNpi]               = useState("1417224445");
  const [zip, setZip]               = useState("33012");
  // Mock evaluation against the active rules for Judge Kulas.
  const result = useMemo(() => {
    const trace = [];
    // VC step
    if (state === "TX") {
      trace.push({ net:"vc", verdict:"blocked", why:"State = TX (Global rule)" });
    } else if (subPayer === "Medicaid" || subPayer === "Medicare") {
      trace.push({ net:"vc", verdict:"blocked", why:"CLP06 = Medicaid/Medicare (Sub-payer)" });
    } else if (amount > 10000) {
      trace.push({ net:"vc", verdict:"blocked", why:"Amount over $10,000 cap (Global)" });
    } else if (zip === "33014") {
      trace.push({ net:"vc", verdict:"blocked", why:"ZIP 33014 opted out of VC (ZIP rule)" });
    } else if (subPayer === "UHC Commercial") {
      trace.push({ net:"vc", verdict:"deprioritized", why:"ACH+ preferred (Sub-payer rule)" });
    } else {
      trace.push({ net:"vc", verdict:"would-route", why:"All checks passed" });
    }
    // ACH+ step
    const vcOk = trace[0].verdict === "would-route";
    if (!vcOk) {
      trace.push({ net:"achp", verdict:"would-route", why:subPayer === "UHC Commercial" ? "Promoted by Sub-payer rule" : "Next in cascade" });
    }
    const winner = trace.find(t => t.verdict === "would-route");
    return { trace, winner };
  }, [state, subPayer, amount, subAccount, npi, zip]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card calc-card" onClick={e=>e.stopPropagation()} style={{maxWidth:640}}>
        <div className="calc-head">
          <div className="calc-head-title">
            <h3>Routing calculator</h3>
            <div className="calc-sub">Simulate where a payment would route given the current rules.</div>
          </div>
          <button className="calc-close" onClick={onClose} aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div className="calc-grid">
          <div>
            <div className="field-label sub">Sub-account</div>
            <CalcSelect value={subAccount} onChange={setSubAccount} ariaLabel="Sub-account" options={[
              "Neighborhood Health Partnership Inc.",
              "UHC Benefits Plan of California",
              "UHC Ins. Co. of the River Valley",
              "Medica Minnesota",
            ]}/>
          </div>
          <div>
            <div className="field-label sub">NPI</div>
            <input className="text-input sm" value={npi} onChange={e=>setNpi(e.target.value)}/>
          </div>
          <div>
            <div className="field-label sub">Sub-payer</div>
            <CalcSelect value={subPayer} onChange={setSubPayer} ariaLabel="Sub-payer" options={["UHC Commercial","Medicare","Medicaid","Other"]}/>
          </div>
          <div>
            <div className="field-label sub">State</div>
            <CalcSelect value={state} onChange={setState} ariaLabel="State" options={["CA","TX","NY","FL","MT"]}/>
          </div>
          <div>
            <div className="field-label sub">ZIP</div>
            <input className="text-input sm" value={zip} onChange={e=>setZip(e.target.value)} maxLength="5"/>
          </div>
          <div>
            <div className="field-label sub">Amount (USD)</div>
            <input className="text-input sm" type="number" value={amount} onChange={e=>setAmount(Number(e.target.value)||0)}/>
          </div>
        </div>
        <div className="calc-result">
          <div className="calc-result-head">
            {result.winner ? (
              <>
                <span className="calc-result-label">This payment would route via</span>
                <span className="calc-winner">
                  <span className={"dot " + dotFor(result.winner.net)}/>
                  {NET_BY_ID[result.winner.net].label}
                </span>
              </>
            ) : (
              <span className="calc-result-label">No network would accept this payment.</span>
            )}
          </div>
          <ol className="calc-trace">
            {result.trace.map((t,i) => (
              <li key={i} className={"calc-trace-row is-" + t.verdict}>
                <span className="calc-trace-num">{i+1}</span>
                <span className="calc-trace-net">
                  <span className={"dot " + dotFor(t.net)}/>
                  {NET_BY_ID[t.net].label}
                </span>
                <span className={"calc-trace-verdict v-" + t.verdict}>
                  {t.verdict === "would-route" ? "✓ Routes here"
                  : t.verdict === "blocked"     ? "⊘ Blocked"
                  : "↓ Deprioritized"}
                </span>
                <span className="calc-trace-why">{t.why}</span>
              </li>
            ))}
          </ol>
        </div>
        <div className="calc-footer">
          <button className="btn btn-quiet" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// Success toast (forms.md) — confirms task completion (save / apply edit).
// Auto-dismisses after ~5s, has a close button, and carries no critical
// info, so it stays accessible. role="status" announces politely. Keyed on
// toast.id so re-firing the same message re-triggers the slide-in.
function Toast({ toast, onClose }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onClose, 5000);
    return () => clearTimeout(t);
  }, [toast && toast.id]);
  if (!toast) return null;
  return ReactDOM.createPortal(
    <div className="save-toast-wrap">
      <div className="save-toast" role="status" key={toast.id}>
        <span className="save-toast-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16 9 11 14 8 11"/></svg>
        </span>
        <span className="save-toast-msg">{toast.msg}</span>
        <button className="save-toast-close" onClick={onClose} aria-label="Dismiss">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>,
    document.body
  );
}

function App() {

  // pre-fill values. null when closed.
  const [wizardCtx, setWizardCtx] = useState(null);
  // Session-level store of opt-outs created via the wizard. Pre-seeded
  // with a couple per sub-account so the variant has visible items from
  // the start and the CSR can immediately see the edit/remove flow.

    { id:"opt-seed-1", createdAt:Date.now()-100000, entityName:"Neighborhood Health Partnership Inc.", entityLevel:"Sub-account", level:"sub-account", scopeKind:"network", scopeKindLabel:"Network", levelLabel:"Sub-account", amountOp:"gte", amount:"5000", zipValue:"", stateValue:"", network:"vc" },
    { id:"opt-seed-2", createdAt:Date.now()-100000, entityName:"Neighborhood Health Partnership Inc.", entityLevel:"Sub-account", level:"sub-account", scopeKind:"distribution", scopeKindLabel:"Distribution", levelLabel:"Sub-account", amountOp:"any", amount:"", zipValue:"", stateValue:"FL", network:"vc" },
    { id:"opt-seed-3", createdAt:Date.now()-100000, entityName:"UHC Benefits Plan of California", entityLevel:"Sub-account", level:"sub-account", scopeKind:"network", scopeKindLabel:"Network", levelLabel:"Sub-account", amountOp:"any", amount:"", zipValue:"", stateValue:"", network:"vc" },
    { id:"opt-seed-4", createdAt:Date.now()-100000, entityName:"UHC Ins. Co. of the River Valley", entityLevel:"Sub-account", level:"sub-account", scopeKind:"network", scopeKindLabel:"Network", levelLabel:"Sub-account", amountOp:"lte", amount:"100", zipValue:"", stateValue:"", network:"vc" },
    { id:"opt-seed-5", createdAt:Date.now()-100000, entityName:"Medica Minnesota", entityLevel:"Sub-account", level:"sub-account", scopeKind:"both", scopeKindLabel:"Network and Distribution", levelLabel:"Sub-account", amountOp:"any", amount:"", zipValue:"", stateValue:"", network:"vc" },
    // Account-level examples so the default All tab shows opt-outs on
    // visible Account rows without having to drill into sub-accounts.
    { id:"opt-seed-6", createdAt:Date.now()-100000, entityName:"UnitedHealthcare IC and its Affiliates", entityLevel:"Account", level:"account", scopeKind:"network", scopeKindLabel:"Network", levelLabel:"Account", amountOp:"gte", amount:"10000", zipValue:"", stateValue:"", network:"vc" },
    { id:"opt-seed-7", createdAt:Date.now()-100000, entityName:"Oxford Health Plans", entityLevel:"Account", level:"account", scopeKind:"distribution", scopeKindLabel:"Distribution", levelLabel:"Account", amountOp:"any", amount:"", zipValue:"", stateValue:"NY", network:"vc" },
    { id:"opt-seed-8", createdAt:Date.now()-100000, entityName:"Harvard Pilgrim Health Care Inc.", entityLevel:"Account", level:"account", scopeKind:"network", scopeKindLabel:"Network", levelLabel:"Account", amountOp:"any", amount:"", zipValue:"", stateValue:"", network:"vc" },
  ]);
  const wizardApi = useMemo(() => ({
    open: (ctx) => setWizardCtx(ctx || {}),
    addOptOut: (item) => {
      const newItem = { id:"opt-" + Date.now(), createdAt:Date.now(), ...item };
      setOptOuts(arr => [...arr, newItem]);
      return newItem;
    },
    removeOptOut: (id) => {
      const removed = optOuts.find(o => o.id === id);
      setOptOuts(arr => arr.filter(o => o.id !== id));
      if (removed) {
        showOptOutToast({
          kind:"removed",
          scopeKindLabel: removed.scopeKindLabel,
          levelLabel: removed.levelLabel,
          entityName: removed.entityName,
        });
      }
    },
    optOuts,
  }), [optOuts]);
  // Overview layout — Comparison is the default that all users see; the
  // segmented switcher to swap into Tabbed or Dense lives behind the top
  // DEV PREVIEW panel and is wired through DisbLayoutContext.
  const [disbLayout, setDisbLayout] = useState("comparison");
  const disbLayoutApi = useMemo(() => ({ value: disbLayout, setValue: setDisbLayout }), [disbLayout]);
  return (
    <EditorStyleContext.Provider value={state.editorStyle}>
    <OptOutWizardContext.Provider value={wizardApi}>
    <DisbLayoutContext.Provider value={disbLayoutApi}>
    <div>
      <DevPanel state={state} dispatch={dispatch}/>
      <Chrome variant={state.variant}>
        {/* Wrap each phase in a keyed .phase-page so the enter animation
            fires whenever state.phase changes (React remounts on key flip). */}
        <div key={state.phase} className="phase-page">
          {state.phase==="edit" && (
            <>
              {state.variant==="table"         && <VariantTable state={state} dispatch={dispatch}/>}
              {state.variant==="routing-aware" && (
                <RoutingAwareContext.Provider value={true}>
                  <VariantTable state={state} dispatch={dispatch}/>
                </RoutingAwareContext.Provider>
              )}
              {state.variant==="routing-rollup" && (
                <RoutingAwareContext.Provider value={true}>
                  <VariantTable state={state} dispatch={dispatch}/>
                </RoutingAwareContext.Provider>
              )}
              {state.variant==="opt-in"        && (
                <OptInOutContext.Provider value={true}>
                  <VariantOptInOut state={state} dispatch={dispatch}/>
                </OptInOutContext.Provider>
              )}
              {state.variant==="persona"       && (
                <RoutingAwareContext.Provider value={true}>
                  <VariantTable state={state} dispatch={dispatch}/>
                </RoutingAwareContext.Provider>

              {state.variant==="unified"       && (
                <RoutingAwareContext.Provider value={true}>

                  </UnifiedContext.Provider>

              {state.variant==="routing"       && <VariantRouting  state={state} dispatch={dispatch}/>}
              {state.variant==="trace"         && <VariantTrace    state={state} dispatch={dispatch}/>}
              <ReviewBar state={state} dispatch={dispatch}/>
            </>

          {state.phase==="review"   && <PageReview   state={state} dispatch={dispatch}/>}
          {state.phase==="impacted" && <PageImpacted state={state} dispatch={dispatch}/>}
          {state.phase==="done"     && <PageDone     state={state} dispatch={dispatch}/>}
        </div>

      {wizardCtx && <OptOutWizard context={wizardCtx} onClose={()=>setWizardCtx(null)}/>}
      <Toast toast={state.toast} onClose={()=>dispatch({type:"dismissToast"})}/>
    </div>
    </DisbLayoutContext.Provider>
    </OptOutWizardContext.Provider>
    </EditorStyleContext.Provider>
  );
}
