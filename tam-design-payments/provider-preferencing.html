      </div>
      <div className="unified-devprev-segs">
        <button type="button"
          className={"unified-devprev-seg " + (value === false ? "is-on" : "")}
          onClick={()=>onChange(false)}>
          Full
        </button>
        <button type="button"
          className={"unified-devprev-seg " + (value === true ? "is-on" : "")}
          onClick={()=>onChange(true)}>
          Simplified
        </button>
      </div>
      <div className="unified-devprev-hint">
        {value === false
          ? "All / Accounts / Sub-accounts / Locations / NPI visible + Edit drawer with Network/Distribution sub-tabs."
          : "Only Sub-accounts tab + Edit drawer stacked (no sub-tabs)."}

}

// ─────────────────────────────────────────────────────────────────────
// Variant B — Drill in
// ─────────────────────────────────────────────────────────────────────
function VariantDrill({ state, dispatch }) {
  const path = state.drillPath;
  const root = { id:"__root__", name:"All payers", children: state.tree };
  let current = root;
  const crumbs = [{ id:"__root__", name:"All payers" }];
  for (const id of path) {
    const f = find(current.children || [], id); if (!f) break;
    current = f; crumbs.push({ id:f.id, name:f.name, level:f.level });
  }
  const items = current.children || [];
  const filtered = useMemo(() => items.filter(it => hasActiveFilters(state.filters) ? matchesFilters(it, state) : true), [items, state]);
  const visibleIds = filtered.map(r => r.id);
  const editingCurrent = state.editingId === current.id;

  return (
    <div>
      <div className="surface px-5 py-4 mb-4 relative">
        <div className="flex items-center gap-2 flex-wrap">
          {crumbs.map((c, i) => (
            <Fragment key={c.id}>
              {i>0 && <span className="crumb-sep">/</span>}
              <button className="crumb-chip" onClick={()=>dispatch({type:"drillTo", path: path.slice(0, i)})}>
                {c.level && <LevelBadge level={c.level} size={22}/>}
                <span className="text-[13px] font-medium">{c.name}</span>
              </button>
            </Fragment>
          ))}
        </div>
        {current.id !== "__root__" && (
          <div className="mt-4 border-t line pt-4 flex items-center gap-4">
            <LevelBadge level={current.level} size={44}/>
            <div className="flex-1">
              <div className="text-[11px] uppercase tracking-wider ink-2 font-semibold">Current scope · {current.level}</div>
              <div className="text-lg font-semibold">{current.name}</div>
              <div className="text-xs ink-2 mt-0.5">
                {current.net === "vc" ? <>Max ${Number(current.max).toLocaleString()} · {current.dist}{current.dist==="Fax" && current.fax ? ` · Fax ${current.fax}` : ""}</> : <span>—</span>}
                · {countDescendants(current)} descendant{countDescendants(current)===1?"":"s"} will inherit
              </div>
            </div>
            <div className="flex items-center gap-3 relative">
              <div>
                <div className="text-[11px] uppercase tracking-wider ink-2">Current network</div>
                <div className="mt-1">
                  {state.editedIds.has(current.id) || state.inheritedIds.has(current.id)
                    ? <span className="change-applied"><NetLabel id={state.originalNet[current.id]} mute/><span className="arrow">→</span><NetLabel id={current.net} bold/></span>
                    : <NetLabel id={current.net} bold/>}
                </div>
              </div>
              <button className={"change-trigger " + (editingCurrent?"on":"")} onClick={()=>dispatch({type:"openEdit", id:current.id})}>
                Edit preferences
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              {editingCurrent && (
                <EditPopover node={current} parents={crumbs.slice(1, -1)} overridesAtRisk={overridesIn(current)} overrides={overrideListIn(current)} onCancel={()=>dispatch({type:"closeEdit"})} onApply={(d)=>dispatch({type:"applyEdit", id:current.id, draft:d})} anchorRight/>
              )}
            </div>
          </div>
        )}
      </div>

      <Toolbar state={state} dispatch={dispatch} total={items.length} shown={filtered.length} visibleIds={visibleIds}
        placeholder={`Search within ${current.id==="__root__" ? "all payers" : current.name}…`}/>
      <QuickFilters state={state} dispatch={dispatch}/>

      {filtered.length > 0 ? (
        <div className="surface overflow-visible">
          <div className="head-strip">
            <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type:e.target.checked ? "selectMany":"clearSelection", ids:visibleIds})}/></div>
            <div></div><div></div>
            <div>Entity</div>
            <div>
              <span>Fulfillment network</span>
              <ColumnFilter kind="nets" options={NETS.map(n=>({id:n.id,label:n.label}))} state={state} dispatch={dispatch}
                renderOpt={(o)=><span className="net"><span className={"dot "+dotFor(o.id)}/><span>{o.label}</span></span>}/>
            </div>
            <div style={{justifyContent:"flex-end"}}>Action</div>
          </div>
          {filtered.map(it => {
            const edited = state.editedIds.has(it.id);
            const inherited = state.inheritedIds.has(it.id);
            const selected = state.selected.has(it.id);
            const orig = state.originalNet[it.id];
            const editing = state.editingId === it.id;
            return (
              <div key={it.id} className={`row ${edited?"is-edited":""} ${inherited?"is-inherited":""} ${selected?"is-selected":""}`}>
                <span className="left-edge"></span>
                <div><input type="checkbox" checked={selected} onChange={()=>dispatch({type:"toggleSelect", id:it.id})}/></div>
                <div>{it.children && it.children.length>0 && (
                  <button className="chev open" onClick={()=>dispatch({type:"drillInto", id:it.id})}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                  </button>
                )}</div>
                <LevelBadge level={it.level} size={32}/>
                <div>
                  <div className="mb-0.5"><LevelLabel level={it.level}/></div>
                  <div className="name">{it.name}</div>
                  <div className="meta">
                    {it.net==="vc" ? <>Max ${Number(it.max).toLocaleString()} · {it.dist}</> : <span className="ink-3">Payment program preferences only</span>}
                    {it.children && it.children.length>0 && <span className="ml-2">· {it.children.length} {it.children[0].level.toLowerCase()}{it.children.length>1?"s":""}</span>}
                  </div>
                </div>
                <div>
                  {(edited||inherited) && orig ? <span className="change-applied"><NetLabel id={orig} mute/><span className="arrow">→</span><NetLabel id={it.net} bold/></span> : <NetLabel id={it.net}/>}
                </div>
                <div className="action">
                  <button className={"change-trigger " + (editing?"on":"")} onClick={()=>dispatch({type:"openEdit", id:it.id})}>Edit</button>
                  {it.children && it.children.length>0 && <button className="btn-ghost ml-2 text-[13px]" onClick={()=>dispatch({type:"drillInto", id:it.id})}>Drill →</button>}
                  {editing && <EditPopover node={it} parents={crumbs.slice(1)} overridesAtRisk={overridesIn(it)} overrides={overrideListIn(it)} onCancel={()=>dispatch({type:"closeEdit"})} onApply={(d)=>dispatch({type:"applyEdit", id:it.id, draft:d})} anchorRight/>}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div className="surface p-10 text-center text-sm ink-2">{items.length===0 ? "This is a leaf — change preferences above or step back." : "No matches at this level."}</div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Variant C — Decision flow (with multi-scope select)
// ─────────────────────────────────────────────────────────────────────
const INTENTS = [
  { id:"opt-out-vc",  label:"Opt out of Virtual Card",  body:"Provider doesn't want virtual cards anymore. We'll suggest the next eligible network.", target:"check" },
  { id:"switch-ach",  label:"Enroll in ACH or ACH+",    body:"Provider wants digital deposit instead of card or check.", target:"ach" },
  { id:"change-dist", label:"Change distribution",      body:"Switch how Virtual Card payments are delivered (Fax vs Mail) without changing the network.", target:"vc" },
  { id:"update-max",  label:"Update max amount",        body:"Cap when Virtual Card can be used. Above the cap, the next network is used.", target:"vc" },
  { id:"other",       label:"Something else",           body:"For requests that don't fit any of the above.", target:null },
];

function VariantFlow({ state, dispatch }) {
  const intent = INTENTS.find(i => i.id === state.flowIntent);
  const flat = useMemo(()=>flatten(state.tree), [state.tree]);
  const filteredFlat = useMemo(() => flat.filter(n => hasActiveFilters(state.filters) ? matchesFilters(n, state) : true), [flat, state]);
  const visibleIds = filteredFlat.map(n=>n.id);
  const scopeArr = Array.from(state.flowScopeIds);
  const totalAffected = scopeArr.reduce((acc, id) => {
    const n = find(state.tree, id); return acc + 1 + (n ? countDescendants(n) : 0);
  }, 0);

  return (
    <div>
      <div className="surface px-5 py-4 mb-4 flex items-center gap-3">
        {["Intent","Scope","Confirm"].map((s, i) => (
          <Fragment key={s}>
            <span className="flex items-center gap-2">
              <span style={{ width:24, height:24, borderRadius:999, display:"inline-flex", alignItems:"center", justifyContent:"center", background: i<state.flowStep ? "var(--check)" : i===state.flowStep ? "var(--navy)" : "var(--line)", color: i<=state.flowStep ? "#fff" : "var(--ink-2)", fontSize:12, fontWeight:700 }}>{i<state.flowStep ? "✓" : i+1}</span>
              <span className={"text-[13px] " + (i===state.flowStep ? "ink font-semibold" : "ink-2")}>{s}</span>
            </span>
            {i<2 && <span className="flex-1 border-t line"/>}
          </Fragment>
        ))}
      </div>

      {state.flowStep === 0 && (
        <div>
          <div className="text-base font-semibold mb-3">What does the provider want to change?</div>
          <div className="grid grid-cols-2 gap-3">
            {INTENTS.map(it => (
              <div key={it.id} className={"tile " + (state.flowIntent===it.id?"sel":"")} onClick={()=>dispatch({type:"flowSetIntent", val:it.id})}>
                <div className="font-semibold">{it.label}</div>
                <div className="text-[13px] ink-2 mt-1">{it.body}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {state.flowStep === 1 && (
        <div>
          <div className="text-base font-semibold mb-1">Where should the change apply?</div>
          <div className="text-[13px] ink-2 mb-3">Search, filter or scroll. You can select one row or many — a change at a higher level cascades to descendants.</div>
          <Toolbar state={state} dispatch={dispatch} total={flat.length} shown={filteredFlat.length} visibleIds={visibleIds} placeholder="Search account, sub-account or ZIP…"/>
          <QuickFilters state={state} dispatch={dispatch}/>

          <div className="grid gap-2">
            {filteredFlat.map(n => {
              const sel = state.flowScopeIds.has(n.id);
              return (
                <div key={n.id} onClick={()=>dispatch({type:"flowToggleScope", id:n.id})}
                  className={"surface flex items-center gap-3 p-3 cursor-pointer transition " + (sel ? "border-[var(--navy)] bg-[var(--navy-soft)]" : "")}
                  style={{ marginLeft: hasActiveFilters(state.filters) ? 0 : n.depth * 24, borderColor: sel ? "var(--navy)" : undefined }}>
                  <input type="checkbox" checked={sel} onChange={()=>dispatch({type:"flowToggleScope", id:n.id})} onClick={e=>e.stopPropagation()}/>
                  <LevelBadge level={n.level} size={32}/>
                  <div className="flex-1">
                    <div className="mb-0.5"><LevelLabel level={n.level}/></div>
                    <div className="name">{n.name}</div>
                    <div className="meta">
                      Currently <NetLabel id={n.net}/>
                      {countDescendants(n)>0 && <span className="ml-2">· cascades to {countDescendants(n)} descendant{countDescendants(n)===1?"":"s"}</span>}
                      {hasActiveFilters(state.filters) && n.parents.length > 0 && <span className="ml-2 path">in {n.parents.map(p=>p.name).join(" › ")}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex items-center justify-between gap-2 mt-4">
            <div className="text-[13px] ink-2">{scopeArr.length === 0 ? "No scope selected" : <><b>{scopeArr.length}</b> scope{scopeArr.length>1?"s":""} selected · ~{totalAffected} row{totalAffected>1?"s":""} affected including descendants</>}</div>
            <div className="flex items-center gap-2">
              {scopeArr.length > 0 && <button className="btn-ghost text-[13px]" onClick={()=>dispatch({type:"flowClearScope"})}>Clear</button>}
              <button className="btn btn-quiet" onClick={()=>dispatch({type:"flowBack"})}>Back</button>
              <button className="btn btn-primary" disabled={scopeArr.length===0} onClick={()=>{ if (intent && intent.target) dispatch({type:"flowSetTarget", val: intent.target}); dispatch({type:"flowNext"}); }}>Continue →</button>
            </div>
          </div>
        </div>
      )}

      {state.flowStep === 2 && intent && scopeArr.length > 0 && (
        <div>
          <div className="text-base font-semibold mb-1">Confirm and apply</div>
          <div className="text-[13px] ink-2 mb-4">Here's what will change. Pick the destination network and we'll cascade to {totalAffected - scopeArr.length} descendant{(totalAffected-scopeArr.length)===1?"":"s"}.</div>

          <div className="surface p-4 mb-4">
            <div className="text-[11px] uppercase tracking-wider ink-2 font-semibold mb-2">Selected scopes</div>
            <div className="grid gap-2">
              {scopeArr.map(id => {
                const n = find(state.tree, id); if (!n) return null;
                return (
                  <div key={id} className="flex items-center gap-3">
                    <LevelBadge level={n.level} size={28}/>
                    <div className="flex-1">
                      <div className="flex items-baseline gap-2"><LevelLabel level={n.level}/><span className="name text-[14px]">{n.name}</span></div>
                      <div className="meta">Currently <NetLabel id={n.net}/> {countDescendants(n)>0 && <span className="ml-1">· cascades {countDescendants(n)}</span>}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="text-[11px] uppercase tracking-wider ink-2 mb-2">Change to</div>
          <div className="grid grid-cols-5 gap-2 mb-5">
            {NETS.map(n => {
              const sel = state.flowTargetNet === n.id;
              return (
                <button key={n.id} onClick={()=>dispatch({type:"flowSetTarget", val:n.id})}
                  className={"tile text-left " + (sel ? "sel" : "")}>
                  <span className="net"><span className={"dot "+dotFor(n.id)}/><span className="font-semibold">{n.label}</span></span>
                  <div className="text-[11px] ink-2 mt-1">{n.sub}</div>
                </button>
              );
            })}
          </div>

          <div className="flex items-center justify-end gap-2">
            <button className="btn btn-quiet" onClick={()=>dispatch({type:"flowBack"})}>Back</button>
            <button className="btn btn-primary" disabled={!state.flowTargetNet} onClick={()=>{
              const draft = { net: state.flowTargetNet, dist:"Mail", max:10000, fax:"" };
              dispatch({type:"applyBulkEdit", ids: scopeArr, draft});
              dispatch({type:"setPhase", val:"review"});
            }}>Apply change →</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Variant C — Opt-in / Opt-out
// Same hierarchy chrome as A/B (level tabs, exclusion rules, search,
// bulk select) but the data columns swap to: Virtual card preference
// (opted in/out) + Product enrollments (NPx ACH+, Settlement Advocate).
// Designed for the use case "is this provider accepting virtual cards,
// and which ACH products are they enrolled in?"
// ─────────────────────────────────────────────────────────────────────
function VariantOptInOut({ state, dispatch }) {
  const all = useMemo(() => flatten(state.tree), [state.tree]);
  const filtersOn = hasActiveFilters(state.filters);
  const rows = useMemo(() => {
    const matchSearch = (n) => {
      const q = (state.filters.search || "").trim().toLowerCase();
      if (!q) return true;
      return [n.name, n.uniqueId, n.payerSso, n.org].filter(Boolean)
        .some(v => String(v).toLowerCase().includes(q));
    };
    const matchLevel = (n) => state.filters.levels.size === 0 || state.filters.levels.has(n.level);
    if (filtersOn) {
      return all.filter(n => matchLevel(n) && matchSearch(n));
    }
    // Hierarchical: only render expanded rows
    const out = [];
    function walkRender(nodes) {
      for (const n of nodes) {
        if (matchSearch(n) || (n.children && n.children.some(c => matchSearch(c)))) out.push(n);
        if (n.children && state.expanded[n.id]) walkRender(n.children);
      }
    }
    walkRender(state.tree);
    return out;
  }, [state.tree, state.expanded, state.filters, filtersOn, all]);
  const visibleIds = rows.map(r => r.id);
  const anyExpanded = Object.values(state.expanded).some(Boolean);

  return (
    <div>
      <LevelTabs state={state} dispatch={dispatch}/>
      <ExclusionRulesSheet open={state.exclusionRulesOpen} onClose={()=>dispatch({type:"closeExclusionRules"})}/>
      <ExclusionDisclaimer dispatch={dispatch}/>
      <div className="flex items-center gap-2 mb-3">
        <div className="flex-1 min-w-0">
          <Toolbar state={state} dispatch={dispatch} total={all.length} shown={rows.length} visibleIds={visibleIds} hideLevelFilter/>
        </div>
        <QuickFilters state={state} dispatch={dispatch}/>
        {!filtersOn && state.filters.levels.size === 0 && (
          <button className="btn-icon-quiet" onClick={()=>dispatch({type: anyExpanded ? "collapseAll" : "expandAll"})}>
            {anyExpanded ? <>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>Collapse all
            </> : <>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Expand all
            </>}
          </button>
        )}
      </div>
      <div className="surface overflow-visible">
        <div className="head-strip head-optinout">
          <div><input type="checkbox" checked={visibleIds.length>0 && visibleIds.every(id => state.selected.has(id))} onChange={(e)=>dispatch({type: e.target.checked ? "selectMany":"clearSelection", ids: visibleIds })}/></div>
          <div></div><div></div>
          <div>Entity</div>
          <div>Virtual card preference</div>
          <div>Product enrollments</div>
          <div style={{justifyContent:"flex-end"}}>Action</div>
        </div>
        {rows.length === 0 ? (
          <div className="p-10 text-center ink-2">
            <div className="text-base font-semibold mb-1">No matches</div>
            <div className="text-[13px]">Try a different search or <button className="btn-ghost" onClick={()=>dispatch({type:"clearFilters"})}>clear filters</button>.</div>
          </div>
        ) : rows.map(r => (
          <OptInOutRow key={r.id} r={r} state={state} dispatch={dispatch} flat={filtersOn} hierarchical={!filtersOn}/>
        ))}
      </div>
    </div>
  );
}

// One row of the Opt-in/out table. Shares some structure with PrefRow
// (checkbox / chevron / level badge / entity cell) but the value columns
// are the new VC pref chip + product enrollment chips.
function OptInOutRow({ r, state, dispatch, flat, hierarchical }) {
  const selected = state.selected.has(r.id);
  const indentCls = flat ? "" : (r.depth === 1 ? "indent-1" : r.depth === 2 ? "indent-2" : "");
  const sectionCls = !flat && r.depth === 0 ? "account-row" : !flat && r.depth > 0 ? "child-row" : "";
  const editing = state.editingId === r.id;
  const editingCls = editing ? "is-editing-row" : "";
  const stateClass = selected ? "is-selected" : "";
  const vc = vcPreferenceFor(r);
  const enr = enrollmentsFor(r);
  const editorStyle = useContext(EditorStyleContext);
  const isDrawer = editorStyle === "drawer";
  const handleRowClick = isDrawer ? (e) => {
    if (e.target.closest("input, button, .clickable-cell, .change-trigger, .edit-pop, a")) return;
    if (state.editingId === r.id) return;
    dispatch({ type:"openEdit", id:r.id, scope:"all" });
  } : undefined;
  return (
    <div
      className={`row row-optinout ${indentCls} ${stateClass} ${sectionCls} ${editingCls} ${isDrawer ? "row-clickable" : ""}`}
      onClick={handleRowClick}
    >
      <span className="left-edge"></span>
      <div><input type="checkbox" checked={selected} onChange={()=>dispatch({type:"toggleSelect", id:r.id})}/></div>
      <div>
        {hierarchical && r.children && r.children.length > 0 ? (
          <button className={"chev "+(state.expanded[r.id]?"open":"")} onClick={()=>dispatch({type:"toggleExpand", id:r.id})}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        ) : <span/>}
      </div>
      <LevelBadge level={r.level} size={32}/>
      <div className="cell-entity min-w-0">
        <div className="mb-0.5"><LevelLabel level={r.level}/></div>
        <div className="name"><Highlight text={r.name} query={state.filters.search}/></div>
        <div className="meta-ids">
          {r.uniqueId && <span className="meta-id-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg><span className="id-val">{r.uniqueId}</span></span>}
          {r.org && <span className="meta-id-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V12h6v10"/><path d="M8 6h.01M8 10h.01M16 6h.01M16 10h.01"/></svg><span>{r.org}</span></span>}
        </div>
      </div>
      <div>
        {vc === "in" ? (
          <span className="vc-pref is-in">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Opted in
          </span>
        ) : (
          <span className="vc-pref is-out">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Opted out
          </span>
        )}
      </div>
      <div>
        {enr.ach_plus || enr.sa_ach ? (
          <span className="pe-list">
            {enr.ach_plus && <span className="pe-chip"><span className="dot"/>NPx ACH+</span>}
            {enr.sa_ach   && <span className="pe-chip"><span className="dot"/>Settlement Advocate</span>}
          </span>
        ) : (
          <span className="pe-empty" title="No enrollments">—</span>
        )}
      </div>
      <div className="action" onClick={(e)=>e.stopPropagation()}>
        <button
          className={"change-trigger " + (editing ? "on" : "") + (state.selected.size > 0 ? " is-bulk-dim" : "")}
          onClick={()=>dispatch({type:"openEdit", id:r.id, scope:"all"})}
        >Edit</button>
        {editing && (
          <EditPopover
            node={r}
            parents={r.parents || []}
            scope="all"
            overridesAtRisk={overridesIn(r)}
            overrides={overrideListIn(r)}
            onCancel={()=>dispatch({type:"closeEdit"})}
            onApply={(draft)=>{ dispatch({type:"applyEdit", id:r.id, draft }); dispatch({type:"showToast", id:Date.now(), msg:"Payment preferences updated"}); }}
            anchorRight
          />
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Variant B — Routing-aware
// Same hierarchy concept as A, but every Fulfillment cell expands into the
// full payer waterfall so the CSR sees not just "what's selected" but
// "what's the chain and where does it go on reissue". Read-only here; the
// edit affordance still opens the existing EditPopover/Drawer.
// ─────────────────────────────────────────────────────────────────────
function VariantRouting({ state, dispatch }) {
  const all = useMemo(() => flatten(state.tree), [state.tree]);
  const accounts = all.filter(n => n.level === "Account");
  return (
    <div>
      <div className="flex items-baseline justify-between mb-2">
        <h2 className="text-xl font-semibold">Routing-aware view</h2>
        <span className="text-[12px] ink-3">Each account shows its full waterfall · current fulfillment highlighted · click any chip to inspect</span>
      </div>
      <ExclusionDisclaimer dispatch={dispatch}/>
      <div className="surface overflow-visible">
        <div className="head-strip" style={{gridTemplateColumns:"32px 44px 1fr"}}>
          <div></div>
          <div></div>
          <div>Entity & waterfall</div>
        </div>
        {accounts.map(acc => <RoutingAccountRow key={acc.id} acc={acc} state={state} dispatch={dispatch}/>)}
      </div>
    </div>
  );
}

function RoutingAccountRow({ acc, state, dispatch }) {
  const [open, setOpen] = useState(false);
  // Mock per-payer waterfall — in reality, the order is configured by the
  // payer. For the prototype, we use the entity's priority list.
  const chain = acc.priority || DEFAULT_PRIORITY;
  // Rule firing — derived from the exclusion rules mock for demo purposes.
  // In a real system this would be the routing engine output per-payment.
  const exclusionMap = useMemo(() => {
    const m = {};
    EXCLUSION_RULES_MOCK.forEach(r => {
      if (r.status !== "Active") return;
      // Heuristic: VC rules exclude vc, OPTUMPAY rule excludes achp.
      if (/Virtual card/i.test(r.rule)) m["vc"] = r;
      if (/OPTUMPAY/i.test(r.rule))     m["achp"] = r;
    });
    return m;
  }, []);
  return (
    <div className="row routing-row" onClick={()=>setOpen(o=>!o)}>
      <span className="left-edge"></span>
      <div></div>
      <LevelBadge level="Account" size={32}/>
      <div className="min-w-0">
        <div className="flex items-baseline gap-2 mb-1">
          <span className="lvl-label account">Account</span>
          <span className="name">{acc.name}</span>
        </div>
        <div className="wf-trail">
          {chain.map((id, i) => {
            const isCurrent = id === acc.net;
            const excludedBy = exclusionMap[id];
            return (
              <Fragment key={id}>
                {i > 0 && <span className="wf-arrow">→</span>}
                <span className={"wf-chip " + (isCurrent ? "current " : "") + (excludedBy && !isCurrent ? "excluded" : "")}>
                  <span className={"dot " + dotFor(id)}/>
                  <span>{NET_BY_ID[id].label}</span>
                  {isCurrent && <span className="wf-tag">FULFILLMENT</span>}
                </span>
              </Fragment>
            );
          })}
        </div>
        {open && (
          <div className="wf-detail">
            <div className="wf-section-label">Why this routing</div>
            {chain.map(id => {
              const isCurrent = id === acc.net;
              const excludedBy = exclusionMap[id];
              return (
                <div key={id} className="wf-reason">
                  <span className={"dot " + dotFor(id)}/>
                  <span className="wf-r-name">{NET_BY_ID[id].label}</span>
                  {isCurrent ? (
                    <span className="wf-r-status ok">✓ Selected — provider enrolled, no rule excludes</span>
                  ) : excludedBy ? (
                    <span className="wf-r-status excluded">✕ Excluded by {excludedBy.scope === "Global" ? "Global rule" : excludedBy.scope === "Account" ? "Provider opt-out" : "Sub-payer rule"}</span>
                  ) : (
                    <span className="wf-r-status fallback">⤵ Available as next fallback</span>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div className="action" onClick={(e)=>e.stopPropagation()}>
        <button className="change-trigger" onClick={()=>dispatch({type:"openEdit", id:acc.id})}>Edit</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Variant C — Payment-trace
// Inverts the entry point: the CSR starts by selecting an in-flight payment
// and sees its full routing trace (payer waterfall + rules that fired +
// fulfillment + next-on-reissue). From there they can jump into the editor
// at the right level.
// ─────────────────────────────────────────────────────────────────────
function VariantTrace({ state, dispatch }) {
  const [selectedId, setSelectedId] = useState(IMPACTED_EDGE[0].id);
  const payment = IMPACTED_EDGE.find(p => p.id === selectedId) || IMPACTED_EDGE[0];
  const exclusionMap = useMemo(() => {
    const m = {};
    EXCLUSION_RULES_MOCK.forEach(r => {
      if (r.status !== "Active") return;
      if (/Virtual card/i.test(r.rule)) m["vc"] = r;
      if (/OPTUMPAY/i.test(r.rule))     m["achp"] = r;
    });
    return m;
  }, []);
  // Mocked per-payer waterfall — simple cascade for demo
  const chain = ["vc","achp","ach","check","sa"];
  return (
    <div>
      <div className="flex items-baseline justify-between mb-2">
        <h2 className="text-xl font-semibold">Payment trace</h2>
        <span className="text-[12px] ink-3">Investigate why a specific payment routed where it did</span>
      </div>
      <ExclusionDisclaimer dispatch={dispatch}/>
      <div className="trace-layout">
        <div className="trace-list">
          <div className="trace-list-head">In-flight payments ({IMPACTED_EDGE.length})</div>
          {IMPACTED_EDGE.map(p => (
            <button
              key={p.id}
              className={"trace-list-row " + (p.id === selectedId ? "is-on" : "")}
              onClick={()=>setSelectedId(p.id)}
            >
              <span className="trace-pid">{p.id}</span>
              <span className="trace-amt">{p.amount}</span>
              <span className="trace-to net"><span className={"dot " + dotFor(p.to)}/>{NET_BY_ID[p.to].label}</span>
            </button>
          ))}
        </div>
        <div className="trace-detail">
          <div className="trace-card">
            <div className="trace-card-head">
              <div>
                <div className="text-[11px] uppercase tracking-wider ink-3 font-semibold">Payment</div>
                <div className="text-xl font-semibold mt-1">{payment.id}</div>
                <div className="text-[12px] ink-3 mt-1">{payment.amount} · {payment.date} · payer {payment.payer}</div>
              </div>
              <div className="trace-fulfillment">
                <div className="text-[11px] uppercase tracking-wider ink-3 font-semibold">Fulfillment</div>
                <div className="trace-pill">
                  <span className={"dot " + dotFor(payment.to)}/>
                  <span>{NET_BY_ID[payment.to].label}</span>
                  <span className="text-[11px] ink-3 ml-1">{payment.confidence}%</span>
                </div>
              </div>
            </div>
            <div className="trace-section-label">Routing waterfall</div>
            <div className="trace-waterfall">
              {chain.map((id, i) => {
                const isCurrent = id === payment.to;
                const excludedBy = exclusionMap[id];
                const isFallback = !isCurrent && !excludedBy && chain.indexOf(id) > chain.indexOf(payment.to);
                return (
                  <div key={id} className={"trace-step " + (isCurrent ? "is-current " : "") + (excludedBy ? "is-excluded " : "") + (isFallback ? "is-fallback" : "")}>
                    <div className="trace-step-num">{i+1}</div>
                    <div className="trace-step-net">
                      <span className={"dot " + dotFor(id)}/>
                      <span className="net-name">{NET_BY_ID[id].label}</span>
                    </div>
                    <div className="trace-step-status">
                      {isCurrent && <span className="ts-ok">✓ Fulfillment — provider enrolled, no rule excludes</span>}
                      {excludedBy && (
                        <span className="ts-excluded">
                          ✕ Excluded by {excludedBy.scope === "Global" ? "Global rule" : excludedBy.scope === "Account" ? "Provider opt-out" : "Sub-payer rule"} — <i>{excludedBy.rule}</i>
                        </span>
                      )}
                      {isFallback && <span className="ts-fallback">⤵ Next on reissue</span>}
                      {!isCurrent && !excludedBy && !isFallback && <span className="ts-skipped">— skipped (above current)</span>}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="trace-actions">
              <button className="btn btn-quiet" onClick={()=>dispatch({type:"openExclusionRules"})}>View all exclusion rules</button>
              <button className="btn btn-primary" onClick={()=>{
                // Bridge into the editor at the linked account level
                const acc = state.tree.find(a => a.name.startsWith("UnitedHealthcare"));
                if (acc) dispatch({type:"openEdit", id:acc.id});
              }}>Edit preferences</button>
            </div>
          </div>
        </div>
      </div>
      <ExclusionRulesSheet open={state.exclusionRulesOpen} onClose={()=>dispatch({type:"closeExclusionRules"})}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// Review bar + later phases (review/impacted/done)
// ─────────────────────────────────────────────────────────────────────
function ReviewBar({ state, dispatch }) {
  const totalEdits = state.editedIds.size + state.npiEditedIds.size;
  const cascadeRows = state.inheritedIds.size;
  // Confirmation modal — opened by Discard when there's more than one edit,
  // to prevent accidental loss of work. A single edit can still be undone
  // via the per-row Undo, so we skip the modal for the trivial case.
  const [confirmDiscard, setConfirmDiscard] = useState(false);
  if (totalEdits === 0) return null;
  const handleDiscardClick = () => {
    if (totalEdits > 1) setConfirmDiscard(true);
    else dispatch({type:"discardAll"});
  };

  // Breakdown by entity kind (Account / Sub-account / Location / NPI),
  // plus detect WHICH fields changed (Network vs Distribution-family) so
  // the headline accurately summarizes the edit.
  const counts = { Account:0, "Sub-account":0, ZIP:0, NPI:0 };
  let netChanges = 0, distChanges = 0;
  // Tree-side edits
  state.editedIds.forEach(id => {
    const n = find(state.tree, id);
    if (!n) return;
    counts[n.level] = (counts[n.level] || 0) + 1;
    const o = state.originals[id] || {};
    if (o.net !== undefined) netChanges++;
    if (o.dist !== undefined || o.max !== undefined || o.fax !== undefined) distChanges++;
  });
  // NPI-side edits
  state.npiEditedIds.forEach(id => {
    counts.NPI += 1;
    const o = state.npiOriginals[id] || {};
    if (o.net !== undefined) netChanges++;
    if (o.dist !== undefined || o.max !== undefined || o.fax !== undefined) distChanges++;
  });
  const types = [];
  if (netChanges > 0)  types.push("Payment program");
  if (distChanges > 0) types.push("Distribution");
  const headlineSuffix = types.length === 0 ? "" : "in " + types.join(" & ");
  const editedLevels = ["Account","Sub-account","ZIP","NPI"].filter(l => counts[l] > 0);
  // NPI badge needs a custom render — uses the registry glyph, not a LevelBadge.
  const NpiPillBadge = () => (
    <span className="lvl-badge npi-level-badge" style={{width:16, height:16, borderRadius:4}}>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
    </span>
  );
  const levelDisplay = (l) => l === "ZIP" ? "location" : l === "NPI" ? "NPI" : l.toLowerCase();

  return (
    <div className="review-bar">
      <div className="flex-1">
        <div className="rb-headline">
          {totalEdits} change{totalEdits>1?"s":""}{headlineSuffix && <span className="type">{headlineSuffix}</span>}
        </div>
        <div className="rb-detail">
          {editedLevels.map(l => (
            <span key={l} className="rb-pill">
              {l === "NPI" ? <NpiPillBadge/> : <LevelBadge level={l} size={16}/>}
              <b>{counts[l]}</b> {levelDisplay(l)}{counts[l]>1 && l !== "NPI" ? "s" : (counts[l]>1 && l === "NPI" ? "s" : "")}
            </span>
          ))}
          {cascadeRows > 0 && <><span className="sep">·</span><span><b>{cascadeRows}</b> child rows inherit</span></>}
          <span className="sep">·</span>
          <span>~<b>15</b> in-flight payments to re-issue</span>
        </div>
      </div>
      <div className="ml-auto flex items-center gap-2">
        <button className="btn btn-quiet" onClick={handleDiscardClick}>Discard</button>
        <button className="btn btn-primary" onClick={()=>dispatch({type:"setPhase", val:"review"})}>Review and save →</button>
      </div>
      {confirmDiscard && ReactDOM.createPortal(
        /* Portal to <body> so the fixed backdrop centres on the viewport.
           The review-bar (this modal's natural parent) uses transform, which
           would otherwise become the containing block and offset it. */
        <div className="modal-backdrop" onClick={()=>setConfirmDiscard(false)}>
          <div className="modal-card" onClick={(e)=>e.stopPropagation()}>
            <div className="modal-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 9v4M12 17h.01M3 18h18L12 4 3 18Z"/></svg>
            </div>
            <h3 className="modal-title">Discard all {totalEdits} changes?</h3>
            <p className="modal-body">This action can't be undone. The provider's preferences will return to the state they were in before this session.</p>
            <div className="modal-actions">
              <button className="btn btn-quiet" onClick={()=>setConfirmDiscard(false)}>Cancel</button>
              <button className="btn btn-danger" onClick={()=>{ setConfirmDiscard(false); dispatch({type:"discardAll"}); }}>Yes, discard all</button>
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

function PageReview({ state, dispatch }) {
  const [rQuery, setRQuery] = useState("");
  const [rEntity, setREntity] = useState("All");
  const [rChange, setRChange] = useState("All");
  const [rEntityOpen, setREntityOpen] = useState(false);
  const [rChangeOpen, setRChangeOpen] = useState(false);
  const rEntityRef = useRef(null);
  const rChangeRef = useRef(null);
  useEffect(() => {
    function onDoc(e) {
      if (rEntityRef.current && !rEntityRef.current.contains(e.target)) setREntityOpen(false);
      if (rChangeRef.current && !rChangeRef.current.contains(e.target)) setRChangeOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const diffs = useMemo(() => {
    const out = [];
    function go(rows, depth=0) {
      for (const n of rows) {
        if (state.editedIds.has(n.id) || state.inheritedIds.has(n.id)) {
          out.push({ ...n, depth, orig: state.originals[n.id] || {}, inherited: state.inheritedIds.has(n.id), isNpi:false });
        }
        if (n.children) go(n.children, depth+1);
      }
    }
    go(state.tree);
    // NPI edits live in a flat list — append them after the hierarchical
    // tree diffs so the review reads top-down (accounts → npis).
    state.npis.forEach(n => {
      if (state.npiEditedIds.has(n.id)) {
        out.push({ ...n, depth:0, orig: state.npiOriginals[n.id] || {}, inherited:false, isNpi:true, level:"NPI" });
      }
    });
    return out;
  }, [state]);
  const formatMoney = (v) => "$" + Number(v || 0).toLocaleString();

  // Per-diff change-type detection — reused by both the filter and the
  // render loop, so we tag once upfront.
  const taggedDiffs = useMemo(() => diffs.map(d => {
    const o = d.orig || {};
    const types = new Set();
    if (o.net  !== undefined && o.net  !== d.net)  types.add("net");
    if (o.dist !== undefined && o.dist !== d.dist) types.add("dist");
    if (o.max  !== undefined && o.max  !== d.max)  types.add("max");
    if (o.fax  !== undefined && (o.fax || "") !== (d.fax || "")) types.add("fax");
    return { ...d, _changeTypes: types };
  }), [diffs]);

  // Counts shown inside the funnel menu.
  const entityCounts = { All: taggedDiffs.length, Account:0, "Sub-account":0, ZIP:0, NPI:0 };
  const changeCounts = { All: taggedDiffs.length, net:0, dist:0, max:0, fax:0 };
  taggedDiffs.forEach(d => {
    entityCounts[d.level] = (entityCounts[d.level] || 0) + 1;
    d._changeTypes.forEach(t => { changeCounts[t] = (changeCounts[t]||0) + 1; });
  });

  const q = rQuery.trim().toLowerCase();
  const filteredDiffs = taggedDiffs.filter(d => {
    if (rEntity !== "All" && d.level !== rEntity) return false;
    if (rChange !== "All" && !d._changeTypes.has(rChange)) return false;
    if (!q) return true;
    return (d.name || "").toLowerCase().includes(q);
  });

  const ENTITY_OPTS = [
    { id:"All",         label:"All entities" },
    { id:"Account",     label:"Account" },
    { id:"Sub-account", label:"Sub-account" },
    { id:"ZIP",         label:"Location / ZIP" },
    { id:"NPI",         label:"NPI" },
  ];
  const CHANGE_OPTS = [
    { id:"All",  label:"All changes" },
    { id:"net",  label:"Fulfillment network" },
    { id:"dist", label:"Distribution" },
    { id:"max",  label:"Max amount" },
    { id:"fax",  label:"Fax number" },
  ];

  return (
    <div>
      <PhaseHeader
        title="Review changes"
        subtitle="Confirm the changes below before saving."
        back={()=>dispatch({type:"setPhase", val:"edit"})}
        right={
          <div className="flex items-center gap-2">
            <div className="excl-scope-filter" ref={rEntityRef}>
              <button
                type="button"
                aria-label="Filter by entity type"
                className={"trigger with-label " + (rEntity !== "All" ? "is-on" : "")}
                onClick={()=>{ setREntityOpen(v=>!v); setRChangeOpen(false); }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                Entity
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              {rEntityOpen && (
                <div className="menu">
                  {ENTITY_OPTS.map(opt => {
                    const empty = opt.id !== "All" && (entityCounts[opt.id] || 0) === 0;
                    return (
                    <button
                      key={opt.id}
                      type="button"
                      disabled={empty}
                      className={(rEntity === opt.id ? "is-on " : "") + (empty ? "is-empty" : "")}
                      onClick={()=>{ if (empty) return; setREntity(opt.id); setREntityOpen(false); }}
                    >
                      <span className="opt-icon" style={{background:"var(--ash)", color:"var(--ink-2)"}}>
                        {opt.id === "All"
                          ? <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                          : opt.id === "NPI"
                            ? <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
                            : <LevelBadge level={opt.id} size={20}/>}
                      </span>
                      <span className="opt-label">{opt.label}</span>
                      <span className="opt-count">{entityCounts[opt.id] || 0}</span>
                      <span className="opt-check">
                        {rEntity === opt.id && <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                      </span>
                    </button>
                  );
                  })}
                </div>
              )}
            </div>
            <div className="excl-scope-filter" ref={rChangeRef}>
              <button
                type="button"
                aria-label="Filter by change type"
                className={"trigger with-label " + (rChange !== "All" ? "is-on" : "")}
                onClick={()=>{ setRChangeOpen(v=>!v); setREntityOpen(false); }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                Change
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              {rChangeOpen && (
                <div className="menu">
                  {CHANGE_OPTS.map(opt => {
                    const empty = opt.id !== "All" && (changeCounts[opt.id] || 0) === 0;
                    return (
                    <button
                      key={opt.id}
                      type="button"
                      disabled={empty}
                      className={(rChange === opt.id ? "is-on " : "") + (empty ? "is-empty" : "")}
                      onClick={()=>{ if (empty) return; setRChange(opt.id); setRChangeOpen(false); }}
                    >
                      <span className="opt-icon" style={{background:"var(--ash)", color:"var(--ink-2)"}}>
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      </span>
                      <span className="opt-label">{opt.label}</span>
                      <span className="opt-count">{changeCounts[opt.id] || 0}</span>
                      <span className="opt-check">
                        {rChange === opt.id && <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                      </span>
                    </button>
                  );
                  })}
                </div>
              )}
            </div>
            <div className="rt-search" style={{width:260}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" placeholder="Search by entity name…" value={rQuery} onChange={e=>setRQuery(e.target.value)}/>
            </div>
          </div>
        }
      />
      <div className="flex items-center mt-3 px-1 text-[12px] ink-3" style={{fontVariantNumeric:"tabular-nums"}}>
        {filteredDiffs.length === taggedDiffs.length
          ? <>{taggedDiffs.length} {taggedDiffs.length === 1 ? "row" : "rows"}</>
          : <>Showing {filteredDiffs.length} of {taggedDiffs.length} rows</>
        }
      </div>
      <div className="surface overflow-hidden">
        <div className="review-head">
          <div></div>
          <div>Entity</div>
          <div>Changes</div>
        </div>
        {filteredDiffs.length === 0 ? (
          <div className="p-10 text-center ink-3 text-[13px]">No changes match your filters.</div>
        ) : filteredDiffs.map(d => {
          const o = d.orig;
          const netChanged = o.net !== undefined && o.net !== d.net;
          const distChanged = o.dist !== undefined && o.dist !== d.dist;
          const maxChanged = o.max !== undefined && o.max !== d.max;
          const faxChanged = o.fax !== undefined && (o.fax || "") !== (d.fax || "");
          // Each entry is rendered as [field label] [old chip → new chip].
          // `mono` flag triggers monospace formatting for numeric fields.
          const fields = [];
          if (netChanged) fields.push({
            label:"Fulfillment network",
            old:<span className="rchip is-old"><span className={"dot " + dotFor(o.net)}/>{NET_BY_ID[o.net].label}</span>,
            neu:<span className="rchip is-new"><span className={"dot " + dotFor(d.net)}/>{NET_BY_ID[d.net].label}</span>,
          });
          if (distChanged) fields.push({
            label:"Distribution",
            old:<span className="rchip is-old">{o.dist}</span>,
            neu:<span className="rchip is-new">{d.dist}</span>,
          });
          if (maxChanged) fields.push({
            label:"Max amount",
            old:<span className="rchip is-old mono">{formatMoney(o.max)}</span>,
            neu:<span className="rchip is-new mono">{formatMoney(d.max)}</span>,
          });
          if (faxChanged) fields.push({
            label:"Fax number",
            old:<span className="rchip is-old mono">{o.fax || "—"}</span>,
            neu:<span className="rchip is-new mono">{d.fax || "—"}</span>,
          });
          return (
            <div key={d.id} className={`review-row ${d.inherited?"is-inherited":"is-edited"}`}>
              <span className="left-edge"></span>
              {d.isNpi ? (
                <span className="lvl-badge npi-level-badge" style={{width:32, height:32, borderRadius:8}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
                </span>
              ) : (
                <LevelBadge level={d.level} size={32}/>
              )}
              <div className="review-entity">
                <div className="lvl-line">
                  {d.isNpi ? <>
                    <span className="lvl-label" style={{color:"var(--ink-2)"}}>NPI</span>
                    <span className="npi-type-chip">{d.type}</span>
                  </> : <LevelLabel level={d.level}/>}
                </div>
                <div className="name"><Highlight text={d.name} query={rQuery}/></div>
                <div className="meta">
                  {d.isNpi
                    ? <>Linked to <b>{d.linkedAccount}</b></>
                    : (d.inherited ? "Inherited from parent" : "Direct change")}
                </div>
              </div>
              <div className="review-diffs">
                {fields.length === 0 ? (
                  <div className="rdiff-empty">Inherited from parent</div>
                ) : fields.map((f, i) => (
                  <div key={i} className="rdiff">
                    <span className="field">{f.label}</span>
                    <span className="pair">
                      {f.old}
                      <span className="arrow">→</span>
                      {f.neu}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="review-bar">
        <div>
          <div className="text-[15px] font-semibold">{diffs.length} row{diffs.length>1?"s":""} will be updated</div>
          <div className="text-[12px] opacity-80 mt-0.5">Effective immediately. In-flight payments next.</div>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <button className="btn btn-quiet" onClick={()=>dispatch({type:"setPhase", val:"edit"})}>Back</button>
          <button className="btn btn-primary" onClick={()=>dispatch({type:"setPhase", val:"impacted"})}>Save and continue →</button>
        </div>
      </div>
    </div>
  );
}

function PageImpacted({ state, dispatch }) {
  const [scenario, setScenario] = useState("simple");
  const data = scenario === "simple" ? IMPACTED_SIMPLE : IMPACTED_EDGE;
  const [selected, setSelected] = useState(new Set(data.map(p=>p.id)));
  // Per-address confirmation. Map of addressId → bool.
  const [addrConfirmed, setAddrConfirmed] = useState({});
  const [openDetails, setOpenDetails] = useState(null); // payment id

  // Keep `selected` in sync when scenario changes — reset to "all selected"
  useEffect(() => { setSelected(new Set(data.map(p=>p.id))); setAddrConfirmed({}); setOpenDetails(null); }, [scenario]);

  function toggle(id) { const n = new Set(selected); n.has(id)?n.delete(id):n.add(id); setSelected(n); }

  // Sort + per-column filter state (local — only affects the visible table,
  // not which payments are selected for reissue).
  const [sortKey, setSortKey] = useState(null);   // "id" | "date" | "amount" | null
  const [sortDir, setSortDir] = useState("asc");
  const [fromFilter, setFromFilter] = useState(new Set());
  const [toFilter, setToFilter]     = useState(new Set());
  const [openHeadFilter, setOpenHeadFilter] = useState(null); // "from" | "to" | null
  const fromFiltRef = useRef(null);
  const toFiltRef = useRef(null);
  useEffect(() => {
    function onDoc(e) {
      if (openHeadFilter === "from" && fromFiltRef.current && !fromFiltRef.current.contains(e.target)) setOpenHeadFilter(null);
      if (openHeadFilter === "to"   && toFiltRef.current   && !toFiltRef.current.contains(e.target))   setOpenHeadFilter(null);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [openHeadFilter]);
  function cycleSort(key) {
    if (sortKey !== key) { setSortKey(key); setSortDir("asc"); }
    else if (sortDir === "asc") setSortDir("desc");
    else { setSortKey(null); setSortDir("asc"); }
  }
  function toggleColFilter(setter, set, id) {
    const n = new Set(set); n.has(id) ? n.delete(id) : n.add(id); setter(n);
  }

  // Derived: routing breakdown + addresses in use, from the current data.
  // The UI branches on these — if there is one bucket, render the simple
  // single-value card; if more, render a list. Same codepath for both.
  const routingCounts = useMemo(() => {
    const c = {};
    data.forEach(p => { c[p.to] = (c[p.to]||0) + 1; });
    return Object.entries(c).sort((a,b)=>b[1]-a[1]); // [[netId, count], ...]
  }, [data]);
  const addressUsage = useMemo(() => {
    const c = {};
    data.forEach(p => { if (p.addressId) c[p.addressId] = (c[p.addressId]||0) + 1; });
    return Object.entries(c).sort((a,b)=>b[1]-a[1]);
  }, [data]);
  const hasMixedRouting = routingCounts.length > 1;
  const hasMultipleAddresses = addressUsage.length > 1;
  const needsAnyCheck = data.some(p => p.to === "check");

  const totalAmount = data.reduce((s,p) => s + Number((p.amount||"$0").replace(/[$,\s]/g,"")), 0);
  const fmtMoney = (n) => "$" + n.toLocaleString();

  const allAddrConfirmed = !needsAnyCheck || addressUsage.every(([id]) => addrConfirmed[id]);

  // Per-column filter option lists with counts (drives the From / Next
  // network header dropdowns).
  const fromOptionCounts = useMemo(() => {
    const c = {}; data.forEach(p => { c[p.from] = (c[p.from]||0)+1; }); return c;
  }, [data]);
  const toOptionCounts = useMemo(() => {
    const c = {}; data.forEach(p => { c[p.to] = (c[p.to]||0)+1; }); return c;
  }, [data]);

  // visibleData: apply filters, then apply sort. Selection (checkboxes) is
  // still tracked against the full set so filtering doesn't drop items.
  const visibleData = useMemo(() => {
    let arr = data.filter(p =>
      (!fromFilter.size || fromFilter.has(p.from)) &&
      (!toFilter.size   || toFilter.has(p.to))
    );
    if (sortKey) {
      const num = (s) => Number(String(s).replace(/[$,\s]/g,""));
      arr = [...arr].sort((a,b) => {
        let av, bv;
        if (sortKey === "id")     { av = a.id;        bv = b.id; }
        else if (sortKey === "date") { av = a.date;   bv = b.date; }
        else if (sortKey === "amount"){ av = num(a.amount); bv = num(b.amount); }
        if (av < bv) return sortDir === "asc" ? -1 : 1;
        if (av > bv) return sortDir === "asc" ?  1 : -1;
        return 0;
      });
    }
    return arr;
  }, [data, fromFilter, toFilter, sortKey, sortDir]);

  function SortIcon({ active, dir }) {
    return (
      <span className="sort-i">
        <svg className="arr-up" width="8" height="5" viewBox="0 0 10 6" fill="currentColor"><path d="M5 0 L10 6 L0 6 Z"/></svg>
        <svg className="arr-down" width="8" height="5" viewBox="0 0 10 6" fill="currentColor"><path d="M5 6 L0 0 L10 0 Z"/></svg>
      </span>
    );
  }

  return (
    <div>
      <PhaseHeader
        title="Reissue in-flight payments"
        subtitle="Confirm with the provider and reissue the payments below."
        back={()=>dispatch({type:"setPhase", val:"review"})}
      />
      {/* Floating scenario toggle — sits next to the DevPanel FAB so it
          reads as a demo control, not as product UI. */}
      <div className="scenario-toggle">
        <span className="scn-label">Scenario</span>
        <button type="button" className={scenario==="simple" ? "is-on" : ""} onClick={()=>setScenario("simple")}>Simple</button>
        <button type="button" className={scenario==="edge"   ? "is-on" : ""} onClick={()=>setScenario("edge")}>Edge case</button>
      </div>
      <div className="stats-sticky">
        <div className="grid grid-cols-3 gap-3">
          <div className="stat">
            <div className="stat-head text-[11px] uppercase tracking-wider ink-3">
              <span className="stat-ic ic-impact">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7v8l10-12h-7V2z"/></svg>
              </span>
              Impacted
            </div>
            <div className="stat-hero">{data.length}<span className="unit">payment{data.length>1?"s":""}</span></div>
            <div className="stat-meta"><b>{fmtMoney(totalAmount)}</b> total<span className="sep">·</span>30-day window</div>
          </div>
          <div className="stat">
            <div className="stat-head text-[11px] uppercase tracking-wider ink-3">
              <span className="stat-ic ic-route">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v6a4 4 0 0 0 4 4h6"/></svg>
              </span>
              Routing
            </div>
            {!hasMixedRouting ? (
              <>
                <div className="stat-hero flex items-center gap-2">
                  <span className={"dot " + dotFor(routingCounts[0][0])} style={{width:14, height:14}}/>
                  {NET_BY_ID[routingCounts[0][0]].label}
                </div>
                <div className="stat-meta"><b>{data[0].confidence}%</b> likelihood of fulfillment</div>
              </>
            ) : (
              <div className="routing-breakdown">
                {routingCounts.map(([id,n]) => (
                  <div key={id} className="rb-row">
                    <span className={"dot " + dotFor(id)}/>
                    <span className="name">{NET_BY_ID[id].label}</span>
                    <span className="count">{n} payment{n>1?"s":""}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          {/* Mailing-address card. Simple: one address + one checkbox. Edge:
              N addresses, each with its own count + confirmation. */}
          {needsAnyCheck && (
            !hasMultipleAddresses ? (
              <div className={"stat mailing-card " + (addrConfirmed[addressUsage[0][0]] ? "confirmed" : "needs-action")}>
                <div className="stat-head text-[11px] uppercase tracking-wider font-semibold" style={{color: addrConfirmed[addressUsage[0][0]] ? "var(--check)" : "var(--vc)"}}>
                  <span className="stat-ic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  </span>
                  Mailing address {addrConfirmed[addressUsage[0][0]] ? "confirmed" : "— confirm with provider"}
                </div>
                <div className="text-[15px] font-semibold ink leading-snug">
                  {IMPACTED_ADDRESSES[addressUsage[0][0]].line1}<br/>
                  {IMPACTED_ADDRESSES[addressUsage[0][0]].line2}
                </div>
                <label className="text-[13px] mt-3 inline-flex items-center gap-2 cursor-pointer font-semibold">
                  <input type="checkbox" checked={!!addrConfirmed[addressUsage[0][0]]} onChange={e=>setAddrConfirmed(c=>({...c, [addressUsage[0][0]]:e.target.checked}))}/>
                  {addrConfirmed[addressUsage[0][0]] ? "Confirmed" : "I confirmed this with the provider"}
                </label>
              </div>
            ) : (
              <div className={"stat mailing-card " + (allAddrConfirmed ? "confirmed" : "needs-action")}>
                <div className="stat-head text-[11px] uppercase tracking-wider font-semibold" style={{color: allAddrConfirmed ? "var(--check)" : "var(--vc)"}}>
                  <span className="stat-ic">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  </span>
                  {addressUsage.length} mailing addresses {allAddrConfirmed ? "confirmed" : "— confirm each"}
                </div>
                <div className="mailing-list">
                  {addressUsage.map(([id,count]) => {
                    const addr = IMPACTED_ADDRESSES[id];
                    const ok = !!addrConfirmed[id];
                    return (
                      <div key={id} className="ml-row">
                        <div className="ml-head">
                          <span>{addr.label}</span>
                          <span className="ml-count">{count} payment{count>1?"s":""}</span>
                        </div>
                        <div className="ml-addr">{addr.line1}<br/>{addr.line2}</div>
                        <label>
                          <input type="checkbox" checked={ok} onChange={e=>setAddrConfirmed(c=>({...c, [id]:e.target.checked}))}/>
                          {ok ? "Confirmed" : "Confirm with provider"}
                        </label>
                      </div>
                    );
                  })}
                </div>
              </div>
            )
          )}
        </div>
      </div>
      <div className="surface mt-4 overflow-hidden">
        <table className="simple">
          <thead>
            <tr>
              <th style={{width:36}}><input type="checkbox" checked={selected.size===data.length} onChange={e=>setSelected(e.target.checked ? new Set(data.map(p=>p.id)) : new Set())}/></th>
              <th>
                <button type="button" onClick={()=>cycleSort("id")}
                  className={"th-sort " + (sortKey==="id" ? "is-active is-"+sortDir : "")}>
                  Payment ID <SortIcon/>
                </button>
              </th>
              <th>
                <button type="button" onClick={()=>cycleSort("date")}
                  className={"th-sort " + (sortKey==="date" ? "is-active is-"+sortDir : "")}>
                  Date <SortIcon/>
                </button>
              </th>
              <th>
                <button type="button" onClick={()=>cycleSort("amount")}
                  className={"th-sort " + (sortKey==="amount" ? "is-active is-"+sortDir : "")}>
                  Amount <SortIcon/>
                </button>
              </th>
              <th>
                <span className="col-filter-wrap" ref={fromFiltRef}>
                  From
                  <button
                    type="button"
                    className={"col-filter ml-1 " + (fromFilter.size?"active":"")}
                    onClick={()=>setOpenHeadFilter(o => o==="from" ? null : "from")}
                    aria-label="Filter by From"
                  >
                    <svg width="12" height="12" viewBox="0 0 24 24" fill={fromFilter.size?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                    {fromFilter.size > 0 && <span className="col-filter-count">{fromFilter.size}</span>}
                  </button>
                  {openHeadFilter === "from" && (
                    <div className="filter-panel col-filter-panel">
                      {Object.entries(fromOptionCounts).map(([id,n]) => (
                        <label key={id} className={"opt " + (n===0?"opt-empty":"")}>
                          <input type="checkbox" checked={fromFilter.has(id)} onChange={()=>toggleColFilter(setFromFilter, fromFilter, id)}/>
                          <span className="opt-label flex items-center gap-2"><span className={"dot "+dotFor(id)}/>{NET_BY_ID[id].label}</span>
                          <span className="opt-count">{n}</span>
                        </label>
                      ))}
                      {fromFilter.size > 0 && (
                        <div className="filter-footer">
                          <button type="button" className="filter-clear" onClick={()=>setFromFilter(new Set())}>Clear</button>
                        </div>
                      )}
                    </div>
                  )}
                </span>
              </th>
              <th></th>
              <th>
                <span className="col-filter-wrap" ref={toFiltRef}>
                  Next network
                  <button
                    type="button"
                    className={"col-filter ml-1 " + (toFilter.size?"active":"")}
                    onClick={()=>setOpenHeadFilter(o => o==="to" ? null : "to")}
                    aria-label="Filter by next network"
                  >
                    <svg width="12" height="12" viewBox="0 0 24 24" fill={toFilter.size?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                    {toFilter.size > 0 && <span className="col-filter-count">{toFilter.size}</span>}
                  </button>
                  {openHeadFilter === "to" && (
                    <div className="filter-panel col-filter-panel">
                      {Object.entries(toOptionCounts).map(([id,n]) => (
                        <label key={id} className={"opt " + (n===0?"opt-empty":"")}>
                          <input type="checkbox" checked={toFilter.has(id)} onChange={()=>toggleColFilter(setToFilter, toFilter, id)}/>
                          <span className="opt-label flex items-center gap-2"><span className={"dot "+dotFor(id)}/>{NET_BY_ID[id].label}</span>
                          <span className="opt-count">{n}</span>
                        </label>
                      ))}
                      {toFilter.size > 0 && (
                        <div className="filter-footer">
                          <button type="button" className="filter-clear" onClick={()=>setToFilter(new Set())}>Clear</button>
                        </div>
                      )}
                    </div>
                  )}
                </span>
              </th>
              <th style={{textAlign:"right"}}></th>
            </tr>
          </thead>
          <tbody>
            {visibleData.length === 0 && (
              <tr><td colSpan={8} className="p-6 text-center ink-3 text-[13px]">No payments match your filters.</td></tr>
            )}
            {visibleData.map(p => {
              const addr = p.addressId ? IMPACTED_ADDRESSES[p.addressId] : null;
              const showAddrChip = addr && hasMultipleAddresses;
              const isOpen = openDetails === p.id;
              return (
                <Fragment key={p.id}>
                  <tr
                    className={selected.has(p.id) ? "sel" : ""}
                    style={{cursor:"pointer"}}
                    onClick={(e)=>{
                      // Ignore clicks on interactive children so checkbox /
                      // See-details button / etc. keep their own behavior.
                      if (e.target.closest("input, button, a, .col-filter, .th-sort")) return;
                      toggle(p.id);
                    }}
                  >
                    <td><input type="checkbox" checked={selected.has(p.id)} onChange={()=>toggle(p.id)}/></td>
                    <td className="font-mono font-semibold text-[12.5px] ink">{p.id}</td>
                    <td className="ink-2">{p.date}</td>
                    <td className="font-mono font-medium text-[13px]" style={{fontVariantNumeric:"tabular-nums"}}>{p.amount}</td>
                    <td>
                      <span className="net" style={{fontStyle:"italic", textDecoration:"line-through", color:"var(--ink-3)"}}>
                        <span className={"dot " + dotFor(p.from)} style={{opacity:.55}}/>
                        <span>{NET_BY_ID[p.from].label}</span>
                      </span>
                    </td>
                    <td className="ink-3">→</td>
                    <td>
                      <span className="net">
                        <span className={"dot " + dotFor(p.to)}/>
                        <span className="font-semibold">{NET_BY_ID[p.to].label}</span>
                        <Tooltip
                          wrap
                          align="center"
                          placement="below"
                          panelStyle={{ maxWidth: 260, minWidth: 200, padding:"8px 10px" }}
                          content={
                            <span>
                              Model-estimated chance the next attempt via <b>{NET_BY_ID[p.to].label}</b> will succeed.
                            </span>
                          }
                        >
                          <span className="text-[11px] ink-3 ml-1" style={{cursor:"help", textDecoration:"underline", textDecorationStyle:"dotted", textDecorationColor:"var(--ink-4)", textUnderlineOffset:3}}>{p.confidence}%</span>
                        </Tooltip>
                        {showAddrChip && <span className={"addr-chip " + (p.addressId==="a2" ? "is-secondary":"")}>{addr.label}</span>}
                      </span>
                    </td>
                    <td style={{textAlign:"right"}}>
                      <button
                        className={"change-trigger " + (isOpen ? "on" : "")}
                        style={isOpen ? undefined : { background:"transparent" }}
                        onClick={()=>setOpenDetails(o => o===p.id ? null : p.id)}
                      >
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        See details
                      </button>
                    </td>
                  </tr>
                  {isOpen && (
                    <tr>
                      <td colSpan={8} style={{padding:0}}>
                        <div className="imp-details-panel">
                          <table>
                            <thead><tr><th>Network</th><th>Network type</th><th>Provider enrolled</th><th>Enrolled date</th></tr></thead>
                            <tbody>
                              {PROVIDER_ENROLLMENT.map(e => (
                                <tr key={e.net}>
                                  <td className={e.net===p.to ? "picked" : ""}>
                                    <span className="net">
                                      <span className={"dot " + dotFor(e.net)}/>
                                      <span>{NET_BY_ID[e.net].label}</span>
                                    </span>
                                  </td>
                                  <td className={e.net===p.to ? "picked" : ""}>{e.type} network</td>
                                  <td className={e.net===p.to ? "picked" : ""}>
                                    {e.enrolled ? <span className="chip-enrolled">Enrolled</span> : <span className="chip-out">Not enrolled</span>}
                                  </td>
                                  <td className={e.net===p.to ? "picked" : ""}>{e.date ? new Date(e.date+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—"}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </td>
                    </tr>
                  )}
                </Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="review-bar">
        <div>
          <div className="text-[15px] font-semibold">{selected.size} of {data.length} payment{selected.size>1?"s":""} selected to reissue</div>
          <div className="text-[12px] opacity-80 mt-0.5">{allAddrConfirmed ? "Mailing address confirmed." : "Confirm the mailing address with the provider before continuing."}</div>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <button className="btn btn-quiet" onClick={()=>dispatch({type:"setPhase", val:"review"})}>Back</button>
          <button className="btn btn-quiet" onClick={()=>dispatch({type:"setPhase", val:"done"})}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            Skip reissue
          </button>
          <button className="btn btn-primary" disabled={!allAddrConfirmed || selected.size===0} onClick={()=>dispatch({type:"setPhase", val:"done"})}>Reissue {selected.size} payment{selected.size>1?"s":""} →</button>
        </div>
      </div>
    </div>
  );
}
