<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provider Preferencing — v5</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- jsDelivr instead of unpkg — more permissive in corporate networks -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
<style>
  :root {
    /* Hybrid palette: warm neutrals + Optum DS V2 cool blues for primary
       interactive surfaces. Navbar / surfaces / text stay warm; primary
       button, selected/edited, info, review bar use the Optum brand blues. */
    --navy:#002677;            /* Optum Primary Blue — primary button rest */
    --navy-d:#003891;          /* Blue 800 — primary button hover */
    --navy-soft:#E6F0FF;       /* Blue 50 — light tint */
    --orange:#FF612B;          /* Optum Orange — brand mark / accent */
    --orange-d:#D74120;        /* Dark Orange — vibrant button */
    --orange-soft:#FFD1AB;     /* Dawn Orange — chips / tags */
    --info:#0075C9;            /* Optum Information / Secondary Blue */
    --info-soft:#E6F0FF;       /* Blue 50 — info fills */
    /* Optum brand accent palette (hexes confirmed from the Abyss brand
       color doc: Sapphire #1E82CB, Tangerine #E4780C, Purple #8061BC,
       Pink #C72887, Info Light #DFF3F9). The light tints + dark text are
       AA-tuned approximations pending the exact token table. Used to give
       chips/badges true brand colour instead of ad-hoc hexes. */
    --sapphire:#1E82CB; --sapphire-bg:#DFF3F9; --sapphire-tx:#0B5A87; --sapphire-bd:#9FCDEA;
    --tangerine:#E4780C; --tangerine-bg:#FCEBDA; --tangerine-tx:#9C4A0C; --tangerine-bd:#F0B27A;
    --purple:#8061BC; --purple-bg:#EFEAF8; --purple-tx:#5A4196; --purple-bd:#C4B3E3;
    --pink:#C72887; --pink-bg:#FBE4F1; --pink-tx:#A01E6B; --pink-bd:#E8A8CF;
    /* Abyss Badge semantic palette (sampled from the Badge component image):
       tinted fill + bold coloured text, no border. */
    --badge-success-bg:#E8F3E8; --badge-success-tx:#2E7D32;
    --badge-warning-bg:#FBF0DD; --badge-warning-tx:#B5531F;
    --badge-error-bg:#FBE4E3;   --badge-error-tx:#B3261E;
    --badge-info-bg:#E7EEFB;    --badge-info-tx:#2D6FCF;
    --badge-neutral-bg:#ECECEA; --badge-neutral-tx:#3D3C38;
    /* Neutrals — warm grays */
    --ink:#3D3C38;             /* Warm Gray — primary text */
    --ink-2:#504F4A;           /* Oracle — secondary text */
    --ink-3:#989790;           /* Slate — tertiary text */
    --ink-4:#CECDCA;           /* Iron — placeholder / disabled */
    --line:#E7E6E4;            /* Smoke — borders, dividers */
    --line-2:#CECDCA;          /* Iron — stronger borders */
    --line-soft:#F0EEE9;       /* Hair-line — elegant in-table dividers */
    --bg:#FFFFFF;              /* White — page background (cleaner than warm white in dense UIs) */
    --bg-hover:#F6F2E9;        /* Dune — interaction hover */
    --row-hover:#E6F0FF;       /* light primary-blue (navy-soft) — table row hover, matches the option-card fill */
    --paper:#FFFFFF;
    --paper-warm:#FAF8F2;      /* Warm White — secondary/specialist surfaces (no border needed) */
    --tip-bg:#43413D;          /* Tooltip surface — warm dark gray (Abyss "gray variant"), softer than near-black Charade */
    --ash:#F3F3F3;             /* neutral hover for filled controls */
    --horizon:#EDE8E0;         /* ghost active fill */
    /* Semantic (re-used for payment-method semantics) */
    --vc:#FF612B;              /* Optum Orange — Virtual card (cost-bearing) */
    --vc-bg:#FFEEE5;
    --check:#00A878;           /* Optum Success Green — Check (preferred / no fee) */
    --check-bg:#E0F4ED;        /* Light success tint */
    --ach:#0075C9;             /* Optum Secondary Blue — ACH / digital */
    --ach-bg:#E6F0FF;          /* Blue 50 */
    --edited:#002677;          /* Optum Primary Blue — edits made this session */
    --edited-bg:#E6F0FF;       /* Blue 50 */
    --inherit:#AD8D01;         /* Yellow stroke — inherited / cascaded (text-safe variant) */
    --inherit-bg:#FFE8CD;      /* Warning Light */
    --warn:#FFA500;            /* Optum Warning */
    --warn-bg:#FFE8CD;
    --error:#E31C3D;           /* Optum Error */
    --error-bg:#FCEAEA;        /* Light error tint */
    /* Level-tag chips (kept distinct for hierarchy visibility) */
    --lvl-account-bg:#EDE8E0; --lvl-account-fg:#3D3C38;       /* Horizon / Warm Gray */
    --lvl-subaccount-bg:#D9F6FA; --lvl-subaccount-fg:#095F87; /* Sky Blue / Information */
    --lvl-zip-bg:#FFD1AB; --lvl-zip-fg:#B83C20;               /* Dawn Orange / Brick */

    --focus-ring: 0 0 0 0.2rem rgba(0,38,119,.18);
    /* Optum elevation scale (layers.md) — shadow color #3D3C38 at 16%,
       blur per documented level. Overlays map to their canonical
       elevation: Menu 6, Notifications 8, Modal 12, Popover 16,
       Tooltip 20, FAB 24. Cards stay flat (elevation 1 = border only). */
    --elev-menu:    0 2px 6px rgba(61,60,56,.16);
    --elev-notif:   0 4px 8px rgba(61,60,56,.16);
    --elev-modal:   0 4px 12px rgba(61,60,56,.16);
    --elev-popover: 0 4px 16px rgba(61,60,56,.16);
    --elev-tooltip: 0 6px 20px rgba(61,60,56,.16);
    --elev-fab:     0 8px 24px rgba(61,60,56,.16);
    /* Legacy aliases mapped onto the scale so existing usages inherit the
       correct elevation: sm = subtle button rest, md = menu, lg = popover,
       xl = modal. */
    --shadow-sm:  0 1px 2px rgba(61,60,56,.08);
    --shadow-md:  var(--elev-menu);
    --shadow-lg:  var(--elev-popover);
    --shadow-xl:  var(--elev-modal);
    /* Optum type scale (Enterprise Sans VF) — heading steps, Bold (700).
       Desktop: XXL 48 · XL 40 · LG 33 · MD 28 · SM 23 · XS 20 · XXS 18.
       Body base stays 14px for CSR table density (DS desktop base is 16px —
       intentional tradeoff for a dense data view). */
    --h-lg:33px; --h-md:28px; --h-sm:23px; --h-xs:20px; --h-xxs:18px;
    /* Heading color — the Abyss catalog renders titles in Optum Primary Blue.
       Used for page / section / modal / drawer titles (not body text). */
    --heading:#002677;
    --t: .2s ease;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  /* Selection controls use the Optum info blue (brighter than the brand
     navy), matching the Abyss Checkbox/Radio/Toggle selected state. */
  input[type=checkbox], input[type=radio]{ accent-color: var(--info); }
  /* Optum DS V2 typography — Enterprise Sans VF with system fallback */
  body { font-family: "Enterprise Sans VF", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; -webkit-font-smoothing: antialiased; font-size:14px; line-height:1.4; }
  .ink{color:var(--ink)} .ink-2{color:var(--ink-2)} .ink-3{color:var(--ink-3)}
  /* Section h2 titles (utility-classed) inherit the Optum navy heading color
     to match the rest of the title hierarchy. */
  h2.text-xl{ color:var(--heading); }
  .line{border-color:var(--line)}
  /* Page shell — widened to make room for the table to grow horizontally.
     Was 1180px (cramped once we add more columns). Now 1480px so the
     CSR can fit additional columns (e.g. last activity, contact, owner)
     without horizontal scroll on common desktop widths (1440–1920). */
  .shell{ max-width:1480px; margin:0 auto; padding:0 28px; }
  /* Card = elevation 1 (flat) per layers.md — border carries the edge, no
     drop shadow. Keeps dense tables calm and matches the DS card spec. */
  .surface{ background:var(--paper); border:1px solid var(--line); border-radius:10px; }
  .surface-flat{ background:var(--paper); border-bottom:1px solid var(--line); }

  /* Abyss buttons are stadium/pill-shaped (fully rounded) — the strongest
     visual signature of the DS. Applies to filled, outline and quiet
     variants that share the .btn base. */
  .btn{display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px; font-weight:600; font-size:14px; line-height:1; transition:all var(--t); cursor:pointer; white-space:nowrap; border:1px solid transparent;}
  .btn:focus-visible{ outline:none; box-shadow: var(--focus-ring); }
  .btn-sm{ padding:7px 12px; font-size:13px; }
  .btn-primary{background:var(--navy); color:#fff; box-shadow: var(--shadow-sm);}
  .btn-primary:hover{background:var(--navy-d); box-shadow: 0 2px 6px rgba(0,38,119,.25);}
  .btn-primary:disabled{background:var(--line-2); color:var(--ink-3); cursor:not-allowed; box-shadow:none;}
  .btn-quiet{background:var(--paper); color:var(--ink); border:1px solid var(--line-2);}
  .btn-quiet:hover{background:var(--bg-hover); border-color:var(--ink-3); color:var(--ink);}
  /* Text/link buttons use info blue (distinct from the solid-button navy),
     matching Abyss links / Text-brand buttons. */
  .btn-ghost{background:transparent; color:var(--info); font-weight:600; padding:6px 4px;}
  .btn-ghost:hover{text-decoration:underline;}
  .btn-danger-ghost{background:transparent; color:var(--error); font-weight:600; padding:6px 8px; border-radius:6px;}
  .btn-danger-ghost:hover{background:var(--error-bg);}
  /* Filled destructive button — used in confirmation modals where the
     primary action removes the user's work. */
  .btn-danger{ background:var(--error); color:#fff; border:1px solid transparent; }
  .btn-danger:hover{ background:#B41530; }

  /* Confirmation modal — backdrop + centered card. Used before destructive
     actions (e.g., discarding multiple unsaved edits). */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(35,34,32,.40); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .18s ease-out; }
  .modal-card{ background:var(--paper); border-radius:12px; box-shadow:var(--elev-modal); max-width:440px; width:100%; padding:24px; animation:drawerIn .22s cubic-bezier(.2,.8,.2,1); }
  .modal-icon{ width:44px; height:44px; border-radius:999px; background:var(--error-bg); color:var(--error); display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .modal-title{ font-size:18px; font-weight:700; color:var(--heading); margin-bottom:8px; line-height:1.25; }
  .modal-body{ font-size:13.5px; color:var(--ink-2); line-height:1.5; margin-bottom:20px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }
  /* Success toast (forms.md) — task-completion confirmation. Light Success
     surface + Dark Success icon + Warm Gray text per colors.md. Elevation 8
     (Notifications) per layers.md. Bottom-center, auto-dismiss. */
  .save-toast-wrap{ position:fixed; left:auto; right:24px; bottom:24px; z-index:300; display:flex; justify-content:flex-end; pointer-events:none; }
  .save-toast{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:10px;
    max-width:520px; padding:12px 14px;
    background:var(--check-bg); color:var(--ink);
    border:1px solid var(--check); border-radius:10px;
    box-shadow:var(--elev-notif);
    font-size:13.5px; font-weight:500;
    animation: saveToastIn .26s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes saveToastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .save-toast-icon{ display:inline-flex; color:var(--check); flex-shrink:0; }
  .save-toast-msg{ line-height:1.35; }
  .save-toast-close{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; margin-left:4px; flex-shrink:0;
    background:transparent; border:0; border-radius:5px;
    color:var(--ink-3); cursor:pointer; transition:all var(--t);
  }
  .save-toast-close:hover{ background:rgba(0,0,0,.06); color:var(--ink); }
  /* Drawer error alert (forms.md) — Danger Light surface, Danger Dark icon,
     Warm Gray text per colors.md. Shown above the actions after a blocked
     save. */
  .edit-error-alert{
    display:flex; align-items:flex-start; gap:9px;
    margin:0 0 10px; padding:10px 12px;
    background:var(--error-bg); border:1px solid #F2C9CF; border-bottom:2px solid var(--error);
    border-radius:8px; font-size:12.5px; color:var(--ink); line-height:1.4;
  }
  /* Filled circular Danger icon — matches the Abyss Alert anatomy. */
  .edit-error-alert .ea-icon{
    flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:999px; margin-top:1px;
    background:var(--error); color:#fff;
  }
  /* Reset button styles inside the modal — the modal is rendered as a child
     of .review-bar which colors .btn-quiet white-on-transparent. We bump
     specificity (.modal-backdrop .modal-card .btn-quiet, 0,3,0) so this
     override beats both .review-bar .btn-quiet and any descendant rules. */
  .modal-backdrop .modal-card .btn-quiet{ background:var(--paper); color:var(--ink); border:1px solid var(--line-2); }
  .modal-backdrop .modal-card .btn-quiet:hover{ background:var(--bg-hover); border-color:var(--ink-3); color:var(--ink); }
  .btn-link-quiet{background:transparent; color:var(--ink-2); font-weight:600; font-size:13px; padding:6px 10px; cursor:pointer;}
  .btn-link-quiet:hover{color:var(--ink); text-decoration:underline;}
  /* Discrete icon button — no bg, no border, subtle hover */
  /* Quiet view-control text buttons (Columns, Expand all) — brand blue:
     lighter info blue at rest, darkening to primary navy on hover. */
  .btn-icon-quiet{ display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--info); font-weight:600; font-size:13px; padding:6px 10px; border-radius:6px; cursor:pointer; transition:all var(--t); white-space:nowrap; }
  .btn-icon-quiet svg{ color:var(--info); }
  .btn-icon-quiet:hover{ color:var(--navy); background:var(--navy-soft); }
  .btn-icon-quiet:hover svg{ color:var(--navy); }
  /* Compact square icon button (e.g., toolbar utilities) */
  .icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:transparent; color:var(--ink-3); border-radius:6px; cursor:pointer; transition:all var(--t); }
  .icon-btn:hover{ color:var(--ink); background:var(--bg-hover); }
  .icon-btn:focus-visible{ outline:none; box-shadow: var(--focus-ring); }

  .dot{display:inline-block; width:8px; height:8px; border-radius:999px; vertical-align:middle;}
  .dot.vc{background:var(--vc)} .dot.check{background:var(--check)} .dot.ach{background:var(--ach)}
  .dot.achp{background:var(--ach); outline:2px solid var(--ach-bg); outline-offset:1px;} .dot.sa{background:var(--ink-3)}
  .net{display:inline-flex; align-items:center; gap:8px; font-weight:500; font-size:14px;}

  .lvl-badge{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lvl-account{background:var(--lvl-account-bg); color:var(--lvl-account-fg);}
  .lvl-subaccount{background:var(--lvl-subaccount-bg); color:var(--lvl-subaccount-fg);}
  .lvl-zip{background:var(--lvl-zip-bg); color:var(--lvl-zip-fg);}
  /* In the table rows the level icon drops its coloured box and renders as a
     plain brand-blue glyph (Optum secondary blue, lighter than the navy used
     on buttons) — same treatment for every level. */
  .row.row-dynamic .cell-badge .lvl-badge{ background:transparent; color:var(--info); }
  /* Same treatment in the legacy / variant rows (opt-in, combined, unified)
     where the level icon is a direct grid child: no tinted box, brand-blue
     glyph — never the old beige fill. */
  .row.row-optinout > .lvl-badge,
  .row.row-combined > .lvl-badge,
  .row.row-unified > .lvl-badge{ background:transparent; color:var(--info); }
  /* Level label sits ABOVE the row name. The name is the primary
     identifier — keep this label muted gray (regardless of level) so
     it reads as quiet metadata. The colored level badge to the left
     still carries the visual coding for Account / Sub-account / Zip. */
  .lvl-label{font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
  .lvl-label.account,
  .lvl-label.subaccount,
  .lvl-label.zip{ color:var(--ink-3); }

  .row{display:grid; grid-template-columns:32px 22px 44px 1fr 300px 90px; align-items:stretch; padding:16px 22px; border-top:1px solid var(--line); position:relative; transition: background .15s; z-index:1;}
  /* Cells fill the full row height so backgrounds (hover/selected) paint
     edge-to-edge and the vertical column dividers span the entire row,
     not just the centered content. Content inside each cell stays
     vertically centered via the cell's own flex layout. */
  .row > *{ display:flex; align-items:center; min-height:0; }
  /* Entity cell stacks label / name / meta-ids vertically — keep them
     vertically centered as a group within the stretched cell. */
  .row > .cell-entity{ flex-direction:column; align-items:flex-start; justify-content:center; }
  /* Header cells stretch too so the column dividers align. */
  .head-strip{ align-items:stretch; }
  .head-strip > div{ display:flex; align-items:center; }
  /* When the row is hovered, lift it above siblings so any popover inside
     (rule-badge, priority tooltip, edit popover) can escape downward over
     the next row. */
  .surface > .row:hover{ z-index:100; }
  .surface > .row:focus-within{ z-index:100; }
  .row.row-combined{ grid-template-columns:32px 22px 44px 1fr 320px 160px 90px; }
  .head-strip.head-combined{ grid-template-columns:32px 22px 44px 1fr 320px 160px 90px; }
  /* Dynamic grid for row + head-strip — grid-template-columns is set
     inline (computed from the column visibility map). column-gap keeps
     cells from butting up against each other; total table width may
     exceed the viewport (horizontal scroll on the surface handles that). */
  .row.row-dynamic,
  .head-strip.head-dynamic{ column-gap:14px; width:max-content; min-width:100%; }
  /* Header cells stay on one line. If the label is wider than the
     column the text gets ellipsis instead of wrapping to a 2nd row
     (which would push every header line and break alignment). */
  .head-strip.head-dynamic > div{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  /* Sticky head cells must NOT clip their ::after gap-mask pseudo — that
     pseudo extends 14px past the cell to cover the column-gap. With
     overflow:hidden the mask was being clipped, letting scrolled text
     bleed through the gap. The Account name column also relies on a
     wider gradient mask that must escape the cell. */
  .head-strip.head-dynamic > div:nth-child(1),
  .head-strip.head-dynamic > div:nth-child(2),
  .head-strip.head-dynamic > div:nth-child(3),
  .head-strip.head-dynamic > .cell-entity{
    overflow:visible;
  }
  /* All grid items get min-width:0 so the dynamic minmax(…, 1fr) on the
     entity column doesn't expand based on its long content. Without
     this, the entity cell takes its min-content width, eating into the
     "1fr" budget and pushing every subsequent column to the right,
     breaking alignment with the header. */
  .row.row-dynamic > *{ min-width:0; }
  .row.row-dynamic > .left-edge{ min-width:auto; }
  /* Cell rendering for the new toggleable columns. Content stays on a
     single line (nowrap) but is never truncated — column widths in
     COL_WIDTHS are sized generously enough to fit common values. When
     the table overall is wider than the viewport, the surface scrolls
     horizontally and the entity (Account name) column stays sticky. */
  .row .cell-text{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--ink-2);
    white-space:nowrap;
  }
  .row .cell-text.cell-mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; color:var(--ink-2); }
  .row .cell-text.cell-num{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink); }
  /* Read-only Identity cells — softer tint signals "informational, not
     clickable" to differentiate from editable cells (dropdown, input,
     clickable-cell). The cell-mono variants already use --ink-3; the
     plain .cell-text on Identity needs to drop from --ink-2 to --ink-3
     for visual consistency. */
  .row .cell-text.cell-readonly,
  .row .cell-text.cell-readonly .cell-org{ color:var(--ink-2); }
  .row .cell-text.cell-readonly .cell-org svg{ color:var(--ink-3); }
  .row .cell-org{
    display:flex; align-items:center; gap:5px;
  }
  .row .cell-org svg{ color:var(--ink-3); flex-shrink:0; }
  .row .cell-org-name{ white-space:nowrap; }
  /* Entity column — keep the name on one line; full name shown. */
  .row .name{ white-space:nowrap; }
  /* Horizontal scroll on the surface when columns push beyond viewport.
     Sticky entity column stays pinned to the left at offset 98px (sum
     of the 3 utility cells: 32+22+44). z-index keeps it above the
     scrolling content; background masks what's behind. */
  .surface.surface-scroll-x{
    overflow-x:auto;
    overflow-y:visible;
    /* Hide the horizontal scrollbar — the right-edge shadow + sticky
       column cues already signal "scroll continues"; the OS bar adds
       visual noise without value. Scroll still works via trackpad /
       wheel / keyboard. */
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .surface.surface-scroll-x::-webkit-scrollbar{ display:none; }
  /* Frozen left columns — the first 4 grid items (checkbox, chevron,
     level badge, Account name) stay pinned to the left edge while the
     rest of the table scrolls horizontally. Each has its own `left`
     value that matches its natural cumulative offset, so they slot
     side-by-side without overlapping when scrolled. */
  /* Row — children order: [0]=left-edge (absolute, skipped) [1]=checkbox
     [2]=chevron [3]=badge [4]=entity. Header — [1]=checkbox [2]=empty
     [3]=empty [4]=Account name. Both share the same column widths. */
  .row.row-dynamic > div:nth-child(2),               /* checkbox (row) */
  .row.row-dynamic > div:nth-child(3),               /* chevron */
  .row.row-dynamic > .cell-badge,                    /* badge wrapper */
  .row.row-dynamic > .cell-entity,
  .head-strip.head-dynamic > div:nth-child(1),       /* checkbox (head) */
  .head-strip.head-dynamic > div:nth-child(2),       /* empty placeholder */
  .head-strip.head-dynamic > div:nth-child(3),       /* empty placeholder */
  .head-strip.head-dynamic > .cell-entity{
    position:sticky;
    z-index:10;
  }
  /* Head-strip sits ABOVE body rows in the surface stacking — both have
     sticky cells, but the head's row should win when columns scroll
     under so partial header labels never bleed through the body's
     non-sticky cells. */
  .head-strip.head-dynamic > div:nth-child(1),
  .head-strip.head-dynamic > div:nth-child(2),
  .head-strip.head-dynamic > div:nth-child(3),
  .head-strip.head-dynamic > .cell-entity{ z-index:20; }
  /* Light gray header band — the Abyss DataTable signals the header row
     with a subtle gray fill behind the column titles. */
  .head-strip.head-dynamic{ position:relative; z-index:15; background:var(--paper); }
  /* Subtle vertical column separators in the header band — the ruled-column
     cue from the Abyss DataTable, kept to the header so the dense body stays
     calm. Data columns only (skip the leading utility/entity sticky cells). */
  .head-strip.head-dynamic > div:nth-child(n+5){ padding-left:10px; }
  /* No vertical column dividers in the body — the ruled grid chopped the
     row-hover band into per-cell segments, reading as separate highlighted
     pieces. Dropping the border-left keeps the hover a single continuous
     row. Padding-left preserves the column spacing the rules used to give. */
  .row.row-dynamic > div:nth-child(n+6){ padding-left:10px; align-self:stretch; }
  /* Cumulative left offsets — checkbox 22, chevron 16, badge 32, entity 360.
     All offsets bumped by 22px so the sticky stack anchors at the row's
     natural padding-left (22px) instead of flush against the surface
     edge. That preserves the visual breathing room on the left when
     scrolling horizontally. The 0–22 area is masked by box-shadow on
     the checkbox cell (below). */
  .row.row-dynamic > div:nth-child(2),
  .head-strip.head-dynamic > div:nth-child(1)        { left:22px; }
  .row.row-dynamic > div:nth-child(3),
  .head-strip.head-dynamic > div:nth-child(2)        { left:58px; }   /* 22 + 22 + 14 */
  .row.row-dynamic > .cell-badge,
  .head-strip.head-dynamic > div:nth-child(3)        { left:88px; }   /* 58 + 16 + 14 */
  .row.row-dynamic > .cell-entity,
  .head-strip.head-dynamic > .cell-entity            { left:134px; }  /* 88 + 32 + 14 */
  /* Left rail mask: the checkbox cell paints its bg 22px to the LEFT
     via box-shadow, covering the row's left padding area. Without it,
     when scrolled horizontally, scrolling cells would be briefly
     visible between 0 and 22px before the checkbox. The --row-bg
     variable keeps it in sync with hover/selected/edited state. */
  .row.row-dynamic > div:nth-child(2),
  .head-strip.head-dynamic > div:nth-child(1){
    box-shadow: -22px 0 0 0 var(--row-bg);
  }
  /* Row bg as a CSS variable so sticky cells (and their pseudo-element
     gap-masks) follow hover / selected states without each rule needing
     to repeat the color. */
  .head-strip.head-dynamic                           { --row-bg:var(--paper); }
  .row.row-dynamic                                   { --row-bg:var(--paper); }
  /* The ROW CONTAINER (not just the sticky cells) must paint --row-bg, so
     the whole row — non-sticky cells + column gaps — shows the zebra /
     selected / edited tint. Without this the resting tint only appeared on
     the sticky first column. Hover/selected/edited !important rules below
     still override. */
  .row.row-dynamic                                   { background:var(--row-bg); }
  /* A legacy `.row.account-row { background:var(--paper) }` rule (same
     specificity, later in source) was hardcoding account rows white and
     beating the line above — so the resting/zebra tint never reached the
     container, only the sticky cells. This higher-specificity rule restores
     --row-bg on the dynamic account + child rows. */
  .row.row-dynamic.account-row,
  .row.row-dynamic.child-row                         { background:var(--row-bg); }
  /* No zebra striping — the table stays all white; columns are delineated
     by the light vertical dividers + horizontal row borders only (per the
     real product). Hover still tints the whole row. */
  .row.row-dynamic:hover                             { --row-bg:var(--row-hover); }
  .row.row-dynamic.is-selected                       { --row-bg:#EBF3FF; }
  /* Sticky cells use the row-bg variable to stay in sync. */
  .head-strip.head-dynamic > div:nth-child(1),
  .head-strip.head-dynamic > div:nth-child(2),
  .head-strip.head-dynamic > div:nth-child(3),
  .head-strip.head-dynamic > .cell-entity,
  .row.row-dynamic > div:nth-child(2),
  .row.row-dynamic > div:nth-child(3),
  .row.row-dynamic > .cell-badge,
  .row.row-dynamic > .cell-entity                    { background:var(--row-bg); }
  /* Badge wrapper — stretches to full row height (mask for horizontal
     scroll). The visual lvl-badge inside stays its inline size, centered. */
  .row.row-dynamic > .cell-badge{ display:flex; align-items:center; justify-content:flex-start; }
  /* Row hover/selected bg lives on the ROW container, not on each cell —
     that way the column-gap area (14px between cells) shows the same
     tint as the cells, producing a uniform band. Painting per-cell left
     the gaps showing through to the row's rest bg (white), which broke
     into white vertical strips between cells.
     Sticky cells still paint --row-bg (set above) so they stay opaque
     when content scrolls horizontally underneath. */
  .row.row-dynamic:hover                             { background:var(--row-hover) !important; }
  .row.row-dynamic.is-selected                       { background:#EBF3FF !important; }
  /* Edited / inherited tints must still win during hover. */
  /* Edited / inherited rows propagate the tint to `--row-bg` so the
     sticky cells (checkbox, chevron, badge, entity) pick it up too.
     Without this, the row body painted blue/amber but the sticky left
     stack kept the default paper bg, leaving a stark white slab on
     the left of each edited row. */
  .row.row-dynamic.is-edited                         { --row-bg:var(--edited-bg); }
  .row.row-dynamic.is-inherited.tint                 { --row-bg:var(--inherit-bg); }
  .row.row-dynamic.is-edited:hover                   { background:var(--edited-bg) !important; --row-bg:var(--edited-bg); }
  .row.row-dynamic.is-inherited.tint:hover           { background:var(--inherit-bg) !important; --row-bg:var(--inherit-bg); }
  /* No vertical column dividers — horizontal row separators already give
     enough structure; verticals just added noise (especially since they
     ended at the cell content edges rather than the row edges, leaving
     short floating lines). */
  /* Gap masks — each sticky cell renders a ::after pseudo-element that
     extends its background 14px to the right (covering the grid's
     column-gap). Without this, scrolling cell content slides through
     the transparent gap and shows behind the sticky cells. */
  .row.row-dynamic > div:nth-child(2)::after,
  .row.row-dynamic > div:nth-child(3)::after,
  .row.row-dynamic > .cell-badge::after,
  .head-strip.head-dynamic > div:nth-child(1)::after,
  .head-strip.head-dynamic > div:nth-child(2)::after,
  .head-strip.head-dynamic > div:nth-child(3)::after{
    content:"";
    position:absolute; top:0; bottom:0;
    left:100%; width:14px;
    background:var(--row-bg);
    pointer-events:none;
  }
  /* Last frozen column (Account name) — gap mask. The hairline + soft
     shadow that signals "scroll continues to the right" is only shown
     when the surface is actually scrolled (.is-scrolled-x), so at
     scrollLeft=0 there's no decorative noise. */
  .row.row-dynamic > .cell-entity::after,
  .head-strip.head-dynamic > .cell-entity::after{
    content:"";
    position:absolute; top:0; bottom:0;
    left:100%; width:14px;
    background:var(--row-bg);
    pointer-events:none;
    transition: box-shadow .15s ease, border-right-color .15s ease;
    border-right:1px solid transparent;
  }
  .surface.is-scrolled-x .row.row-dynamic > .cell-entity::after,
  .surface.is-scrolled-x .head-strip.head-dynamic > .cell-entity::after{
    border-right-color: var(--line);
    box-shadow: 6px 0 10px -4px rgba(35,34,32,.10);
    /* Hard cutoff — earlier iterations used a gradient fade past the
       sticky column to soften the seam, but the partially-transparent
       overlay revealed pill borders and input chrome behind it as
       faint "ghost boxes" per row, which read as broken. A clean
       cutoff (no fade) + hairline border + drop-shadow signals
       "content continues" without overlaying anything. */
    width: 14px;
    background: var(--row-bg);
  }
  /* No mask on the sibling cell — it gets cropped cleanly by the
     sticky entity's solid background instead of fading in. */
  /* Pill for 835 enrollment status — green check for enrolled, gray X
     for not enrolled. Matches the visual language used elsewhere. */
  /* Semantic status badge — Abyss Badge anatomy: small rounded-rect (not a
     pill) + bold coloured text on a light tint. Distinguishes status badges
     from the pill-shaped chips/buttons. */
  .cell-pill{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 8px; border-radius:6px;
    font-size:11px; font-weight:700;
    white-space:nowrap;
  }
  .cell-pill.is-ok{ background:var(--badge-success-bg); color:var(--badge-success-tx); }
  .cell-pill.is-off{ background:var(--badge-neutral-bg); color:var(--badge-neutral-tx); }
  /* In-table link (brand): info blue + underline, darkens to navy on hover.
     Used for primary identifiers that drill into a detail (e.g. NPI provider
     name). Keeps any hover tooltip on the same element. */
  .tbl-link{ color:var(--info); text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:1px; cursor:pointer; }
  .tbl-link:hover{ color:var(--navy); }
  /* Inline waterfall for network priority / distribution order — compact
     chips connected by chevrons. Current = bold + colored, others muted. */
  .cell-waterfall{
    display:inline-flex; align-items:center; gap:4px;
    flex-wrap:wrap;
    min-width:0; overflow:hidden;
  }
  /* Waterfall chips (network priority + distribution order): every step is a
     neutral filled chip (no border); the CURRENT/selected step reads as a
     primary button (dark navy fill + white text). */
  .cell-wf-step{
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px;
    background:var(--badge-neutral-bg); border:0;
    border-radius:6px;
    font-size:10.5px; font-weight:600; color:var(--badge-neutral-tx);
    white-space:nowrap;
  }
  .cell-wf-step.is-current{
    background:var(--navy);
    color:#fff;
    font-weight:700;
  }
  .cell-wf-step .dot{ width:5px; height:5px; }
  /* On the selected (navy) chip, the network dot + icon flip to white so they
     read against the dark fill, like a primary button. */
  .cell-wf-step.is-current .dot{ background:#fff !important; outline:none !important; }
  .cell-wf-step svg{ color:var(--badge-neutral-tx); opacity:.9; }
  .cell-wf-step.is-current svg{ color:#fff; opacity:1; }
  .cell-wf-arrow{ color:var(--ink-3); opacity:.5; font-size:11px; }
  /* Rollup variant — empty cell placeholder for rows where this column
     intentionally doesn't apply (Account rows skip priority/current;
     non-Account rows skip distribution). A quiet em-dash signals "n/a
     by design" so the cell isn't visually missing. */
  .cell-rollup-blank{ display:flex; align-items:center; }
  .cell-rollup-dash{ color:var(--ink-4); font-size:13px; }
  /* Rollup variant — stacked Network distribution bar at the Account
     row. Vertical stack: thin coloured bar on top, compact dot+label
     legend below. Mirrors the Overview "Network distribution" KPI so
     the metaphor reads the same wherever it appears. */
  /* Drop display:flex on the cell so the inner Tooltip wrap and bar
     wrap can take width:100% naturally. The Tooltip's .tip-wrap is
     inline-flex by default (content-sized), which collapses single-
     segment bars — force it to block so the bar always spans the cell. */
  .row .cell-text.cell-netdist{
    display:block; padding:0;
  }
  .row .cell-text.cell-netdist > .tip-wrap{
    display:block; width:100%;
  }
  .row .cell-text.cell-netdist .netdist-wrap{
    display:flex; flex-direction:column; gap:5px;
    width:100%; min-width:0;
    cursor:help;
  }
  .netdist-bar{
    display:flex; width:100%; height:8px;
    border-radius:999px; overflow:hidden;
    background:var(--ash);
  }
  .netdist-seg{ height:100%; min-width:2px; }
  .netdist-seg-vc   { background:var(--vc); }
  .netdist-seg-achp { background:var(--ach); position:relative; }
  .netdist-seg-achp::after{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.3) 0 3px, transparent 3px 6px);
  }
  .netdist-seg-ach  { background:var(--ach); }
  .netdist-seg-check{ background:var(--check); }
  .netdist-seg-sa   { background:var(--ink-3); }
  .netdist-legend{
    display:flex; flex-wrap:wrap; gap:6px 10px;
    font-size:10.5px; color:var(--ink-3);
    line-height:1.2;
  }
  .netdist-leg-item{
    display:inline-flex; align-items:center; gap:4px;
    white-space:nowrap;
  }
  .netdist-leg-item .dot{ width:5px; height:5px; }
  .netdist-leg-item b{ color:var(--ink-2); font-weight:600; }
  .netdist-leg-label{ color:var(--ink-3); }
  /* Columns picker — discreet btn + popover next to the toolbar's
     Expand all button. Lets the CSR add or remove columns to fit their
     workflow. Required columns lock the checkbox; "Coming next"
     columns surface the intent without being functional yet. */
  .cols-picker-wrap{ position:relative; display:inline-flex; }
  .cols-picker-btn{ position:relative; }
  .cols-picker-btn .cols-picker-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:16px; padding:0 5px;
    margin-left:2px;
    background:var(--ash); color:var(--ink-3);
    border-radius:999px;
    font-size:10.5px; font-weight:700; letter-spacing:0;
    font-variant-numeric:tabular-nums;
  }
  .cols-picker-btn.is-open{ background:var(--navy-soft); color:var(--navy); }
  .cols-picker-btn.is-open svg{ color:var(--navy); }
  .cols-picker-btn.is-open .cols-picker-count{ background:var(--paper); color:var(--ink-2); }
  .cols-picker-panel{
    position:absolute; top:calc(100% + 6px); right:0;
    z-index:150;
    width:720px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:10px;
    box-shadow: var(--elev-popover);
    padding:6px;
    animation: tipFade .12s ease-out;
  }
  .cols-picker-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px 6px;
    font-size:12px; font-weight:700; color:var(--ink);
  }
  .cols-picker-head-meta{
    font-size:10.5px; font-weight:600; color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }
  /* The 4 group columns sit side by side so the CSR sees every available
     column at a glance — no vertical scroll, no scanning past System to
     find Network. align-items:start lets each column be its own height
     instead of stretching to match the tallest. */
  .cols-picker-groups{
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap:8px;
    padding:4px;
    border-top:1px solid var(--line);
  }
  .cols-picker-group{
    padding:2px 0;
    min-width:0;
  }
  .cols-picker-group + .cols-picker-group{ border-top:0; }
  .cols-picker-group-label{
    padding:4px 8px 4px;
    font-size:9.5px; font-weight:700; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.07em;
  }
  .cols-picker-item{
    display:flex; align-items:center; gap:8px;
    padding:5px 8px; border-radius:6px;
    font-size:12.5px; color:var(--ink); cursor:pointer;
    transition: background .12s;
    min-width:0;
  }
  .cols-picker-item .cols-picker-item-label{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cols-picker-item:hover{ background:var(--bg-hover); }
  .cols-picker-item.is-locked,
  .cols-picker-item.is-todo{ cursor:default; }
  .cols-picker-item.is-todo{ color:var(--ink-3); }
  .cols-picker-item input[type=checkbox]{ flex-shrink:0; cursor:pointer; }
  .cols-picker-item input[type=checkbox]:disabled{ cursor:not-allowed; }
  .cols-picker-item-label{ flex:1; }
  .cols-picker-tag{
    flex-shrink:0;
    font-size:9.5px; font-weight:700; padding:1px 6px;
    border-radius:999px; letter-spacing:.04em;
  }
  .cols-picker-tag.is-locked{
    background:var(--ash); color:var(--ink-3);
  }
  .cols-picker-tag.is-todo{
    background:#FFF1E8; color:#B24516;
    text-transform:uppercase;
  }
  /* Unified Routing built-in dev preview chip — bottom-LEFT, compact
     single-line pill so it sits as a discreet reminder without taking
     real estate. Hint text only on hover. The Edit drawer's chip
     (also bottom-left) stacks above it via the explicit bottom offset. */
  .unified-devprev-floating{
    position:fixed; left:20px; bottom:20px;
    z-index:200;
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 8px 6px 10px;
    background:#232220; color:#fff;
    border-radius:999px;
    box-shadow: var(--elev-menu);
    animation: toastIn .2s ease-out;
    cursor:default;
  }
  .unified-devprev-label{
    display:inline-flex; align-items:center; gap:5px;
    font-size:9px; font-weight:700; color:rgba(255,255,255,.55);
    text-transform:uppercase; letter-spacing:.08em;
    white-space:nowrap;
  }
  .unified-devprev-dot{
    width:5px; height:5px; border-radius:50%; background:#FF612B;
    box-shadow: 0 0 0 2px rgba(255,97,43,.22);
  }
  .unified-devprev-segs{
    display:inline-flex; gap:2px;
    padding:2px; border-radius:999px;
    background:rgba(255,255,255,.06);
  }
  .unified-devprev-seg{
    display:inline-flex; align-items:center; justify-content:center;
    padding:4px 10px; font-size:10.5px; font-weight:600;
    background:transparent; border:0; border-radius:999px;
    color:rgba(255,255,255,.7); cursor:pointer; transition:all var(--t);
    white-space:nowrap;
  }
  .unified-devprev-seg:hover{ color:#fff; }
  .unified-devprev-seg.is-on{ background:#fff; color:var(--ink); }
  /* Hint hidden by default; only reveals on hover so the chip stays
     compact. Pops above the chip with a small panel. */
  .unified-devprev-hint{
    position:absolute; left:0; bottom:calc(100% + 8px);
    width:240px;
    background:#232220; color:rgba(255,255,255,.75);
    padding:10px 12px; border-radius:8px;
    font-size:10.5px; line-height:1.4;
    box-shadow: var(--elev-menu);
    opacity:0; pointer-events:none;
    transition: opacity .15s ease;
  }
  .unified-devprev-floating:hover .unified-devprev-hint{ opacity:1; }
  /* When the Edit drawer is open in Full mode, its chip lives at the
     same corner — bump it up so they stack. The Unified chip stays
     pinned to bottom:20px. */
  body:has(.edit-pop.as-drawer) .edit-devprev-floating{ bottom:80px; }
  /* Variant C (Unified) — drops the Distribution column. We shrink the
     network column slightly and push the Action cell with a left
     padding so the waterfall pills / rule badges never butt up against
     Edit + ⋮ menu on narrow viewports. */
  .row.row-unified{       grid-template-columns:32px 22px 44px 1fr 300px 170px; }
  .head-strip.head-unified{ grid-template-columns:32px 22px 44px 1fr 300px 170px; }
  .row.row-unified > .action{ padding-left:32px; }
  .head-strip.head-unified > div:last-child{ padding-left:32px; }
  .row:first-child{border-top:none;}
  .row:hover{background:var(--bg-hover);}
  /* Drawer mode — entire row becomes a click target for Edit. Inner
     interactive controls (checkbox, chevron, Edit button…) keep their
     own cursors and stop propagation handled in the JSX. */
  .row.row-clickable{ cursor:pointer; }
  .row.row-clickable input, .row.row-clickable .chev, .row.row-clickable .clickable-cell,
  .row.row-clickable .change-trigger, .row.row-clickable .btn, .row.row-clickable a{ cursor:auto; }
  .row.row-clickable .chev, .row.row-clickable .change-trigger, .row.row-clickable .btn{ cursor:pointer; }
  .row .left-edge{position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:14px 0 0 14px; background:transparent;}
  .row.is-edited .left-edge{background:var(--edited);}
  .row.is-inherited .left-edge{background:var(--inherit);}
  .row.is-edited{background:var(--edited-bg);}
  .row.is-inherited.tint{background:var(--inherit-bg);}
  .row.is-selected{background:var(--line);}
  /* When editing, lift the whole row above siblings so its popover doesn't get hidden.
     Higher-specificity selector to beat .row.account-row (which has its own z-index for sticky). */
  .row.is-editing-row,
  .row.account-row.is-editing-row,
  .row.child-row.is-editing-row{ z-index: 200 !important; }
  .indent-1{padding-left:56px;} .indent-2{padding-left:92px;}
  .row .name{font-size:15px; font-weight:600; color:var(--ink);}
  .row .meta{font-size:12px; color:var(--ink-2); margin-top:3px;}
  /* IDs inline with mini icons under the name */
  .meta-ids{ display:flex; align-items:center; gap:4px 10px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:4px; }
  .meta-id-item{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .meta-id-item svg{ flex-shrink:0; color:var(--ink-3); }
  .meta-id-item .id-val{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; }
  /* Distribution method pills (inline toggle Fax/Mail) */
  .dist-method-pills{ display:inline-flex; gap:4px; }
  .dist-method-pill{ padding:5px 12px; border-radius:999px; border:1px solid var(--line-2); font-size:12px; font-weight:600; color:var(--ink-2); cursor:pointer; transition:all var(--t); background:#fff; }
  .dist-method-pill:hover{ background:var(--navy-soft); }
  .dist-method-pill.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  /* Locked dist indicator (when network forces the delivery method) */
  .dist-locked{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--bg); color:var(--ink-2); font-size:12px; font-weight:600; border:1px dashed var(--line-2); }
  /* Per-row delivery rule note */
  .dist-note{ font-size:11px; color:var(--ink-3); margin-top:8px; display:flex; align-items:flex-start; gap:5px; line-height:1.4; }
  .dist-note svg{ flex-shrink:0; margin-top:1px; }
  /* Info icon next to locked dist pills */
  .dist-info-icon{ display:inline-flex; align-items:center; color:var(--ink-3); cursor:help; transition:color var(--t); }
  .dist-info-icon:hover{ color:var(--navy); }
  /* Wrapper for editable VC dist dropdown + its info icon. */
  .dist-cell-wrap{ display:inline-flex; align-items:center; gap:6px; }
  /* Info icon sitting after a column header label. Discreet by default,
     lifts to navy on hover so it reads as an affordance for context. */
  .head-info-icon{ display:inline-flex; align-items:center; margin-left:6px; color:var(--ink-3); cursor:help; transition:color var(--t); vertical-align:middle; }
  .head-info-icon:hover{ color:var(--navy); }
  /* Read-only distribution display — when the row's network locks the
     distribution (Check → Mail, ACH/SA → Digital) the value is not
     editable. Render it in a muted tone so the affordance reads as
     "informational" vs the editable dropdown used for VC. */
  .dist-line{ display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--ink-3); font-weight:500; }
  .dist-line svg{ color:var(--ink-4); }
  /* Info icon next to the locked dist value — match the muted tint. */
  .row .relative > .flex .dist-info-icon{ color:var(--ink-4); }
  .row .relative > .flex .dist-info-icon:hover{ color:var(--ink-3); }
  .dist-secondary{ color:var(--ink-2); font-weight:400; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
  /* Max amount displayed under the Virtual card pill */
  .net-max{ font-size:11px; color:var(--ink-3); margin-top:4px; font-weight:500; }
  /* Inline-edit controls inside cells — borderless at rest so they read
     as static text; reveal a subtle border on hover so the affordance
     is discoverable, and a navy focus ring on edit so the active field
     is clearly highlighted. Same dimensions as .clickable-cell so the
     vertical rhythm of the row doesn't shift when toggling fields. */
  .cell-input,
  .cell-select{
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    padding:4px 6px;
    margin:-4px -6px;
    font:inherit;
    color:inherit;
    outline:none;
    transition: all var(--t);
    max-width:100%;
    /* Strip native chrome — without this, the browser still paints a
       faint inset shadow / focus ring around the input even when CSS
       border + bg are transparent. That residue was visible as ghost
       boxes inside the entity gradient overlay during horizontal scroll. */
    appearance: none;
    -webkit-appearance: none;
  }
  .cell-input{ width:120px; }
  .cell-input:hover,
  .cell-select:hover{ border-color:var(--line-2); background:var(--paper); }
  .cell-input:focus,
  .cell-select:focus{ border-color:var(--navy); background:var(--paper); box-shadow:var(--focus-ring); }
  .cell-input-mono{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11.5px;
    color:var(--ink-3);
  }
  .cell-input-mono:focus{ color:var(--ink); }
  /* Money input — tabular numerics + bolder weight so the $ amount reads
     as a value vs the muted contact numbers. */
  .cell-input-money{
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--ink);
    width: 90px;
  }
  /* Money wrapper — keeps the $ glyph fixed to the LEFT of the editable
     input so the user only edits the number itself. The wrapper aligns
     them as a single visual unit without making the prefix part of the
     editable text. */
  .cell-money-wrap{
    display:inline-flex; align-items:baseline; gap:2px;
    font-variant-numeric: tabular-nums;
  }
  .cell-money-wrap .cell-money-prefix{
    color: var(--ink-3); font-weight: 500;
    pointer-events: none; user-select: none;
  }
  .cell-money-wrap.is-search-match .cell-input-money{
    background: #FFF3A6 !important;
    color: var(--ink);
  }
  /* Contact wrapper — mirrors .cell-money-wrap but for phone / fax
     fields. A discreet glyph (phone receiver / printer) sits to the
     LEFT of the input as a non-editable affordance so users can
     distinguish the two columns at a glance when scanning vertically. */
  .cell-contact-wrap{
    display:inline-flex; align-items:center; gap:6px;
  }
  .cell-contact-wrap .cell-contact-icon{
    color: var(--ink-3);
    flex-shrink:0;
    pointer-events:none;
    display:inline-flex;
  }
  /* Phone / fax input — reads as plain dark text at rest (no border, no
     bg) so it blends with surrounding cells; only morphs into a visible
     input on hover/focus, revealing the editable affordance once the
     user shows intent. */
  .cell-input-active{
    width: 120px;
    color: var(--ink);
    font-weight: 500;
  }
  .cell-input-active:hover{ border-color: var(--line-2); background: var(--paper); }
  .cell-input-active:focus{ border-color: var(--navy); background: var(--paper); box-shadow: var(--focus-ring); }
  /* Search match — when the input value contains the active search query,
     paint it with the same yellow highlight as <mark> on other cells so
     the match is visible while typing, even though native <input> can't
     embed <mark> children. */
  .cell-input-active.is-search-match{
    background: #FFF3A6 !important;
    color: var(--ink);
  }
  /* Custom on-brand dropdown for cell-level edits (replaces native
     <select> which renders OS-styled menus). Trigger reads like
     quiet text + caret; menu pops below with icon + check, navy
     focus ring on open. */
  .cell-dropdown{ position:relative; display:inline-flex; }
  .cell-dropdown-trigger{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 8px;
    border:1px solid var(--line-2); border-radius:6px;
    background:var(--paper); cursor:pointer;
    font:inherit; color:var(--ink);
    transition: all var(--t);
  }
  .cell-dropdown-trigger:hover{ border-color:var(--ink-3); }
  .cell-dropdown-trigger.is-open{ border-color:var(--navy); box-shadow:var(--focus-ring); }
  .cell-dropdown-trigger svg{ color:var(--ink-2); flex-shrink:0; }
  .cell-dropdown-trigger .cell-dropdown-caret{ color:var(--ink-3); margin-left:2px; transition: transform var(--t); }
  .cell-dropdown-trigger.is-open .cell-dropdown-caret{ transform: rotate(180deg); color:var(--navy); }
  .cell-dropdown-menu{
    position:absolute; top:calc(100% + 4px); left:0;
    z-index:120;
    min-width:140px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:8px;
    box-shadow: var(--elev-menu);
    padding:4px;
    animation: tipFade .12s ease-out;
  }
  .cell-dropdown-item{
    display:flex; align-items:center; gap:8px;
    width:100%;
    padding:7px 8px 7px 10px;
    border:0; border-radius:6px;
    background:transparent; cursor:pointer;
    font:inherit; color:var(--ink); text-align:left;
    font-size:13px;
    transition: background var(--t);
  }
  .cell-dropdown-item:hover{ background:var(--bg-hover); }
  .cell-dropdown-item.is-selected{ font-weight:600; color:var(--ink); }
  .cell-dropdown-item .cell-dropdown-item-label{ flex:1; }
  .cell-dropdown-item .cell-dropdown-check{ color:var(--navy); flex-shrink:0; }
  .cell-dropdown-item svg:first-child{ color:var(--ink-2); flex-shrink:0; }
  /* Clickable value cells (Network pill, Distribution display) — Notion-style */
  .clickable-cell{ cursor:pointer; border-radius:6px; padding:4px 6px; margin:-4px -6px; transition: background var(--t); position:relative; display:inline-block; }
  /* Slightly darker warm tone so the affordance stays visible BOTH on a
     paper row (warm tint over white) AND on a hovered row (deeper tint
     over the cream band) — picking pure white here broke the hover band
     when both states stacked. */
  .clickable-cell:hover{ background: var(--horizon); }
  .clickable-cell.is-editing-cell{ background: var(--navy-soft); }
  /* When the whole row is clickable (.row-clickable), the per-cell
     hover bg becomes a double-hover artifact — the entity name lights
     up FIRST and the row's band follows a frame later, reading as a
     glitch. Suppress the cell-level hover bg in that context so the
     row hover wins exclusively. The editing-cell tint still wins via
     its own rule below. */
  .row.row-clickable .clickable-cell:hover{ background: transparent; }
  .row.row-clickable .clickable-cell.is-editing-cell{ background: var(--navy-soft); }
  /* Fax number displayed under the Fax label (mirrors .net-max styling) */
  .dist-sub{ font-size:11px; color:var(--ink-3); margin-top:4px; font-weight:500; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* Inline fax input */
  .fax-input{ display:inline-flex; align-items:center; gap:6px; margin-left:8px; }
  .fax-input input{ width:120px; padding:5px 10px; border:1px solid var(--line-2); border-radius:6px; font-size:13px; outline:none; transition:all var(--t); background:#fff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fax-input input:hover{ border-color: var(--ink-3); }
  .fax-input input:focus{ border-color:var(--navy); box-shadow: var(--focus-ring); }
  .fax-input .lbl{ font-size:11px; color:var(--ink-3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  /* Section header for split tables */
  .section-h{ display:flex; align-items:baseline; gap:10px; margin-top:24px; margin-bottom:10px; }
  .section-h:first-child{ margin-top:0; }
  .section-h h3{ font-size:13px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:.06em; }
  .section-h .sub{ font-size:12px; color:var(--ink-2); }
  /* Table tabs — for split view (Network / Distribution) */
  .table-tabs{ display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  /* Level tabs render as soft pills: inactive = brand-blue text (regular),
     selected = subtle light-blue fill with dark-grey bold text, hover = very
     light grey. No underline — the fill carries the active state. */
  .table-tab{ padding:10px 16px 12px; font-size:14px; font-weight:400; color:var(--info); border:none; border-radius:8px 8px 0 0; cursor:pointer; margin-bottom:0; display:inline-flex; align-items:center; gap:6px; background:transparent; transition:background .12s, color .12s; }
  /* Tab icons render as a brand-blue glyph (same as level icons in rows);
     opacity carries the active state. */
  .table-tab .lvl-badge{ background:transparent; color:var(--info); opacity:.6; transition:opacity .15s; }
  .table-tab:hover{ background:#F2F2F1; }
  .table-tab:hover .lvl-badge{ opacity:.85; }
  .table-tab.active{ color:var(--ink); font-weight:700; background:rgba(0,117,201,.10); }
  .table-tab.active .lvl-badge{ opacity:1; }
  /* Count chip stays neutral always (incl. active) — the Neutral badge tint. */
  .table-tab .tab-count{ font-size:11px; padding:1px 7px; border-radius:999px; background:var(--badge-neutral-bg); color:var(--badge-neutral-tx); font-weight:700; }
  .table-tab.active .tab-count{ background:var(--badge-neutral-bg); color:var(--badge-neutral-tx); }
  /* Exclusion rules trigger — sits on the tabs row, right-aligned, but is
     not a tab. Neutral chip-style so it doesn't compete with brand orange. */
  /* Outlined brand button — same as the Edit button: navy border, navy
     text + icon, soft navy hover fill. */
  .exclusion-trigger{ margin-left:auto; align-self:center; display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--navy); border-radius:999px; background:var(--paper); color:var(--navy); font-size:12.5px; font-weight:600; cursor:pointer; transition:all .12s; position:relative; }
  .exclusion-trigger:hover{ border-color:var(--navy); color:var(--navy); background:var(--navy-soft); }
  .exclusion-trigger svg{ color:var(--navy); }
  /* "Linked" state — fires while the Heads-up banner is visible. A subtle
     looped pulse using the same warning yellow as the banner, so the user
     intuits "the button is the home of those rules". */
  .exclusion-trigger.is-linked{
    background:#FFFBE0; border-color:var(--inherit); color:#5C4A00;
    animation: exclLinkedPulse 2.4s ease-in-out infinite;
  }
  .exclusion-trigger.is-linked svg{ color:var(--inherit); }
  .exclusion-trigger.is-linked:hover{ background:#FFF5C2; }
  @keyframes exclLinkedPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(173,141,1,0); }
    50%      { box-shadow: 0 0 0 6px rgba(173,141,1,.18); }
  }
  /* "Just relocated" state — one-shot ~1s flash right after the banner
     gets dismissed, so the user sees where the warning went. */
  .exclusion-trigger.just-relocated{
    animation: exclRelocate 1.1s ease-out 1;
  }
  @keyframes exclRelocate {
    0%   { background:#FFFBE0; border-color:var(--inherit); box-shadow: 0 0 0 0 rgba(173,141,1,.55); transform:scale(1); }
    35%  { background:#FFF5C2; border-color:var(--inherit); box-shadow: 0 0 0 10px rgba(173,141,1,.0); transform:scale(1.04); }
    100% { background:var(--paper); border-color:var(--line); box-shadow: 0 0 0 0 rgba(173,141,1,0); transform:scale(1); }
  }
  .exclusion-count{ font-size:10.5px; font-weight:700; background:var(--bg-hover); color:var(--ink-2); padding:1px 7px; border-radius:999px; }
  /* Exclusion rules sheet — full-viewport drawer with a card list. Each card
     leads with the rule name (the primary thing the CSR is looking for) and
     stacks meta (created/effective/status) above it in muted small text. */
  .exclusion-sheet{ width:100vw; max-width:100vw; }
  .exclusion-sheet > .edit-content{ padding:24px 32px 16px; max-width:1120px; margin:0 auto; width:100%; }
  .exclusion-sheet > .edit-bottom{ padding:14px 32px 18px; }
  /* Override flex utility classes on .edit-actions so the Close button can
     stretch full-width. !important needed because Tailwind utilities load
     after this stylesheet block. */
  .exclusion-sheet > .edit-bottom .edit-actions{
    display:block !important; width:100% !important; max-width:none !important;
  }
  .exclusion-sheet > .edit-bottom .edit-actions .btn,
  .exclusion-sheet > .edit-bottom .edit-actions .btn-quiet{
    display:block !important; width:100% !important; box-sizing:border-box;
    justify-content:center; text-align:center; padding-top:11px; padding-bottom:11px;
  }
  /* Toolbar — search input + active-only toggle */
  .excl-toolbar{ display:flex; align-items:center; gap:10px; margin-top:14px; margin-bottom:14px; }
  .excl-search{ position:relative; flex:1; }
  .excl-search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; }
  .excl-search input{
    width:100%; padding:9px 12px 9px 34px; font-size:13.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line-2); border-radius:8px;
    transition:border-color var(--t), box-shadow var(--t);
  }
  .excl-search input::placeholder{ color:var(--ink-3); }
  .excl-search input:focus{ outline:none; border-color:var(--navy); box-shadow:var(--focus-ring); }
  .excl-filter{
    display:inline-flex; align-items:center; gap:8px; padding:7px 13px;
    font-size:12.5px; font-weight:600; color:var(--ink-2);
    background:var(--paper); border:1px solid var(--line-2); border-radius:999px;
    cursor:pointer; transition:all var(--t); white-space:nowrap;
  }
  .excl-filter:hover{ border-color:var(--ink-3); color:var(--ink); }
  .excl-filter.is-on{ background:var(--navy-soft); border-color:var(--navy); color:var(--navy); }
  .excl-filter .check{ width:14px; height:14px; border-radius:3px; border:1.5px solid currentColor; display:inline-flex; align-items:center; justify-content:center; }
  .excl-filter.is-on .check{ background:var(--navy); border-color:var(--navy); color:#fff; }
  /* Scope filter — bare funnel icon (no text, no border), matches the
     col-filter pattern from the table head. Active state tints to navy. */
  .excl-scope-filter{ position:relative; display:inline-flex; align-items:center; }
  .excl-scope-filter .trigger{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; padding:0; border:none; border-radius:8px;
    background:transparent; color:var(--ink-3); cursor:pointer;
    transition:all var(--t);
  }
  .excl-scope-filter .trigger:hover{ color:var(--navy); background:var(--navy-soft); }
  .excl-scope-filter .trigger.is-on{ color:var(--navy); background:var(--navy-soft); }
  /* Pill variant — used when the funnel trigger also shows a label
     (e.g. "Entity ▾" / "Change ▾"). Auto width, pill border, navy when on. */
  .excl-scope-filter .trigger.with-label{
    width:auto; height:auto; padding:7px 12px;
    border:1px solid var(--line-2); background:var(--paper);
    color:var(--ink-2); font-size:12.5px; font-weight:600;
    border-radius:999px; gap:6px;
  }
  .excl-scope-filter .trigger.with-label:hover{
    background:var(--bg-hover); border-color:var(--ink-3); color:var(--ink);
  }
  .excl-scope-filter .trigger.with-label.is-on{
    background:var(--navy-soft); border-color:var(--navy); color:var(--navy);
  }
  .excl-scope-filter .menu{
    position:absolute; top:calc(100% + 6px); right:0; z-index:50;
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    box-shadow:var(--shadow-lg); min-width:200px; padding:6px;
    animation:fadeIn .12s ease-out;
  }
  .excl-scope-filter .menu button{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:8px 10px; font-size:13px; color:var(--ink); text-align:left;
    background:transparent; border:none; border-radius:6px; cursor:pointer;
    transition:background var(--t);
  }
  .excl-scope-filter .menu button:hover{ background:var(--bg-hover); }
  .excl-scope-filter .menu button .opt-icon{
    width:20px; height:20px; border-radius:5px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .excl-scope-filter .menu button .opt-label{ flex:1; }
  .excl-scope-filter .menu button .opt-count{
    font-size:11px; font-weight:600; color:var(--ink-3);
    background:var(--ash); padding:1px 7px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .excl-scope-filter .menu button .opt-check{ width:14px; color:var(--navy); flex-shrink:0; margin-left:2px; }
  .excl-scope-filter .menu button.is-on{ font-weight:600; color:var(--navy); background:var(--navy-soft); }
  .excl-scope-filter .menu button.is-on .opt-count{ background:#fff; color:var(--navy); }
  /* Disabled-looking option when its count is 0 — mutes label, icon and
     chip so the user can see it exists but it's not meaningful right now. */
  .excl-scope-filter .menu button.is-empty{ color:var(--ink-4); cursor:default; }
  .excl-scope-filter .menu button.is-empty:hover{ background:transparent; }
  .excl-scope-filter .menu button.is-empty .opt-icon{ opacity:.45; }
  .excl-scope-filter .menu button.is-empty .opt-count{ background:transparent; color:var(--ink-4); }
  /* Section header inside the filter menu — small uppercase label that
     separates filter groups (Scope · Status). */
  .excl-scope-filter .menu .menu-section{
    font-size:10px; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    padding:8px 10px 4px;
  }
  .excl-scope-filter .menu .menu-divider{
    height:1px; background:var(--line); margin:6px 4px;
  }
  /* The "Active only" entry needs a leading checkbox-style indicator. */
  .excl-scope-filter .menu button .opt-tickbox{
    width:14px; height:14px; border-radius:3px;
    border:1.5px solid var(--line-2); flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--paper); color:#fff; transition:all var(--t);
  }
  .excl-scope-filter .menu button.is-on .opt-tickbox{
    background:var(--navy); border-color:var(--navy);
  }
  /* Card list — visual hierarchy mirrors the main entity table:
       1. Rule name = entity title (top, bold)
       2. Scope line = subtitle (level icon + scope ref, like "# 87708 · Engine")
       3. Created/effective dates = quiet meta below (like "Max $10,000")
       4. Status = discreet chip pinned to top-right corner */
  /* Result count line — uniform muted line, no bolds or color shifts. */
  .excl-count{
    font-size:12px; color:var(--ink-3); font-weight:400;
    margin:4px 2px 10px;
    font-variant-numeric:tabular-nums;
  }
  .excl-list{ display:flex; flex-direction:column; gap:12px; }
  /* Proper card layout — white surface, soft shadow + thin border, rounded.
     Modern layered shadow gives the cards a subtle lift so each one is
     clearly its own block without heavy borders. */
  .excl-card{
    position:relative;
    background:var(--paper);
    border:1px solid #ECEAE5; border-radius:10px;
    padding:14px 16px;
    display:flex; flex-direction:column; align-items:flex-start;
    box-shadow: 0 1px 2px rgba(35,34,32,.04), 0 0 0 1px rgba(35,34,32,.01);
    transition: border-color var(--t), box-shadow var(--t), transform var(--t);
  }
  .excl-card > .excl-card-rule,
  .excl-card > .excl-rule-row,
  .excl-card > .excl-meta{ width:100%; }
  .excl-card:hover{
    border-color:var(--ink-4);
    box-shadow: 0 4px 12px rgba(35,34,32,.07), 0 1px 3px rgba(35,34,32,.05);
  }
  /* Status chip — sits as its own line on top of the rule, left-aligned. */
  .excl-card .excl-status{
    position:static !important;
    margin-bottom:8px;
    align-self:flex-start;
  }
  /* Rule name — same weight/size as the entity name in the main table */
  .excl-card-rule{
    font-size:15px; font-weight:500; color:var(--ink); line-height:1.45;
    margin-bottom:2px;
    word-break:break-word;
  }
  /* Scope line — mimics the entity subtitle "# 87708 · 🏛 UnitedHealthcare …".
     Uses the same LevelBadge as the tabs/table, then scope-ref in ink-2,
     all at 12.5px and var(--ink-3) for separators. */
  .excl-scope-line{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:12px; font-size:12.5px; color:var(--ink-3); line-height:1.4;
  }
  .excl-scope-line .lvl-badge{ width:16px; height:16px; border-radius:5px; background:var(--ash) !important; color:var(--ink-3) !important; }
  .excl-scope-line .lvl-badge svg{ width:9px; height:9px; }
  .excl-scope-line .scope-kind{ font-weight:500; color:var(--ink-3); }
  .excl-scope-line .scope-ref{ color:var(--ink-3); font-weight:400; }
  .excl-scope-line .sep{ color:var(--ink-3); opacity:.5; }
  /* Created / effective / applied-to meta — vertical list, one item per row.
     Icon + small uppercase label + value, with the value's key parts in
     bold so the eye lands on the data, not the chrome. */
  .excl-meta{
    margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex; flex-direction:column; gap:6px;
  }
  .excl-meta-row{
    display:grid; grid-template-columns:18px 86px 1fr;
    align-items:center; gap:10px;
    font-size:12.5px; color:var(--ink-2); line-height:1.4;
  }
  .excl-meta-icon{
    color:var(--ink-3); display:inline-flex;
  }
  .excl-meta-label{
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-3);
  }
  .excl-meta-val{ color:var(--ink-2); }
  .excl-meta-val b{ color:var(--ink); font-weight:600; }
  /* Pill-style toggle at the bottom of each card. */
  .excl-card-more{
    align-self:flex-start; margin-top:12px;
    display:inline-flex; align-items:center; gap:6px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px;
    font-size:11.5px; font-weight:600; color:var(--ink-2);
    cursor:pointer; transition:all var(--t);
  }
  .excl-card-more:hover{ border-color:var(--ink-3); background:var(--bg-hover); color:var(--ink); }
  .excl-card-more svg{ transition:transform .15s ease; }
  .excl-card-more.is-open svg{ transform:rotate(180deg); }
  /* Reason — plain text with a warning icon, no chip background so it
     reads as supporting context rather than another tag/status. */
  .excl-card-reason{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-3); font-size:12px; font-weight:500;
    margin-top:8px;
  }
  .excl-card-reason svg{ color:var(--ink-3); flex-shrink:0; }
  /* Status chip — discreet pill anchored to the bottom-right corner of the
     card, sharing the baseline with the "See more details" toggle. Color
     reflects state: green active, amber scheduled, gray paused. */
  .excl-status{
    position:absolute; bottom:18px; right:20px;
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600;
    padding:2px 9px; border-radius:999px;
  }
  .excl-status .dot{ width:6px; height:6px; border-radius:999px; background:currentColor; }
  .excl-status-active{ color:#066605; background:#E0F3DF; }
  .excl-status-paused{ color:var(--ink-3); background:var(--ash); }
  /* Scheduled — pending future effective date. Gray (not amber) to keep
     it clearly distinct from Active without competing visually. */
  .excl-status-scheduled{ color:var(--ink-3); background:var(--ash); }
  .excl-empty{ padding:40px 20px; text-align:center; color:var(--ink-3); font-size:13px; }

  /* Priority info icon — payer's fallback waterfall (read-only, informational only) */
  .priority-info{ display:inline-flex; align-items:center; margin-left:8px; color:var(--ink-3); cursor:help; vertical-align:middle; transition:color var(--t); position:relative; }
  .priority-info:hover{ color:var(--navy); }
  /* Custom tooltip — appears on hover with styled content */
  .tip-wrap{ position:relative; display:inline-flex; }
  .tip-panel{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--tip-bg); color:#fff; padding:10px 12px; border-radius:8px;
    font-size:11.5px; white-space:nowrap; z-index:9999; pointer-events:none;
    box-shadow: var(--elev-tooltip);
    animation: tipFade .12s ease-out;
  }
  .tip-panel::after{ content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--tip-bg); }
  .tip-panel.tip-align-right::after{ left:auto; right:10px; transform:none; }
  .tip-panel.tip-align-left::after{ left:10px; right:auto; transform:none; }
  /* Below-placement variant — flips the panel under the trigger and points
     the arrow upward. Use when there isn't enough room above (e.g. trigger
     is near the top of the drawer). */
  .tip-panel.tip-place-below{ bottom:auto; top:calc(100% + 8px); }
  .tip-panel.tip-place-below::after{ top:auto; bottom:100%; border-top-color:transparent; border-bottom-color:var(--tip-bg); }
  /* Descendants list inside a tooltip */
  .tip-desc-list{ display:flex; flex-direction:column; gap:6px; }
  .tip-desc-list .desc-title{ font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; opacity:.65; margin-bottom:2px; font-weight:700; }
  .tip-desc-row{ display:flex; align-items:center; gap:8px; font-size:12px; line-height:1.35; }
  .tip-desc-row .desc-lvl-icon{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; background:rgba(255,255,255,.10); color:#fff; flex-shrink:0; }
  .tip-desc-row .desc-lvl-name{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.65; font-weight:600; min-width:62px; }
  .tip-desc-row .desc-entity{ color:#fff; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  /* Impact rows for the location-scope tooltip — icon + label on one line,
     value on the right, helper sub-line below. */
  .tip-impact-row{ display:grid; grid-template-columns:18px 1fr auto; column-gap:8px; row-gap:2px; align-items:center; padding:6px 0; border-top:1px solid rgba(255,255,255,.08); }
  .tip-impact-row:first-of-type{ border-top:none; }
  .tip-impact-row .ti-icon{ color:rgba(255,255,255,.7); display:inline-flex; }
  .tip-impact-row .ti-label{ color:#fff; font-weight:600; font-size:12px; }
  .tip-impact-row .ti-val{ color:#fff; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; }
  .tip-impact-row .ti-sub{ grid-column:2 / 4; font-size:11px; color:rgba(255,255,255,.55); line-height:1.35; }
  /* When .wrap is added (e.g. cascade tooltip in drawer mode) names wrap
     instead of truncating so long entity names like "UHC Ins. Co. of the
     River Valley" stay legible. */
  .tip-desc-row .desc-entity.wrap{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.35; }
  .tip-desc-more{ font-size:11px; opacity:.6; margin-top:2px; }
  .tip-panel .tip-title{ font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; opacity:.65; margin-bottom:5px; font-weight:700; }
  .tip-panel .tip-waterfall{ display:flex; align-items:center; gap:4px; }
  .tip-panel .tip-step{ display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:4px; font-weight:500; opacity:.7; }
  .tip-panel .tip-step.active{ background:rgba(255,255,255,.14); opacity:1; font-weight:700; }
  .tip-panel .tip-step .dot{ width:6px; height:6px; }
  .tip-panel .tip-arrow{ opacity:.45; font-size:10px; }
  /* Keep the fade-in but DON'T touch transform — the panel's transform is
     already controlled by the alignment (center → translateX(-50%),
     right/left → none). Animating transform here would override the
     align style and snap the panel to a different position. */
  @keyframes tipFade { from { opacity:0; } to { opacity:1; } }
  .row .path{font-size:11px; color:var(--ink-3); margin-top:2px;}
  /* Quiet count line for ZIPs that exist under multiple sub-accounts —
     replaces the regular path so the row stays at the same vertical
     rhythm. The numbers are bumped slightly so the eye lands on counts
     first; full names live in the hover tooltip. */
  .row .path.zip-dup-hint{
    color:var(--ink-2); cursor:help;
    display:inline; white-space:nowrap;
  }
  .row .path.zip-dup-hint b{ color:var(--ink); font-weight:700; }
  .row .path.zip-dup-hint .zip-dup-hint-sep{ color:var(--ink-3); opacity:.45; margin:0 6px; }
  .row .path.zip-dup-hint:hover{ color:var(--ink); }
  /* Hover panel — lists every account / sub-account where this ZIP
     appears, grouped, with a one-line hint pointing the CSR to the
     toolbar search if they want to narrow down further. Colors are
     tuned for the dark tooltip surface (#232220) — white-on-dark for
     primary text, semi-transparent white for secondary, with the hint
     separated by extra spacing and dimmed further to read as
     supplementary copy rather than a primary message. */
  .zip-dup-tip{ font-size:12px; color:#fff; min-width:240px; }
  .zip-dup-tip-title{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; color:#fff;
    margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .zip-dup-tip-title-zip{
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 7px; background:rgba(255,97,43,.18);
    color:#FFB388; border-radius:4px;
    font-size:11px; font-weight:700; letter-spacing:.02em;
  }
  .zip-dup-tip-section{ margin-bottom:10px; }
  .zip-dup-tip-section:last-of-type{ margin-bottom:0; }
  .zip-dup-tip-label{
    font-size:9.5px; font-weight:700; color:rgba(255,255,255,.55);
    text-transform:uppercase; letter-spacing:.08em;
    margin-bottom:6px;
  }
  .zip-dup-tip-list{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column; gap:4px;
  }
  .zip-dup-tip-list li{
    font-size:12px; color:rgba(255,255,255,.92);
    padding:3px 8px 3px 18px;
    background:rgba(255,255,255,.05); border-radius:5px;
    position:relative; white-space:normal; line-height:1.35;
  }
  .zip-dup-tip-list li::before{
    content:""; position:absolute; left:8px; top:50%;
    transform:translateY(-50%);
    width:4px; height:4px; border-radius:50%;
    background:rgba(255,255,255,.4);
  }
  .zip-dup-tip-hint{
    margin-top:14px; padding-top:10px;
    border-top:1px dashed rgba(255,255,255,.14);
    font-size:10.5px; line-height:1.4;
    color:rgba(255,255,255,.45); font-style:italic;
  }

  /* Account rows are sticky for orientation, but no extra bg colour by default
     (avoids clashing with selection / edited / inherited tints). The white bg
     keeps the row opaque when content scrolls under it. */
  .row.account-row{
    background:var(--paper);
    border-top:1px solid var(--line-2);
    position:sticky; top:38px; z-index:5;
  }
  .row.account-row:first-child{ border-top:none; }
  /* Account row has its own bg (sticky overlay) — must restate hover with
     matching specificity so it beats .row.account-row{ background:var(--paper) } */
  .row.account-row:hover{ background:var(--bg-hover); }
  .row.account-row .name{ font-size:15px; font-weight:600; }
  /* State bgs need to override account-row's white background — higher specificity */
  .row.account-row.is-edited{ background:var(--edited-bg); }
  .row.account-row.is-inherited.tint{ background:var(--inherit-bg); }
  .row.account-row.is-selected{ background:var(--line); }

  /* tree connectors removed — hierarchy reads from indent + level badge + sticky Account header */

  /* Edit popover breadcrumb — confirms exact scope before save */
  .edit-bc{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 10px; background:var(--bg); border-radius:8px;
    margin-bottom:12px; font-size:12px;
  }
  .edit-bc .sep{ color:var(--ink-3); }
  .edit-bc .crumb{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); }
  .edit-bc .crumb.current{ color:var(--ink); font-weight:700; }

  /* Custom-preference chip — row's network differs from its parent (set manually) */
  .chip-override{
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px 2px 7px; border-radius:999px;
    background:var(--inherit-bg); color:var(--ink);
    font-size:11px; font-weight:600;
    border:1px solid #FD602B; margin-left:10px;
  }
  .chip-override svg{ color:var(--warn); }

  /* Expand/collapse all button */
  .expand-toggle{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px;
    border-radius:8px; font-size:12px; font-weight:600; color:var(--ink-2);
    background:var(--paper); border:1px solid var(--line-2); cursor:pointer; transition:all .15s;
  }
  .expand-toggle:hover{ background:var(--navy-soft); border-color:var(--navy); color:var(--navy); }

  .action{display:flex; justify-content:flex-end; position:relative;}
  .change-trigger{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; font-weight:600; font-size:13px; background:var(--paper); color:var(--navy); border:1px solid var(--navy); cursor:pointer; transition:all .15s; white-space:nowrap;}
  .change-trigger:hover{background:var(--navy-soft); border-color:var(--navy);}
  .change-trigger.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  /* Bulk-mode dimming — when one or more rows are selected, the per-row
