  /* Custom select for the calculator form — built to match the height,
     border, radius and focus treatment of the sibling text inputs so
     the form reads as a single homogenous block. Native <select>
     replaced because its dropdown menu inherits OS chrome (rounded
     macOS sheet, Chrome's flat menu …) which clashes with the rest
     of the app's visual language. */
  .calc-select{ position:relative; }
  .calc-select-trigger{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; width:100%; height:38px;
    padding:0 12px;
    border:1px solid var(--line-2); border-radius:8px;
    background:#fff; color:var(--ink);
    font:inherit; font-size:13.5px;
    cursor:pointer; outline:none; transition:all var(--t);
  }
  .calc-select-trigger:hover{ border-color:var(--ink-3); }
  .calc-select-trigger:focus-visible,
  .calc-select-trigger.is-open{ border-color:var(--navy); box-shadow:var(--focus-ring); }
  .calc-select-value{
    flex:1; min-width:0;
    text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .calc-select-caret{ color:var(--ink-3); flex-shrink:0; transition:transform var(--t); }
  .calc-select-trigger.is-open .calc-select-caret{ transform:rotate(180deg); color:var(--navy); }
  /* Popover menu — same surface treatment as the cell-level dropdown
     used in the table, scaled up for the form. */
  .calc-select-menu{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    z-index:120;
    max-height:260px; overflow-y:auto;
    background:var(--paper); border:1px solid var(--line);
    border-radius:10px;
    box-shadow: 0 12px 28px rgba(35,34,32,.14), 0 2px 6px rgba(35,34,32,.06);
    padding:5px;
    animation: tipFade .12s ease-out;
  }
  .calc-select-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 10px;
    border:0; border-radius:6px;
    background:transparent; cursor:pointer;
    font:inherit; color:var(--ink); text-align:left; font-size:13.5px;
    transition:background var(--t);
  }
  .calc-select-item + .calc-select-item{ margin-top:1px; }
  .calc-select-item:hover{ background:var(--bg-hover); }
  .calc-select-item.is-selected{ background:#EAF1FC; color:var(--navy); font-weight:600; }
  .calc-select-item-label{ flex:1; min-width:0; }
  .calc-select-check{ color:var(--navy); flex-shrink:0; }
  /* Provider sub-tabs (Overview / Preferences / Enrollments) — SegmentedControls
     style: a light-gray track; inactive segments are regular dark-grey text;
     the selected one is a white chip with a dark border + bold near-black text.
     Thin dividers sit between inactive segments (hidden around the active one). */
  .seg-tabs{ display:inline-flex; align-items:stretch; background:#F4F4F2; border-radius:14px; padding:3px; }
  .tab{position:relative; padding:7px 16px; border-radius:11px; font-size:13.5px; font-weight:400; color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:7px; border:1px solid transparent; transition:color .12s, background .12s, border-color .12s; white-space:nowrap;}
  .tab .seg-ico{ width:15px; height:15px; flex-shrink:0; opacity:.85; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ background:#fff; color:#232220; font-weight:700; border-color:#3D3C38; }
  .tab.active svg{ color:#232220; }
  /* Thin separators between segments; hidden on the active one and the one
     immediately after it, so the white chip floats free of the dividers. */
  .tab + .tab::before{ content:""; position:absolute; left:-0.5px; top:24%; bottom:24%; width:1px; background:var(--line-2); }
  .tab.active::before, .tab.active + .tab::before{ display:none; }

  /* Unified Dev panel — single floating control that replaces the old top
     dark DevBar and the bottom-floating VariantSwitcher. */
  /* Tiny, discreet trigger — just the lab glyph in a circle. */
  /* Dev FAB styled as the design-system avatar (first variant): white fill,
     thin navy border, navy glyph. */
  .devp-fab{
    position:fixed; top:14px; right:16px; z-index:80;
    width:32px; height:32px; padding:0; border-radius:999px;
    background:#fff; color:var(--navy); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--navy); box-shadow:var(--elev-fab);
    transition:all .15s;
  }
  .devp-fab:hover{ background:var(--navy-soft); }
  .devp-fab svg{ opacity:1; }

  .devp-panel{
    position:fixed; top:60px; right:16px; z-index:80;
    width:340px; background:var(--paper-warm); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--elev-popover); padding:14px; font-size:13px;
  }
  .devp-panel .devp-head{ display:flex; align-items:center; gap:8px; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .devp-panel .devp-head .kbd{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10px; background:#232220; padding:2px 6px; border-radius:4px; color:#fff; letter-spacing:.06em; font-weight:600; }
  .devp-panel .devp-head .title{ font-size:12px; color:var(--ink-2); font-weight:500; }
  .devp-panel .devp-section{ margin-bottom:12px; }
  .devp-panel .devp-section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700; margin-bottom:6px; }
  .devp-panel .devp-seg{ display:grid; gap:4px; padding:3px; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  .devp-panel .devp-seg.cols-4{ grid-template-columns:repeat(4, 1fr); }
  .devp-panel .devp-seg.cols-3{ grid-template-columns:repeat(3, 1fr); }
  .devp-panel .devp-seg.cols-2{ grid-template-columns:repeat(2, 1fr); }
  .devp-panel .devp-seg button{ padding:6px 6px; border-radius:5px; font-size:12px; color:var(--ink-2); font-weight:500; cursor:pointer; transition:all .12s; text-align:center; background:transparent; }
  .devp-panel .devp-seg button:hover{ color:var(--ink); background:rgba(0,0,0,.03); }
  .devp-panel .devp-seg button.on{ background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(14,26,43,.10), 0 0 0 1px var(--line); }
  .devp-panel .devp-card{ display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; border:1px solid var(--line); cursor:pointer; transition:all .12s; }
  .devp-panel .devp-card + .devp-card{ margin-top:5px; }
  .devp-panel .devp-card:hover{ border-color:var(--ink-3); }
  .devp-panel .devp-card.on{ border-color:var(--navy); background:var(--navy-soft); }
  .devp-panel .devp-card .b{ width:22px; height:22px; border-radius:5px; background:var(--ink-3); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; margin-top:1px; }
  .devp-panel .devp-card.on .b{ background:var(--navy); }
  .devp-panel .devp-card .t{ font-weight:600; font-size:13px; color:var(--ink); line-height:1.2; }
  .devp-panel .devp-card .d{ font-size:11px; color:var(--ink-2); margin-top:2px; line-height:1.4; }
  /* Experimental section — discarded variants kept for reference. Visually
     demoted: smaller subhead + muted card body + a tiny "experimental" tag. */
  .devp-panel .devp-experimental-label{
    margin-top:14px; opacity:.75;
    display:flex; align-items:center; gap:6px;
  }
  .devp-panel .devp-experimental-label::before{
    content:""; flex:1; height:1px; background:var(--line); margin-right:6px;
  }
  /* Quiet expander — hides the experimental list by default. Looks like
     a horizontal divider with a small chevron + count, so the panel
     reads as 3 clean active options unless the user explicitly opens it. */
  .devp-panel .devp-exp-toggle{
    display:flex; align-items:center; gap:6px;
    width:100%; margin-top:14px; padding:8px 4px;
    background:transparent; border:0; border-top:1px solid var(--line);
    font-size:10.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-3); cursor:pointer; transition:color .12s;
  }
  .devp-panel .devp-exp-toggle:hover{ color:var(--ink-2); }
  .devp-panel .devp-exp-chev{
    color:var(--ink-3); transition:transform .15s;
    flex-shrink:0;
  }
  .devp-panel .devp-exp-toggle.is-open .devp-exp-chev{ transform:rotate(90deg); }
  .devp-panel .devp-exp-count{
    margin-left:auto; padding:1px 7px; border-radius:999px;
    background:var(--bg); color:var(--ink-3);
    font-size:10px; font-weight:700;
    letter-spacing:0;
  }
  .devp-panel .devp-exp-toggle.is-open + .devp-card-experimental{ margin-top:4px; }
  .devp-panel .devp-card-experimental{ opacity:.72; }
  .devp-panel .devp-card-experimental:hover{ opacity:1; }
  .devp-panel .devp-card-experimental .b{ background:var(--ink-4); }
  .devp-panel .devp-card-experimental.on{ opacity:1; }
  .devp-panel .devp-card .devp-tag{
    display:inline-block; margin-left:6px; padding:1px 6px;
    border-radius:4px; background:var(--ash); color:var(--ink-3);
    font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; vertical-align:middle;
  }
  .devp-panel .devp-foot{ display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--line); margin-top:6px; }
  .devp-panel .devp-foot .ver{ font-size:11px; color:var(--ink-3); }
  .devp-panel .devp-foot .reset{ font-size:12px; color:var(--navy); font-weight:600; cursor:pointer; padding:2px 6px; border-radius:4px; background:transparent; }
  .devp-panel .devp-foot .reset:hover{ background:var(--navy-soft); }
  .devp-panel .devp-sub{ margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:6px; display:flex; align-items:center; gap:10px; }
  .devp-panel .devp-sub .sublbl{ font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; flex-shrink:0; }
  .devp-panel .devp-sub .devp-seg{ flex:1; }

  .crumb-chip{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; background:#fff; border:1px solid var(--line); border-radius:8px; cursor:pointer;}
  .crumb-chip:hover{background:var(--navy-soft); border-color:var(--navy);}
  .crumb-sep{color:var(--ink-3); padding:0 2px;}
  .tile{background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:18px; cursor:pointer; transition:all .15s;}
  .tile:hover{border-color:var(--navy); background:var(--navy-soft);}
  .tile.sel{border-color:var(--navy); background:var(--navy-soft);}
  /* ─────────────────────────────────────────────────────────────────
     Success page (Done) — animated celebratory state.
     Hero check that draws in, concentric rings that pulse outward,
     contents fade up sequentially. Designed to feel like a small reward
     after completing the flow.
     ───────────────────────────────────────────────────────────────── */
  .done-card{
    position:relative; overflow:hidden;
    background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:64px 40px 48px;
    margin-top:24px; box-shadow:var(--shadow-md);
    /* Flex column + center so every child (icon, title, stats, buttons)
       stacks vertically and is horizontally centered regardless of its
       own display type. */
    display:flex; flex-direction:column; align-items:center;
    animation: doneCardIn .55s cubic-bezier(.18,1.08,.32,1) both;
  }
  .done-icon{
    position:relative; width:96px; height:96px; margin:0 0 28px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--check-bg); color:var(--check);
    border-radius:999px;
    animation: donePop .55s cubic-bezier(.2,1.4,.4,1) .12s both;
  }
  /* Two pulse rings emanating outward */
  .done-icon::before, .done-icon::after{
    content:""; position:absolute; inset:0; border-radius:999px;
    border:2px solid var(--check); opacity:0;
    animation: doneRing 1.8s ease-out .55s both;
  }
  .done-icon::after{ animation-delay:1.05s; }
  .done-icon svg{ width:42px; height:42px; stroke-width:3; position:relative; z-index:1; }
  .done-icon svg path{
    stroke-dasharray:30; stroke-dashoffset:30;
    animation: doneCheckDraw .42s cubic-bezier(.6,0,.4,1) .55s both;
  }
  .done-title{
    font-size:var(--h-md); font-weight:700; color:var(--heading); letter-spacing:-.01em;
    line-height:1.15; margin:0 0 10px; text-align:center; position:relative;
    animation: doneFadeUp .5s cubic-bezier(.2,.8,.2,1) .42s both;
  }
  .done-sub{
    font-size:14.5px; color:var(--ink-2); max-width:440px;
    margin:0 0 32px; line-height:1.55; text-align:center; position:relative;
    animation: doneFadeUp .5s cubic-bezier(.2,.8,.2,1) .56s both;
  }
  .done-stats{
    display:flex; align-items:stretch; gap:0;
    margin:8px 0 32px; padding:14px 4px;
    background:var(--bg-hover); border-radius:14px;
    position:relative;
    animation: doneFadeUp .5s cubic-bezier(.2,.8,.2,1) .68s both;
  }
  .done-stat{ padding:0 26px; text-align:center; position:relative; }
  .done-stat + .done-stat::before{
    content:""; position:absolute; left:0; top:18%; bottom:18%; width:1px; background:var(--line);
  }
  .done-stat .num{
    font-size:var(--h-sm); font-weight:700; color:var(--ink);
    font-variant-numeric:tabular-nums; line-height:1.1;
  }
  .done-stat .lbl{
    font-size:10.5px; color:var(--ink-3); text-transform:uppercase;
    letter-spacing:.06em; margin-top:4px; font-weight:600;
  }
  .done-actions{
    display:flex; gap:10px; position:relative;
    animation: doneFadeUp .5s cubic-bezier(.2,.8,.2,1) .8s both;
  }
  @keyframes doneCardIn {
    from { opacity:0; transform:translateY(12px) scale(.98); }
    to   { opacity:1; transform:none; }
  }
  @keyframes donePop {
    0%   { transform:scale(.4); opacity:0; }
    55%  { transform:scale(1.12); opacity:1; }
    100% { transform:scale(1); opacity:1; }
  }
  @keyframes doneRing {
    0%   { transform:scale(.7); opacity:.55; }
    100% { transform:scale(2.3); opacity:0; }
  }
  @keyframes doneCheckDraw {
    to { stroke-dashoffset:0; }
  }
  @keyframes doneFadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:none; }
  }
  /* Phase pages fade gently in on mount — adds rhythm to the flow without
     getting in the way. Opacity-only on the wrapper (no transform) so
     position:fixed descendants like the edit drawer + backdrop still
     reference the viewport, not the animated wrapper. Apple-style cubic
     for a soft elegant feel on every phase change. */
  .phase-page{
    animation: phaseEnter .45s cubic-bezier(.32,.72,0,1) both;
  }
  @keyframes phaseEnter {
    from { opacity:0; }
    to   { opacity:1; }
  }
  /* Inline row-expand animation for the "See details" panel inside
     PageImpacted — slides the details down instead of snapping. */
  .imp-details-panel{ animation: rowExpand .22s ease-out both; transform-origin:top; }
  @keyframes rowExpand {
    from { opacity:0; transform:scaleY(.9); }
    to   { opacity:1; transform:scaleY(1); }
  }
  /* ═════════════════════════════════════════════════════════════════
     Variant C — Opt-in / Opt-out
     Same hierarchy table chrome as A/B but the data columns swap:
     [VC preference] · [Product enrollments] instead of [Fulfillment +
     Distribution]. Designed for the use case "is this provider accepting
     virtual cards, and which ACH products are they enrolled in?"
     ═════════════════════════════════════════════════════════════════ */
  /* Grids — 7 columns. No column-gap (matches A/B's row layout); the
     visual separation between value columns comes from the entity column
     being capped + the enrollments column taking 1fr (so its content sits
     left-aligned while the empty space pushes Action to the right). */
  .row.row-optinout       { grid-template-columns:32px 22px 44px minmax(260px, 380px) 180px 1fr 90px; }
  .head-strip.head-optinout{ grid-template-columns:32px 22px 44px minmax(260px, 380px) 180px 1fr 90px; }
  /* Push the enrollments column away from VC preference for better
     visual separation between the two value columns. */
  .row.row-optinout > div:nth-child(7),
  .head-strip.head-optinout > div:nth-child(6){ padding-left:32px; }
  /* VC preference chip */
  .vc-pref{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px;
    font-size:12.5px; font-weight:600;
    line-height:1.3; white-space:nowrap;
  }
  .vc-pref svg{ flex-shrink:0; }
  .vc-pref.is-in {
    background:#E0F3DF; color:#066605;
  }
  .vc-pref.is-out{
    background:#FCEAEA; color:#A41818;
  }
  /* Product enrollment chips — small pills inside the column */
  .pe-list{ display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pe-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:600;
    background:var(--info-soft); color:var(--info);
    line-height:1.3; white-space:nowrap;
  }
  .pe-chip .dot{ width:6px; height:6px; border-radius:999px; background:currentColor; }
  .pe-empty{
    color:var(--ink-3); font-size:13px; cursor:help;
    font-variant-numeric:tabular-nums;
  }
  /* Edit-modal additions — VC preference toggle + enrollments checkboxes
     shown only when the variant is C. */
  .vc-toggle{
    display:inline-flex; align-items:center; padding:3px;
    background:var(--paper); border:1px solid var(--line-2); border-radius:999px;
  }
  .vc-toggle button{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; font-size:12.5px; font-weight:600;
    color:var(--ink-3); background:transparent; border:none;
    border-radius:999px; cursor:pointer; transition:all var(--t);
    white-space:nowrap;
  }
  .vc-toggle button:hover{ color:var(--ink); }
  .vc-toggle button.is-on{ background:var(--ink); color:#fff; }
  .vc-toggle button.is-on.in { background:#066605; color:#fff; }
  .vc-toggle button.is-on.out{ background:#A41818; color:#fff; }
  /* When opted-out, the existing "what would VC look like if they opted back in"
     section is shown but visually disabled. */
  .opt-disabled{
    opacity:.5; pointer-events:none;
    position:relative;
  }
  .opt-disabled-hint{
    display:block; font-size:11px; color:var(--ink-3); font-style:italic;
    margin-top:6px;
  }
  /* Product enrollments checkboxes block */
  .enrollment-list{
    display:flex; flex-direction:column; gap:8px;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg);
  }
  .enrollment-list label{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--ink); cursor:pointer; padding:4px 0;
  }
  .enrollment-list label .pe-chip{ pointer-events:none; }
  /* Read-only variant — same chips, no checkboxes, flat row. */
  .enrollment-list.is-readonly{
    flex-direction:row; flex-wrap:wrap; gap:8px;
    padding:8px 10px;
  }
  .enrollment-empty{
    padding:10px 12px; border:1px dashed var(--line);
    border-radius:8px; background:var(--bg);
    font-size:13px; color:var(--ink-3);
  }
  /* StructuredRule (exclusion rules sheet) — natural-language sentence,
     same treatment as the inline rule annotations in the waterfall. */
  .sr-sentence{
    color:var(--ink-2); font-size:13px; line-height:1.5;
  }
  /* ═════════════════════════════════════════════════════════════════
     Variant B (Routing-aware) — Edit modal sections.
     Effective waterfall: numbered cascade with status chips per network.
     Active rules: read-only list of rules affecting this entity.
     ═════════════════════════════════════════════════════════════════ */
  /* Collapsible section — flat (no card border), matches the visual
     weight of the existing "Distribution" / "Payment program" headings.
     Just a label + chevron toggle, no surrounding box. */
  /* Match the visual weight of field-label.primary (Distribution heading)
     so all section titles in the drawer read at the same level. */
  .collap-section{ margin-bottom:24px; }
  .edit-pop.as-drawer .collap-section{ margin-top:24px; }
  .collap-head{
    display:flex; align-items:center; gap:8px;
    width:100%; padding:0 0 10px;
    background:transparent; border:none; cursor:pointer;
    text-align:left;
  }
  .collap-head .collap-icon{
    display:none; /* keep API but hide — title alone is the affordance */
  }
  .collap-head .collap-title{
    flex:1; font-size:16px; font-weight:700; color:var(--ink);
    text-transform:none; letter-spacing:0; line-height:1.3;
  }
  .collap-head .collap-count{
    font-size:10.5px; font-weight:700; padding:1px 7px;
    border-radius:999px; background:var(--ash); color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .collap-head .collap-chev{
    color:var(--ink-3); transition:transform .15s ease;
  }
  .collap-head.is-closed .collap-chev{ transform:rotate(-90deg); }
  .collap-body{ padding:6px 0 0; }
  /* Effective waterfall — each step is a CONTAINER (head + optional body).
     The head is the network row (number + name + status). The body holds
     anything that belongs to that step: rule annotations affecting it, and
     for Virtual card, the Max amount. Containment matters: the body sits
     INSIDE the step's border so the relationship is visually obvious. */
  .eff-list{ display:flex; flex-direction:column; gap:10px; }
  /* Each step reads like a tappable card — soft shadow at rest, stronger
     lift on hover so the click affordance is obvious. Rounded enough to
     feel inviting without going full pill. */
  .eff-step{
    display:flex; flex-direction:column;
    border-radius:12px;
    background:var(--paper); border:1px solid #ECEAE5;
    box-shadow: 0 1px 2px rgba(35,34,32,.04), 0 0 0 1px rgba(35,34,32,.01);
    transition: border-color var(--t), box-shadow var(--t), transform var(--t);
    /* overflow:visible so absolutely-positioned tooltips inside the body
       can escape the step's rounded box. Corner clipping is handled per
       child via their own border-radius rules below. */
    overflow:visible;
  }
  .eff-step:hover{
    border-color:var(--ink-4);
    box-shadow: 0 4px 12px rgba(35,34,32,.07), 0 1px 3px rgba(35,34,32,.05);
  }
  .eff-step-head{
    display:grid; grid-template-columns:24px 1fr auto;
    gap:10px; align-items:center;
    padding:10px 14px;
    cursor:pointer; transition:background var(--t);
    border-radius:11px 11px 0 0;
  }
  /* Right-aligned cluster — keeps the existing tag (or count chip in
     bulk mode) and the "Selected" cue side-by-side inside the head's
     auto-sized grid column, instead of stacking. */
  .eff-step-tags{ display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
  .eff-step.has-body .eff-step-head{ border-radius:11px 11px 0 0; }
  .eff-step:not(.has-body) .eff-step-head{ border-radius:11px; }
  .eff-step-head:hover{ background:var(--bg-hover); }
  /* Current = saturated blue (border + filled head). Next = subtle pale
     blue with dashed border. Same hue family, different intensity, so the
     hierarchy (active vs. fallback) reads at a glance. */
  .eff-step.is-current{ border-color:var(--navy); border-width:1.5px; }
  .eff-step.is-current .eff-step-head{ background:#CFDDF5; }
  .eff-step.is-current .eff-step-head:hover{ background:#CFDDF5; }
  .eff-step.is-next{
    border-color:#B8CDED; border-style:dashed; border-width:1.5px;
  }
  .eff-step.is-next .eff-step-head{ background:#EEF4FE; }
  .eff-step.is-next .eff-step-head:hover{ background:#EEF4FE; }
  /* Excluded step — whole card reads as disabled (gray head, faded dot,
     muted name) so the user knows it's not clickable. The BLOCKED tag is
     the ONLY element that keeps strong color, so the reason stays loud. */
  .eff-step.is-excluded{
    border-color:var(--line);
  }
  .eff-step.is-excluded .eff-step-head{
    cursor:not-allowed;
    background:var(--ash);
    color:var(--ink-3);
  }
  .eff-step.is-excluded .eff-name{ color:var(--ink-3); }
  .eff-step.is-excluded .eff-name .dot{ opacity:.4; }
  .eff-step.is-current.is-excluded .eff-name{ color:var(--ink); }
  .eff-step.is-current.is-excluded .eff-name .dot{ opacity:1; }
  .eff-num{
    width:22px; height:22px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--ash); color:var(--ink-2);
    font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .eff-step.is-current  .eff-num{ background:var(--navy);  color:#fff; }
  .eff-step.is-next     .eff-num{ background:#7791B8;      color:#fff; }
  .eff-step.is-excluded .eff-num{ background:var(--ink-4); color:#fff; }
  .eff-name{
    font-size:13px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; gap:7px; min-width:0;
  }
  .eff-name .dot{ width:8px; height:8px; }
  .eff-tag{
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    padding:3px 9px; border-radius:6px;
    background:var(--ash); color:var(--ink-3);
  }
  .eff-step.is-current .eff-tag{ background:var(--navy);  color:#fff; }
  .eff-step.is-next    .eff-tag{ background:#7791B8;      color:#fff; }
  .eff-step.is-excluded .eff-tag{
    background:var(--error); color:#fff;
    border:none; font-weight:700;
  }
  /* Bulk-edit chip — shows how many of the selected entities have this
     network as their current. Non-zero counts use the same solid navy
     treatment as the single-edit "Current" tag so the CSR's eye lands
     on populated steps at a glance. 0 stays muted ash. Hover surfaces
     the entity breakdown tooltip. */
  .eff-tag-bulk{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 9px;
    background:var(--navy); color:#fff;
    border-radius:6px;
    text-transform:none; letter-spacing:0;
    cursor:help;
  }
  .eff-tag-bulk .eff-tag-bulk-count{ font-size:13px; font-weight:700; line-height:1; }
  .eff-tag-bulk .eff-tag-bulk-label{ font-size:10px; font-weight:600; opacity:.78; text-transform:uppercase; letter-spacing:.06em; }
  .eff-tag-bulk-empty{ background:var(--ash); color:var(--ink-4); }
  /* "Selected" badge in bulk mode — sits next to the count chip so the
     "X on this" total stays visible AND the CSR's pick is unmistakable.
     Vibrant Dark Orange (the DS-sanctioned interactive emphasis color, not
     decorative Optum Orange) so it can't be confused with the navy count
     chip representing the existing state. */
  .eff-tag-bulk-selected{
    background:var(--orange-d); color:#fff;
    border-radius:6px; padding:3px 9px;
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
  }
  /* Highlight the whole step the CSR chose in bulk — orange-tinted
     border + soft background — so the row reads as the active pick
     even before the user scrolls back to the toolbar. Mirrors the
     "is-current" treatment but in the accent colour to distinguish
     "what you just chose" from "what was current". */
  .eff-step.is-bulk-selected{ border-color:var(--orange-d); border-width:1.5px; box-shadow: 0 0 0 1px rgba(215,65,32,.15); }
  .eff-step.is-bulk-selected .eff-step-head{ background:#FFF1EA; }
  .eff-step.is-bulk-selected .eff-step-head:hover{ background:#FFE7DA; }
  .eff-step.is-bulk-selected .eff-num{ background:var(--orange-d); color:#fff; }
  /* Distribution breakdown — same chip language as the waterfall, laid
     out side-by-side. The icon sits at the left, label center, count at
     the right end. Empty methods stay muted; populated methods use the
     solid navy treatment to mirror the bulk waterfall chips. */
  .bulk-dist-breakdown{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .bulk-dist-chip{
    /* Force inline-flex even on the empty variant (which doesn't carry
       .eff-tag-bulk), otherwise the chip becomes a block-level flex item
       with inline content that wraps to a second line. */
    display:inline-flex !important;
    align-items:center; gap:6px;
    padding:6px 12px;
    white-space:nowrap; flex-shrink:0;
    flex-direction:row !important; flex-wrap:nowrap !important;
    width:auto;
  }
  .bulk-dist-chip svg{ flex-shrink:0; }
  .bulk-dist-chip .bulk-dist-chip-label{
    font-size:11.5px; font-weight:600;
    text-transform:none; letter-spacing:0;
    opacity:1; white-space:nowrap; flex-shrink:0;
  }
  .bulk-dist-chip .bulk-dist-chip-count{
    margin-left:4px; padding-left:8px;
    border-left:1px solid rgba(255,255,255,.22);
    font-size:13px; font-weight:700; line-height:1;
    font-variant-numeric: tabular-nums;
    flex-shrink:0; white-space:nowrap;
  }
  .bulk-dist-chip.eff-tag-bulk-empty .bulk-dist-chip-count{
    border-left-color: var(--ink-4);
    opacity: .8;
  }
  .bulk-dist-chip.eff-tag-bulk-empty svg{ color: var(--ink-4); }
  /* ACH products column — compact chips listing enrolled programs.
     Each chip carries a small dot (ACH-blue) + product name. Tooltip
     on hover surfaces the product description (kept off the row to
     avoid clutter). */
  /* ACH enrollment pill — same shape as the cell-pill is-ok / is-off
     variants, with a smiley/frown face badge at the left. */
  .ach-enroll-pill{ padding-left:4px !important; }
  .ach-enroll-face{ display:inline-flex; align-items:center; opacity:.95; }
  .ach-prod-chips{ display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; cursor:help; }
  .ach-prod-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px 2px 7px;
    background:var(--ach-bg); color:var(--ach);
    border-radius:999px;
    font-size:10.5px; font-weight:600;
    white-space:nowrap;
  }
  .ach-prod-chip .ach-prod-check{ color:var(--ach); flex-shrink:0; }
  .ach-prod-tip-title{
    font-size:11px; font-weight:700; color:#fff;
    text-transform:uppercase; letter-spacing:.06em;
    padding-bottom:6px; margin-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .ach-prod-tip-row{ padding:4px 0; }
  .ach-prod-tip-row + .ach-prod-tip-row{ border-top:1px solid rgba(255,255,255,.08); margin-top:4px; padding-top:8px; }
  .ach-prod-tip-name{ font-size:12px; font-weight:600; color:#fff; display:block; }
  .ach-prod-tip-desc{ font-size:11px; color:rgba(255,255,255,.7); line-height:1.4; margin-top:2px; }
  /* Tooltip body — entity list with each row's waterfall preview.
     Each entity is its own stacked "card" separated by a hairline
     divider with generous vertical padding so the rows don't visually
     melt together. The CURRENT step of the waterfall is rendered with
     a filled chip + crisp white text; the rest are nearly ghost so
     the eye lands on the active one immediately. */
  .bulk-tag-tip-title{
    display:flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:#fff;
    padding-bottom:10px; margin-bottom:4px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .bulk-tag-tip-title .dot{ width:7px; height:7px; }
  .bulk-tag-tip-title b{ font-weight:700; }
  .bulk-tag-tip-list{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:0; }
  .bulk-tag-tip-list li{ display:flex; flex-direction:column; gap:7px; padding:12px 0; }
  .bulk-tag-tip-list li + li{ border-top:1px solid rgba(255,255,255,.08); }
  .bulk-tag-tip-list li:last-child{ padding-bottom:0; }
  /* Row inside tooltip — level chip + name + monospace id stacked
     horizontally; gives the CSR the type + identifier next to the name
     so duplicate-named entities (e.g. zip 33012 under multiple sub-
     accounts) are disambiguated at a glance. */
  .bulk-tag-tip-row{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; white-space:nowrap; }
  .bulk-tag-tip-lvl{
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    padding:1px 6px; border-radius:4px;
    background:rgba(255,255,255,.12); color:rgba(255,255,255,.78);
    flex-shrink:0;
  }
  .bulk-tag-tip-lvl-account{ background:rgba(255,255,255,.16); color:#fff; }
  .bulk-tag-tip-lvl-subaccount{ background:rgba(102,178,255,.22); color:#cfe5ff; }
  .bulk-tag-tip-lvl-zip{ background:rgba(255,180,120,.22); color:#ffd9b6; }
  .bulk-tag-tip-name{ font-size:11.5px; color:rgba(255,255,255,.95); font-weight:500; }
  .bulk-tag-tip-id{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:10px; color:rgba(255,255,255,.5); font-weight:500;
  }
  .bulk-tag-tip-wf{ display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .bulk-tag-tip-wf-step{
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px; border-radius:999px;
    font-size:10px; font-weight:600;
    background:transparent; color:rgba(255,255,255,.30);
    transition: all .15s;
  }
  .bulk-tag-tip-wf-step .dot{ width:5px; height:5px; opacity:.45; }
  .bulk-tag-tip-wf-step.is-current{
    background:rgba(255,255,255,.14);
    color:#fff;
    font-weight:700;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .bulk-tag-tip-wf-step.is-current .dot{ opacity:1; width:6px; height:6px; }
  .bulk-tag-tip-wf-arrow{ color:rgba(255,255,255,.22); font-size:10px; }
  /* Body — always white so the rules + Max amount stand out cleanly
     against the colored head. Head carries the state color; body holds
     the data. Left padding aligns with the network NAME (12 + 24 + 10). */
  .eff-step-body{
    border-top:1px solid var(--line);
    background:var(--paper);
    padding:10px 14px 12px 48px;
    display:flex; flex-direction:column; gap:2px;
    border-radius:0 0 11px 11px;
  }
  /* Rule annotation — leading warning icon (universal "this is a rule"
     marker, same icon for block + prefer), sentence, scope chip. */
  .rule-anno{
    display:grid; grid-template-columns:14px 1fr auto;
    align-items:start; gap:9px;
    padding:3px 0;
    font-size:12.5px;
  }
  .rule-anno-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; margin-top:2px;
    color:#B8861A;
  }
  .rule-anno-sentence{
    color:var(--ink-2); line-height:1.5;
  }
  .rule-anno-val{ color:var(--ink); font-weight:600; }
  .rule-anno-scope{
    font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    padding:2px 7px; border-radius:6px;
    background:var(--ash); color:var(--ink-3);
  }
  /* Scope chips on brand accents: Global = Sapphire (authority blue),
     Sub-payer = Purple, Provider = Tangerine — three distinct brand hues. */
  .rule-anno-scope.global   { background:var(--sapphire-bg); color:var(--sapphire-tx); }
  .rule-anno-scope.subpayer { background:var(--purple-bg); color:var(--purple-tx); }
  .rule-anno-scope.provider { background:var(--tangerine-bg); color:var(--tangerine-tx); }
  /* Max amount sub-step — sits inside the VC step body alongside its rules.
     When rules come before it, add a thin divider so the user reads them
     as conceptually different: rules = conditions; max = a setting. */
  .eff-substep{
    display:flex; align-items:center; gap:8px;
    padding:4px 0;
  }
  .eff-substep + .rule-anno,
  .rule-anno + .eff-substep{
    margin-top:8px; padding-top:10px;
    border-top:1px dashed rgba(0,0,0,.12);
  }
  .eff-substep-label{
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-3); min-width:88px;
  }
  .eff-substep-control{
    display:inline-flex; align-items:center;
    background:var(--paper); border:1px solid var(--line);
    border-radius:6px; padding:2px 8px;
    transition:border-color var(--t);
  }
  .eff-substep-control:focus-within{ border-color:var(--navy); }
  .eff-substep-prefix{
    color:var(--ink-3); font-size:12px; font-weight:600;
    margin-right:2px;
  }
  .eff-substep-input{
    width:80px; border:none; outline:none; background:transparent;
    font-size:12.5px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums; padding:2px 0;
  }
  .eff-substep-hint{
    font-size:11.5px; color:var(--ink-3);
  }
  /* Enrollment annotation inside an enrollment-gated step (ACH+ / SA).
     Reuses .rule-anno grid (icon · sentence · trailing slot) but recolors
     the leading icon by sentiment: green party-popper if enrolled, muted
     gray frown if not. The trailing slot holds a count with hover tooltip. */
  .rule-anno.is-enrollment.is-enrolled .rule-anno-mark{ color:#066605; }
  .rule-anno.is-enrollment.is-not      .rule-anno-mark{ color:var(--ink-2); }
  /* When the "not enrolled" line carries the 5-7 day delay continuation,
     keep the surface neutral — the bold lede + scope chip already carry
     the heads-up signal without needing a coloured slab behind it. */
  .rule-anno.is-enrollment.has-delay-tail .rule-anno-mark{ color:var(--ink-3); }
  /* Provider-initiated opt-out — leading warning icon (warm orange to
     distinguish from rules' amber), sentence (wraps to multiple lines if
     long), warm-orange scope chip, edit/delete actions. CSR-editable.
     Same grid + zero horizontal padding as other rule-anno items so the
     icon aligns vertically with the amber warning triangles above. */
  .rule-anno.is-optout{
    grid-template-columns: 14px 1fr auto auto;
    align-items:start;
    padding:3px 0;
    background:transparent;
    border-radius:4px;
    /* Background AND box-shadow both fade together so the green halo
       doesn't snap off when the just-added flag clears. */
    transition: background 1.6s ease, box-shadow 1.6s ease;
  }
  .rule-anno.is-optout .rule-anno-mark{
    color:#FF612B; /* Optum brand orange — clearly warm, not red */
  }
  .rule-anno.is-optout .rule-anno-sentence{ line-height:1.45; }
  .rule-anno.is-optout .rule-anno-scope{ align-self:center; }
  .rule-anno.is-optout .rule-anno-actions{ align-self:center; }
  .rule-anno.is-optout.is-just-added{
    background:#E0F3DF;
    box-shadow: 0 0 0 6px #E0F3DF;
    /* Subtle pop on mount — scales from .98 once. Pair with the fade-out
       transition above to get a "settle in" feel. */
    animation: optOutPop .35s cubic-bezier(.34,1.56,.64,1) 1;
  }
  @keyframes optOutPop {
    0%   { transform:scale(.985); }
    60%  { transform:scale(1.008); }
    100% { transform:scale(1); }
  }
  .rule-anno-scope.is-optout-scope{ background:#FFE8DA; color:#9C3A1B; }
  .rule-anno-actions{ display:inline-flex; gap:2px; margin-left:4px; }
  .rule-anno-act{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:5px;
    background:transparent; border:none; cursor:pointer;
    color:var(--ink-3); transition:all var(--t);
  }
  .rule-anno-act:hover{ background:var(--bg-hover); color:var(--ink); }
  .rule-anno-act:last-child:hover{ color:var(--error); }
  /* Waterfall header meta — rules count + Create CTA (count nested inside). */
  .wf-meta{ display:inline-flex; align-items:center; gap:8px; margin-left:auto; }
  /* Row-scoped "Opt-out" action — sits next to "Edit" in the action cell.
     Same shape as the change-trigger button but with the system orange
     to signal a destructive/exception action and to distinguish it from
     plain edit. Compact label so two actions fit in the action column. */
  .row-create-opt-btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 12px; border-radius:999px;
    font-weight:600; font-size:13px;
    background:var(--paper); color:var(--badge-error-tx);
    border:1px solid var(--badge-error-tx); cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .row-create-opt-btn:hover{ background:var(--badge-error-bg); border-color:#8F1D17; color:#8F1D17; }
  .row-create-opt-btn svg{ color:inherit; }
  .row-create-opt-btn.is-bulk-dim{ opacity:.4; pointer-events:none; }
  .wf-create-opt-btn{
    display:inline-flex; align-items:center; gap:6px;
    margin-left:6px; padding:5px 10px; border-radius:6px;
    background:var(--paper); border:1px solid var(--line-2);
    font-size:11.5px; font-weight:600; color:var(--ink-2); cursor:pointer;
    transition:all var(--t);
  }
  .wf-create-opt-btn:hover{ border-color:#D74120; background:#FFF3EC; color:#B83C20; }
  .wf-create-opt-btn svg{ color:inherit; }
  .wf-create-opt-btn-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 6px;
    background:#FFE8DA; color:#9C3A1B; border-radius:999px;
    font-size:10.5px; font-weight:700; margin-left:2px;
  }
  /* Expand/collapse link inside a crowded step body. */
  .eff-step-expand{
    display:inline-flex; align-items:center; gap:4px;
    background:transparent; border:none; padding:6px 0 0;
    font-size:11.5px; font-weight:600; color:var(--navy); cursor:pointer;
    align-self:flex-start;
  }
  .eff-step-expand:hover{ text-decoration:underline; }
  /* VC consent annotation — green check / gray X */
  .rule-anno.is-consent.is-yes .rule-anno-mark{ color:#066605; }
  .rule-anno.is-consent.is-no  .rule-anno-mark{ color:var(--ink-2); }
  /* Lockbox fee annotation in the Check step — amber lightning glyph so
     the CSR reads it as "important retention context" (the provider is
     paying 7-10% to their bank), without confusing it with a blocking
     rule (amber, not red). */
  .rule-anno.is-lockbox .rule-anno-mark{ color:var(--ink-3); }
  /* Right-hand scope chips on the informative annotations (Retention,
     Heads up) read as neutral informational tags — same muted grey as
     the default scope chip, no warm fill. */
  .rule-anno-scope.retention{ background:var(--ash); color:var(--ink-3); }
  /* Retention talk-track annotation — megaphone glyph in muted ink so
     it reads as a "say this to the provider" prompt distinct from rules.
     Surface stays neutral, chip on the right carries the meaning. */
  .rule-anno.is-talktrack .rule-anno-mark{ color:var(--ink-3); }
  .rule-anno.is-talktrack .rule-anno-sentence{ color:var(--ink-2); }
  /* Enrollment delay heads-up — neutral surface, clock glyph in muted
     ink. The "Heads up" scope chip on the right does the signalling. */
  .rule-anno.is-delay .rule-anno-mark{ color:var(--ink-3); }
  .rule-anno-scope.delay{ background:var(--ash); color:var(--ink-3); }
  /* Inline consent badge next to "Virtual card" in the OptInOut variant's
     Payment program list. Compact pill: small icon + label. Color reflects
     consent state — green check (yes) or muted gray X (no). */
  .vc-consent-inline{
    display:inline-flex; align-items:center; gap:4px;
    margin-left:6px; padding:2px 8px;
    border-radius:999px;
    font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .vc-consent-inline.is-yes{ background:#E0F3DF; color:#066605; }
  .vc-consent-inline.is-no{  background:var(--ash); color:var(--ink-2); }
  .enr-anno-count{
    font-size:12.5px; color:var(--ink-2); cursor:help;
    text-decoration:underline; text-decoration-style:dotted;
    text-decoration-color:var(--ink-4); text-underline-offset:3px;
    white-space:nowrap;
  }
  .enr-anno-count:hover{ color:var(--ink); }
  .enr-sep{ color:var(--ink-3); margin:0 4px; }
  /* Inline product list inside the ACH+ step body — used when the
     provider is enrolled in 1–2 products, so the names sit right after
     "Enrolled" without a hover. Above 2 products we fall back to the
     counter + tooltip pattern (see .enr-status-count). */
  .enr-status-products{
    font-size:12.5px; color:var(--ink-2); margin-left:2px;
  }
  .enr-status-products::before{ content:"·"; color:var(--ink-3); margin-right:6px; }
  /* Inline product list inside the ACH+ rule-annotation (sits between
     the "Enrolled" label and end of line, no tooltip). Same muted ink
     tone as the count-with-tooltip variant so the transition between
     ≤2 products → inline names and 3+ → counter feels consistent. */
  .enr-anno-products{ font-size:12.5px; color:var(--ink-2); white-space:nowrap; }
  /* Inline count text variant for collapsible header (e.g. "3 rules apply"). */
  .collap-count-text{
    margin-left:auto; margin-right:8px;
    font-size:11.5px; color:var(--ink-3);
  }
  .collap-head.no-toggle{ cursor:default; padding-bottom:14px; }
  .collap-count-link{
    margin-left:auto; cursor:help;
    text-decoration:underline; text-decoration-style:dotted;
    text-decoration-color:var(--ink-4); text-underline-offset:3px;
  }
  .collap-count-link:hover .collap-count-text{ color:var(--ink); }
  .collap-count-link .collap-count-text{ margin-left:0; margin-right:0; }
  /* Tooltip body — ordered list of rules. Two-line layout per rule (scope
     chip on top, sentence below) so long sentences don't wrap awkwardly
     around fixed-width chips. Optimized for the dark tooltip surface:
     bright whites for emphasis, soft greys for connective text. */
  .rules-tip-title{
    font-size:9.5px; font-weight:700; color:rgba(255,255,255,.55);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px;
  }
  .rules-tip-list{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:10px;
  }
  .rules-tip-list li{
    display:flex; flex-direction:column; gap:4px;
    padding-top:10px; border-top:1px solid rgba(255,255,255,.10);
  }
  .rules-tip-list li:first-child{ padding-top:0; border-top:none; }
  .rules-tip-text{
    font-size:12.5px; line-height:1.45; color:rgba(255,255,255,.78);
  }
  .rules-tip-text b{ color:#fff; font-weight:600; }
  .rules-tip-scope{
    align-self:flex-start;
    font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    padding:2px 7px; border-radius:4px; white-space:nowrap;
    background:rgba(255,255,255,.10); color:rgba(255,255,255,.85);
  }
  .rules-tip-scope.global   { background:rgba(124,160,232,.20); color:#9DBAF1; }
  .rules-tip-scope.subpayer { background:rgba(118,184,221,.20); color:#92C7E8; }
  .rules-tip-scope.provider { background:rgba(232,150,118,.20); color:#F0B098; }
  /* Structured rule — labeled rows (WHEN / ACTION / NETWORK) so the CSR
     can scan a rule without parsing prose. Chips for variable values,
     icons for action verbs. Used by both the rules sheet cards and the
     Active rules list inside the Edit modal. */
  .sr{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .sr-row{ display:grid; grid-template-columns:64px 1fr; gap:10px; align-items:center; min-height:24px; }
  .sr-label{
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-3); padding-top:2px;
  }
  .sr-content{
    color:var(--ink-2); display:flex; align-items:center; gap:6px;
    flex-wrap:wrap; line-height:1.4;
  }
  .sr-content .sep{ color:var(--ink-3); }
  .sr-chip-value{
    display:inline-flex; align-items:center;
    padding:2px 9px; border-radius:6px;
    background:var(--ash); color:var(--ink);
    font-weight:600;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12px;
  }
  .sr-action{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink); font-weight:600;
  }
  .sr-action.is-block { color:#A41818; }
  .sr-action.is-prefer{ color:var(--info); }
  .sr-action svg{ flex-shrink:0; }
  .sr-net-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:2px 9px; border-radius:6px;
    background:var(--ash); color:var(--ink);
    font-weight:600; font-size:12px;
  }
  .sr-net-chip .dot{ width:7px; height:7px; }
  /* Active rules list — chips in Optum brand palette: Global navy,
     Sub-payer sky/info blue, Provider warm orange (Dawn). Fixed-width
     chip column so all rule texts align across rows. */
  .ar-list{ display:flex; flex-direction:column; gap:6px; }
  .ar-row{
    display:grid; grid-template-columns:96px 1fr; gap:14px;
    align-items:start;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper);
  }
  .ar-chip{
    justify-self:start; margin-top:1px; min-width:0;
    text-align:center; width:100%;
    font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    padding:4px 8px; border-radius:6px;
  }
  .ar-chip.global   { background:var(--navy-soft);  color:var(--navy); }
  .ar-chip.subpayer { background:var(--info-soft);  color:var(--info); }
  .ar-chip.provider { background:var(--orange-soft);color:#B83C20; }
  .ar-rule{
    font-size:13px; color:var(--ink); font-weight:500;
    line-height:1.4; flex:1;
  }
  .ar-empty{
    padding:18px 14px; text-align:center;
    font-size:12.5px; color:var(--ink-3); font-style:italic;
  }
  /* ═════════════════════════════════════════════════════════════════
     Variant B (Routing-aware) — additions injected only when
     RoutingAwareContext === true. Variant A never sees these elements.
     ═════════════════════════════════════════════════════════════════ */
  /* Entity-row chip — surfaces Provider opt-out rules tied to a specific
     account. Visible in BOTH A and B because these rules are inherently
     scoped to the entity. Hover shows the rules; click opens the sheet. */
  .entity-rule-chip{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:8px; padding:3px 9px;
    background:#FFFBE0; color:#7A5A00;
    border:1px solid #E0CC7E; border-radius:999px;
    font-size:10.5px; font-weight:600; cursor:pointer;
    position:relative; line-height:1.4;
    transition:background .12s, border-color .12s;
  }
  .entity-rule-chip:hover{ background:#FFF5C2; border-color:#C9A800; }
  .entity-rule-chip svg{ flex-shrink:0; color:currentColor; opacity:.85; }
  .entity-rule-chip:hover .entity-rule-pop,
  .entity-rule-chip:focus-visible .entity-rule-pop{ display:block; }
  .entity-rule-pop{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:60;
    min-width:300px; max-width:380px; padding:10px 12px;
    background:var(--tip-bg); color:#fff; border-radius:8px;
    box-shadow:var(--shadow-lg);
    font-size:11.5px; font-weight:400; text-transform:none; letter-spacing:0;
    text-align:left; cursor:default;
    animation:tipFade .12s ease-out;
  }
  .entity-rule-pop .erp-head{
    display:block; font-size:10px; opacity:.75; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
  }
  .entity-rule-pop .erp-rule{
    display:block; padding:5px 0; line-height:1.4; font-style:italic; opacity:.95;
  }
  .entity-rule-pop .erp-rule + .erp-rule{ border-top:1px solid rgba(255,255,255,.1); }
  .entity-rule-pop .erp-foot{
    display:block; margin-top:8px; padding-top:8px;
    border-top:1px solid rgba(255,255,255,.15);
    font-size:10.5px; opacity:.7;
  }
  /* Rule-impact badge — small chip next to the Fulfillment value when one
     or more active exclusion rules potentially affect the entity. Quiet
     amber so it reads as "heads up" without alarm. */
  .rule-badge{
    display:inline-flex; align-items:center; gap:5px;
    margin-left:8px; padding:2px 9px;
    background:var(--badge-info-bg); color:var(--badge-info-tx);
    border:0; border-radius:6px;
    font-size:10.5px; font-weight:600; cursor:help;
    position:relative; line-height:1.4; vertical-align:middle;
  }
  .rule-badge svg{ flex-shrink:0; }
  /* Variant C (Unified) — opt-out count badge. Same shape as rule-badge
     but warm-orange palette to signal "set by provider, editable" vs the
     amber rules ("set by Optum, read-only"). */
  .optout-badge{
    display:inline-flex; align-items:center; gap:5px;
    margin-left:6px; padding:2px 9px;
    background:var(--badge-warning-bg); color:var(--badge-warning-tx);
    border:0; border-radius:6px;
    font-size:10.5px; font-weight:600; cursor:help;
    position:relative; line-height:1.4; vertical-align:middle;
  }
  .optout-badge svg{ flex-shrink:0; }
  .optout-badge .rule-badge-pop{ left:auto; right:0; }
  /* Inline pill for the opt-out scope inside the badge popover — overrides
     the default block layout so it doesn't stretch into a full-width bar. */
  .rule-badge-pop .rb-scope.is-optout-scope-chip{
    display:inline-block; width:auto; margin-bottom:4px;
    padding:2px 7px; border-radius:4px;
    background:rgba(255,255,255,.10); color:rgba(255,255,255,.85);
    opacity:1; font-size:9px;
  }
  .rule-badge-pop{
    /* Anchor to the badge's RIGHT edge and grow leftward — the badge
       lives inside .surface which has overflow-x:auto, so a tooltip
       growing rightward would get clipped against the surface edge. */
    position:absolute; top:calc(100% + 6px); right:0; left:auto; z-index:1000;
    min-width:340px; width:max-content; max-width:480px; padding:10px 12px;
    background:var(--tip-bg); color:#fff; border-radius:8px;
    box-shadow:var(--shadow-lg);
    font-size:11.5px; font-weight:400; text-transform:none; letter-spacing:0;
    text-align:left; cursor:default;
    white-space:normal; word-break:break-word;
    animation:tipFade .12s ease-out;
  }
  .rule-badge-pop .rb-row{ padding:6px 0; line-height:1.4; display:block; }
  .rule-badge-pop .rb-row + .rb-row{ border-top:1px solid rgba(255,255,255,.1); }
  .rule-badge-pop .rb-scope{
    font-size:9.5px; text-transform:uppercase; letter-spacing:.06em;
    opacity:.7; font-weight:700; display:block; margin-bottom:2px;
  }
  .rule-badge-pop .rb-rule{
    display:block; font-style:italic; opacity:.95; line-height:1.4;
  }
  /* Waterfall trail inline — small subtitle under the network value showing
     the rest of the payer's cascade. Always visible in B (no hover needed). */
  .wf-trail-inline{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin-top:6px; font-size:11px; color:var(--ink-3); line-height:1.3;
  }
  .wf-trail-inline .wf-trail-label{ color:var(--ink-3); font-weight:500; }
  .wf-trail-inline .wf-trail-net{
    display:inline-flex; align-items:center; gap:4px; color:var(--ink-2);
  }
  .wf-trail-inline .wf-trail-net .dot{ width:6px; height:6px; }
  .wf-trail-inline .wf-trail-arrow{ opacity:.5; }
  /* ═════════════════════════════════════════════════════════════════
     Variant D (experimental) — Routing-aware FLAT-LIST
     Each row shows the entity above and the full waterfall chain below.
     ═════════════════════════════════════════════════════════════════ */
  .row.routing-row{
    display:grid; grid-template-columns:32px 44px 1fr 90px;
    gap:10px; align-items:flex-start;
    padding:18px 22px; cursor:pointer;
    border-top:1px solid var(--line-soft);
    transition:background var(--t);
  }
  .row.routing-row:first-of-type{ border-top:none; }
  .row.routing-row:hover{ background:var(--bg-hover); }
  .wf-trail{
    display:inline-flex; flex-wrap:wrap; align-items:center; gap:8px;
    margin-top:2px;
  }
  .wf-arrow{ color:var(--ink-3); font-size:12px; flex-shrink:0; }
  .wf-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px;
    font-size:12.5px; background:var(--ash); color:var(--ink-2);
    transition:all var(--t);
  }
  .wf-chip .dot{ width:7px; height:7px; }
  .wf-chip.current{
    background:var(--navy-soft); color:var(--navy); font-weight:600;
  }
  .wf-chip.excluded{
    text-decoration:line-through; opacity:.55; font-style:italic;
  }
  .wf-chip .wf-tag{
    margin-left:4px; padding:1px 6px; border-radius:4px;
    background:var(--navy); color:#fff; font-size:9.5px;
    text-transform:uppercase; letter-spacing:.04em; font-weight:700;
  }
  /* Inline expand panel — rule-by-rule reasoning per network */
  .wf-detail{
    margin-top:14px; padding:12px 14px;
    background:var(--bg-hover); border-radius:10px;
    animation: rowExpand .22s ease-out;
  }
  .wf-section-label{
    font-size:10.5px; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  .wf-reason{
    display:flex; align-items:center; gap:10px;
    padding:6px 0; font-size:12.5px; color:var(--ink-2);
    border-top:1px solid var(--line-soft);
  }
  .wf-reason:first-of-type{ border-top:none; }
  .wf-reason .dot{ width:8px; height:8px; flex-shrink:0; }
  .wf-reason .wf-r-name{ color:var(--ink); font-weight:500; min-width:90px; }
  .wf-r-status.ok{ color:#066605; }
  .wf-r-status.excluded{ color:var(--inherit); }
  .wf-r-status.fallback{ color:var(--ink-3); }
  /* ═════════════════════════════════════════════════════════════════
     Variant C — Payment-trace
     Two-pane layout: list of in-flight payments on the left, trace detail
     on the right.
     ═════════════════════════════════════════════════════════════════ */
  .trace-layout{
    display:grid; grid-template-columns:300px 1fr; gap:16px;
    margin-top:14px; align-items:start;
  }
  .trace-list{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .trace-list-head{
    padding:14px 16px; font-size:11px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    border-bottom:1px solid var(--line);
  }
  .trace-list-row{
    display:grid; grid-template-columns:1fr auto;
    grid-template-areas: "pid amt" "to to";
    column-gap:10px; row-gap:4px;
    width:100%; padding:12px 16px;
    background:transparent; border:none; border-bottom:1px solid var(--line-soft);
    text-align:left; cursor:pointer; transition:background var(--t);
  }
  .trace-list-row:last-child{ border-bottom:none; }
  .trace-list-row:hover{ background:var(--bg-hover); }
  .trace-list-row.is-on{ background:var(--navy-soft); }
  .trace-list-row .trace-pid{
    grid-area:pid; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .trace-list-row .trace-amt{
    grid-area:amt; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px; color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .trace-list-row .trace-to{
    grid-area:to; font-size:11.5px; color:var(--ink-3);
  }
  .trace-list-row .trace-to .dot{ width:7px; height:7px; }
  .trace-detail{ min-width:0; }
  .trace-card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:24px; box-shadow:var(--shadow-sm);
  }
  .trace-card-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:24px; padding-bottom:18px; border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .trace-fulfillment{ text-align:right; }
  .trace-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; margin-top:6px;
    background:var(--navy-soft); border-radius:999px;
    font-size:14px; font-weight:600; color:var(--navy);
  }
  .trace-pill .dot{ width:9px; height:9px; }
  .trace-section-label{
    font-size:11px; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;
  }
  .trace-waterfall{
    display:flex; flex-direction:column; gap:10px;
    margin-bottom:24px;
  }
  .trace-step{
    display:grid; grid-template-columns:32px 160px 1fr;
    gap:14px; align-items:center;
    padding:12px 14px; border-radius:10px;
    background:var(--paper); border:1px solid var(--line);
    transition:all var(--t);
  }
  .trace-step.is-current{ border-color:var(--navy); background:var(--navy-soft); }
  .trace-step.is-excluded{ opacity:.85; background:#FFFBE0; border-color:var(--inherit); }
  .trace-step-num{
    width:24px; height:24px; border-radius:999px;
    background:var(--ash); color:var(--ink-3);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .trace-step.is-current .trace-step-num{ background:var(--navy); color:#fff; }
  .trace-step.is-excluded .trace-step-num{ background:var(--inherit); color:#fff; }
  .trace-step-net{
    display:flex; align-items:center; gap:8px;
    font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .trace-step-net .dot{ width:9px; height:9px; }
  .trace-step.is-excluded .trace-step-net .net-name{ text-decoration:line-through; opacity:.7; }
  .trace-step-status{ font-size:12.5px; line-height:1.4; }
  .ts-ok{ color:#066605; font-weight:600; }
  .ts-excluded{ color:#7A5A00; }
  .ts-excluded i{ font-style:italic; color:var(--ink-2); }
  .ts-fallback{ color:var(--info); font-weight:500; }
  .ts-skipped{ color:var(--ink-3); font-style:italic; }
  .trace-actions{
    display:flex; justify-content:flex-end; gap:10px;
    padding-top:16px; border-top:1px solid var(--line);
  }
  /* Hierarchy table rows — staggered fade-in on mount so the table feels
     like it's "settling in" rather than appearing all at once. Opacity-only
     (no transform) because each row hosts EditPopover whose drawer +
     backdrop are position:fixed — a transformed ancestor would create a
     containing block and break their viewport positioning. */
  .surface > .row{
    animation: rowIntro .42s cubic-bezier(.32,.72,0,1) both;
  }
  .surface > .row:nth-child(2)  { animation-delay:.04s; }
  .surface > .row:nth-child(3)  { animation-delay:.08s; }
  .surface > .row:nth-child(4)  { animation-delay:.12s; }
  .surface > .row:nth-child(5)  { animation-delay:.16s; }
  .surface > .row:nth-child(6)  { animation-delay:.20s; }
  .surface > .row:nth-child(7)  { animation-delay:.24s; }
  .surface > .row:nth-child(8)  { animation-delay:.28s; }
  .surface > .row:nth-child(9)  { animation-delay:.32s; }
  .surface > .row:nth-child(10) { animation-delay:.36s; }
  .surface > .row:nth-child(11) { animation-delay:.40s; }
  .surface > .row:nth-child(n+12){ animation-delay:.44s; }
  @keyframes rowIntro {
    from { opacity:0; }
    to   { opacity:1; }
  }

  /* Stat card — Maeda REDUCE+ORGANIZE: tighter hierarchy (icon-tile +
     UPPERCASE label up top, hero value in the middle, quiet meta below).
     Larger radius for a softer modern feel; subtle box-shadow lifts the
     card off the page. */
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; box-shadow:var(--shadow-sm);
  }
  /* Bigger thematic icon tile sitting next to the section label. */
  .stat-head{ display:inline-flex; align-items:center; gap:10px; margin-bottom:12px; font-weight:700; }
  .stat-head .stat-ic{
    width:28px; height:28px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--ash); color:var(--ink-2); flex-shrink:0;
  }
  .stat-head .stat-ic svg{ width:14px; height:14px; }
  /* Themed accents per stat — small enough to read as identity, not alert. */
  .stat-ic.ic-impact{ background:#FFF4E0; color:#B07300; }
  .stat-ic.ic-route { background:var(--info-soft); color:var(--info); }
  .mailing-card.needs-action .stat-head .stat-ic{ background:#FFE6D9; color:var(--vc); }
  .mailing-card.confirmed .stat-head .stat-ic{ background:#D7F0E5; color:var(--check); }
  /* Hero number — slightly larger than 2xl, tabular numerals for alignment. */
  .stat-hero{ font-size:var(--h-md); line-height:1.05; font-weight:700; color:var(--ink); letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .stat-hero .unit{ font-size:15px; font-weight:500; color:var(--ink-2); margin-left:6px; }
  .stat-meta{ font-size:12.5px; color:var(--ink-3); margin-top:8px; line-height:1.4; }
  .stat-meta b{ color:var(--ink); font-weight:600; }
  .stat-meta .sep{ color:var(--ink-4); margin:0 5px; }
  .stats-sticky{ position:sticky; top:38px; z-index:20; background:var(--bg); padding:14px 0 12px; margin-top:4px; }
  /* Scenario toggle — floating pill sitting just below the DevPanel FAB
     so it reads as a preview/demo control, not as part of the product UI.
     Same codepath underneath; only the mock dataset changes. */
  .scenario-toggle{
    position:fixed; top:58px; right:14px; z-index:75;
    display:inline-flex; align-items:center; padding:3px; gap:2px;
    background:var(--paper); border:1px solid var(--line-2); border-radius:999px;
    box-shadow:var(--shadow-md);
  }
  .scenario-toggle .scn-label{ font-size:11px; color:var(--ink-3); font-weight:600; padding:0 8px 0 10px; letter-spacing:.04em; text-transform:uppercase; }
  .scenario-toggle button{
    padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-3);
    background:transparent; border:none; border-radius:999px;
    cursor:pointer; transition:all var(--t); white-space:nowrap;
  }
  .scenario-toggle button:hover{ color:var(--ink); }
  .scenario-toggle button.is-on{ background:var(--navy); color:#fff; box-shadow:var(--shadow-sm); }
  /* Routing breakdown — mixed-routing variant. Stacks the network rows so
     the eye reads them as a small tabular summary. Network name bold,
     count tabular-numeric and pushed to the right. */
  .routing-breakdown{ display:flex; flex-direction:column; gap:10px; }
  .routing-breakdown .rb-row{
    display:flex; align-items:center; gap:10px;
    font-size:14px; line-height:1.2;
  }
  .routing-breakdown .rb-row .dot{ width:10px; height:10px; }
  .routing-breakdown .rb-row .name{ font-weight:600; color:var(--ink); }
  .routing-breakdown .rb-row .count{
    margin-left:auto; font-size:13px;
    color:var(--ink-2); font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  /* Mailing-addresses list — sub-cards inside the edge case mailing card.
     Each has its own count + confirmation. */
  .mailing-list{ display:flex; flex-direction:column; gap:10px; }
  .mailing-list .ml-row{
    padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--paper);
  }
  .mailing-list .ml-row .ml-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:10.5px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.06em; font-weight:600;
    margin-bottom:6px;
  }
  .mailing-list .ml-row .ml-head .ml-count{
    font-size:11.5px; color:var(--ink-2); font-weight:500;
    text-transform:none; letter-spacing:0;
    font-variant-numeric:tabular-nums;
  }
  .mailing-list .ml-row .ml-addr{ font-size:14px; color:var(--ink); font-weight:600; line-height:1.4; }
  .mailing-list .ml-row label{
    font-size:12.5px; margin-top:8px;
    display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; color:var(--ink-2); font-weight:600;
  }
  /* Per-row details expansion — small panel inside the table showing why
     this payment was routed where it was. */
  .imp-details-toggle{
    display:inline-flex; align-items:center; gap:4px; padding:4px 8px;
    font-size:11.5px; font-weight:600; color:var(--ink-3);
    background:transparent; border:1px solid var(--line); border-radius:6px;
    cursor:pointer; transition:all var(--t);
  }
  .imp-details-toggle:hover{ border-color:var(--ink-3); color:var(--ink); }
  .imp-details-toggle.is-open{ background:var(--navy-soft); border-color:var(--navy); color:var(--navy); }
  .imp-details-panel{
    background:var(--paper); border-top:1px solid var(--line); padding:0;
  }
  /* Full-bleed table — no inner padding, no outer border. Header matches
     the main table style (white background, ink-3 uppercase). */
  .imp-details-panel table{ width:100%; font-size:12.5px; border-collapse:collapse; background:var(--paper); }
  .imp-details-panel th{
    text-align:left; font-size:11px; color:var(--ink-3); font-weight:600;
    text-transform:uppercase; letter-spacing:.06em;
    padding:10px 22px; background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .imp-details-panel td{ padding:10px 22px; color:var(--ink-2); border-top:1px solid var(--line-soft); }
  .imp-details-panel td.picked{ color:var(--ink); }
  .imp-details-panel .chip-enrolled{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; background:var(--check-bg); color:#066605; font-size:11px; font-weight:600; }
  .imp-details-panel .chip-out{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; background:var(--ash); color:var(--ink-3); font-size:11px; font-weight:600; }
  /* Address chip in the table row when an edge-case check has a non-primary
     address. Quiet pill so it doesn't dominate. */
  .addr-chip{
    display:inline-flex; align-items:center; gap:4px; margin-left:8px;
    padding:1px 7px; border-radius:999px; background:var(--ash); color:var(--ink-2);
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
  }
  .addr-chip.is-secondary{ background:#FFE8CD; color:#7A5A00; }
  .mailing-card{ transition: all .15s; }
  /* Softer than full 2px solid border — keeps the orange identity without
     screaming. The icon tile is the real brand cue. */
  .mailing-card.needs-action{ border:1px solid var(--vc); background:var(--vc-bg); }
  .mailing-card.needs-action input[type=checkbox]{ outline: 2px solid var(--vc); outline-offset: 2px; border-radius: 3px; }
  .mailing-card.confirmed{ background:var(--check-bg); border-color:var(--check); }
  table.simple{width:100%; border-collapse:collapse; font-size:13px;}
  table.simple th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600; text-align:left; padding:12px 14px; background:var(--paper); border-bottom:1px solid var(--line);}
  /* Sortable column header — clickable label + small dual-chevron icon.
     Active sort dims the inactive arrow and brightens the active one. */
  .th-sort{
    display:inline-flex; align-items:center; gap:5px;
    background:transparent; border:none; padding:0;
    font:inherit; color:inherit;
    text-transform:inherit; letter-spacing:inherit;
    cursor:pointer; transition:color var(--t);
  }
  .th-sort:hover{ color:var(--ink-2); }
  .th-sort.is-active{ color:var(--ink); }
  /* Sort affordance — kept discrete in idle state but visible enough to
     read at first glance. Previously --ink-4 + 0.35 opacity made the
     arrows nearly invisible against the head-strip background, so
     CSRs were missing the affordance on columns they didn't expect
     to be sortable (e.g. Max amount). Bumped to --ink-3 + 0.6 opacity
     for the idle pair; active arrow stays full opacity in navy. */
  /* Sort + filter affordances render in info blue (matches the Abyss
     DataTable, where these icons are blue at rest, not grey). */
  /* Single arrow-up-down glyph — both arrows always equal, no per-direction
     dimming. Info blue at rest, navy on hover / when the column is active. */
  .th-sort .sort-i{ display:inline-flex; align-items:center; color:var(--info); }
  .th-sort .sort-i svg{ display:block; }
  .th-sort:hover .sort-i{ color:var(--navy); }
  .th-sort.is-active .sort-i{ color:var(--navy); }
  table.simple td{padding:12px 14px; border-bottom:1px solid var(--line);}
  table.simple tr:last-child td{border-bottom:none;}
  table.simple tr.sel{background:var(--navy-soft);}
  @keyframes pulseIn { from { background:var(--navy-soft); } to {} }
  .row.is-edited{ animation:pulseIn .35s ease-out; }
  input[type=checkbox]{ width:16px; height:16px; accent-color:var(--info); cursor:pointer;}
  /* Custom table checkboxes — rounded box with a visible border; when checked
     it fills with brand blue + a white check (the border rounds the icon). */
  .head-strip input[type=checkbox],
  .row.row-dynamic input[type=checkbox]{
    appearance:none; -webkit-appearance:none; margin:0;
    width:18px; height:18px; flex-shrink:0;
    border:1.5px solid var(--line-2); border-radius:5px;
    background:#fff; cursor:pointer; position:relative; transition:all .12s;
  }
  .head-strip input[type=checkbox]:hover,
  .row.row-dynamic input[type=checkbox]:hover{ border-color:var(--ink-3); }
  .head-strip input[type=checkbox]:checked,
  .row.row-dynamic input[type=checkbox]:checked{ background:var(--info); border-color:var(--info); }
  .head-strip input[type=checkbox]:checked::after,
  .row.row-dynamic input[type=checkbox]:checked::after{
    content:""; position:absolute; left:5px; top:1.5px;
    width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .head-strip input[type=checkbox]:focus-visible,
  .row.row-dynamic input[type=checkbox]:focus-visible{ outline:none; box-shadow:var(--focus-ring); }

  /* warning */
  .warn-banner{ background:var(--warn-bg); border:1px solid var(--warn); color:var(--ink); padding:10px 14px; border-radius:10px; font-size:13px; display:flex; align-items:center; gap:10px;}
  /* Override notice — soft yellow surface, no border. Detail line in
     secondary text so the title leads. */
  .override-notice{ background:#FFF8E1; border:none; color:var(--ink); padding:10px 14px; border-radius:8px; display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .override-notice .ov-icon{ color:var(--inherit); flex-shrink:0; margin-top:2px; }
  .override-notice .ov-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .override-notice .ov-title{ font-size:11px; font-weight:700; color:var(--inherit); text-transform:uppercase; letter-spacing:.05em; }
  .override-notice .ov-detail{ font-size:12.5px; line-height:1.45; color:var(--ink-2); }
  .override-notice .ov-detail b{ color:var(--ink); font-weight:600; }
  /* ═════════════════════════════════════════════════════════════════
     Variant C (Unified Routing / V3)
     ═════════════════════════════════════════════════════════════════ */
  /* Row action cluster — Edit + ⋯ menu in Unified. Keeps the buttons
     visually grouped with consistent spacing. */
  .action-cluster{ display:inline-flex; align-items:center; gap:6px; }
  .row-dots-wrap{ position:relative; display:inline-flex; }
  .row-dots{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:6px;
    background:transparent; border:0;
    color:var(--ink-3); cursor:pointer; transition:all var(--t);
  }
  .row-dots:hover{ background:var(--bg-hover); color:var(--ink); }
  .row-dots-menu{
    position:absolute; top:calc(100% + 4px); right:0;
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    box-shadow: 0 4px 12px rgba(35,34,32,.10);
    min-width:180px; padding:4px; z-index:50;
  }
  .row-dots-item{
    display:flex; align-items:center; gap:8px;
    width:100%; padding:8px 10px; border-radius:6px;
    background:transparent; border:none; cursor:pointer;
    font-size:13px; color:var(--ink); text-align:left;
  }
  .row-dots-item:hover{ background:var(--bg-hover); }
  .row-dots-item svg{ color:var(--ink-3); }
  /* Page-level "Create opt-out" CTA — sits next to the search bar in the
     Preferences tab toolbar. More prominent than the row-level ⋯ menu
     because it's the entry point for proactive opt-outs (no payment ctx). */
  .unified-create-opt-cta{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:8px;
    background:var(--navy); color:#fff; border:1px solid transparent;
    font-size:13px; font-weight:600; cursor:pointer;
    transition:all var(--t); white-space:nowrap;
    box-shadow: 0 1px 2px rgba(0,38,119,.12);
  }
  .unified-create-opt-cta:hover{ background:var(--navy-d); box-shadow: 0 2px 6px rgba(0,38,119,.20); }
  .unified-create-opt-cta svg{ color:#fff; }
  /* Discreet link in the Edit drawer footer to launch the opt-out wizard. */
  .unified-create-opt-link-wrap{ padding-top:8px; padding-bottom:4px; }
  .unified-create-opt-link{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:none; padding:4px 0;
    font-size:12.5px; font-weight:500; color:var(--ink-2); cursor:pointer;
  }
  .unified-create-opt-link:hover{ color:var(--ink); text-decoration:underline; }
  .unified-create-opt-link svg{ color:var(--ink-3); }
  /* Opt-out wizard drawer — side panel, ~520px wide. Steps are visually
     summarized with a 3-circle indicator + body content per step. */
  .opt-wiz-drawer{
    position:fixed; top:0; right:0; bottom:0; left:auto;
    width:600px; max-width:92vw;
    /* Warm White — this is a secondary guided task; the warmer surface
       gives white inputs/radio cards inside subtle separation per the DS. */
    background:var(--paper-warm); z-index:200;
    box-shadow:-8px 0 24px rgba(61,60,56,.16);
    display:flex; flex-direction:column;
    /* Wider drawer warrants a more decisive slide — comes in from off-
       screen rather than the generic 24px nudge. Curve is the same
       material-style ease-out so it lands without bounce. */
    animation: wizardDrawerIn .32s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes wizardDrawerIn {
    from { transform:translateX(100%); opacity:.6; }
    to   { transform:translateX(0);    opacity:1; }
  }
  .opt-wiz-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:24px 28px 8px;
  }
  .opt-wiz-head-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .opt-wiz-eyebrow{
    font-size:10.5px; font-weight:700; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.07em;
  }
  .opt-wiz-title{
    font-size:28px; font-weight:700; color:var(--ink); line-height:1.15;
    letter-spacing:-.01em;
  }
  .opt-wiz-desc{
    font-size:13.5px; color:var(--ink-2); line-height:1.5;
    max-width:480px;
  }
  .opt-wiz-context{
    margin-top:4px; font-size:12.5px; color:var(--ink-3);
    padding-top:10px; border-top:1px dashed var(--line);
  }
  .opt-wiz-context b{ color:var(--ink-2); font-weight:600; }
  .opt-wiz-close{
    flex-shrink:0; background:transparent; border:none; cursor:pointer;
    color:var(--ink-3); padding:4px; border-radius:6px;
  }
  .opt-wiz-close:hover{ background:var(--bg-hover); color:var(--ink); }
  .opt-wiz-steps{
    display:flex; gap:8px; padding:14px 28px;
    background:transparent;
  }
  .opt-wiz-step{
    flex:1; height:4px; border-radius:2px; background:var(--line);
    position:relative;
    transition: background .35s cubic-bezier(.4,.0,.2,1);
  }
  .opt-wiz-step.is-current{
    background:var(--navy);
    /* Subtle live pulse on the active segment so the eye lands on it
       after the bar fills in. */
    animation: stepPulse 2.4s ease-in-out infinite;
  }
  .opt-wiz-step.is-done{ background:var(--navy); }
  @keyframes stepPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 38, 119, 0); }
    50%      { box-shadow: 0 0 0 3px rgba(0, 38, 119, .14); }
  }
  .opt-wiz-step-num{ display:none; }
  .opt-wiz-body{
    flex:1; overflow-y:auto; padding:24px 28px;
  }
  .opt-wiz-section{
    display:flex; flex-direction:column; gap:14px;
    /* Each step's body re-mounts on step change (React conditional render),
       so this fires every transition. Slight upward slide + fade reads as
       "next page" without feeling slow. */
    animation: stepEnter .26s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes stepEnter {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .opt-wiz-radios{ display:flex; flex-direction:column; gap:10px; }
  .opt-wiz-radio{
    display:flex; align-items:flex-start; gap:12px;
    padding:14px 16px; border:1px solid var(--line); border-radius:10px;
    cursor:pointer; transition:all var(--t);
  }
  .opt-wiz-radio:hover{ border-color:var(--ink-4); background:var(--bg-hover); }
  .opt-wiz-radio.is-on{ border-color:var(--navy); background:#F0F6FF; }
  .opt-wiz-radio input{ margin-top:2px; accent-color:var(--info); }
  .opt-wiz-radio-label{ font-size:13.5px; color:var(--ink); flex:1; line-height:1.4; }
  .opt-wiz-radio-label b{ font-weight:700; }
  .opt-wiz-radio-sub{
    font-size:12px; color:var(--ink-3); font-weight:500;
  }
  .opt-wiz-radio-row{ flex-direction:row; align-items:center; }
  .opt-wiz-arrow{
    color:var(--navy); font-size:12px; font-weight:700;
    margin-left:auto;
  }
  .opt-wiz-hint{
    font-size:12px; color:var(--ink-3); font-style:italic;
  }
  .opt-wiz-field{ display:flex; flex-direction:column; gap:6px; }
  .opt-wiz-label{
    font-size:11px; font-weight:700; color:var(--ink-2);
    text-transform:uppercase; letter-spacing:.06em;
  }
  /* Both amount and location rows use the same 2-col layout so the right
     column lines up vertically across rows. */
  .opt-wiz-amount-row, .opt-wiz-location-row{
    display:flex; gap:8px; align-items:stretch;
  }
  .opt-wiz-amount-row .fancy-dd,
  .opt-wiz-location-row .opt-wiz-zip-input{ flex:1; min-width:0; }
