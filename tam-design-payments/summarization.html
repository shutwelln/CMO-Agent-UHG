      follow:["Which one had the highest fee?","Show me only VCC payments"] };

  if (has("consolidat","grouped","bundle"))
    { const c=DATA.filter(p=>p.isConsolidated);
      return { text:"<b>"+c.length+" of "+DATA.length+"</b> payments are consolidated — one network payment carrying several claim payments. The rest are single-claim.",
        rows:c.map(p=>[p.netId+" · "+p.provider, p.claimCount+" claims · "+money(p.payerPaid)]),
        follow:["Why are payments consolidated?","Show the largest payment"] }; }

  if (has("largest","biggest","highest","most"))
    { const p=[...DATA].sort((a,b)=>b.payerPaid-a.payerPaid)[0];
      return { text:"The largest is "+link(p.netId)+" to <b>"+p.provider+"</b> — "+money(p.payerPaid)+" paid by "+p.type+", grouping "+p.claimCount+" claim payments.",
        figs:[["Payer paid",money(p.payerPaid)],["Fee",money(p.fee)],["Deposited",money(p.deposit)]],
        follow:["Break it down by claim","How much did we pay in fees?"] }; }

  if (has("break it down","by claim","children","detail"))
    { const p=[...DATA].sort((a,b)=>b.payerPaid-a.payerPaid)[0];
      return { text:link(p.netId)+" breaks into "+p.claimCount+" claim payments:",
        rows:p.children.map(c=>[c.claim+" · "+c.status, money(c.amount)]),
        follow:["What is a network payment ID?"] }; }

  if (has("network payment id","net-","what is a network"))
    return { text:"A <b>network payment ID</b> is the single identifier the payment network assigns when several claim payments travel together as one deposit. It's the number to quote to a payer — the individual claim payments sit underneath it.",
      follow:["Which payments are consolidated?","How do I reconcile one?"] };

  if (has("vcc","card","virtual"))
    { const v=DATA.filter(p=>p.type==="VCC");
      return { text:"<b>"+v.length+"</b> payment came through as a virtual card, for "+money(v.reduce((a,p)=>a+p.payerPaid,0))+". Its fee rate is the steepest of the three methods.",
        rows:v.map(p=>[p.provider+" · "+p.netId, money(p.payerPaid)+" · fee "+money(p.fee)]),
        follow:["Compare fees by payment type"] }; }

  if (has("compare fees","by payment type","by type"))
    { const t=["ACH","VCC","Check"].map(k=>{ const g=DATA.filter(p=>p.type===k);
        return [k+" · "+g.length+" payment"+(g.length===1?"":"s"), g.length? ((g.reduce((a,p)=>a+p.fee,0)/g.reduce((a,p)=>a+p.payerPaid,0))*100).toFixed(2)+"%" : "—"]; });
      return { text:"Effective fee rate by payment type, on the payments in view:", rows:t,
        follow:["Show me only VCC payments"] }; }

  if (has("reconcile","match","post"))
    return { text:"Search the <b>network payment ID</b> from your bank statement, open it, and every claim payment inside is listed with its own status. That view is what you post against — the deposit total always equals payer paid minus fees.",
      follow:["Which payments are consolidated?"] };

  const claimHit = /clm-?\s?(\d{6})/i.exec(qRaw);
  if (claimHit || has("claim ")){
    const id = claimHit ? "CLM-" + claimHit[1] : null;
    let owner = null, child = null;
    DATA.forEach(p=>p.children.forEach(c=>{ if (id && c.claim === id){ owner = p; child = c; } }));
    if (owner)
      return { text:"<b>" + child.claim + "</b> is inside " + link(owner.netId) + " to " + owner.provider +
          " — " + money(child.amount) + ", " + child.status.toLowerCase() + " on " + child.date + ".",
        rows:owner.children.map(c=>[c.claim + (c.claim===child.claim ? " \u00b7 this one" : ""), money(c.amount) + " \u00b7 " + c.status]),
        follow:["Which payments are consolidated?","How do I reconcile one?"] };
    return { text:"Every claim payment travels inside a network payment. Give me a claim number \u2014 " +
        CLAIMS.slice(0,3).join(", ") + " are in view \u2014 and I'll show which payment carries it.",
      follow:["Where is claim " + CLAIMS[0] + "?"] };
  }

  if (has("batch"))
    return { text:"A <b>batch</b> is the file a payer sends in one run; the payments in view arrived across several of them. Batch search is the place to open one end to end \u2014 here I can only see the payments themselves.",
      figs:[["Payments in view", String(DATA.length)], ["Claim payments", String(DATA.reduce((a,p)=>a+p.children.length,0))], ["Payers", String(uniq(DATA.map(p=>p.org)).length)]],
      follow:["Which payments are consolidated?","How much did we pay in fees?"] };

  const who = DATA.find(p=>q.includes(p.provider.toLowerCase().split(" ")[0]));
  if (who)
    return { text:"<b>"+who.provider+"</b> (TIN "+who.tin+") has "+DATA.filter(p=>p.provider===who.provider).length+" payment(s) in view. The most recent is "+link(who.netId)+" — "+money(who.payerPaid)+" by "+who.type+".",
      figs:[["Payer paid",money(who.payerPaid)],["Fee",money(who.fee)],["Deposited",money(who.deposit)]],
      follow:["Break it down by claim"] };

  return { text:"I can work over the payments in view — fees, consolidation, payment types, or a specific provider. Try one of these:",
    follow:["How much did we pay in fees?","Which payments are consolidated?","Compare fees by payment type"] };
}

/* Past conversations — staged so the history state can be demoed both ways. */
const AI_PAST = [
  { id:1, t:"Fees on June deposits",        when:"Yesterday",  group:"Yesterday",       q:"How much did we pay in fees?",       at:"4:12 PM" },
  { id:2, t:"Consolidated vs individual",   when:"2 days ago", group:"Previous 7 days", q:"Which payments are consolidated?",   at:"11:47 AM" },
  { id:3, t:"Maria Gomez · card settlement",when:"Last week",  group:"Previous 7 days", q:"Show me only VCC payments",          at:"2:38 PM" },
  { id:4, t:"What a network payment ID is", when:"Last week",  group:"Previous 7 days", q:"What is a network payment ID?",      at:"9:03 AM" },
];
/* buckets AI_PAST into {label, items} groups, preserving first-seen order — the ChatGPT-style sidebar grouping */
function groupPast(list){
  var order=[], map={};
  list.forEach(function(c){
    if(!map[c.group]){ map[c.group]=[]; order.push(c.group); }
    map[c.group].push(c);
  });
  return order.map(function(label){ return { label:label, items:map[label] }; });
}

const aiNow = ()=> new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });

const AI_VIEWS = [
  { id:"bubble", label:"Bubble",      short:"Bubble", ico:"bubble" },
  { id:"drawer", label:"Side drawer", short:"Drawer", ico:"drawer" },
  { id:"full",   label:"Full screen", short:"Full",   ico:"max" },
];

const AI_STEPS = ["Reading your question…","Searching 608,170 payments…","Checking fees and totals…","Writing the answer…"];

function AiMessage({ m, onFollow, isLast, onOpenPay }){
  const [fb,setFb] = useState(null);
  if (m.role==="me") return (<div className="ai-msg me"><div className="ai-me-wrap"><div className="ai-bub">{m.text}</div><div className="ai-time me">{m.at}</div></div></div>);
  /* dangerouslySetInnerHTML can't carry onClick, so one delegated handler on the bubble reads the .ai-link's netId */
  const onBubClick = (e)=>{
    const t = e.target.closest && e.target.closest(".ai-link");
    if (t && t.dataset.net && onOpenPay) onOpenPay(t.dataset.net);
  };
  return (
    <div className="ai-msg-wrap">
      <div className="ai-msg ai">
        <div className="ai-bub" onClick={onBubClick}>
          <span dangerouslySetInnerHTML={{__html:m.shown}}/>{!m.done && <i className="ai-caret"/>}
          {m.done && m.figs && (<div className="ai-figs">{m.figs.map((f,i)=>(
            <div className="ai-fig" key={i}><span>{f[0]}</span><b>{f[1]}</b></div>))}</div>)}
          {m.done && m.rows && (<table className="ai-tbl"><tbody>{m.rows.map((r,i)=>(
            <tr key={i}><td>{r[0]}</td><td>{r[1]}</td></tr>))}</tbody></table>)}
        </div>
      </div>
      {m.done && (
        <Fragment>
          <div className="ai-meta">
            <span className="ai-time">{m.at}</span>
            <div className="ai-fb">
              <button className={fb==="up"?"on":""} onClick={()=>setFb("up")} title="Helpful" aria-label="Helpful">{AiIcons.up()}</button>
              <button className={fb==="down"?"on":""} onClick={()=>setFb("down")} title="Not helpful" aria-label="Not helpful">{AiIcons.down()}</button>
            </div>
          </div>
          {m.follow && (<div className={"ai-follow"+(isLast?"":" is-gone")}>{m.follow.map((f,i)=>(
            <button key={i} style={{animationDelay:(i*60)+"ms"}} onClick={()=>onFollow(f)}>{AiIcons.reply()}{f}</button>))}</div>)}
        </Fragment>
      )}
    </div>
  );
}

function Assistant({ hasHistory, onOpen }){
  /* the assistant has its own tile in the hub, so it can be linked to directly:
     /summarization?ask=1 lands with the panel already open */
  const [open,setOpen]   = useState(/[?&]ask=1/.test(typeof location === 'undefined' ? '' : location.search));
  const [seen,setSeen]   = useState(false);
  const [msgs,setMsgs]   = useState([]);
  const [draft,setDraft] = useState("");
  const [busy,setBusy]   = useState(false);
  const [step,setStep]   = useState(0);
  const [view,setView]       = useState('bubble');
  const [showHist,setShowHist] = useState(false);
  const [menu,setMenu]         = useState(false);
  const [leaving,setLeaving]   = useState(false);
  const [hadChat,setHadChat]   = useState(false);
  const bodyRef = useRef(null), taRef = useRef(null), timers = useRef([]);

  const clearTimers = ()=>{ timers.current.forEach(clearTimeout); timers.current=[]; };
  const scroll = ()=>{ const el=bodyRef.current; if(el) el.scrollTop = el.scrollHeight; };
  React.useEffect(scroll, [msgs, busy, step]);
  React.useEffect(()=>{ if(open && taRef.current) taRef.current.focus(); }, [open]);
  React.useEffect(()=>()=>clearTimers(), []);
  React.useEffect(()=>{
    const esc = (e)=>{ if(e.key==="Escape"){ setMenu(false); setOpen(false); } };
    window.addEventListener("keydown", esc); return ()=>window.removeEventListener("keydown", esc);
  },[]);

  /* send() does the work; ask() decides whether the welcome screen has to
     fade out first, so the answer never lands on top of the greeting */
  function send(t){
    setDraft(""); setBusy(true); setStep(0); setHadChat(true);
    setMsgs(m=>[...m,{ role:"me", text:t, at:aiNow() }]);
    /* the status line walks the steps so the wait reads as work, not lag */
    AI_STEPS.forEach((_,i)=>{ if(i) timers.current.push(setTimeout(()=>setStep(i), i*640)); });
    timers.current.push(setTimeout(()=>{
      const a = aiAnswer(t);
      setBusy(false);
      setMsgs(m=>[...m,{ role:"ai", ...a, shown:"", done:false, at:aiNow() }]);
      /* reveal word by word — cheap, but it makes the answer feel composed */
      const words = a.text.split(" ");
      words.forEach((w,i)=>{
        timers.current.push(setTimeout(()=>{
          setMsgs(m=>{ const c=[...m], last=c.length-1;
            c[last] = {...c[last], shown: words.slice(0,i+1).join(" "), done: i===words.length-1 };
            return c; });
        }, 34*i));
      });
    }, AI_STEPS.length*640));
  }

  function ask(text){
    const t = (text||"").trim();
    if (!t || busy) return;
    if (msgs.length === 0){
      setLeaving(true);
      timers.current.push(setTimeout(()=>{ setLeaving(false); send(t); }, 260));
      return;
    }
    send(t);
  }
  const reset = ()=>{ clearTimers(); setMsgs([]); setBusy(false); setDraft(""); setShowHist(false); setLeaving(false); };
  /* a past chat is already resolved — load it in full, don't replay the ask/think/answer sequence */
  const openPast = (c)=>{
    clearTimers();
    const a = aiAnswer(c.q);
    setBusy(false); setDraft(""); setShowHist(false); setMenu(false); setLeaving(false);
    setMsgs([ { role:"me", text:c.q, at:c.at }, { role:"ai", ...a, shown:a.text, done:true, at:c.at } ]);
    setHadChat(true);
  };
  const toggle = ()=>{ setOpen(o=>!o); setSeen(true); };
  /* a clicked payment mention opens it in the table behind the panel, same as any other netid-link */
  const openPayment = (id)=>{ if (onOpen) onOpen(id); setOpen(false); };

  /* the chat you're in right now sits at the top of history under Today, so it's never lost among the past ones */
  const liveChat = msgs.length ? { id:"live", t:(msgs.find(m=>m.role==="me")||{}).text || "Current chat" } : null;
  const histGroups = (liveChat ? [{ label:"Today", items:[liveChat], live:true }] : [])
    .concat(hasHistory ? groupPast(AI_PAST) : []);
  const renderHist = ()=> histGroups.map(g=>(
    <div className="ai-side-group" key={g.label}>
      <div className="ai-side-l">{g.label}</div>
      {g.items.map(c=>(
        <button className={"ai-side-item"+(g.live?" on":"")} key={c.id}
          onClick={()=> g.live ? setShowHist(false) : openPast(c)}>{c.t}</button>
      ))}
    </div>
  ));

  return (
    <Fragment>
      <button className={"ai-fab"+(open?" is-open":"")} onClick={toggle}
        title={open?"Close the assistant":"Ask the payments assistant"}
        aria-label={open?"Close the assistant":"Ask the payments assistant"} aria-expanded={open}>
        {open ? AiIcons.close(20) : AiIcons.chat(24)}
        {!open && !seen && <span className="ai-fab-dot"/>}
      </button>

      {open && (
        <div className={"ai-panel ai-view-"+view+(msgs.length===0 && !busy && !showHist && !leaving?" is-fresh":"")} role="dialog" aria-label="Payments Assistant">
          {view==="full" && (
            <div className="ai-sidebar">
              <div className="ai-side-brand"><span className="ai-mark">{AiIcons.chat(18)}</span><b>Payments Assistant</b></div>
              <button className="ai-side-new" onClick={reset}>{AiIcons.plus(14)}<span>New chat</span></button>
              <div className="ai-side-hist">
                {histGroups.length ? renderHist() : <div className="ai-side-empty">No chats yet</div>}
              </div>
              <div className="ai-side-foot">
                <div className="ai-seg">
                  {AI_VIEWS.map(v=>(
                    <button key={v.id} className={view===v.id?"on":""} onClick={()=>setView(v.id)} title={v.label}>
                      {AiIcons[v.ico](14)}<span>{v.short}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div className="ai-main">
          <div className="ai-head">
            <span className="ai-mark">{AiIcons.chat(20)}</span>
            <div className="ai-head-t"><b>Payments Assistant</b></div>
            {view!=="full" && (
              <span className="ai-more-wrap">
                <button className={"ai-ico-btn"+(menu?" on":"")} onClick={()=>setMenu(m=>!m)} title="More" aria-label="More">{AiIcons.dots()}</button>
                {menu && (
                  <div className="ai-more">
                    <button className="ai-new-item" onClick={()=>{ reset(); setMenu(false); }}>{AiIcons.plus(14)}<span>New chat</span></button>
                    <button onClick={()=>{ setShowHist(h=>!h); setMenu(false); }}>{AiIcons.hist(14)}<span>{showHist?"Back to chat":"Chat history"}</span></button>
                    <div className="ai-more-sep"/>
                    <div className="ai-more-l">View</div>
                    <div className="ai-seg">
                      {AI_VIEWS.map(v=>(
                        <button key={v.id} className={view===v.id?"on":""} onClick={()=>{ setView(v.id); setMenu(false); }} title={v.label}>
                          {AiIcons[v.ico](14)}<span>{v.short}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </span>
            )}
            <button className="ai-ico-btn" onClick={()=>setOpen(false)} title="Close" aria-label="Close">{AiIcons.close(16)}</button>
          </div>

          <div className="ai-body" ref={bodyRef} aria-live="polite">
            <div className="ai-topfade" aria-hidden="true"/>
            {/* full screen already shows history permanently in the sidebar — the body always stays on the live conversation */}
            {showHist && view!=="full" ? (
              <div className="ai-hist">
                {histGroups.length ? renderHist() : (
                  <div className="ai-hist-empty">
                    <div className="ai-empty-mark">{AiIcons.hist(22)}</div>
                    <h4>No chats yet</h4>
                    <p>Once you ask something, your conversations show up here so you can pick them back up.</p>
                    <button className="ai-hist-cta" onClick={()=>setShowHist(false)}>Start a chat</button>
                  </div>
                )}
              </div>
            ) : (<Fragment>
            {msgs.length===0 && !busy && (
              <div className={"ai-empty"+(leaving?" is-leaving":"")}>
                <div className="ai-hello"><span>Hello, {AI_USER}</span><span className="ai-wave">{AiIcons.wave(17)}</span></div>
                <h4>How can I help you?</h4>
                <div className="ai-sugg-l">Try asking</div>
                <div className="ai-sugg">
                  {AI_SUGGEST.map((s,i)=>(
                    <button className="ai-chip" key={s} style={{animationDelay:(120+i*70)+"ms"}} onClick={()=>ask(s)}>
                      {AiIcons.arrow()}<span>{s}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
            {msgs.map((m,i)=><AiMessage key={i} m={m} onFollow={ask} isLast={i===msgs.length-1} onOpenPay={openPayment}/>)}
            {busy && (
              <div className="ai-think">
                <span className="ai-load"><span className="ai-dots"><i/><i/><i/></span><span className="ai-step">{AI_STEPS[step]}</span></span>
              </div>
            )}
            </Fragment>)}
          </div>

          {/* browsing history there is no conversation to type into — one clear action instead of a dead composer */}
          <div className="ai-foot">
            {showHist && view!=="full" ? (
              <button className="ai-foot-new" onClick={reset}>{AiIcons.plus(15)}<span>New chat</span></button>
            ) : (<Fragment>
              <div className="ai-input">
                <textarea ref={taRef} rows="2" value={draft} placeholder="Ask about these payments…"
                  onChange={e=>{ setDraft(e.target.value); e.target.style.height="auto"; e.target.style.height=Math.max(48,Math.min(e.target.scrollHeight,112))+"px"; }}
                  onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(draft); e.target.style.height="auto"; } }}/>
                <button className="ai-send" disabled={!draft.trim()||busy} onClick={()=>ask(draft)}
                  title="Send" aria-label="Send">{busy?AiIcons.load():AiIcons.send()}</button>
              </div>
              <p className="ai-legal">{AiIcons.spark(11)}Answers are AI-generated — check anything important.</p>
            </Fragment>)}
          </div>
          </div>
        </div>
      )}
    </Fragment>
  );
}

        {pages.map(n=><button key={n} className={pg===n?"on":""} onClick={()=>setPg(n)}>{n}</button>)}
        <span className="pager-nav" onClick={()=>setPg(p=>Math.min(5,p+1))}>
          Next<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </span>
    </div>
  );
}

// Date-range filter in the search bar (a dropdown chip, as in the original).
function RangeFilter(){
  const [open, setOpen] = useState(false);
  const [val, setVal] = useState("In the last 6 months");
  const OPTS = ["In the last 30 days","In the last 6 months","In the last 12 months","All time"];
  return (
    <span className="filter-wrap">
      <button className="range-chip" onClick={()=>setOpen(o=>!o)}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        {val}
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </button>
      {open && (
        <div className="fdrop" style={{right:0, left:"auto"}}>
          {OPTS.map(o=>(
            <div key={o} className="fopt" onClick={()=>{ setVal(o); setOpen(false); }}>
              <span className={"fcheck"+(val===o?" on":"")}>{val===o && <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}</span>
              {o}
            </div>
          ))}
        </div>
      )}
    </span>
  );
}

function FilterChip({ id, label, openKey, setOpenKey, options, single, selected, value, onToggle, onPick }){
  const isOpen = openKey===id;
  const count = single ? (value?1:0) : selected.size;
  return (
    <span className="filter-wrap">
      <button className={"filter-chip"+(count?" is-active":"")} onClick={()=>setOpenKey(isOpen?null:id)}>
        {count>0 && <span className="chip-check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>}
        {label}{count>0 && <span className="chip-count">{count}</span>}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      {isOpen && (
        <div className="fdrop">
          {options.map(o=>{
            const on = single ? value===o.id : selected.has(o.id);
            return (
              <div key={o.id} className="fopt" onClick={()=> single ? onPick(on?null:o.id) : onToggle(o.id)}>
                <span className={"fcheck"+(on?" on":"")}>{on && <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}</span>
                {o.label}
              </div>
            );
          })}
        </div>
      )}
    </span>
  );
}

function SearchView({ option, onOpen, recentId }){
  const [mode, setMode] = useState("consolidated");
  const [q, setQ] = useState("");
  const [filters, setFilters] = useState(emptyFilters());
  const [openKey, setOpenKey] = useState(null);
  const [sort, setSort] = useState({ key:null, dir:1 });
  const toggle = (key,val) => setFilters(f=>{ const s=new Set(f[key]); s.has(val)?s.delete(val):s.add(val); return {...f,[key]:s}; });
  const pickAmount = (val) => setFilters(f=>({...f, amount:val}));
  const clearAll = () => { setQ(""); setFilters(emptyFilters()); setOpenKey(null); };
  const active = anyFilter(q,filters);
  const opt = (arr) => arr.map(v=>({ id:v, label:v }));

  const pRows = sortRows(parentRows(q,filters), sort);
  const iRows = sortRows(individualRows(q,filters), sort, (r,k)=> (k in r ? r[k] : r.parent[k]));
  const usingIndividual = option==="drill" || (option==="toggle" && mode==="individual");
  const shown = usingIndividual ? iRows.length : pRows.length;

  const CHIPS = [
    { id:"amount",   label:"Payment amount",   single:true, options:AMOUNT_RANGES },
    { id:"claim",    label:"Claim number",     options:opt(CLAIMS) },
    { id:"status",   label:"Current status",   options:opt(STATUSES) },
    { id:"type",     label:"Current network",  options:opt(TYPES) },
    { id:"modality", label:"Current modality", options:opt(MODALITIES) },
    { id:"provider", label:"Provider",         options:opt(PROVIDERS) },
    { id:"org",      label:"Organization",     options:opt(ORGS) },
    { id:"orgId",    label:"Organization IDs", options:opt(ORG_IDS) },
  ];

  return (
    <div>
      <div className="breadcrumb"><span className="crumb-link">Home</span><span className="sep">›</span><span style={{color:"var(--ink)"}}>Global payment search</span></div>
      <div className="title-row">
        <div>
          <h1 className="page">Payments</h1>
          <div className="page-sub">Enter any payment information to begin a search — payment date, amount, payment ID, and other payment information.</div>
        </div>
        <button className="btn btn-quiet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Search by card number
        </button>
      </div>
      <div className="searchbar">
        <div className="search-input">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input placeholder="Try a TIN, provider, network ID, payment ID, or claim…" value={q} onChange={e=>setQ(e.target.value)}/>
          {q && <button className="icon-act" onClick={()=>setQ("")} title="Clear search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></button>}
          <RangeFilter/>
        </div>
        <button className="btn btn-primary">Search</button>
      </div>

      <h2 className="section-title">All payments</h2>
      <div className="filter-label">Filter payments by</div>
      {(() => {
        const renderChip = (c)=>(
          <FilterChip key={c.id} id={c.id} label={c.label} openKey={openKey} setOpenKey={setOpenKey}
            options={c.options} single={c.single}
            selected={c.single?null:filters[c.id]} value={c.single?filters.amount:null}
            onToggle={(v)=>toggle(c.id,v)} onPick={pickAmount}/>
        );
        return (
          <Fragment>
            {/* Row 1: first five filters + All filters / Clear all on the right.
                Row 2: the remaining filters — matches the original two-line wrap. */}
            <div className="filters">
              {CHIPS.slice(0,5).map(renderChip)}
              {active
                ? <span className="all-filters" onClick={clearAll}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Clear all</span>
                : <span className="all-filters">All filters<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></span>}
            </div>
            <div className="filters">
              {CHIPS.slice(5).map(renderChip)}
            </div>
          </Fragment>
        );
      })()}

      <div className="results-meta">
        <span className="results-count">Showing 1–{shown} of 608,170 results</span>
        {option==="toggle" && (
          <div className="seg">
            <button className={mode==="individual"?"on":""} onClick={()=>setMode("individual")}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Individual payments
            </button>
            <button className={mode==="consolidated"?"on":""} onClick={()=>setMode("consolidated")}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/></svg>
              Consolidated payments
            </button>
          </div>
        )}
        {option==="drill" && <span className="legend-hint"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg> Click a Network Payment ID to open its consolidation</span>}
        {option==="clarity" && <span className="legend-hint"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> Hover the ⓘ on ambiguous columns for an inline definition</span>}
      </div>

      {option==="toggle" && (mode==="consolidated"
        ? (pRows.length ? <ConsolidatedTable rows={pRows} onOpen={onOpen} sort={sort} setSort={setSort} recentId={recentId} q={q}/> : <EmptyState/>)
        : (iRows.length ? <IndividualTable rows={iRows} drill={false} onOpen={onOpen} sort={sort} setSort={setSort} recentId={recentId} q={q}/> : <EmptyState/>))}
      {option==="expand" && (pRows.length ? <ExpandableTable rows={pRows} onOpen={onOpen} sort={sort} setSort={setSort} recentId={recentId} q={q}/> : <EmptyState/>)}
      {option==="drill" && (iRows.length ? <IndividualTable rows={iRows} drill={true} onOpen={onOpen} sort={sort} setSort={setSort} recentId={recentId} q={q}/> : <EmptyState/>)}
      {option==="clarity" && (pRows.length ? <ExpandableTable rows={pRows} onOpen={onOpen} sort={sort} setSort={setSort} clarity={true} recentId={recentId} q={q}/> : <EmptyState/>)}

      {shown>0 && <Pager shown={shown}/>}
    </div>
  );
}

function App(){
  const [option, setOption] = useState("toggle");
  const [aiHist, setAiHist] = useState(true);
  const [view, setView] = useState("search");
  const [netId, setNetId] = useState(null);
  const [recentId, setRecentId] = useState(null);  // briefly highlights the row you came back to
  const recentTimer = React.useRef(null);
  const [navOpen, setNavOpen] = useState(false);   // sidenav collapsed by default
  const open = (id) => { setNetId(id); setView("detail"); };
  // Returning from a detail highlights the originating row, then fades it out
  // after a few seconds so it doesn't stay marked forever.
  const back = () => {
    setView("search");
    setRecentId(netId);
    if(recentTimer.current) clearTimeout(recentTimer.current);
    recentTimer.current = setTimeout(()=>setRecentId(null), 3200);
  };
  // Switching option starts that option clean — clear the row highlight and
  // return to search. The key={option} below remounts SearchView so its
  // filters / sort / expansion don't bleed across options.
  const switchOption = (o) => { setOption(o); setView("search"); setNetId(null); setRecentId(null); if(recentTimer.current) clearTimeout(recentTimer.current); };
  const ChevDouble = ({dir}) => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
      {dir==="left"
        ? <Fragment><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></Fragment>
        : <Fragment><path d="M13 17l5-5-5-5"/><path d="M6 17l5-5-5-5"/></Fragment>}
    </svg>
  );
  return (
    <div className="app">
      <div className="topbar">
        <span className="brand"><b>Acme</b> Financial</span>
      </div>
      {/* Floating menu toggle — transparent, sits by the page title (not the navbar). */}
      <button className={"nav-fab"+(navOpen?" open":"")} onClick={()=>setNavOpen(o=>!o)} title={navOpen?"Collapse menu":"Expand menu"} aria-label={navOpen?"Collapse menu":"Expand menu"}>
        <ChevDouble dir={navOpen?"left":"right"}/>
      </button>
      <div className="body">
        {navOpen && <SideNav/>}
        <div className="content">
          {view==="search"
            ? <SearchView key={option} option={option} onOpen={open} recentId={recentId}/>
            : <ConsolidatedDetail netId={netId} onBack={back} clarity={option==="clarity"}/>}
        </div>
      </div>
      <Switcher option={option} setOption={switchOption} aiHist={aiHist} setAiHist={setAiHist}/>
      <Assistant hasHistory={aiHist} onOpen={open}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
